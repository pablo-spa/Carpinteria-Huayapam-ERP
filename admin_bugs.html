<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bugs y Reportes</title>
<style>
.main { max-width: 860px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.filters { display: flex; gap: 8px; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); align-items: center; justify-content: space-between; }
.filter-tabs { display: flex; gap: 6px; }
.ftab { background: var(--mantle); border: 1px solid var(--crust); border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; color: var(--subtext); display: flex; align-items: center; gap: 5px; }
.ftab:hover { border-color: var(--surface1); color: var(--text); }
.ftab.active-all  { background: var(--surface0); border-color: var(--surface1); color: var(--text); }
.ftab.active-open { background: var(--red-bg); border-color: var(--red); color: var(--red-text); }
.ftab.active-res  { background: var(--green-bg); border-color: var(--green); color: var(--green-text); }
.ftab-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* Cards */
.bug-list { display: flex; flex-direction: column; gap: 8px; }

.bcard { background: var(--mantle); border: 1px solid var(--crust); border-radius: 10px; overflow: hidden; }
.bcard.is-open   { border-left: 3px solid var(--red); }
.bcard.is-solved { border-left: 3px solid var(--green); opacity: .72; }

.bcard-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; }
.bcard-row:hover { background: var(--base); }

.bcard-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; }
.bcard.is-open   .bcard-dot { background: var(--red); }
.bcard.is-solved .bcard-dot { background: var(--green); }

.bcard-body { flex: 1; min-width: 0; }
.bcard-preview { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.bcard-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.bcard-user { font-size: 11px; font-weight: 700; color: var(--subtext); }
.bcard-page { font-size: 10px; background: var(--surface0); color: var(--subtext); padding: 1px 6px; border-radius: 4px; font-family: monospace; }
.bcard-date { font-size: 11px; color: var(--subtext); margin-left: auto; flex-shrink: 0; }

.bcard-arrow { font-size: 10px; color: var(--subtext); flex-shrink: 0; transition: transform .2s; }
.bcard.expanded .bcard-arrow { transform: rotate(180deg); }

/* Detail panel */
.bcard-detail { display: none; padding: 0 14px 14px; border-top: 1px solid var(--crust); }
.bcard.expanded .bcard-detail { display: block; }

.bcard-desc {
  font-size: 13px; line-height: 1.65; color: var(--text); white-space: pre-wrap;
  padding: 10px 12px; background: var(--base); border-radius: 6px;
  border: 1px solid var(--crust); margin-top: 12px;
}
.bcard-capture { margin-top: 10px; }
.bcard-capture img { max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid var(--crust); cursor: zoom-in; }
.bcard-ua { font-size: 10px; color: var(--hint); margin-top: 8px; line-height: 1.45; word-break: break-all; }
.bcard-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.solved-label { font-size: 12px; font-weight: 700; color: var(--green); display: flex; align-items: center; gap: 4px; }

/* Empty / Loading */
.empty-state { text-align: center; padding: 52px 20px; color: var(--subtext); font-size: 13px; }
.empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .5; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Bugs y Reportes</h2>
  </div>
</div>

<div class="filters">
  <div class="filter-tabs" id="filter-tabs">
    <div class="ftab active-all" data-f="todos" onclick="setFilter('todos')"><span class="ftab-dot"></span> Todos <span id="cnt-all">0</span></div>
    <div class="ftab" data-f="abierto" onclick="setFilter('abierto')"><span class="ftab-dot"></span> Abiertos <span id="cnt-open">0</span></div>
    <div class="ftab" data-f="resuelto" onclick="setFilter('resuelto')"><span class="ftab-dot"></span> Resueltos <span id="cnt-res">0</span></div>
  </div>
  <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;" onclick="loadBugs()">⟳ Actualizar</button>
</div>

<div class="main">
  <div class="bug-list" id="bug-list">
    <div class="empty-state"><div class="empty-icon">⏳</div>Cargando reportes...</div>
  </div>
</div>

<script>
let allBugs = [];
let activeFilter = 'todos';

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diffH = (now - d) / 3600000;
  if (diffH < 1) return 'Hace un momento';
  if (diffH < 24) return `Hace ${Math.floor(diffH)}h`;
  if (diffH < 48) return 'Ayer';
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
}

function filtered() {
  if (activeFilter === 'todos') return allBugs;
  return allBugs.filter(b => b.estado === activeFilter);
}

function updateTabs() {
  const nOpen = allBugs.filter(b => b.estado === 'abierto').length;
  const nRes  = allBugs.filter(b => b.estado === 'resuelto').length;
  document.getElementById('cnt-all').textContent = allBugs.length;
  document.getElementById('cnt-open').textContent = nOpen;
  document.getElementById('cnt-res').textContent = nRes;
  document.querySelectorAll('.ftab').forEach(t => {
    const f = t.dataset.f;
    t.className = 'ftab';
    if (f === activeFilter) {
      if (f === 'todos')    t.classList.add('active-all');
      if (f === 'abierto')  t.classList.add('active-open');
      if (f === 'resuelto') t.classList.add('active-res');
    }
  });
}

function render() {
  const bugs = filtered();
  const el = document.getElementById('bug-list');
  updateTabs();

  if (!bugs.length) {
    const msg = activeFilter === 'abierto' ? 'Sin bugs abiertos 🎉' : 'Nada que mostrar aquí.';
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">✓</div>${msg}</div>`;
    return;
  }

  el.innerHTML = bugs.map(b => {
    const solved = b.estado === 'resuelto';
    const preview = (b.descripcion || '—').replace(/\n/g, ' ');
    return `
    <div class="bcard ${solved ? 'is-solved' : 'is-open'}" id="bc-${b.id}">
      <div class="bcard-row" onclick="toggleCard('${b.id}')">
        <div class="bcard-dot"></div>
        <div class="bcard-body">
          <div class="bcard-preview">${preview}</div>
          <div class="bcard-sub">
            <span class="bcard-user">${b.usuario || 'Sin usuario'}</span>
            <span class="bcard-page">${b.pagina || '?'}</span>
            <span class="bcard-date">${fmtDate(b.fecha)}</span>
          </div>
        </div>
        <div class="bcard-arrow">▼</div>
      </div>
      <div class="bcard-detail">
        <div class="bcard-desc">${b.descripcion || ''}</div>
        ${b.captura ? `<div class="bcard-capture"><a href="${b.captura}" target="_blank"><img src="${b.captura}"></a></div>` : ''}
        <div class="bcard-ua">💻 ${b.user_agent || ''}</div>
        <div class="bcard-actions">
          ${solved
            ? `<div class="solved-label">✓ Marcado como solucionado</div>`
            : `<button class="btn btn-green" style="font-size:12px;padding:5px 12px;" onclick="markResolved('${b.id}')">✓ Solucionado</button>`
          }
          <button class="btn" style="font-size:12px;padding:5px 12px;color:var(--red);border-color:var(--crust);" onclick="deleteBug('${b.id}')">🗑 Eliminar</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.setFilter = function(f) {
  activeFilter = f;
  render();
};

window.toggleCard = function(id) {
  document.getElementById('bc-' + id)?.classList.toggle('expanded');
};

window.loadBugs = async function() {
  document.getElementById('bug-list').innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div>Cargando...</div>';
  try {
    // Reset cache so we always get fresh data
    if (window.parent?.DB_STATE) window.parent.DB_STATE.bugs = undefined;
    await window.parent.cargar_coleccion('bugs');
    allBugs = (window.parent.DB_STATE?.bugs || []).filter(b => b.id);
    allBugs.sort((a, b) => {
      if (a.estado === 'abierto' && b.estado !== 'abierto') return -1;
      if (a.estado !== 'abierto' && b.estado === 'abierto') return 1;
      return new Date(b.fecha) - new Date(a.fecha);
    });
    render();
  } catch (e) {
    document.getElementById('bug-list').innerHTML = `<div class="empty-state" style="color:var(--red);">Error al cargar: ${e.message}</div>`;
  }
};

window.markResolved = async function(id) {
  const confirmed = await new Promise(resolve =>
    window.parent.showConfirm('Marcar como Resuelto', '¿Marcar este reporte como solucionado?', '✓ Solucionado', 'btn-green',
      () => resolve(true), () => resolve(false))
  );
  if (!confirmed) return;
  try {
    const bug = allBugs.find(b => b.id === id);
    if (!bug) return;
    const payload = { ...bug, estado: 'resuelto' };
    delete payload.id;
    await window.parent.setDocumentInFirebase('bugs', id, payload);
    bug.estado = 'resuelto';
    render();
  } catch (e) { alert('Error: ' + e.message); }
};

window.deleteBug = async function(id) {
  const confirmed = await new Promise(resolve =>
    window.parent.showConfirm('Eliminar Reporte', '¿Eliminar este reporte permanentemente?', 'Eliminar', 'btn-red',
      () => resolve(true), () => resolve(false))
  );
  if (!confirmed) return;
  try {
    await window.parent.deleteDocumentFromFirebase('bugs', id);
    allBugs = allBugs.filter(b => b.id !== id);
    render();
  } catch (e) { alert('Error: ' + e.message); }
};

window.loadBugs();
</script>
</body>
</html>
