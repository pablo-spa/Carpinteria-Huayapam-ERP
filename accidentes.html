<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accidentes — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.hdr-title { font-size: 18px; font-weight: 800; color: var(--text); }

.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.empty-icon { font-size: 72px; margin-bottom: 20px; opacity: 0.9; }
.empty-title { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
.empty-desc { font-size: 15px; color: var(--subtext); max-width: 440px; line-height: 1.6; }

.wip-badge { display: inline-block; background: var(--red-bg); color: var(--red); padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; border: 1px solid rgba(210,15,57,0.2); }
</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
  <div class="hdr-title">Bitácora de Accidentes</div>
</div>

<div class="main">
  <div class="wip-badge">Próximo Módulo</div>
  <div class="empty-icon">🩹</div>
  <div class="empty-title">En Planeación</div>
  <div class="empty-desc">
    Este módulo te permitirá llevar un registro formal de incidentes de salud y accidentes laborales para control de Recursos Humanos y seguimiento ante el seguro/IMSS.
  </div>
</div>

</body>
</html>
