<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Compras — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --green: #40a02b; --green-bg: #e5f4e3; --green-text: #2d6e1e;
  --blue: #1e66f5; --blue-bg: #e6eaf6; --blue-text: #1e66f5;
  --amber: #df8e1d; --amber-bg: #fdf3e5; --amber-text: #8a5500;
  --red: #d20f39; --red-bg: #fde8ed;
  --radius: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --green: #a6da95; --green-bg: rgba(166,218,149,0.15); --green-text: #a6da95;
    --blue: #8caaee; --blue-bg: rgba(140,170,238,0.15); --blue-text: #8caaee;
    --amber: #f9e2af; --amber-bg: rgba(249,226,175,0.15); --amber-text: #f9e2af;
    --red: #f38ba8; --red-bg: rgba(243,139,168,0.15);
  }
}
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding: 20px; }

.hdr { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hdr h2 { font-size: 18px; font-weight: 800; }
.btn { padding: 8px 14px; border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; transition: opacity .15s; font-family: inherit; font-size: 13px; }
.btn:hover { opacity: .85; }
.btn-blue  { background: var(--blue);  color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber); color: #fff; }
.btn-dark  { background: var(--surface0); color: var(--text); border: 1px solid var(--surface1); }
.btn-red   { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
.card.c-pending { border: 2px solid var(--amber); }
.card.c-ready   { border: 2px solid var(--green); }
.card.c-manual  { border: 2px solid var(--blue);  }
.card-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 12px; }
.card-folio { font-size: 14px; font-weight: 800; }
.card-meta  { font-size: 12px; color: var(--subtext); margin-top: 2px; }

.pill { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
.pill-amber  { background: var(--amber-bg);  color: var(--amber-text); }
.pill-green  { background: var(--green-bg);  color: var(--green-text); }
.pill-blue   { background: var(--blue-bg);   color: var(--blue-text); }
.pill-gray   { background: var(--surface0);  color: var(--subtext); }

/* Order items table */
.items-tbl { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.items-tbl th { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--subtext); padding: 4px 6px; border-bottom: 2px solid var(--crust); text-align: left; white-space: nowrap; }
.items-tbl td { padding: 6px 4px; border-bottom: 1px solid var(--crust); vertical-align: middle; }
.items-tbl tr:last-child td { border-bottom: none; }
.items-tbl input, .items-tbl select { padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--crust); background: var(--base); color: var(--text); font-size: 13px; font-family: inherit; width: 100%; }
.items-tbl input:focus, .items-tbl select:focus { outline: none; border-color: var(--blue); }
/* Autocomplete concept field inside items table */
.iac-wrap { position: relative; }
.iac-drop {
  position: fixed; background: var(--base); border: 1px solid var(--surface0);
  border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14);
  z-index: 9999; max-height: 220px; overflow-y: auto; display: none; min-width: 260px;
}
.iac-drop.open { display: block; }
.iac-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--crust); display: flex; justify-content: space-between; align-items: center; }
.iac-item:last-child { border-bottom: none; }
.iac-item:hover, .iac-item.focused { background: var(--surface0); }
.iac-item-name { font-weight: 600; color: var(--text); white-space: normal; word-break: break-word; }
.iac-item-meta { font-size: 11px; color: var(--subtext); margin-left: 8px; white-space: nowrap; }
.iac-new { color: var(--blue); font-style: italic; }

.card-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }

/* ── New Order Form Panel ── */
#new-order-panel {
  background: var(--mantle); border: 2px solid var(--blue);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.f-field { display: flex; flex-direction: column; gap: 5px; }
.f-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--subtext); letter-spacing: .04em; }
.f-field input, .f-field select, .f-field textarea {
  padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--crust);
  background: var(--base); color: var(--text); font-family: inherit; font-size: 13px;
}
.f-field input:focus, .f-field select:focus, .f-field textarea:focus { outline: none; border-color: var(--blue); }

.sec-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--subtext); letter-spacing: .05em; margin-bottom: 8px; }

/* New item rows */
.new-item-row { background: var(--base); border: 1px solid var(--crust); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.new-item-top { display: grid; grid-template-columns: 2fr 2fr 80px 90px; gap: 8px; align-items: end; }
.new-item-bot { display: grid; grid-template-columns: 1fr 1fr 30px; gap: 8px; align-items: end; }
@media (max-width: 700px) {
  .new-item-top { grid-template-columns: 1fr 1fr; }
  .new-item-bot { grid-template-columns: 1fr 1fr 30px; }
}
.row-rm { background: none; border: none; cursor: pointer; color: var(--subtext); font-size: 16px; padding: 4px 6px; border-radius: 6px; }
.row-rm:hover { background: var(--red-bg); color: var(--red); }

.new-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 800; text-transform: uppercase;
  background: var(--amber-bg); color: var(--amber-text);
  border: 1px solid var(--amber); border-radius: 5px; padding: 2px 6px;
  margin-top: 3px;
}

.add-row-btn { cursor: pointer; background: var(--base); border: 1.5px dashed var(--crust); border-radius: var(--radius); color: var(--subtext); font-size: 13px; font-weight: 600; padding: 9px 14px; font-family: inherit; width: 100%; text-align: left; transition: .15s; margin-bottom: 12px; }
.add-row-btn:hover { border-color: var(--blue); color: var(--blue-text); background: var(--blue-bg); }

.pending-notice { background: var(--amber-bg); border: 1px solid var(--amber); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--amber-text); margin-top: 10px; }
.status-flow { display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin:8px 0 4px; }
.sf-step { font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--surface0); color:var(--subtext); white-space:nowrap; }
.sf-done  { background:var(--green-bg); color:var(--green-text); opacity:.7; }
.sf-active{ background:var(--blue-bg);  color:var(--blue-text); }
.sf-sep { font-size:9px; color:var(--subtext); margin:0 1px; }
.add-cat-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
.add-cat-row label { font-size:11px; font-weight:700; color:var(--amber-text); cursor:pointer; }

/* Section headers */
.sec-hdr { display:flex; align-items:center; gap:10px; margin:24px 0 10px; }
.sec-hdr-lbl { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--subtext); }
.sec-hdr-line { flex:1; height:1px; background:var(--crust); }
.hist-card { background:none; border:none; border-bottom:1px solid var(--crust); border-radius:0; padding:10px 0; margin-bottom:0; }
.hist-card:last-child { border-bottom:none; }
.hist-wrap { background:var(--mantle); border:1px solid var(--crust); border-radius:var(--radius-lg); padding:4px 16px; margin-bottom:14px; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button onclick="window.history.back()" style="background:none;border:none;font-size:14px;font-weight:700;color:var(--subtext);cursor:pointer;">← Volver</button>
    <h2>Panel de Compras</h2>
  </div>
  <button class="btn btn-blue" onclick="showNewOrderForm()">+ Nueva Orden</button>
</div>

<!-- ── Formulario Nueva Orden ── -->
<div id="new-order-panel" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div style="font-size:16px; font-weight:800;">Nueva Orden de Compra</div>
    <button class="btn btn-dark" onclick="hideNewOrderForm()">✕ Cancelar</button>
  </div>

  <div class="form-grid">
    <div class="f-field">
      <label>Proyecto</label>
      <select id="no-proyecto">
        <option value="">— Stock General / Sin proyecto —</option>
      </select>
    </div>
    <div class="f-field">
      <label>Notas</label>
      <input type="text" id="no-notas" placeholder="Observaciones opcionales…">
    </div>
  </div>

  <div class="sec-lbl">Renglones a comprar</div>

  <div id="no-items-list"></div>

  <button class="add-row-btn" onclick="addNewItemRow()">+ Agregar renglón</button>

  <div id="no-pending-notice" class="pending-notice" style="display:none;">
    ⚠ Esta orden incluye <span id="no-pending-count">0</span> concepto(s) nuevo(s) y/o proveedor(es) nuevos que aún no están en el catálogo.
    Se agregarán automáticamente al catálogo cuando autorices la compra.
  </div>

  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px; padding-top:14px; border-top:1px solid var(--crust);">
    <button class="btn btn-dark" onclick="hideNewOrderForm()">Cancelar</button>
    <button class="btn btn-blue" onclick="submitNewOrder()">Guardar Orden</button>
  </div>
</div>

<!-- ── Lista de Órdenes ── -->
<div id="orders-list"></div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
let INV          = [];   // inventory items
let SUPPLIERS    = [];   // contacts con tipo='proveedor'
let UNITS        = [];
let ACCOUNTS     = [];
let PROJECTS     = [];
let newRowCount  = 0;

// ── Init ──────────────────────────────────────────────────────
async function init() {
  await Promise.all([
    window.DB.query('purchase_orders'),
    window.DB.query('bank_accounts'),
    window.DB.query('concept_units'),
  ]);

  const db = window.DB.get();
  INV       = (db.inventory     || []).filter(i => i.code && (i.name||i.nombre) && !i._init);
  SUPPLIERS = (db.contacts      || []).filter(c => c.tipo === 'proveedor' && !c._init && (c.name||c.nombre));
  UNITS     = (db.concept_units || [])[0]?.list || ['pza','caja','mt','mt2','lt','kg','gln','rollo','par','juego','bolsa'];
  // Cargar cuentas bancarias desde Firestore (doc 'main' con campo list)
  const baDoc = (db.bank_accounts||[]).find(d => (d._id||d.id) === 'main') || (db.bank_accounts||[])[0];
  ACCOUNTS  = baDoc?.list?.length ? baDoc.list : ['CAJA','CHU','SATP'];
  PROJECTS  = (db.projects      || []).filter(p => !p._init && !p.archivado && !p.archived && (p.codigo||p.code));

  // Populate project select in new order form
  const pSel = document.getElementById('no-proyecto');
  PROJECTS.forEach(p => {
    const o = document.createElement('option');
    const cod = p.codigo||p.code; const nom = p.nombre||p.name;
    o.value = cod; o.textContent = `${cod} — ${nom}`;
    pSel.appendChild(o);
  });

  renderOrders();
}

// ── Concept select options ─────────────────────────────────────
function buildConceptOpts(selectedCode) {
  return `<option value="">— Buscar concepto —</option>` +
    INV.map(i => {
      const nom = i.name || i.nombre || i.code;
      return `<option value="${i.code}" data-unit="${i.unit||'pza'}" ${i.code===selectedCode?'selected':''}>${i.code} — ${nom}</option>`;
    }).join('') +
    `<option value="_new" style="font-weight:700;color:var(--blue);">✚ Concepto nuevo…</option>`;
}

function buildSupplierOpts(selectedId) {
  return `<option value="">— Seleccionar proveedor —</option>` +
    SUPPLIERS.map(s => {
      const nom = s.nombre||s.name;
      return `<option value="${s.id}" ${s.id===selectedId?'selected':''}>${nom}</option>`;
    }).join('') +
    `<option value="_new" style="font-weight:700;color:var(--blue);">✚ Proveedor nuevo…</option>`;
}

function buildUnitOpts(selected) {
  return UNITS.map(u => `<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
}

function buildAccountOpts(selected) {
  return `<option value="">— Cuenta —</option>` + ACCOUNTS.map(a => `<option value="${a}" ${a===selected?'selected':''}>${a}</option>`).join('');
}

// ── New order form ─────────────────────────────────────────────
function showNewOrderForm() {
  document.getElementById('no-items-list').innerHTML = '';
  newRowCount = 0;
  addNewItemRow();
  document.getElementById('new-order-panel').style.display = 'block';
  document.getElementById('new-order-panel').scrollIntoView({ behavior:'smooth' });
}

function hideNewOrderForm() {
  document.getElementById('new-order-panel').style.display = 'none';
}

function addNewItemRow(data = {}) {
  const rowId = `nr-${++newRowCount}`;
  const cont  = document.getElementById('no-items-list');
  const div   = document.createElement('div');
  div.className = 'new-item-row';
  div.id        = rowId;

  const showCustomConcept  = data.conceptoPendiente ? 'block' : 'none';
  const showCustomSupplier = data.proveedorPendiente ? 'block' : 'none';

  div.innerHTML = `
    <div class="new-item-top">
      <!-- Concepto -->
      <div class="f-field">
        <label>Concepto</label>
        <select class="ni-concepto" data-searchable onchange="handleConceptChange('${rowId}',this)">
          ${buildConceptOpts(data.code||'')}
        </select>
        <div class="ni-concepto-nuevo" style="display:${showCustomConcept}; margin-top:4px;">
          <input type="text" class="ni-concepto-txt" placeholder="Nombre del concepto nuevo" value="${data.conceptoPendiente?.nombre||''}">
          <span class="new-badge">✦ Nuevo — pendiente aprobación</span>
        </div>
      </div>
      <!-- Proveedor -->
      <div class="f-field">
        <label>Proveedor</label>
        <select class="ni-proveedor" onchange="handleSupplierChange('${rowId}',this)">
          ${buildSupplierOpts(data.proveedorId||'')}
        </select>
        <div class="ni-proveedor-nuevo" style="display:${showCustomSupplier}; margin-top:4px;">
          <input type="text" class="ni-proveedor-txt" placeholder="Nombre del proveedor nuevo" value="${data.proveedorPendiente?.nombre||''}">
          <span class="new-badge">✦ Nuevo — pendiente aprobación</span>
        </div>
      </div>
      <!-- Cantidad -->
      <div class="f-field">
        <label>Cantidad</label>
        <input type="number" class="ni-qty" value="${data.qty||1}" min="0.01" step="any" style="text-align:center;">
      </div>
      <!-- Unidad -->
      <div class="f-field">
        <label>Unidad</label>
        <select class="ni-unit">${buildUnitOpts(data.unit||'pza')}</select>
      </div>
    </div>
    <div class="new-item-bot">
      <!-- Precio -->
      <div class="f-field">
        <label>Precio Unitario ($)</label>
        <input type="number" class="ni-price" value="${data.price||''}" min="0" step="any" placeholder="0.00">
      </div>
      <!-- Cuenta -->
      <div class="f-field">
        <label>Cuenta</label>
        <select class="ni-account">${buildAccountOpts(data.account||'')}</select>
      </div>
      <!-- Remove -->
      <div style="display:flex; align-items:flex-end; padding-bottom:2px;">
        <button class="row-rm" onclick="document.getElementById('${rowId}').remove(); updPendingNotice()">✕</button>
      </div>
    </div>
  `;
  cont.appendChild(div);
  SearchableSelect.init(div.querySelector('.ni-concepto'));
  updPendingNotice();
}

function handleConceptChange(rowId, sel) {
  const row      = document.getElementById(rowId);
  const nuevoDiv = row.querySelector('.ni-concepto-nuevo');
  const unitSel  = row.querySelector('.ni-unit');
  if (sel.value === '_new') {
    sel.value = '';
    if (sel._ssSync) sel._ssSync();
    nuevoDiv.style.display = 'block';
    row.querySelector('.ni-concepto-txt').focus();
  } else if (sel.value) {
    nuevoDiv.style.display = 'none';
    const opt = sel.options[sel.selectedIndex];
    if (opt.dataset.unit) unitSel.value = opt.dataset.unit;
  } else {
    nuevoDiv.style.display = 'none';
  }
  updPendingNotice();
}

function handleSupplierChange(rowId, sel) {
  const row      = document.getElementById(rowId);
  const nuevoDiv = row.querySelector('.ni-proveedor-nuevo');
  if (sel.value === '_new') {
    sel.value = '';
    nuevoDiv.style.display = 'block';
    row.querySelector('.ni-proveedor-txt').focus();
  } else {
    nuevoDiv.style.display = 'none';
  }
  updPendingNotice();
}

function updPendingNotice() {
  let pendingCount = 0;
  document.querySelectorAll('#no-items-list .new-item-row').forEach(row => {
    if (row.querySelector('.ni-concepto-nuevo')?.style.display  !== 'none') pendingCount++;
    if (row.querySelector('.ni-proveedor-nuevo')?.style.display !== 'none') pendingCount++;
  });
  const notice = document.getElementById('no-pending-notice');
  document.getElementById('no-pending-count').textContent = pendingCount;
  notice.style.display = pendingCount > 0 ? 'block' : 'none';
}

function collectItems() {
  const items = [];
  document.querySelectorAll('#no-items-list .new-item-row').forEach(row => {
    const concSel   = row.querySelector('.ni-concepto');
    const concTxt   = row.querySelector('.ni-concepto-txt');
    const concNuevo = row.querySelector('.ni-concepto-nuevo')?.style.display !== 'none';
    const provSel   = row.querySelector('.ni-proveedor');
    const provTxt   = row.querySelector('.ni-proveedor-txt');
    const provNuevo = row.querySelector('.ni-proveedor-nuevo')?.style.display !== 'none';
    const qty       = parseFloat(row.querySelector('.ni-qty')?.value) || 0;
    const unit      = row.querySelector('.ni-unit')?.value || 'pza';
    const price     = parseFloat(row.querySelector('.ni-price')?.value) || 0;
    const account   = row.querySelector('.ni-account')?.value || '';

    if (qty <= 0) return;

    const item = { qty, unit, price, account };

    if (concNuevo) {
      const nombre = concTxt?.value.trim();
      if (!nombre) return;
      item.code             = '';
      item.name             = nombre;
      item.conceptoPendiente = { nombre, unidad: unit };
    } else {
      item.code = concSel?.value || '';
      const inv = INV.find(i => i.code === item.code);
      item.name = inv ? (inv.name || inv.nombre) : (concSel?.options[concSel.selectedIndex]?.text || item.code);
      if (!item.code && !item.name) return;
    }

    if (provNuevo) {
      const nombre = provTxt?.value.trim();
      item.proveedorId       = '';
      item.proveedorNombre   = nombre || '';
      if (nombre) item.proveedorPendiente = { nombre };
    } else {
      item.proveedorId     = provSel?.value || '';
      const sup = SUPPLIERS.find(s => s.id === item.proveedorId);
      item.proveedorNombre = sup ? (sup.nombre || sup.name) : '';
    }

    items.push(item);
  });
  return items;
}

async function submitNewOrder() {
  const items = collectItems();
  if (!items.length) { alert('Agrega al menos un renglón con concepto y cantidad.'); return; }

  const now   = new Date();
  const folio = 'ORD-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') +
                String(now.getDate()).padStart(2,'0') + '-' + String(now.getTime()).slice(-4);

  const order = {
    id:         crypto.randomUUID(),
    folio,
    date:       now.toISOString().slice(0,10),
    status:     'Autorizado',
    project:    document.getElementById('no-proyecto').value,
    requester:  'Compras',
    notes:      document.getElementById('no-notas').value.trim(),
    items,
    manual:     true,
    createdAt:  now.toISOString()
  };

  const db = window.DB.get();
  if (!db.purchase_orders) db.purchase_orders = [];
  db.purchase_orders.unshift(order);
  window.DB.save(db);

  if (window.parent?.setDocumentInFirebase) {
    await window.parent.setDocumentInFirebase('purchase_orders', order.id, order);
  }

  hideNewOrderForm();
  renderOrders();
  showToast(`✓ Orden ${folio} guardada`);
}

function statusFlow(cur) {
  const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
  const ci = steps.findIndex(([s]) => s === cur);
  return '<div class="status-flow">' + steps.map(([,lbl], i) =>
    (i > 0 ? '<span class="sf-sep">›</span>' : '') +
    `<span class="sf-step ${i < ci ? 'sf-done' : i === ci ? 'sf-active' : ''}">${lbl}</span>`
  ).join('') + '</div>';
}

// ── Autocomplete for concept field in existing order cards ─────
function iacFilter(input, key) {
  const q   = input.value.trim();
  const drop = document.getElementById('iacdrop-' + key);
  if (!drop) return;
  const rect = input.getBoundingClientRect();
  drop.style.top   = (rect.bottom + 2) + 'px';
  drop.style.left  = rect.left + 'px';
  drop.style.width = Math.max(rect.width, 260) + 'px';

  const results = (INV || [])
    .map(i => ({ ...i, s: (() => {
      const t = (i.name||i.nombre||'').toLowerCase(), ql = q.toLowerCase();
      if (!ql) return 0;
      if (t.startsWith(ql)) return 1;
      if (t.includes(ql)) return 2;
      let ti = 0;
      for (let c of ql) { ti = t.indexOf(c, ti); if (ti === -1) return Infinity; ti++; }
      return 3;
    })() }))
    .filter(i => i.s < Infinity)
    .sort((a, b) => a.s - b.s)
    .slice(0, 14);

  drop.innerHTML = '';
  results.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'iac-item';
    div.dataset.idx = idx;
    div.innerHTML = `<span class="iac-item-name">${item.name||item.nombre}</span><span class="iac-item-meta">${item.unit||item.unidad||'pza'} · ${item.category||''}</span>`;
    div.addEventListener('mousedown', e => {
      e.preventDefault();
      iacSelect(input, item.name||item.nombre, item.unit||item.unidad||'pza');
    });
    drop.appendChild(div);
  });

  // "Texto libre" option when typed text doesn't match exactly
  if (q && !(INV||[]).find(i => (i.name||i.nombre||'').toLowerCase() === q.toLowerCase())) {
    const div = document.createElement('div');
    div.className = 'iac-item iac-new';
    div.innerHTML = `<span class="iac-item-name">Usar "<strong>${q}</strong>" como concepto personalizado</span>`;
    div.addEventListener('mousedown', e => { e.preventDefault(); iacSelect(input, q, null); });
    drop.appendChild(div);
  }

  drop.classList.toggle('open', drop.children.length > 0);
}

function iacSelect(input, name, unit) {
  input.value = name;
  input.title = name;
  // If unit is provided, try to update the unit select in the same row
  if (unit) {
    const tr = input.closest('tr');
    if (tr) {
      const unitSel = tr.querySelector('.iunit');
      if (unitSel) {
        // Find or add the option
        let found = false;
        for (const opt of unitSel.options) { if (opt.value === unit) { found = true; break; } }
        if (!found) { const o = document.createElement('option'); o.value = unit; o.textContent = unit; unitSel.appendChild(o); }
        unitSel.value = unit;
      }
    }
  }
  const key = input.dataset.iackey;
  const drop = document.getElementById('iacdrop-' + key);
  if (drop) drop.classList.remove('open');
}

document.addEventListener('mousedown', e => {
  if (!e.target.closest('.iac-wrap') && !e.target.closest('.iac-drop')) {
    document.querySelectorAll('.iac-drop.open').forEach(d => d.classList.remove('open'));
  }
}, true);

// ── Build editable items table HTML ───────────────────────────
function buildItemsTable(o) {
  const rows = (o.items||[]).map((item, i) => {
    const key = `${o.id}-${i}`;
    const nameVal = (item.name||item.code||'').replace(/"/g,'&quot;');
    return `
    <tr>
      <td>
        <div class="iac-wrap">
          <input type="text" class="iname" data-order="${o.id}" data-idx="${i}" data-iackey="${key}"
            value="${nameVal}" title="${nameVal}"
            autocomplete="off"
            oninput="iacFilter(this,'${key}')" onfocus="iacFilter(this,'${key}')"
            onkeydown="iacKey(event,this,'${key}')"
            style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;">
          <div class="iac-drop" id="iacdrop-${key}"></div>
        </div>
        ${item.conceptoPendiente ? `
          <div class="add-cat-row">
            <input type="checkbox" class="iadd-cat" data-order="${o.id}" data-idx="${i}" id="cat-${o.id}-${i}" checked style="width:14px;height:14px;accent-color:var(--amber);">
            <label for="cat-${o.id}-${i}">✦ Agregar al catálogo</label>
          </div>` : ''}
      </td>
      <td>
        <div style="display:flex;gap:4px;align-items:center;">
          <input type="number" class="iqty" data-order="${o.id}" data-idx="${i}" value="${item.qty}" min="0.01" step="any" style="width:60px;text-align:center;padding:5px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;">
          <select class="iunit" data-order="${o.id}" data-idx="${i}" style="padding:4px 5px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:12px;">
            ${buildUnitOpts(item.unit||'pza')}
          </select>
        </div>
      </td>
      <td>
        ${item.proveedorPendiente
          ? `<div style="font-size:12px;font-weight:600;">${item.proveedorNombre||'—'} <span class="new-badge">✦ Nuevo</span></div>`
          : `<select class="prov-sel-${o.id}-${i}" style="padding:5px 8px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:12px;width:100%;">
               ${buildSupplierOpts(item.proveedorId||'')}
             </select>`
        }
      </td>
      <td><input type="number" class="iprice" data-order="${o.id}" data-idx="${i}" value="${item.price||''}" placeholder="0.00" min="0" step="any" style="width:85px;text-align:right;padding:5px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;"></td>
      <td>
        <select class="iaccount" data-order="${o.id}" data-idx="${i}" style="padding:5px 8px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:12px;width:100%;">
          ${buildAccountOpts(item.account||'')}
        </select>
      </td>
    </tr>`;
  }).join('');

  return `<table class="items-tbl">
    <colgroup>
      <col style="width:40%">
      <col style="width:140px">
      <col style="width:20%">
      <col style="width:100px">
      <col style="width:auto">
    </colgroup>
    <thead><tr>
      <th>Concepto</th><th>Cant. / Unidad</th><th>Proveedor</th>
      <th style="text-align:right;">$ Precio Unit.</th><th>Cuenta</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function iacKey(e, input, key) {
  const drop = document.getElementById('iacdrop-' + key);
  if (!drop || !drop.classList.contains('open')) return;
  const items = drop.querySelectorAll('.iac-item');
  let focused = drop.querySelector('.iac-item.focused');
  const idx = focused ? parseInt(focused.dataset.idx ?? -1) : -1;
  if (e.key === 'ArrowDown') { e.preventDefault(); items.forEach(i => i.classList.remove('focused')); const next = items[Math.min(idx+1, items.length-1)]; if (next) next.classList.add('focused'); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items.forEach(i => i.classList.remove('focused')); const prev = items[Math.max(idx-1,0)]; if (prev) prev.classList.add('focused'); }
  else if (e.key === 'Enter') { e.preventDefault(); if (focused) focused.dispatchEvent(new MouseEvent('mousedown')); else drop.classList.remove('open'); }
  else if (e.key === 'Escape') { drop.classList.remove('open'); }
}

function buildActiveCard(o, mode) {
  // mode: 'cotizar' (Confirmado) or 'comprar' (Autorizado)
  const isCotizar = mode === 'cotizar';
  const isManual  = o.manual === true;
  const pillCls   = isCotizar ? 'pill-amber' : isManual ? 'pill-blue' : 'pill-green';
  const pillTxt   = isCotizar ? 'Por cotizar' : isManual ? 'Manual' : 'Autorizado';
  const cardCls   = isCotizar ? 'c-pending' : isManual ? 'c-manual' : 'c-ready';

  const hasPending = o.items?.some(i => i.conceptoPendiente || i.proveedorPendiente);
  const pendingHtml = hasPending
    ? `<div class="pending-notice" style="margin-bottom:10px;">⚠ Esta orden tiene conceptos o proveedores nuevos que se confirmarán al autorizar.</div>`
    : '';

  const cuentaOpts = ACCOUNTS.map(a => `<option value="${a}">${a}</option>`).join('');
  const actionBtns = isCotizar
    ? `<button class="btn btn-amber" onclick="guardarPrecios('${o.id}')">💾 Guardar precios</button>
       <span style="font-size:12px;color:var(--subtext);margin-left:8px;">⏳ Esperando autorización en <strong>Autorizar Pedidos</strong></span>`
    : `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;justify-content:flex-end;">
         <div style="display:flex;align-items:center;gap:6px;margin-right:auto;">
           <label style="font-size:12px;font-weight:700;color:var(--subtext);white-space:nowrap;">Cuenta de pago:</label>
           <select id="cuentapago-${o.id}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;">
             <option value="">— Seleccionar —</option>
             ${cuentaOpts}
           </select>
         </div>
         <button class="btn btn-amber" onclick="guardarPrecios('${o.id}')">💾 Guardar precios</button>
         <button class="btn btn-blue"  onclick="act('${o.id}','Comprado')">✓ Marcar Comprado</button>
         <button class="btn btn-green" onclick="act('${o.id}','Recibido')">✓✓ Comprado y Recibido</button>
       </div>`;

  const card = document.createElement('div');
  card.id        = 'ord-' + o.id;
  card.className = `ficha ${cardCls}`;
  card.innerHTML = `
    <div class="ficha-hdr">
      <span class="ficha-folio">${o.folio||'Sin folio'}</span>
      <span class="pill ${pillCls}">${pillTxt}</span>
    </div>
    <div class="ficha-meta">
      <span>📁 ${o.project||'Stock General'}</span>
      ${o.requester ? `<span>👤 ${o.requester}</span>` : ''}
      ${o.date ? `<span>📅 ${o.date}</span>` : ''}
      ${o.notes ? `<span>📝 ${o.notes}</span>` : ''}
    </div>
    ${statusFlow(o.status)}
    ${pendingHtml}
    ${buildItemsTable(o)}
    <div class="ficha-actions">${actionBtns}</div>
  `;
  return card;
}

// ── Render existing orders ─────────────────────────────────────
function renderOrders() {
  const db  = window.DB.get();
  const all = (db.purchase_orders || db.orders || []).filter(o => !o._init);

  const confirmados = all
    .filter(o => o.status === 'Confirmado')
    .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));

  const autorizados = all
    .filter(o => o.status === 'Autorizado' || (o.manual === true && !['Comprado','Recibido','Entregado'].includes(o.status)))
    .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));

  const activeIds = new Set([...confirmados, ...autorizados].map(o => o.id));
  const historial = all
    .filter(o => !activeIds.has(o.id))
    .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));

  const cont = document.getElementById('orders-list');
  cont.innerHTML = '';

  // ── Sección 1: Por Cotizar (Confirmado) ──
  if (confirmados.length) {
    cont.insertAdjacentHTML('beforeend', `
      <div class="sec-hdr">
        <span class="sec-hdr-lbl">⏳ Por Cotizar</span>
        <span style="font-size:11px;color:var(--amber-text);font-weight:700;background:var(--amber-bg);padding:2px 8px;border-radius:99px;">${confirmados.length} orden${confirmados.length>1?'es':''}</span>
        <div class="sec-hdr-line"></div>
      </div>`);
    confirmados.forEach(o => cont.appendChild(buildActiveCard(o, 'cotizar')));
  }

  // ── Sección 2: Autorizadas / Por Comprar ──
  cont.insertAdjacentHTML('beforeend', `
    <div class="sec-hdr">
      <span class="sec-hdr-lbl">✓ Autorizadas — Por Comprar</span>
      <div class="sec-hdr-line"></div>
    </div>`);

  if (autorizados.length) {
    autorizados.forEach(o => cont.appendChild(buildActiveCard(o, 'comprar')));
  } else {
    cont.insertAdjacentHTML('beforeend', '<div style="color:var(--subtext);text-align:center;padding:32px;background:var(--mantle);border-radius:12px;border:1px solid var(--crust);margin-bottom:14px;">No hay órdenes autorizadas pendientes.</div>');
  }

  // ── Sección 3: Todas las demás (read-only) ──
  if (historial.length) {
    const PMAP = {'Pedido':'pill-amber','Solicitado':'pill-amber','Confirmado':'pill-blue','Autorizado':'pill-green','Comprado':'pill-green','Recibido':'pill-green','Cancelado':'pill-red'};
    const fmt2 = n => '$'+parseFloat(n).toLocaleString('es-MX',{minimumFractionDigits:2});
    cont.insertAdjacentHTML('beforeend', `
      <div class="sec-hdr">
        <span class="sec-hdr-lbl">Todas las órdenes (${historial.length})</span>
        <div class="sec-hdr-line"></div>
      </div>
      ${historial.map(o => {
        const proj = db.projects.find(p => (p.codigo||p.code) === o.project || p.id === o.projectId);
        const pLbl = proj ? `${proj.codigo||proj.code} – ${proj.nombre||proj.name}` : (o.project||'Stock General');
        const total = (o.items||[]).reduce((s,i) => s+((i.price||0)*(i.qty||0)), 0);
        const pill  = PMAP[o.status] || 'pill-gray';
        const itemsHtml = (o.items||[]).map(i =>
          `<div class="ficha-item"><span class="ficha-item-name">${i.name||i.code||'—'}</span><span class="ficha-item-qty">${i.qty} ${i.unit||'pza'}${i.price>0?' · '+fmt2(i.price):''}</span></div>`
        ).join('');
        return `
          <div class="ficha" style="opacity:.72;">
            <div class="ficha-hdr"><span class="ficha-folio">${o.folio||o.id}</span><span class="pill ${pill}">${o.status}</span></div>
            <div class="ficha-meta">
              <span>📁 ${pLbl}</span>
              ${o.requester?`<span>👤 ${o.requester}</span>`:''}
              ${o.date?`<span>📅 ${o.date}</span>`:''}
              ${o.cuentaPago?`<span>🏦 ${o.cuentaPago}</span>`:''}
              ${total>0?`<span>💰 ${fmt2(total)}</span>`:''}
            </div>
            ${statusFlow(o.status)}
            <div class="ficha-items">${itemsHtml}</div>
          </div>`;
      }).join('')}`);
  }
}

// ── Save prices (concepto, qty, unidad, precio — proveedor y cuenta opcionales) ──
async function guardarPrecios(ordId) {
  const db    = window.DB.get();
  const order = (db.purchase_orders||db.orders||[]).find(o => o.id === ordId);
  if (!order) return;
  readPricesFromCard(ordId, order);

  // Sync en DB_STATE para que otros módulos vean el cambio
  if (window.parent?.DB_STATE?.purchase_orders) {
    const idx = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
    if (idx >= 0) window.parent.DB_STATE.purchase_orders[idx] = order;
  }

  if (window.parent?.setDocumentInFirebase) await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
  showToast('✓ Guardado');
  renderOrders();
}

function readPricesFromCard(ordId, order) {
  const card = document.getElementById('ord-'+ordId);
  if (!card) return;
  card.querySelectorAll('.iname').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    if (order.items[idx] !== undefined) order.items[idx].name = inp.value.trim();
  });
  card.querySelectorAll('.iqty').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    if (order.items[idx] !== undefined) order.items[idx].qty = parseFloat(inp.value) || order.items[idx].qty;
  });
  card.querySelectorAll('.iunit').forEach(sel => {
    const idx = parseInt(sel.dataset.idx);
    if (order.items[idx] !== undefined) order.items[idx].unit = sel.value;
  });
  card.querySelectorAll('.iprice').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    if (order.items[idx] !== undefined) order.items[idx].price = parseFloat(inp.value)||0;
  });
  card.querySelectorAll('.iaccount').forEach(sel => {
    const idx = parseInt(sel.dataset.idx);
    if (order.items[idx] !== undefined) order.items[idx].account = sel.value;
  });
  (order.items||[]).forEach((item, i) => {
    if (!item.proveedorPendiente) {
      const sel = card.querySelector(`.prov-sel-${ordId}-${i}`);
      if (sel) {
        item.proveedorId     = sel.value;
        const sup            = SUPPLIERS.find(s => s.id === sel.value);
        item.proveedorNombre = sup ? (sup.nombre||sup.name) : '';
      }
    }
  });
}

// ── Authorize purchase (and process pending items) ────────────
async function act(ordId, newStatus) {
  const card = document.getElementById('ord-'+ordId);
  if (!card) return;

  // Validar cuenta de pago (buscar en el card completo)
  const cuentaSel  = document.getElementById(`cuentapago-${ordId}`) || card.querySelector('[id^="cuentapago-"]');
  const cuentaPago = cuentaSel?.value || '';
  if (!cuentaPago) {
    alert('Selecciona la cuenta de pago (CAJA, CHU, SATP...) antes de marcar como comprado.');
    cuentaSel?.focus();
    return;
  }

  const db    = window.DB.get();
  const order = (db.purchase_orders || db.orders || []).find(o => o.id === ordId);
  if (!order) { alert('Orden no encontrada'); return; }

  readPricesFromCard(ordId, order);
  order.status      = newStatus;
  order.fechaCompra = new Date().toISOString().slice(0,10);
  order.cuentaPago  = cuentaPago;

  // ── Crear movimiento contable "por_comprobar" ────────────────
  const total = (order.items||[]).reduce((s, i) => s + (parseFloat(i.price)||0) * (parseFloat(i.qty)||0), 0);
  const itemsDesc = (order.items||[]).map(i => `${i.name||i.code} ×${i.qty}`).join(', ');
  const proyNombre = order.project || 'Stock General';
  const movId = crypto.randomUUID();
  const pObj = (db.projects||[]).find(p => (p.codigo||p.code) === order.project || p.id === order.projectId);
  window.DB.addMovement({
    id: movId,
    type: 'Gasto',
    date: order.fechaCompra,
    amount: total,
    account: cuentaPago,
    concept: `Compra ${order.folio} — ${proyNombre}: ${itemsDesc.slice(0, 100)}`,
    category: 'Compras',
    projectId: pObj?.id || null,
    status: 'por_comprobar',
    purchase_order_id: order.id
  });
  order.movimiento_id = movId;

  // ── Process pending concepts → add to inventory ──────────────
  const newConcepts  = [];
  const newSuppliers = [];

  (order.items||[]).forEach((item, idx) => {
    if (item.conceptoPendiente) {
      const checkbox = card.querySelector(`.iadd-cat[data-idx="${idx}"]`);
      const shouldAdd = !checkbox || checkbox.checked;
      if (shouldAdd) {
        const newInvItem = {
          id:       crypto.randomUUID(),
          code:     'NCON-' + Date.now().toString().slice(-5),
          name:     item.name || item.conceptoPendiente.nombre,
          nombre:   item.name || item.conceptoPendiente.nombre,
          unit:     item.unit || item.conceptoPendiente.unidad || 'pza',
          unidad:   item.unit || item.conceptoPendiente.unidad || 'pza',
          category: 'General',
          stock:    0, min: 0, cost: item.price || 0
        };
        db.inventory.push(newInvItem);
        if (window.parent?.setDocumentInFirebase) window.parent.setDocumentInFirebase('inventory', newInvItem.id, newInvItem);
        item.code = newInvItem.code;
        newConcepts.push(newInvItem.name);
      }
      delete item.conceptoPendiente;
    }

    if (item.proveedorPendiente) {
      const newSupplier = {
        id:     crypto.randomUUID(),
        name:   item.proveedorPendiente.nombre,
        nombre: item.proveedorPendiente.nombre,
        tipo:   'proveedor',
        activo: true,
        phone: '', email: '', address: ''
      };
      db.contacts.push(newSupplier);
      if (window.parent?.setDocumentInFirebase) window.parent.setDocumentInFirebase('contacts', newSupplier.id, newSupplier);
      item.proveedorId     = newSupplier.id;
      item.proveedorNombre = newSupplier.nombre;
      SUPPLIERS.push(newSupplier);
      newSuppliers.push(newSupplier.nombre);
      delete item.proveedorPendiente;
    }
  });

  window.DB.save(db);
  if (window.parent?.setDocumentInFirebase) await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
  if (window.parent?.DB_STATE?.purchase_orders) {
    const si = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
    if (si >= 0) window.parent.DB_STATE.purchase_orders[si] = order;
  }

  let msg = `✓ Orden marcada como "${newStatus}"`;
  if (newConcepts.length) msg += `\n→ ${newConcepts.length} concepto(s) agregado(s) al inventario: ${newConcepts.join(', ')}`;
  if (newSuppliers.length) msg += `\n→ ${newSuppliers.length} proveedor(es) agregado(s) al CRM: ${newSuppliers.join(', ')}`;
  alert(msg);

  showToast(`✓ ${order.folio} → ${newStatus}`);
  renderOrders();
}

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;background:var(--green);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
