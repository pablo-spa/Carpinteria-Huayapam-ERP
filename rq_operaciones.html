<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar Pedidos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding-bottom: 40px; }
.hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.hdr h2 { font-size: 18px; font-weight: 800; }
.hdr-sub { font-size: 13px; color: var(--subtext); }
.main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--crust); background: var(--mantle); color: var(--subtext); font-size: 12px; font-weight: 600; cursor: pointer; }
.tab.act { background: var(--text); color: var(--base); border-color: var(--text); }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 12px; }
.card-meta { font-size: 12px; color: var(--subtext); margin-bottom: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-pedido    { background: rgba(30,102,245,0.15); color: var(--blue); }
.badge-confirmed { background: rgba(64,160,43,0.15);  color: var(--green); }
.badge-cancelled { background: rgba(210,15,57,0.12);  color: var(--red); }
.item-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 0; border-top: 1px solid var(--crust); gap: 8px; }
.item-unit { color: var(--subtext); font-size: 11px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--crust); }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-green { background: var(--green); color: #fff; }
.btn-red   { background: var(--red);   color: #fff; }
.empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
.empty-icon  { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.status-flow { display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin:8px 0 4px; }
.sf-step { font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--surface0); color:var(--subtext); white-space:nowrap; }
.sf-done  { background:rgba(64,160,43,0.15); color:var(--green); opacity:.7; }
.sf-active{ background:rgba(30,102,245,0.15); color:var(--blue); }
.sf-sep { font-size:9px; color:var(--subtext); margin:0 1px; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div>
      <h2>Confirmar Pedidos</h2>
      <div class="hdr-sub" id="hdr-count">Cargando…</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab act">Pendientes</div>
  </div>
  <div id="orders-list"></div>
</div>

<script src="db.js"></script>
<script src="ui.js"></script>
<script>
  let ALL_ORDERS = [];
  let currentTab = 'pending';

  async function init() {
    const orders = await window.DB.query('purchase_orders');
    ALL_ORDERS = orders.filter(o => o.id && !o._init);
    render();
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('act',
        (tab === 'pending' && t.textContent === 'Pendientes') ||
        (tab === 'all'     && t.textContent === 'Todos'));
    });
    render();
  }

  function render() {
    const list = document.getElementById('orders-list');
    const d = window.DB.get();

    const pending = ALL_ORDERS.filter(o => o.status === 'Pedido' || o.status === 'Solicitado');
    document.getElementById('hdr-count').textContent =
      pending.length ? `${pending.length} pedido(s) esperando confirmación` : 'Sin pedidos pendientes';

    const TERMINAL = ['Cancelado','Recibido','Entregado'];
    const historial = ALL_ORDERS
      .filter(o => o.status !== 'Pedido' && o.status !== 'Solicitado' && !TERMINAL.includes(o.status))
      .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));

    const filtered = currentTab === 'pending' ? pending : ALL_ORDERS.filter(o => o.status === 'Pedido' || o.status === 'Solicitado');

    list.innerHTML = '';

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✅</div>
          <div class="empty-title">Sin pedidos pendientes</div>
          <div style="font-size:14px;">Los pedidos creados en Hoja de Pedido aparecerán aquí.</div>
        </div>`;
    } else {
      list.innerHTML = '';
      filtered.forEach(o => {
        const proj = d.projects.find(p => (p.codigo||p.code) === o.project || p.id === o.projectId);
        const projLabel = proj ? `${proj.code||proj.codigo} – ${proj.name||proj.nombre}` : (o.project || 'Stock General');
        const card = document.createElement('div');
        card.className = 'ficha';
        card.id = 'card-' + o.id;
        card.innerHTML = `
          <div class="ficha-hdr">
            <span class="ficha-folio">${o.folio || o.id}</span>
            <span class="pill pill-amber">Pendiente</span>
          </div>
          <div class="ficha-meta">
            <span>📁 ${projLabel}</span>
            ${o.requester ? `<span>👤 ${o.requester}</span>` : ''}
            ${o.date      ? `<span>📅 ${o.date}</span>`      : ''}
            ${o.notes     ? `<span>📝 ${o.notes}</span>`     : ''}
          </div>
          ${statusFlow(o.status)}
          <div id="items-view-${o.id}" class="ficha-items">
            ${(o.items||[]).map(i => `
              <div class="ficha-item">
                <span class="ficha-item-name">${i.name || i.code || '—'}${i.esHerramienta?'&nbsp;<span style="font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba(223,142,29,0.15);color:var(--amber);">🔧 Herramienta</span>':''}</span>
                <span class="ficha-item-qty">${i.qty} ${i.unit || 'pza'}</span>
              </div>`).join('')}
          </div>
          <div id="items-edit-${o.id}" style="display:none; margin-top:12px; display:none;">
            <div style="overflow-x:auto;">
              <table style="width:100%;border-collapse:collapse;font-size:13px;">
                <thead><tr>
                  <th style="text-align:left;padding:4px 6px;font-size:11px;font-weight:700;color:var(--subtext);border-bottom:2px solid var(--crust);">Concepto</th>
                  <th style="text-align:center;padding:4px 6px;font-size:11px;font-weight:700;color:var(--subtext);border-bottom:2px solid var(--crust);width:70px;">Cant.</th>
                  <th style="text-align:left;padding:4px 6px;font-size:11px;font-weight:700;color:var(--subtext);border-bottom:2px solid var(--crust);width:80px;">Unidad</th>
                  <th style="border-bottom:2px solid var(--crust);width:28px;"></th>
                </tr></thead>
                <tbody id="edit-tbody-${o.id}">
                  ${(o.items||[]).map((it, idx) => editRow(o.id, idx, it)).join('')}
                </tbody>
              </table>
            </div>
            <button onclick="addEditRow('${o.id}')"
              style="margin-top:8px;background:none;border:1.5px dashed var(--crust);border-radius:6px;color:var(--subtext);font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;font-family:inherit;width:100%;">
              + Añadir renglón
            </button>
          </div>
          <div class="ficha-actions">
            <button class="btn" id="btn-edit-${o.id}" onclick="toggleEdit('${o.id}')"
              style="background:var(--surface0);color:var(--text);border:1px solid var(--surface1);margin-right:auto;">✏️ Editar</button>
            <button class="btn btn-red"   onclick="act('${o.id}','Cancelado')">✕ Rechazar</button>
            <button class="btn btn-green" onclick="actConfirm('${o.id}')">✓ Confirmar para Compras</button>
          </div>`;
        list.appendChild(card);
      });
    }

    if (historial.length) {
      const PMAP = {'Confirmado':'pill-blue','Autorizado':'pill-green','Comprado':'pill-green','Recibido':'pill-green','Cancelado':'pill-red'};
      const isOpen = localStorage.getItem('rq_op_hist') !== 'closed';
      list.insertAdjacentHTML('beforeend', `
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:20px 0 8px;cursor:pointer;display:flex;justify-content:space-between;" onclick="toggleOpHist(this)">
          <span>En Proceso (${historial.length})</span>
          <span>${isOpen ? '▲' : '▼'}</span>
        </div>
        <div id="op-hist-body" style="display:${isOpen ? 'block' : 'none'};">
        ${historial.map(o => {
          const proj = d.projects.find(p => (p.codigo||p.code) === o.project || p.id === o.projectId);
          const projLabel = proj ? `${proj.code||proj.codigo} – ${proj.name||proj.nombre}` : (o.project || 'Stock');
          const pill = PMAP[o.status] || 'pill-gray';
          return `<div class="ficha" style="opacity:.75;">
            <div class="ficha-hdr"><span class="ficha-folio">${o.folio||o.id}</span><span class="pill ${pill}">${o.status}</span></div>
            <div class="ficha-meta"><span>📁 ${projLabel}</span>${o.requester?`<span>👤 ${o.requester}</span>`:''}${o.date?`<span>📅 ${o.date}</span>`:''}</div>
            ${statusFlow(o.status)}
          </div>`;
        }).join('')}
        </div>`);
    }
  }

  function statusFlow(cur) {
    const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
    const ci = steps.findIndex(([s]) => s === cur);
    return '<div class="status-flow">' + steps.map(([,lbl], i) =>
      (i > 0 ? '<span class="sf-sep">›</span>' : '') +
      `<span class="sf-step ${i < ci ? 'sf-done' : i === ci ? 'sf-active' : ''}">${lbl}</span>`
    ).join('') + '</div>';
  }

  function editRow(ordId, idx, item) {
    const herrAttr = item.esHerramienta ? 'data-herr="1"' : '';
    const herrBadge = item.esHerramienta
      ? `<span style="font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba(223,142,29,0.15);color:var(--amber);margin-left:4px;">🔧</span>`
      : '';
    return `<tr id="erow-${ordId}-${idx}" ${herrAttr}>
      <td style="padding:4px 4px;">
        <div style="display:flex;align-items:center;gap:4px;">
          <input type="text" value="${(item.name||item.code||'').replace(/"/g,'&quot;')}"
            style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;">
          ${herrBadge}
        </div>
      </td>
      <td style="padding:4px 4px;">
        <input type="number" value="${item.qty||1}" min="0.01" step="any"
          style="width:65px;text-align:center;padding:6px 4px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;">
      </td>
      <td style="padding:4px 4px;">
        <input type="text" value="${item.unit||'pza'}"
          style="width:70px;padding:6px 6px;border-radius:6px;border:1px solid var(--crust);background:var(--base);color:var(--text);font-family:inherit;font-size:13px;">
      </td>
      <td style="padding:4px 2px;text-align:center;">
        <button onclick="this.closest('tr').remove()"
          style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;line-height:1;">✕</button>
      </td>
    </tr>`;
  }

  let _editRowCount = 0;
  function addEditRow(ordId) {
    const tbody = document.getElementById('edit-tbody-' + ordId);
    if (!tbody) return;
    const idx = 'new-' + (++_editRowCount);
    tbody.insertAdjacentHTML('beforeend', editRow(ordId, idx, { name:'', qty:1, unit:'pza' }));
  }

  function toggleEdit(ordId) {
    const viewEl = document.getElementById('items-view-' + ordId);
    const editEl = document.getElementById('items-edit-' + ordId);
    const btn    = document.getElementById('btn-edit-' + ordId);
    if (!viewEl || !editEl) return;
    const editing = editEl.style.display !== 'none';
    viewEl.style.display = editing ? '' : 'none';
    editEl.style.display = editing ? 'none' : 'block';
    btn.textContent = editing ? '✏️ Editar' : '↩ Cancelar edición';
  }

  async function actConfirm(id) {
    const order = ALL_ORDERS.find(o => o.id === id);
    if (!order) return;

    // Leer items editados si el modo edición está activo
    const editEl = document.getElementById('items-edit-' + id);
    if (editEl && editEl.style.display !== 'none') {
      const rows = editEl.querySelectorAll('tbody tr');
      const newItems = [];
      rows.forEach(tr => {
        const inputs = tr.querySelectorAll('input');
        const name = inputs[0]?.value.trim();
        const qty  = parseFloat(inputs[1]?.value) || 0;
        const unit = inputs[2]?.value.trim() || 'pza';
        const esHerr = tr.dataset.herr === '1';
        if (name && qty > 0) newItems.push({ name, qty, unit, price: 0, code: '', esHerramienta: esHerr || undefined });
      });
      if (!newItems.length) { toast('Agrega al menos un renglón antes de confirmar.', 'warn'); return; }
      order.items = newItems;
    }

    if (!await showConfirm(`¿Confirmar pedido ${order.folio}?`)) return;
    order.status = 'Confirmado';
    order.confirmedAt = new Date().toISOString();

    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', id, order);
      if (window.parent.DB_STATE?.purchase_orders) {
        const idx = window.parent.DB_STATE.purchase_orders.findIndex(o => o.id === id);
        if (idx !== -1) window.parent.DB_STATE.purchase_orders[idx] = order;
        else window.parent.DB_STATE.purchase_orders.push(order);
      }
    }
    toast('✓ Pedido confirmado');
    ALL_ORDERS = ALL_ORDERS.map(o => o.id === id ? order : o);
    render();
  }

  function showConfirm(msg, okLabel = 'Confirmar') {
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `<div style="background:var(--base,#eff1f5);border-radius:12px;padding:24px 28px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25);"><p style="margin:0 0 20px;font-size:14px;font-weight:600;color:var(--text,#4c4f69);line-height:1.5;">${msg}</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button id="sc-no" style="padding:8px 18px;border-radius:7px;border:1px solid var(--crust,#dce0e8);background:var(--mantle,#e6e9ef);color:var(--text,#4c4f69);font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button><button id="sc-yes" style="padding:8px 18px;border-radius:7px;border:none;background:var(--blue,#1e66f5);color:#fff;font-size:13px;font-weight:700;cursor:pointer;">${okLabel}</button></div></div>`;
      document.body.appendChild(ov);
      const done = v => { ov.remove(); resolve(v); };
      ov.querySelector('#sc-no').onclick  = () => done(false);
      ov.querySelector('#sc-yes').onclick = () => done(true);
      ov.addEventListener('mousedown', e => { if (e.target === ov) done(false); });
    });
  }

  function toggleOpHist(hdr) {
    const body = document.getElementById('op-hist-body');
    if (!body) return;
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    hdr.querySelector('span:last-child').textContent = open ? '▼' : '▲';
    localStorage.setItem('rq_op_hist', open ? 'closed' : 'open');
  }

  async function act(id, newStatus) {
    const order = ALL_ORDERS.find(o => o.id === id);
    if (!order) return;
    const verb = newStatus === 'Confirmado' ? 'confirmar' : 'rechazar';
    if (!await showConfirm(`¿Seguro que deseas ${verb} este pedido?`)) return;

    order.status = newStatus;

    if (window.parent && window.parent.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', id, order);
      if (window.parent.DB_STATE?.purchase_orders) {
        const idx = window.parent.DB_STATE.purchase_orders.findIndex(o => o.id === id);
        if (idx !== -1) window.parent.DB_STATE.purchase_orders[idx] = order;
      }
    }
    render();
  }

  init();
</script>
</body>
</html>
