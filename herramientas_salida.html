<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<script src="db.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salida de Herramientas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* ── Scanner input (siempre activo, invisible) ─── */
#scan-ghost { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }

/* ════════════════════════════════════════════════
   IDLE SCREEN
════════════════════════════════════════════════ */
.idle-screen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; overflow: hidden;
}

/* Top: clock */
.idle-top {
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 20px 20px;
}
.clock {
  font-size: 5rem; font-weight: 800;
  font-variant-numeric: tabular-nums; letter-spacing: -.04em; line-height: 1;
}
.date-str { font-size: 1rem; color: var(--subtext); margin-top: 4px; text-transform: capitalize; }

/* Middle: scan input */
.scan-bar {
  width: 100%; max-width: 380px;
  padding: 12px 22px; font-size: 1.3rem; text-align: center;
  border: 2px solid var(--surface1); border-radius: 9999px;
  background: var(--mantle); color: var(--text); outline: none;
  transition: border-color .2s, box-shadow .2s; font-family: inherit;
  margin: 8px 0 4px;
}
.scan-bar:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(137,180,250,.18); }
.scan-bar::placeholder { color: var(--subtext); font-size: 1rem; }
.scan-hint { font-size: .85rem; color: var(--subtext); margin-bottom: 16px; }

/* Bottom: worker grid */
.worker-grid-wrap {
  flex: 1; width: 100%; overflow-y: auto;
  padding: 0 16px 16px;
}
.worker-grid-title {
  font-size: .7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: .06em; color: var(--subtext); margin-bottom: 8px; text-align: center;
}
.worker-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px;
  max-width: 700px; margin: 0 auto;
}
.w-btn {
  background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px;
  padding: 14px 8px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 7px; transition: all .12s; user-select: none;
}
.w-btn:hover  { background: var(--surface0); border-color: var(--blue); }
.w-btn:active { transform: scale(.96); }
.w-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--blue); color: #111;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900; flex-shrink: 0;
}
.w-label { font-size: 11px; font-weight: 700; text-align: center; line-height: 1.3; color: var(--text); }

/* ════════════════════════════════════════════════
   ACTIVE SCREEN
════════════════════════════════════════════════ */
.active-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.active-screen.shown { display: flex; }

.active-hdr {
  background: var(--mantle); border-bottom: 1px solid var(--crust);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.hdr-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--blue); color: #111;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900; flex-shrink: 0;
}
.hdr-name  { font-size: 16px; font-weight: 800; }
.hdr-sub   { font-size: 11px; color: var(--subtext); margin-top: 1px; }

/* Timer ring */
.timer-ring  { width: 38px; height: 38px; position: relative; flex-shrink: 0; }
.timer-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer-ring circle { fill: none; stroke: var(--surface1); stroke-width: 3; }
.timer-ring .prog  { stroke: var(--blue); stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke-dashoffset .9s linear, stroke .5s; }
.timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }

.btn-close {
  padding: 6px 14px; border-radius: 7px;
  background: var(--surface0); border: 1px solid var(--crust);
  color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
}

.active-body { flex: 1; display: flex; overflow: hidden; }

/* Mi Caja panel */
.caja-panel { width: 240px; flex-shrink: 0; background: var(--mantle); border-right: 1px solid var(--crust); display: flex; flex-direction: column; overflow: hidden; }
.panel-hdr  { padding: 10px 14px; border-bottom: 1px solid var(--crust); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--subtext); flex-shrink: 0; }
.caja-list  { flex: 1; overflow-y: auto; }
.caja-item  { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--crust); cursor: pointer; transition: background .1s; }
.caja-item:hover  { background: rgba(243,139,168,.1); }
.caja-item:last-child { border-bottom: none; }
.ci-icon  { font-size: 17px; flex-shrink: 0; }
.ci-info  { flex: 1; min-width: 0; }
.ci-name  { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-code  { font-size: 10px; color: var(--subtext); font-family: monospace; }
.ci-ret   { font-size: 10px; color: var(--red); font-weight: 700; opacity: 0; transition: opacity .1s; flex-shrink: 0; }
.caja-item:hover .ci-ret { opacity: 1; }
.caja-empty { padding: 24px 14px; text-align: center; color: var(--subtext); font-size: 12px; }

/* Catálogo panel */
.cat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.cat-search-bar { padding: 10px 14px; border-bottom: 1px solid var(--crust); flex-shrink: 0; background: var(--mantle); }
.cat-search {
  width: 100%; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--crust); background: var(--base);
  color: var(--text); font-size: 13px; font-family: inherit; outline: none;
}
.cat-search:focus { border-color: var(--blue); }
.cat-scroll { flex: 1; overflow-y: auto; padding: 12px 14px; }

.cat-group-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--subtext); padding: 6px 0 5px; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tool-card {
  background: var(--mantle); border: 1px solid var(--crust); border-radius: 10px;
  padding: 12px; cursor: pointer; transition: all .12s; display: flex; flex-direction: column; gap: 5px; user-select: none;
}
.tool-card:hover         { background: var(--surface0); transform: translateY(-1px); }
.tool-card.taken         { opacity: .38; cursor: not-allowed; pointer-events: none; }
.tool-card.mine          { border-color: var(--red); background: rgba(243,139,168,.08); }
.tool-card.mine:hover    { background: rgba(243,139,168,.18); }

.tc-icon  { font-size: 20px; }
.tc-name  { font-size: 12px; font-weight: 700; line-height: 1.3; }
.tc-code  { font-size: 10px; color: var(--subtext); font-family: monospace; }
.tc-badge { font-size: 10px; font-weight: 700; margin-top: 2px; }
.tc-avail  { color: var(--green); }
.tc-mine   { color: var(--red); }
.tc-taken  { color: var(--subtext); }

/* Big toast */
.big-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--green); color: #fff; padding: 14px 28px; border-radius: 12px;
  font-size: 16px; font-weight: 800; z-index: 9999; pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,.3); transition: transform .3s ease, opacity .3s ease; opacity: 0;
  max-width: 90vw; text-align: center;
}
.big-toast.show  { transform: translateX(-50%) translateY(0); opacity: 1; }
.big-toast.error { background: var(--red); }

/* Config panel */
.grid-header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
.btn-cfg {
  background: none; border: 1px solid var(--crust); border-radius: 6px;
  color: var(--subtext); cursor: pointer; padding: 3px 8px; font-size: 13px;
  font-family: inherit; transition: all .12s;
}
.btn-cfg:hover { background: var(--surface0); color: var(--text); }

.cfg-panel {
  display: none; background: var(--mantle); border: 1px solid var(--crust);
  border-radius: 10px; padding: 14px 16px; margin: 0 auto 12px;
  max-width: 560px; width: calc(100% - 32px);
}
.cfg-panel.open { display: block; }
.cfg-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--subtext); margin-bottom: 10px; }
.cfg-roles { display: flex; flex-wrap: wrap; gap: 7px; }
.role-chip {
  display: flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--crust); background: var(--base);
  font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; color: var(--subtext);
  transition: all .12s;
}
.role-chip.on { background: var(--blue); border-color: var(--blue); color: #111; }

@media (max-width: 600px) {
  .caja-panel  { width: 190px; }
  .tool-grid   { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .clock       { font-size: 3.8rem; }
  .worker-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
}
</style>
</head>
<body>

<!-- Input fantasma siempre escuchando el escáner de gafete -->
<input type="text" id="scan-ghost" autocomplete="off" autocorrect="off" autocapitalize="off">

<!-- ════════════════════════════════════════
     IDLE SCREEN
════════════════════════════════════════ -->
<div class="idle-screen" id="idle-screen">

  <div class="idle-top">
    <div class="clock"    id="clock">00:00:00</div>
    <div class="date-str" id="date-str">Cargando...</div>
  </div>

  <!-- Input visible para escáner / teclado -->
  <input type="text" id="scan-bar" class="scan-bar" placeholder="🪪  Escanea tu gafete" autocomplete="off" spellcheck="false">
  <div class="scan-hint">o selecciona tu nombre</div>

  <!-- Grilla de trabajadores -->
  <div class="worker-grid-wrap">
    <div class="grid-header">
      <div class="worker-grid-title" style="margin:0;">Selección rápida</div>
      <button class="btn-cfg" onclick="toggleCfg()" title="Filtrar por puesto">⚙ Filtrar</button>
    </div>

    <!-- Panel de configuración de roles -->
    <div class="cfg-panel" id="cfg-panel">
      <div class="cfg-title">Mostrar puestos</div>
      <div class="cfg-roles" id="cfg-roles"></div>
    </div>

    <div class="worker-grid" id="worker-grid">
      <div style="grid-column:1/-1;text-align:center;color:var(--subtext);padding:20px;font-size:13px;">Cargando trabajadores…</div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     ACTIVE SCREEN
════════════════════════════════════════ -->
<div class="active-screen" id="active-screen">

  <div class="active-hdr">
    <div class="hdr-avatar" id="hdr-avatar">?</div>
    <div>
      <div class="hdr-name" id="hdr-name">—</div>
      <div class="hdr-sub"  id="hdr-sub">0 herramientas en caja</div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
      <div class="timer-ring">
        <svg viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.9"/>
          <circle cx="18" cy="18" r="15.9" class="prog" id="timer-prog"/>
        </svg>
        <div class="timer-num" id="timer-num">30</div>
      </div>
      <button class="btn-close" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="active-body">
    <div class="caja-panel">
      <div class="panel-hdr">📦 Mi Caja</div>
      <div class="caja-list" id="caja-list">
        <div class="caja-empty">Sin herramientas</div>
      </div>
    </div>

    <div class="cat-panel">
      <div class="cat-search-bar">
        <input class="cat-search" id="cat-search" placeholder="🔍 Buscar herramienta…" oninput="renderCatalogo()" onfocus="resetTimer()">
      </div>
      <div class="cat-scroll" id="cat-scroll"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="big-toast" id="big-toast"></div>

<script>
const TIMEOUT_SEC = 30;
const CATEGORIAS = [
  { id: 'perforacion',  label: 'Perforación',    icon: '🔩' },
  { id: 'corte',        label: 'Corte',           icon: '🪚' },
  { id: 'lijado',       label: 'Lijado',          icon: '📋' },
  { id: 'cepillado',    label: 'Cepillado',       icon: '🪵' },
  { id: 'medicion',     label: 'Medición',        icon: '📐' },
  { id: 'sujecion',     label: 'Sujeción',        icon: '🔧' },
  { id: 'router',       label: 'Router / Fresado',icon: '⚙️' },
  { id: 'ensamble',     label: 'Ensamble / Mano', icon: '🔨' },
  { id: 'acabado',      label: 'Acabado',         icon: '🎨' },
  { id: 'otro',         label: 'Otros',           icon: '🧰' },
];

let herramientas = [];
let workers      = [];
let activeWorker = null;
let timerInterval = null;
let timerLeft     = TIMEOUT_SEC;

/* ── Colores por puesto ─────────────── */
// bg, text, border
const ROLE_PALETTE = [
  ['#89b4fa','#111','#5a9ef8'],  // blue
  ['#a6e3a1','#111','#7acc75'],  // green
  ['#fab387','#111','#f89458'],  // peach
  ['#cba6f7','#111','#b07ef5'],  // mauve
  ['#94e2d5','#111','#5ecec0'],  // teal
  ['#f9e2af','#111','#f5cc6e'],  // yellow
  ['#f38ba8','#fff','#ef5a7e'],  // red
  ['#89dceb','#111','#58cce4'],  // sky
  ['#b4befe','#111','#8a9ff7'],  // lavender
  ['#f5c2e7','#111','#ef93d3'],  // pink
  ['#74c7ec','#111','#41aee0'],  // sapphire
  ['#eba0ac','#111','#e46e7f'],  // maroon
];
const roleColorMap = {};
function roleColor(role) {
  if (!role) return ROLE_PALETTE[0];
  if (!roleColorMap[role]) {
    const idx = Object.keys(roleColorMap).length % ROLE_PALETTE.length;
    roleColorMap[role] = ROLE_PALETTE[idx];
  }
  return roleColorMap[role];
}

/* ── Clock ──────────────────────────── */
function tick() {
  const now = new Date();
  const clk = document.getElementById('clock');
  const dt  = document.getElementById('date-str');
  if (clk) clk.textContent = now.toLocaleTimeString('es-MX', { hour12: false });
  if (dt)  dt.textContent  = now.toLocaleDateString('es-MX',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }
  ).replace(/^\w/, c => c.toUpperCase());
}
setInterval(tick, 1000);
tick();

/* ── Init ───────────────────────────── */
async function init() {
  const p = window.parent;
  if (!p?.cargar_coleccion) { setTimeout(init, 300); return; }

  await Promise.all([
    p.cargar_coleccion('herramientas'),
    p.cargar_coleccion('workers'),
  ]);

  herramientas = (p.DB_STATE?.herramientas || [])
    .map(h => ({ ...h, id: h.id || h._id })).filter(h => h.id);

  workers = (p.DB_STATE?.workers || [])
    .map(w => ({ ...w, id: w.id || w._id })).filter(w => w.id);

  // Fallback: intentar contacts si workers está vacío
  if (!workers.length) {
    await p.cargar_coleccion('contacts');
    workers = (p.DB_STATE?.contacts || [])
      .map(w => ({ ...w, id: w.id || w._id }))
      .filter(w => w.id && w.tipo === 'trabajador');
  }

  workers.sort((a, b) => displayName(a).localeCompare(displayName(b), 'es'));
  buildRoleChips();
  renderWorkerGrid();
}

/* ── Nombre para mostrar ────────────── */
function displayName(w) {
  // name es "ApellidoP ApellidoM Nombre" — recomponer como "Nombre ApellidoP"
  const given = w.givenName || '';
  const parts  = (w.name || '').split(' ');
  const apPat  = parts[0] || '';
  if (given && apPat) return `${given} ${apPat}`;
  return w.nombre || w.name || w.givenName || '?';
}

/* ── Config de roles (localStorage) ── */
const CFG_KEY = 'herr_roles_hidden';
let allRoles   = [];
let hiddenRoles = new Set(JSON.parse(localStorage.getItem(CFG_KEY) || '[]'));

function buildRoleChips() {
  allRoles = [...new Set(workers.map(w => w.role || '').filter(Boolean))].sort();
  // Asignar colores en orden estable (sort garantiza consistencia)
  allRoles.forEach(r => roleColor(r));
  const el = document.getElementById('cfg-roles');
  el.innerHTML = allRoles.map(r => {
    const [bg, fg] = roleColor(r);
    const active   = !hiddenRoles.has(r);
    const style    = active ? `background:${bg};border-color:${bg};color:${fg};` : '';
    return `<div class="role-chip${active ? ' on' : ''}" data-role="${r}"
      style="${style}" onclick="toggleRole('${r}')">${r}</div>`;
  }).join('');
}

function toggleRole(role) {
  if (hiddenRoles.has(role)) hiddenRoles.delete(role);
  else hiddenRoles.add(role);
  localStorage.setItem(CFG_KEY, JSON.stringify([...hiddenRoles]));
  buildRoleChips();
  renderWorkerGrid();
}

function toggleCfg() {
  document.getElementById('cfg-panel').classList.toggle('open');
}

/* ── Worker grid ────────────────────── */
function renderWorkerGrid() {
  const el = document.getElementById('worker-grid');
  const visible = workers.filter(w => !hiddenRoles.has(w.role || ''));

  if (!visible.length) {
    el.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--subtext);padding:20px;font-size:13px;">Sin trabajadores visibles — revisa la configuración ⚙</div>';
    return;
  }
  el.innerHTML = visible.map(w => {
    const name       = displayName(w);
    const initial    = name[0].toUpperCase();
    const [bg, fg, border] = roleColor(w.role || '');
    return `<div class="w-btn" onclick="loginWorker('${w.id}')"
      style="border-color:${border}40;">
      <div class="w-avatar" style="background:${bg};color:${fg};">${initial}</div>
      <span class="w-label">${name}</span>
      <span style="font-size:9px;color:${bg};font-weight:700;text-align:center;line-height:1;">${w.role||''}</span>
      <span style="font-size:9px;color:var(--subtext);font-family:monospace;text-align:center;">${w.id}</span>
    </div>`;
  }).join('');
}

/* ── Scanner ────────────────────────── */
const ghost   = document.getElementById('scan-ghost');
const scanBar = document.getElementById('scan-bar');

// Mantener el ghost activo para el escáner físico
function keepGhostFocus() {
  const active = document.activeElement;
  if (active !== scanBar && active !== document.getElementById('cat-search')) {
    ghost.focus();
  }
}
document.addEventListener('click', keepGhostFocus);
setInterval(keepGhostFocus, 800);
ghost.focus();

// Lector de barras acumula caracteres rápido y dispara al hacer Enter o pausa
let scanBuf = '', scanTimer = null;

function flushScan() {
  const code = scanBuf.trim();
  scanBuf = '';
  if (code) processScan(code);
}

ghost.addEventListener('input', () => {
  clearTimeout(scanTimer);
  scanBuf += ghost.value;
  ghost.value = '';
  scanTimer = setTimeout(flushScan, 80);
});
ghost.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(scanTimer); ghost.value = ''; flushScan(); }
});

// El input visible del idle screen también funciona
scanBar.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const code = scanBar.value.trim();
    scanBar.value = '';
    if (code) processScan(code);
  }
});
// Cuando el usuario escribe en scan-bar, desactivar ghost para no duplicar
scanBar.addEventListener('focus', () => clearInterval(null));

/* ── Proceso de scan ────────────────── */
function processScan(code) {
  resetTimer();

  // ¿Es un trabajador?
  const w = workers.find(w =>
    w.scanCode === code || w.id === code || w.personalId === code || w.codigo === code
  );
  if (w) {
    if (!activeWorker) {
      loginWorker(w.id);
    } else if (activeWorker.id !== w.id) {
      bigToast('Cierra tu sesión primero.', true);
    }
    return;
  }

  // ¿Es una herramienta?
  if (!activeWorker) {
    bigToast('Escanea tu gafete primero.', true);
    return;
  }
  const tool = herramientas.find(h => h.codigo === code || h.id === code);
  if (!tool) { bigToast('Código no reconocido.', true); return; }
  handleTool(tool);
}

/* ── Login / Logout ─────────────────── */
function loginWorker(wId) {
  const w = workers.find(w => w.id === wId);
  if (!w) return;
  activeWorker = w;

  const name       = displayName(w);
  const [bg, fg]   = roleColor(w.role || '');
  const avatar     = document.getElementById('hdr-avatar');
  avatar.textContent   = name[0].toUpperCase();
  avatar.style.background = bg;
  avatar.style.color      = fg;
  document.getElementById('hdr-name').textContent = name;

  document.getElementById('idle-screen').style.display   = 'none';
  document.getElementById('active-screen').classList.add('shown');
  document.getElementById('cat-search').value = '';

  renderCaja();
  renderCatalogo();
  startTimer();
}

function logout() {
  activeWorker = null;
  clearInterval(timerInterval);
  timerInterval = null;

  document.getElementById('idle-screen').style.display = '';
  document.getElementById('active-screen').classList.remove('shown');
  scanBar.value = '';
  ghost.focus();
}

/* ── Timer ──────────────────────────── */
function startTimer() {
  timerLeft = TIMEOUT_SEC;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerLeft = Math.max(0, timerLeft - 1);
    updateTimerUI();
    if (timerLeft <= 0) { clearInterval(timerInterval); logout(); }
  }, 1000);
  updateTimerUI();
}

function resetTimer() {
  if (!activeWorker) return;
  timerLeft = TIMEOUT_SEC;
  updateTimerUI();
}

function updateTimerUI() {
  const pct    = (timerLeft / TIMEOUT_SEC) * 100;
  const circle = document.getElementById('timer-prog');
  circle.style.strokeDashoffset = 100 - pct;
  circle.style.stroke = timerLeft <= 8 ? 'var(--red)' : timerLeft <= 15 ? 'var(--amber)' : 'var(--blue)';
  document.getElementById('timer-num').textContent = timerLeft;
}

/* ── Tool actions ───────────────────── */
function handleTool(tool) {
  const myTools  = herramientas.filter(h => h.assignedTo === activeWorker.id);
  const alreadyMine = myTools.some(h => h.id === tool.id);

  if (alreadyMine) {
    doReturn(tool);
  } else if (tool.assignedTo) {
    const oName = workerName(tool.assignedTo);
    bigToast(`La tiene ${oName}.`, true);
  } else {
    doLoan(tool);
  }
}

async function doLoan(tool) {
  try {
    const updated = await window.DB.assignTool(tool.id, activeWorker.id, false);
    updateLocal(tool.id, updated);
    renderCaja(); renderCatalogo();
    bigToast(`✓ ${tool.nombre}`);
    resetTimer();
  } catch (e) { bigToast(e.message, true); }
}

async function doReturn(tool) {
  try {
    const updated = await window.DB.assignTool(tool.id, activeWorker.id, true);
    updateLocal(tool.id, updated);
    renderCaja(); renderCatalogo();
    bigToast(`↩ ${tool.nombre} — devuelta`);
    resetTimer();
  } catch (e) { bigToast(e.message, true); }
}

function updateLocal(toolId, updated) {
  const idx = herramientas.findIndex(h => h.id === toolId);
  if (idx >= 0) herramientas[idx] = updated;
}

function workerName(id) {
  const w = workers.find(w => w.id === id);
  return w ? (w.nombre || w.name || w.givenName || id) : id;
}

/* ── Render ─────────────────────────── */
function catIcon(id) { return CATEGORIAS.find(c => c.id === id)?.icon || '🧰'; }

function renderCaja() {
  if (!activeWorker) return;
  const myTools = herramientas.filter(h => h.assignedTo === activeWorker.id);
  const n = myTools.length;
  document.getElementById('hdr-sub').textContent = `${n} herramienta${n !== 1 ? 's' : ''} en caja`;

  const el = document.getElementById('caja-list');
  if (!n) { el.innerHTML = '<div class="caja-empty">Sin herramientas</div>'; return; }

  el.innerHTML = myTools.map(h => `
    <div class="caja-item" onclick="doReturn(herramientas.find(x=>x.id==='${h.id}'))" title="Toca para devolver">
      <span class="ci-icon">${catIcon(h.categoria)}</span>
      <div class="ci-info">
        <div class="ci-name">${h.nombre}</div>
        <div class="ci-code">${h.codigo || ''} ${h.tipo === 'personal' ? '🔒' : ''}</div>
      </div>
      ${h.tipo !== 'personal'
        ? '<span class="ci-ret">↩</span>'
        : '<span style="font-size:10px;color:var(--subtext);flex-shrink:0;">personal</span>'}
    </div>`).join('');
}

function renderCatalogo() {
  if (!activeWorker) return;
  const q     = (document.getElementById('cat-search').value || '').toLowerCase();
  const myIds = new Set(herramientas.filter(h => h.assignedTo === activeWorker.id).map(h => h.id));

  let list = herramientas.filter(h => {
    if (h.tipo === 'personal' && h.assignedTo && h.assignedTo !== activeWorker.id) return false;
    if (h.estado === 'baja' || h.estado === 'reparacion') return false;
    if (q && !(h.nombre||'').toLowerCase().includes(q) && !(h.codigo||'').toLowerCase().includes(q)) return false;
    return true;
  });

  const groups = {};
  list.forEach(h => {
    const cat = h.categoria || 'otro';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(h);
  });

  const el = document.getElementById('cat-scroll');
  if (!list.length) {
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--subtext);">Sin resultados.</div>';
    return;
  }

  el.innerHTML = CATEGORIAS.filter(c => groups[c.id]?.length).map(c => `
    <div class="cat-group-title">${c.icon} ${c.label}</div>
    <div class="tool-grid">
      ${groups[c.id].map(h => {
        const isMine  = myIds.has(h.id);
        const isTaken = !isMine && !!h.assignedTo;
        const badge   = isMine  ? `<span class="tc-badge tc-mine">↩ devolver</span>`
                      : isTaken ? `<span class="tc-badge tc-taken">Con ${workerName(h.assignedTo)}</span>`
                      :           `<span class="tc-badge tc-avail">Disponible</span>`;
        const cardCls = isMine ? 'mine' : isTaken ? 'taken' : '';
        const onclick = isTaken ? '' : `onclick="handleTool(herramientas.find(x=>x.id==='${h.id}'));resetTimer()"`;
        return `
          <div class="tool-card ${cardCls}" ${onclick}>
            <span class="tc-icon">${c.icon}</span>
            <span class="tc-name">${h.nombre}</span>
            ${h.codigo ? `<span class="tc-code">${h.codigo}</span>` : ''}
            ${badge}
          </div>`;
      }).join('')}
    </div>`).join('');
}

/* ── Toast ──────────────────────────── */
let toastTimer = null;
function bigToast(msg, isError = false) {
  const el = document.getElementById('big-toast');
  el.textContent = msg;
  el.className   = 'big-toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
