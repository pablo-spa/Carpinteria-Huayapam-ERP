<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
  <meta charset="UTF-8">
  <title>Admin Usuarios</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    .table-wrap {
      width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--crust); overflow-x: auto;
    }
    .items-table { width: 100%; border-collapse: collapse; min-width: 500px; font-size: 13px; }
    .items-table th {
      text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .05em; color: var(--subtext); padding: 10px 14px;
      border-bottom: 2px solid var(--crust); background: var(--mantle); white-space: nowrap;
    }
    .items-table td { padding: 10px 14px; vertical-align: middle; border-bottom: 1px solid var(--crust); }
    .items-table tr:last-child td { border-bottom: none; }
    
    .items-table select { width: 100%; max-width: 200px; }

  </style>
</head>
<body>

  <div class="hdr">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
      <h2 class="hdr-title">Gestión de Usuarios</h2>
    </div>
    <button class="btn btn-blue" onclick="document.getElementById('add-form').style.display='flex'">+ Agregar Usuario</button>
  </div>

  <div class="main" style="max-width: 900px;">
    <div class="card" id="add-form" style="display:none;">
      <div class="card-title">Nuevo Usuario</div>
      <div class="card-body" style="flex-direction:row; gap:12px; align-items:flex-end; flex-wrap:wrap;">
        <div class="field" style="flex:2; min-width:200px;">
          <label>Email de Google del usuario</label>
          <input type="email" id="new-email" placeholder="ejemplo@gmail.com">
        </div>
        <div class="field" style="flex:1; min-width:140px;">
          <label>Asignar Rol</label>
          <select id="new-role">
            <option value="admin">Administrador</option>
            <option value="gerencia">Gerencia</option>
            <option value="contador">Contador</option>
            <option value="compras">Compras</option>
            <option value="almacen">Almacén</option>
            <option value="produccion">Producción</option>
            <option value="ninguno">Ninguno (Bloqueado)</option>
          </select>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" onclick="document.getElementById('add-form').style.display='none'" style="height:38px;">Cancelar</button>
          <button class="btn btn-blue" onclick="addUser()" style="height:38px;">Guardar Usuario</button>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table class="items-table">
        <thead>
          <tr>
            <th>Email de Acceso (Google)</th>
            <th>Rol / Permisos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="users-body">
          <tr><td colspan="3" style="text-align:center; padding:30px; color:var(--subtext);">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const ROLES = ['admin', 'gerencia', 'contador', 'compras', 'almacen', 'produccion', 'ninguno'];

    let users = [];

    async function loadUsers() {
      try {
        // We get the latest from DB_STATE, which is populated by index.html automatically
        users = window.parent.DB_STATE?.users || [];
        renderTable();
      } catch (err) {
        console.error("Error loading users:", err);
        renderTable();
      }
    }

    function renderTable() {
      const tbody = document.getElementById('users-body');
      let html = '';
      
      users.forEach(u => {
        let selectHtml = `<select onchange="updateRole('${u.email}', this.value)">`;
        
        // Ensure the current role is in ROLES
        const rolesToRender = [...ROLES];
        if (u.role && !rolesToRender.includes(u.role)) {
            rolesToRender.push(u.role);
        }
        
        rolesToRender.forEach(r => {
            selectHtml += `<option value="${r}" ${u.role === r ? 'selected' : ''}>${r.charAt(0).toUpperCase() + r.slice(1)}</option>`;
        });
        
        selectHtml += `</select>`;

        html += `
          <tr>
            <td>${u.email}</td>
            <td>${selectHtml}</td>
            <td>
              <button class="btn btn-ghost" style="padding:4px 8px; font-size:12px; color:var(--red); border-color:var(--surface1);" onclick="deleteUser('${u.email}')">✕ Eliminar</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    window.updateRole = async (email, newRole) => {
      try {
        if(window.parent && window.parent.saveUserToFirebase) {
           await window.parent.saveUserToFirebase(email, newRole);
        }
        const user = users.find(u => u.email === email);
        if (user) user.role = newRole;
        
        // Update parent state too
        if(window.parent.DB_STATE && window.parent.DB_STATE.users) {
           let su = window.parent.DB_STATE.users.find(u => u.email === email);
           if(su) su.role = newRole;
        }
      } catch (err) {
        alert("Error al actualizar: " + err.message);
      }
    };

    window.addUser = async () => {
      const em = document.getElementById('new-email').value.trim();
      const ro = document.getElementById('new-role').value;
      if (!em) return alert("Ingresa un email válido");
      
      try {
        if(window.parent && window.parent.saveUserToFirebase) {
            await window.parent.saveUserToFirebase(em, ro);
        }
        users.push({ email: em, role: ro });
        
        if (window.parent.DB_STATE) {
            if (!window.parent.DB_STATE.users) window.parent.DB_STATE.users = [];
            window.parent.DB_STATE.users.push({ _id: em, email: em, role: ro });
        }
        
        document.getElementById('add-form').style.display = 'none';
        document.getElementById('new-email').value = '';
        renderTable();
      } catch (err) {
        alert("Error al guardar: " + err.message);
      }
    };

    window.deleteUser = async (email) => {
      if (!confirm(`¿Eliminar acceso para ${email}?`)) return;
      try {
        await window.parent.deleteUserFromFirebase(email);
        users = users.filter(u => u.email !== email);
        
        if (window.parent.DB_STATE) {
            window.parent.DB_STATE.users = window.parent.DB_STATE.users.filter(u => u.email !== email);
        }
        
        renderTable();
      } catch (err) {
        alert("Error al eliminar: " + err.message);
      }
    };

    document.addEventListener("DOMContentLoaded", loadUsers);
  </script>
</body>
</html>
