<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Carpintería Huayapam</title>
<style>
  /* Dashboard uses global.css variables — no local :root overrides needed */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; position: sticky; top: 0; z-index: 10; display:flex; justify-content:space-between; align-items:center; }
  .hdr-title { font-size: 17px; font-weight: 800; color: var(--text); }

  .main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ── Filtro período ── */
  .filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filter-select { padding: 7px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); outline: none; font-family: inherit; cursor:pointer; }
  .filter-select:focus { border-color: var(--blue); }

  /* ── KPI Cards ── */
  .grid-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .stat-card { background: var(--base); border: 1px solid var(--crust); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--crust); }
  .stat-card.c-green { border-top-color: var(--green); }
  .stat-card.c-red   { border-top-color: var(--red); }
  .stat-card.c-blue  { border-top-color: var(--blue); }
  .stat-card.c-amber { border-top-color: var(--amber); }
  .sc-title { font-size: 11px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.05em; }
  .sc-val { font-size: 26px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sc-sub { font-size: 11px; color: var(--muted); }

  /* ── Alertas ── */
  .alerts-section { display:flex; flex-direction:column; gap:8px; }
  .alert-row { display:flex; align-items:center; gap:10px; background:var(--base); border:1px solid var(--crust); border-radius:10px; padding:10px 16px; cursor:pointer; transition:.12s; border-left:3px solid transparent; }
  .alert-row:hover { background:var(--surface0); }
  .alert-row.a-red    { border-left-color:var(--red); }
  .alert-row.a-amber  { border-left-color:var(--amber); }
  .alert-row.a-blue   { border-left-color:var(--blue); }
  .alert-row.a-green  { border-left-color:var(--green); }
  .alert-icon  { font-size:18px; flex-shrink:0; }
  .alert-body  { flex:1; }
  .alert-title { font-size:13px; font-weight:700; color:var(--text); }
  .alert-sub   { font-size:11px; color:var(--subtext); margin-top:2px; }
  .alert-arrow { font-size:12px; color:var(--subtext); }

  /* ── Grid medio/bajo ── */
  .grid-mid  { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
  .grid-low  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-mid, .grid-low { grid-template-columns: 1fr; } }

  .panel { background: var(--base); border: 1px solid var(--crust); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .p-hdr { padding: 14px 18px; border-bottom: 1px solid var(--crust); font-weight: 700; font-size: 14px; display:flex; justify-content:space-between; align-items:center; }
  .p-body { padding: 16px 18px; flex: 1; overflow-y: auto; }

  .list-row { display: flex; justify-content: space-between; align-items:center; padding: 9px 0; border-bottom: 1px solid var(--surface0); font-size:13px; gap:8px; }
  .list-row:last-child { border-bottom: none; padding-bottom: 0; }
  .lr-title { color: var(--text); font-weight: 600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lr-val { color: var(--subtext); font-variant-numeric: tabular-nums; flex-shrink:0; }
  .lr-val.pos { color: var(--green); }
  .lr-val.neg { color: var(--red); }
  .lr-val.warn { color: var(--amber); }

  /* ── Gráfico de barras ── */
  .chart-wrap { display:flex; flex-direction:column; gap:10px; padding-top:4px; }
  .chart-month { display:flex; flex-direction:column; gap:3px; }
  .cm-label { font-size:11px; color:var(--subtext); font-weight:600; display:flex; justify-content:space-between; }
  .cm-bars { display:flex; gap:3px; height:8px; border-radius:4px; overflow:hidden; background:var(--surface0); }
  .bar-ing  { background:var(--green);  height:100%; transition:.3s; }
  .bar-gas  { background:var(--red);    height:100%; transition:.3s; }
  .chart-legend { display:flex; gap:16px; font-size:11px; color:var(--subtext); font-weight:600; padding-top:4px; }
  .leg-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle; }

  /* ── Progress bar ── */
  .prog-wrap { display:flex; flex-direction:column; gap:4px; }
  .pw-labels { display:flex; justify-content:space-between; font-size:12px; color:var(--subtext); }
  .pw-bar-bg { width:100%; height:7px; background:var(--surface0); border-radius:4px; overflow:hidden; }
  .pw-bar-fill { height:100%; background:var(--blue); border-radius:4px; }

  /* ── Stock bajo badge ── */
  .stock-badge { font-size:10px; font-weight:800; padding:2px 7px; border-radius:99px; background:var(--red); color:#fff; }
  .stock-badge.warn { background:var(--amber); color:#000; }

  .empty-state { text-align:center; color:var(--muted); font-size:13px; padding:20px 0; }

  /* ── Monthly calendar ── */
  .cal-nav-btn { background:transparent; border:1px solid var(--crust); border-radius:6px; color:var(--subtext); font-size:16px; width:28px; height:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; transition:.15s; }
  .cal-nav-btn:hover { background:var(--surface0); color:var(--text); }
  .cal-legend { display:flex; gap:10px; flex-wrap:wrap; }
  .cal-leg { font-size:11px; font-weight:700; color:var(--subtext); display:flex; align-items:center; gap:4px; }
  .cal-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
  .cal-dow { text-align:center; font-size:10px; font-weight:800; color:var(--subtext); text-transform:uppercase; padding:4px 0; }
  .cal-body { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-cell { min-height:80px; background:var(--mantle); border:1px solid var(--crust); border-radius:6px; padding:5px 6px; }
  .cal-cell.today { border-color:var(--blue); }
  .cal-cell.other { opacity:.4; }
  .cal-cell-dd { font-size:13px; font-weight:700; margin-bottom:3px; }
  .cal-cell.today .cal-cell-dd { color:var(--blue); }
  .cal-ev { font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:filter .1s; }
  .cal-ev:hover { filter:brightness(.88); }
  .cev-b { background:var(--green-bg); color:var(--green-text); }
  .cev-p { background:var(--amber-bg); color:var(--amber-text); }
  .cev-c { background:var(--blue-bg); color:var(--blue-text); }
  .cev-v { background:rgba(139,92,246,.14); color:#7c3aed; }
  .cev-q { background:rgba(32,159,181,.12); color:var(--teal,#159a8a); }
  .cev-x { background:var(--surface0); color:var(--subtext); cursor:pointer; }

  /* ── Event popover ── */
  #cal-popover {
    display: none;
    position: fixed;
    z-index: 500;
    background: var(--base);
    border: 1px solid var(--crust);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.22);
    width: 280px;
    max-width: calc(100vw - 32px);
    padding: 16px;
    pointer-events: all;
  }
  #cal-popover.open { display: block; }
  .cpop-type { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--subtext); margin-bottom:6px; }
  .cpop-title { font-size:15px; font-weight:800; color:var(--text); margin-bottom:10px; line-height:1.3; }
  .cpop-rows { display:flex; flex-direction:column; gap:6px; }
  .cpop-row { display:flex; gap:8px; font-size:12px; }
  .cpop-label { color:var(--subtext); font-weight:700; min-width:90px; flex-shrink:0; }
  .cpop-val { color:var(--text); }
  .cpop-close { position:absolute; top:10px; right:12px; background:none; border:none; font-size:16px; color:var(--subtext); cursor:pointer; padding:2px 6px; border-radius:4px; }
  .cpop-close:hover { background:var(--surface0); }

  /* Day-detail list (when clicking +N) */
  .cpop-day-ev { display:flex; align-items:center; gap:7px; padding:5px 0; border-bottom:1px solid var(--crust); cursor:pointer; }
  .cpop-day-ev:last-child { border-bottom:none; }
  .cpop-day-ev:hover { color:var(--blue); }
  .cpop-day-badge { font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; white-space:nowrap; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="window.history.back()">← Volver</button>
    <div class="hdr-title">Dashboard Administrativo</div>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="filter-bar">
      <select id="filt-period" class="filter-select" onchange="handlePeriodChange()">
        <option value="all">Todo Histórico</option>
        <option value="ytd">Este Año</option>
        <option value="month" selected>Este Mes</option>
        <option value="custom">Personalizado...</option>
      </select>
      <div id="custom-dates" style="display:none; gap:8px; align-items:center; display:none;">
        <input type="date" id="filt-start" class="filter-select" onchange="renderDashboard()">
        <span style="color:var(--subtext)">a</span>
        <input type="date" id="filt-end" class="filter-select" onchange="renderDashboard()">
      </div>
    </div>
    <div style="font-size:11px; color:var(--muted);" id="last-update"></div>
  </div>
</div>

<div class="main">
  <!-- KPIs -->
  <div class="grid-top" id="top-stats"></div>

  <!-- Alertas -->
  <div id="alerts-area" style="display:none;">
    <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--subtext); margin-bottom:8px;">Requieren Atención</div>
    <div class="alerts-section" id="alerts-list"></div>
  </div>

  <!-- Gráfico + Saldos -->
  <div class="grid-mid">
    <div class="panel">
      <div class="p-hdr">
        Ingresos vs Gastos — Últimos 6 Meses
        <span style="font-size:11px; font-weight:500; color:var(--muted);">Por mes</span>
      </div>
      <div class="p-body" id="monthly-chart"></div>
    </div>
    <div class="panel">
      <div class="p-hdr">Saldos de Cuentas</div>
      <div class="p-body" id="acc-balances"></div>
    </div>
  </div>

  <!-- Proyectos / RRHH / Inventario -->
  <div class="grid-low">
    <div class="panel">
      <div class="p-hdr">Proyectos Activos <span id="projs-count" style="font-size:11px;color:var(--muted);font-weight:500;"></span></div>
      <div class="p-body" id="active-projs"></div>
    </div>
    <div class="panel">
      <div class="p-hdr">Recursos Humanos</div>
      <div class="p-body" id="hr-stats"></div>
    </div>
    <div class="panel">
      <div class="p-hdr">Stock Bajo / Crítico <span id="stock-count" style="font-size:11px;color:var(--muted);font-weight:500;"></span></div>
      <div class="p-body" id="inv-stats"></div>
    </div>
  </div>

  <!-- Monthly Calendar -->
  <div class="panel" id="cal-panel">
    <div class="p-hdr">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
        <span style="font-size:15px; font-weight:800;" id="cal-title">—</span>
        <button class="cal-nav-btn" onclick="calNav(1)">›</button>
      </div>
      <div class="cal-legend">
        <span class="cal-leg"><span class="cal-dot" style="background:var(--green);"></span>Cumpleaños</span>
        <span class="cal-leg"><span class="cal-dot" style="background:var(--amber);"></span>Proyectos</span>
        <span class="cal-leg"><span class="cal-dot" style="background:var(--blue);"></span>Compras</span>
        <span class="cal-leg"><span class="cal-dot" style="background:#8b5cf6;"></span>Viajes</span>
        <span class="cal-leg"><span class="cal-dot" style="background:var(--teal,#159a8a);"></span>Cotizaciones</span>
      </div>
    </div>
    <div class="p-body" style="padding:12px 18px;">
      <div id="cal-grid"></div>
    </div>
  </div>
</div>

<!-- Event detail popover -->
<div id="cal-popover">
  <button class="cpop-close" onclick="closeCalPopover()">✕</button>
  <div class="cpop-type" id="cpop-type"></div>
  <div class="cpop-title" id="cpop-title"></div>
  <div class="cpop-rows" id="cpop-rows"></div>
</div>

<script src="db.js"></script>
<script>
  const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function fmt(num) {
    return '$' + parseFloat(num||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function fmtK(num) {
    const n = parseFloat(num||0);
    if (Math.abs(n) >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1000)    return '$' + (n/1000).toFixed(1) + 'k';
    return '$' + n.toFixed(0);
  }

  function handlePeriodChange() {
    const val = document.getElementById('filt-period').value;
    const cd = document.getElementById('custom-dates');
    cd.style.display = (val === 'custom') ? 'flex' : 'none';
    renderDashboard();
  }

  function filterMovs(allMovs) {
    const period = document.getElementById('filt-period').value;
    const sDate = document.getElementById('filt-start').value;
    const eDate = document.getElementById('filt-end').value;
    const now = new Date();

    return allMovs.filter(m => {
      if(period === 'all') return true;
      if(period === 'ytd') return new Date(m.date).getFullYear() === now.getFullYear();
      if(period === 'month') {
        const d = new Date(m.date);
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      }
      if(period === 'custom') {
        if(sDate && m.date < sDate) return false;
        if(eDate && m.date > eDate) return false;
        return true;
      }
      return true;
    });
  }

  function renderDashboard() {
    const d = window.DB.get();
    const allMovs = d.accounting_movements || [];
    const movs = filterMovs(allMovs).filter(m => !m.eliminado);

    let ing = 0, gas = 0, cxC = 0, cxP = 0;
    const accBals = {};

    movs.forEach(m => {
      const isConf = m.status === 'confirmado' || m.status === 'confirmed';
      if(isConf) {
        if(m.type === 'Ingreso') ing += (m.amount || 0);
        if(m.type === 'Gasto')   gas += (m.amount || 0);
        if(m.type === 'Ingreso' || m.type === 'Apertura') {
          accBals[m.account] = (accBals[m.account]||0) + (m.amount||0);
        } else if(m.type === 'Gasto') {
          accBals[m.account] = (accBals[m.account]||0) - (m.amount||0);
        } else if(m.type === 'Transferencia') {
          accBals[m.account]     = (accBals[m.account]    ||0) - (m.amount||0);
          accBals[m.destAccount] = (accBals[m.destAccount]||0) + (m.amount||0);
        }
      } else if(m.status === 'pendiente' || m.status === 'draft') {
        if(m.type === 'Ingreso') cxC += (m.amount||0);
        if(m.type === 'Gasto')   cxP += (m.amount||0);
      }
    });

    const flujo = ing - gas;

    // ── KPIs ──────────────────────────────────────────────────────────────────
    document.getElementById('top-stats').innerHTML = `
      <div class="stat-card c-green">
        <div class="sc-title">Ingresos</div>
        <div class="sc-val" style="color:var(--green)">${fmtK(ing)}</div>
        <div class="sc-sub">${fmt(ing)}</div>
      </div>
      <div class="stat-card c-red">
        <div class="sc-title">Egresos</div>
        <div class="sc-val" style="color:var(--red)">${fmtK(gas)}</div>
        <div class="sc-sub">${fmt(gas)}</div>
      </div>
      <div class="stat-card ${flujo>=0?'c-blue':'c-red'}">
        <div class="sc-title">Flujo Neto</div>
        <div class="sc-val" style="color:${flujo>=0?'var(--blue)':'var(--red)'}">${fmtK(flujo)}</div>
        <div class="sc-sub">${fmt(flujo)}</div>
      </div>
      <div class="stat-card c-amber">
        <div class="sc-title">Por Cobrar</div>
        <div class="sc-val" style="color:var(--amber)">${fmtK(cxC)}</div>
        <div class="sc-sub">${fmt(cxC)} pendiente</div>
      </div>
    `;

    // ── Alertas ───────────────────────────────────────────────────────────────
    renderAlerts(d);

    // ── Gráfico mensual ───────────────────────────────────────────────────────
    renderMonthlyChart(allMovs.filter(m => !m.eliminado));

    // ── Saldos ────────────────────────────────────────────────────────────────
    let balHtml = '<div class="prog-wrap" style="gap:12px;">';
    const totalBal = Object.values(accBals).reduce((s,x)=>s+x, 0);
    const sortedAccs = Object.entries(accBals).sort((a,b) => b[1]-a[1]);
    for(let [ac, b] of sortedAccs) {
      const pct = Math.max(0, Math.min(100, totalBal > 0 ? (b/totalBal)*100 : 0));
      balHtml += `
        <div class="prog-wrap" style="gap:4px;">
          <div class="pw-labels"><span>${ac}</span><span style="color:${b>=0?'var(--green)':'var(--red)'}; font-weight:700;">${fmt(b)}</span></div>
          <div class="pw-bar-bg"><div class="pw-bar-fill" style="width:${pct}%; background:${b>=0?'var(--blue)':'var(--red)'}"></div></div>
        </div>
      `;
    }
    if(sortedAccs.length > 0) {
      balHtml += `<div style="text-align:right; font-weight:800; font-size:15px; margin-top:12px; padding-top:10px; border-top:1px solid var(--surface0)">Total: ${fmt(totalBal)}</div>`;
    }
    balHtml += '</div>';
    document.getElementById('acc-balances').innerHTML = sortedAccs.length > 0 ? balHtml : '<div class="empty-state">Sin movimientos confirmados</div>';

    // ── Proyectos ─────────────────────────────────────────────────────────────
    const active = (d.projects||[]).filter(p => {
      const st = p.estado || p.status || '';
      return st !== 'Terminado' && st !== 'Cancelado' && st !== 'terminado' && st !== 'cancelado';
    }).sort((a,b) => (b.avance||b.progress||0) - (a.avance||a.progress||0));
    document.getElementById('projs-count').textContent = active.length > 0 ? `(${active.length})` : '';
    let pH = '';
    active.slice(0,6).forEach(p => {
      const avance = p.avance ?? p.progress ?? 0;
      pH += `
        <div class="prog-wrap" style="gap:4px; margin-bottom:10px;">
          <div class="pw-labels"><span style="font-weight:600; color:var(--text);">${p.nombre||p.name||'—'}</span><span>${avance}%</span></div>
          <div class="pw-bar-bg"><div class="pw-bar-fill" style="width:${avance}%;"></div></div>
        </div>
      `;
    });
    document.getElementById('active-projs').innerHTML = active.length > 0 ? pH : '<div class="empty-state">Sin proyectos activos</div>';

    // ── RRHH ──────────────────────────────────────────────────────────────────
    const workers = (d.workers||[]).filter(w => w.activo !== false);
    const nw = workers.length;
    const weeklyN = workers.reduce((s,w) => s+(parseFloat(w.salarioBase||w.baseSalary||0)), 0);
    document.getElementById('hr-stats').innerHTML = `
      <div class="list-row"><span class="lr-title">Plantilla activa</span><span class="lr-val">${nw} trabajadores</span></div>
      <div class="list-row"><span class="lr-title">Nómina semanal (est.)</span><span class="lr-val">${fmt(weeklyN)}</span></div>
      <div class="list-row"><span class="lr-title">Nómina mensual (est.)</span><span class="lr-val">${fmt(weeklyN * 4.33)}</span></div>
    `;

    // ── Stock bajo ────────────────────────────────────────────────────────────
    renderLowStock(d.inventory||[]);

    document.getElementById('last-update').textContent = 'Act: ' + new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  }

  function renderMonthlyChart(allMovs) {
    const now = new Date();
    const months = [];
    for(let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: MONTHS_ES[d.getMonth()] });
    }

    const data = months.map(m => {
      const mMovs = allMovs.filter(mv => (mv.date||'').startsWith(m.key) && (mv.status === 'confirmado' || mv.status === 'confirmed'));
      const ing = mMovs.filter(mv => mv.type === 'Ingreso').reduce((s,mv) => s+(mv.amount||0), 0);
      const gas = mMovs.filter(mv => mv.type === 'Gasto').reduce((s,mv)  => s+(mv.amount||0), 0);
      return { ...m, ing, gas };
    });

    const maxVal = Math.max(...data.flatMap(d => [d.ing, d.gas]), 1);

    let html = '<div class="chart-wrap">';
    data.forEach(m => {
      const ingPct = (m.ing / maxVal * 100).toFixed(1);
      const gasPct = (m.gas / maxVal * 100).toFixed(1);
      html += `
        <div class="chart-month">
          <div class="cm-label">
            <span>${m.label}</span>
            <span style="color:var(--green)">${fmtK(m.ing)}</span>
            <span style="color:var(--red)">${fmtK(m.gas)}</span>
          </div>
          <div class="cm-bars">
            <div class="bar-ing" style="width:${ingPct}%"></div>
            <div class="bar-gas" style="width:${gasPct}%"></div>
          </div>
        </div>
      `;
    });
    html += `
      <div class="chart-legend">
        <span><span class="leg-dot" style="background:var(--green)"></span>Ingresos</span>
        <span><span class="leg-dot" style="background:var(--red)"></span>Gastos</span>
      </div>
    </div>`;
    document.getElementById('monthly-chart').innerHTML = html;
  }

  function renderAlerts(d) {
    const alerts = [];
    const orders = (d.purchase_orders||[]).filter(o => !o._init);

    // Pedidos esperando confirmación
    const nConf = orders.filter(o => o.status === 'Pedido' || o.status === 'Solicitado').length;
    if(nConf > 0) alerts.push({ cls:'a-blue', icon:'📋', title:`${nConf} pedido${nConf>1?'s':''} esperando confirmación`, sub:'Operaciones debe confirmar antes de enviar a compras', file:'rq_operaciones.html', mod:'Confirmar Pedidos' });

    // Pedidos confirmados esperando autorización
    const nAut = orders.filter(o => o.status === 'Confirmado').length;
    if(nAut > 0) alerts.push({ cls:'a-amber', icon:'🛡️', title:`${nAut} pedido${nAut>1?'s':''} esperando autorización`, sub:'Administración debe autorizar y fijar precios', file:'rq_admin_aprobacion.html', mod:'Autorizar Pedidos' });

    // Órdenes autorizadas listas para comprar
    const nComp = orders.filter(o => o.status === 'Autorizado').length;
    if(nComp > 0) alerts.push({ cls:'a-green', icon:'🛒', title:`${nComp} orden${nComp>1?'es':''} lista${nComp>1?'s':''} para comprar`, sub:'Compras debe procesar la adquisición', file:'rq_compras.html', mod:'Compras' });

    // Compras pendientes de recibir
    const nRec = orders.filter(o => o.status === 'Comprado').length;
    if(nRec > 0) alerts.push({ cls:'a-blue', icon:'📦', title:`${nRec} compra${nRec>1?'s':''} pendiente${nRec>1?'s':''} de recibir`, sub:'Almacén debe confirmar la recepción', file:'rq_recepcion.html', mod:'Recepción de Material' });

    // Proyectos vencidos o atrasados (avance < 50 y con fecha de entrega pasada)
    const today = new Date().toISOString().slice(0,10);
    const atrasados = (d.projects||[]).filter(p => {
      const st = p.estado || p.status || '';
      if(st === 'Terminado' || st === 'Cancelado') return false;
      const fecha = p.fechaEntrega || p.deliveryDate || p.dueDate;
      return fecha && fecha < today;
    });
    if(atrasados.length > 0) alerts.push({ cls:'a-red', icon:'⏰', title:`${atrasados.length} proyecto${atrasados.length>1?'s':''} con fecha de entrega vencida`, sub: atrasados.slice(0,2).map(p => p.nombre||p.name||'').join(', '), file:'proyectos.html', mod:'Proyectos' });

    // Movimientos sin categorizar
    const sinCat = (d.accounting_movements||[]).filter(m => !m.eliminado && (m.status==='confirmado'||m.status==='confirmed') && (!m.category || m.category==='' || m.category==='pending'));
    if(sinCat.length > 0) alerts.push({ cls:'a-amber', icon:'🏷️', title:`${sinCat.length} movimiento${sinCat.length>1?'s':''} sin categorizar`, sub:'Sin categoría afecta los reportes financieros', file:'finanzas.html', mod:'Contabilidad' });

    const area = document.getElementById('alerts-area');
    const list = document.getElementById('alerts-list');
    if(alerts.length === 0) { area.style.display = 'none'; return; }

    area.style.display = 'block';
    list.innerHTML = alerts.map(a => `
      <div class="alert-row ${a.cls}" onclick="if(window.parent?.openModule) window.parent.openModule('${a.file}','${a.mod}')">
        <span class="alert-icon">${a.icon}</span>
        <div class="alert-body">
          <div class="alert-title">${a.title}</div>
          ${a.sub ? `<div class="alert-sub">${a.sub}</div>` : ''}
        </div>
        <span class="alert-arrow">→</span>
      </div>`).join('');
  }

  function renderLowStock(inventory) {
    const LOW_THRESHOLD = 3;
    const items = inventory.filter(i => typeof i.stock === 'number' && i.stock <= LOW_THRESHOLD)
      .sort((a,b) => a.stock - b.stock)
      .slice(0, 8);
    document.getElementById('stock-count').textContent = items.length > 0 ? `(${items.length})` : '';
    if(items.length === 0) {
      document.getElementById('inv-stats').innerHTML = '<div class="empty-state">✅ Todo el stock está OK</div>';
      return;
    }
    let html = '';
    items.forEach(i => {
      const isCritical = i.stock <= 0;
      const badge = isCritical
        ? '<span class="stock-badge">AGOTADO</span>'
        : `<span class="stock-badge warn">${i.stock} ${i.unit||''}</span>`;
      html += `
        <div class="list-row">
          <span class="lr-title" style="font-size:12px;">${i.name||i.code||'—'}</span>
          ${badge}
        </div>
      `;
    });
    document.getElementById('inv-stats').innerHTML = html;
  }

  // ── Monthly Calendar ──────────────────────────────────────────────────────
  const MONTHS_ES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DAYS_ES_S = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let CAL_YEAR  = new Date().getFullYear();
  let CAL_MONTH = new Date().getMonth();
  let CAL_EV_DATA = {}; // id → event detail object

  function calNav(dir) {
    CAL_MONTH += dir;
    if (CAL_MONTH < 0)  { CAL_MONTH = 11; CAL_YEAR--; }
    if (CAL_MONTH > 11) { CAL_MONTH = 0;  CAL_YEAR++; }
    closeCalPopover();
    renderMonthCalendar();
  }

  // ── Popover ────────────────────────────────────────────────────────
  function closeCalPopover() {
    document.getElementById('cal-popover').classList.remove('open');
  }

  function calNavigate(evId) {
    const ev = CAL_EV_DATA[evId];
    if (!ev?.navFile) return;
    closeCalPopover();
    if (ev.navSetup) ev.navSetup();
    window.parent.openModule(ev.navFile, ev.navLabel || ev.title);
  }

  function showCalPopover(evtEl, evId) {
    const ev = CAL_EV_DATA[evId];
    if (!ev) return;

    const pop = document.getElementById('cal-popover');
    document.getElementById('cpop-type').textContent  = ev.typeLabel || '';
    document.getElementById('cpop-title').textContent = ev.title || '';

    const rowsEl = document.getElementById('cpop-rows');
    const rowsHtml = (ev.rows || []).map(r =>
      `<div class="cpop-row"><span class="cpop-label">${r.label}</span><span class="cpop-val">${r.val}</span></div>`
    ).join('');
    const navBtn = ev.navFile
      ? `<div style="margin-top:10px;"><button class="btn btn-blue" style="font-size:12px;padding:5px 14px;width:100%;" onclick="calNavigate('${evId}')">Abrir →</button></div>`
      : '';
    rowsEl.innerHTML = rowsHtml + navBtn;

    pop.classList.add('open');

    const rect = evtEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = 280, ph = 320;
    let left = rect.left, top = rect.bottom + 6;
    if (left + pw > vw - 8) left = Math.max(8, vw - pw - 8);
    if (top + ph > vh - 8) top = rect.top - ph - 6;
    pop.style.left = left + 'px';
    pop.style.top  = top  + 'px';
  }

  function showDayPopover(evtEl, isoDate, allEvIds) {
    const pop = document.getElementById('cal-popover');
    const [y, m, d] = isoDate.split('-').map(Number);
    const label = new Date(y, m - 1, d).toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('cpop-type').textContent  = label;
    document.getElementById('cpop-title').textContent = 'Todos los eventos';

    const rowsEl = document.getElementById('cpop-rows');
    rowsEl.innerHTML = allEvIds.map(id => {
      const ev = CAL_EV_DATA[id];
      if (!ev) return '';
      return `<div class="cpop-day-ev" onclick="showCalPopover(this,'${id}')">
        <span class="cpop-day-badge ${ev.cls}">${ev.chip}</span>
        <span style="font-size:12px;">${ev.title}</span>
      </div>`;
    }).join('');

    pop.classList.add('open');
    const rect = evtEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const pw = 280;
    let left = rect.left, top = rect.bottom + 6;
    if (left + pw > vw - 8) left = Math.max(8, vw - pw - 8);
    if (top + 300 > vh - 8) top = rect.top - 300 - 6;
    pop.style.left = left + 'px';
    pop.style.top  = top  + 'px';
  }

  document.addEventListener('click', e => {
    const pop = document.getElementById('cal-popover');
    if (!pop.contains(e.target) && !e.target.closest('.cal-ev')) closeCalPopover();
  });

  // ── Calendar render ────────────────────────────────────────────────
  async function renderMonthCalendar() {
    const grid    = document.getElementById('cal-grid');
    const titleEl = document.getElementById('cal-title');
    if (!grid) return;

    titleEl.textContent = `${MONTHS_ES_L[CAL_MONTH]} ${CAL_YEAR}`;
    grid.innerHTML = '<div style="color:var(--subtext);font-size:13px;padding:12px 0;">Cargando…</div>';

    const loadCol = async (col) => {
      if (window.parent?.cargar_coleccion && window.parent?.DB_STATE?.[col] === undefined)
        await window.parent.cargar_coleccion(col).catch(() => {});
    };
    await Promise.all([loadCol('viajes'), loadCol('purchase_orders'), loadCol('quotations'), loadCol('workers'), loadCol('contacts')]);
    const db2 = window.DB.get();

    const workers    = (db2.workers    || []).filter(w => !w._init);
    const contacts   = (db2.contacts   || []).filter(c => !c._init);
    const projects   = (db2.projects   || []).filter(p => !p._init);
    const orders     = (db2.purchase_orders || db2.orders || []).filter(o => !o._init && o.date);
    const viajes     = (db2.viajes     || []).filter(v => !v._init && v.fecha_salida);
    const quotations = (db2.quotations || []).filter(q => !q._init && !q.eliminada && (q.createdAt || q.fecha || q.date));

    titleEl.textContent = `${MONTHS_ES_L[CAL_MONTH]} ${CAL_YEAR}`;

    const today    = new Date();
    const todayISO = today.toISOString().slice(0, 10);
    const toISO    = d => d.toISOString().slice(0, 10);
    const fmtDate  = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' }) : '—';
    const fmtMXN   = n => n != null ? '$' + Number(n).toLocaleString('es-MX') : null;

    CAL_EV_DATA = {};
    let evIdSeq = 0;
    const evMap = {}; // iso → evId[]

    const reg = (iso, evObj) => {
      const id = 'cev_' + (evIdSeq++);
      CAL_EV_DATA[id] = evObj;
      if (!evMap[iso]) evMap[iso] = [];
      evMap[iso].push(id);
    };

    const shortName = (s, max=22) => s && s.length > max ? s.slice(0, max) + '…' : (s || '');

    // ── Cumpleaños — combina workers + contacts(trabajador) para cubrir ambas colecciones
    const birthdayPeople = [
      ...workers,
      ...contacts.filter(c => c.tipo === 'trabajador'),
    ];
    const seenBirthIds = new Set();
    birthdayPeople.forEach(w => {
      const wid = w.id || w._id || w.nombre || w.name;
      if (seenBirthIds.has(wid)) return;
      seenBirthIds.add(wid);
      const bd = w.birthDate || '';
      const parts = bd.split('-').map(Number);
      if (parts.length < 3) return;
      const [byear, bm, bday] = parts;
      if (!bm || !bday) return;
      const iso = `${CAL_YEAR}-${String(bm).padStart(2,'0')}-${String(bday).padStart(2,'0')}`;
      const edad = byear ? CAL_YEAR - byear : null;
      const nombre = w.nombre || w.name || '?';
      reg(iso, {
        cls: 'cev-b', chip: `🎂 ${nombre.split(' ')[0]}`, typeLabel: 'Cumpleaños',
        title: nombre,
        rows: [
          { label: 'Fecha',  val: fmtDate(iso) },
          ...(edad ? [{ label: 'Edad', val: `${edad} años` }] : []),
        ]
      });
    });

    // ── Proyectos (inicio y fin)
    projects.forEach(p => {
      const nombre = p.nombre || p.name || '';
      const codigo = p.codigo || p.code || '';
      const label  = nombre && codigo ? `${nombre} (${codigo})` : nombre || codigo || 'Proyecto';
      const chip   = shortName(nombre || codigo, 18);
      const start  = (p.fechaInicio || p.startDate || '').slice(0, 10);
      const end    = (p.fechaFin    || p.endDate   || '').slice(0, 10);

      const baseRows = [
        { label: 'Código',  val: codigo || '—' },
        { label: 'Inicio',  val: fmtDate(start) },
        { label: 'Entrega', val: end ? fmtDate(end) : '—' },
        ...(p.estado ? [{ label: 'Estado', val: p.estado }] : []),
      ];

      if (start) reg(start, {
        cls: 'cev-p', chip: `▶ ${chip}`, typeLabel: 'Inicio de proyecto',
        title: label, rows: baseRows,
        navFile: `proyecto_detalle.html?id=${p.id}`, navLabel: label,
      });
      if (end && end !== start) reg(end, {
        cls: 'cev-p', chip: `■ ${chip}`, typeLabel: 'Entrega de proyecto',
        title: label, rows: baseRows,
        navFile: `proyecto_detalle.html?id=${p.id}`, navLabel: label,
      });
    });

    // ── Compras
    orders.forEach(o => {
      const date = (o.date || '').slice(0, 10);
      if (!date) return;
      const supplier = o.proveedor || o.supplier || o.provider || '';
      const rows = [
        { label: 'Folio',     val: o.folio || '—' },
        { label: 'Fecha',     val: fmtDate(date) },
        ...(supplier ? [{ label: 'Proveedor', val: supplier }] : []),
        ...(o.total != null ? [{ label: 'Total', val: fmtMXN(o.total) }] : []),
        ...(o.items?.length  ? [{ label: 'Artículos', val: String(o.items.length) }] : []),
      ];
      reg(date, {
        cls: 'cev-c', chip: `🛒 ${o.folio || 'Compra'}`, typeLabel: 'Orden de Compra',
        title: o.folio || 'Orden de Compra', rows,
        navFile: 'historial_compras.html', navLabel: 'Historial Compras',
      });
    });

    // ── Viajes
    viajes.forEach(v => {
      const sal    = (v.fecha_salida     || '').slice(0, 10);
      const regReal = (v.fecha_regreso_real || '').slice(0, 10);
      const regEst  = (v.fecha_regreso_est  || '').slice(0, 10);
      const regEnd  = regReal || regEst || sal;
      if (!sal) return;

      const proy = v.project_id ? projects.find(p => p.id === v.project_id) : null;
      const proyNombre = proy ? (proy.nombre || proy.name || '') : '';
      const proyLabel  = proy
        ? (proyNombre + (proy.codigo ? ` (${proy.codigo})` : '')).trim()
        : '';

      const rows = [
        { label: 'Destino',      val: v.destino || '—' },
        { label: 'Salida',       val: fmtDate(sal) },
        { label: 'Regreso est.', val: regEst  ? fmtDate(regEst)  : '—' },
        ...(regReal ? [{ label: 'Regreso real', val: fmtDate(regReal) }] : []),
        ...(proyLabel ? [{ label: 'Proyecto', val: proyLabel }] : []),
        ...(v.estado  ? [{ label: 'Estado',   val: v.estado }]  : []),
      ];

      // Chip: project name if available, else destination
      const chipText = shortName(proyNombre || v.destino || 'Viaje', 18);
      const vId = v.id;

      const cur = new Date(sal + 'T12:00:00');
      const endD = new Date(regEnd + 'T12:00:00');
      while (cur <= endD) {
        const iso = toISO(cur);
        const mnStart = `${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}-01`;
        const mnEnd   = `${CAL_YEAR}-${String(CAL_MONTH+1).padStart(2,'0')}-31`;
        if (iso >= mnStart && iso <= mnEnd)
          reg(iso, {
            cls: 'cev-v', chip: `✈ ${chipText}`, typeLabel: 'Viaje',
            title: v.destino || 'Viaje', rows,
            navFile: 'viaticos.html', navLabel: 'Viáticos',
            navSetup: () => { window.parent.PENDING_VIAJE_ID = vId; },
          });
        cur.setDate(cur.getDate() + 1);
      }
    });

    // ── Cotizaciones
    quotations.forEach(q => {
      const date = (q.createdAt || q.fecha || q.date || '').slice(0, 10);
      if (!date) return;
      const proy   = q.projectId ? projects.find(p => p.id === q.projectId) : null;
      const client = q.clientId  ? contacts.find(c => c.id === q.clientId)  : null;
      const proyNombre   = proy   ? (proy.nombre  || proy.name  || '') : '';
      const clientNombre = client ? (client.nombre || client.name || '') : '';
      const displayTitle = proyNombre || clientNombre || q.folio || 'Cotización';

      const rows = [
        { label: 'Folio',   val: q.folio || '—' },
        { label: 'Fecha',   val: fmtDate(date) },
        ...(clientNombre  ? [{ label: 'Cliente',  val: clientNombre }]  : []),
        ...(proyNombre    ? [{ label: 'Proyecto', val: proyNombre + (proy.codigo ? ` (${proy.codigo})` : '') }] : []),
        ...(q.total != null ? [{ label: 'Total',  val: fmtMXN(q.total) }] : []),
        ...(q.status || q.estado ? [{ label: 'Estado', val: q.status || q.estado }] : []),
      ];
      reg(date, {
        cls: 'cev-q', chip: `📋 ${shortName(proyNombre || clientNombre || q.folio || 'Cot.', 16)}`,
        typeLabel: 'Cotización', title: displayTitle, rows,
        navFile: q.id ? `cotizacion.html?id=${q.id}` : (proy ? `proyecto_detalle.html?id=${proy.id}` : null),
        navLabel: 'Cotización',
      });
    });

    // ── Grid HTML
    const firstDay    = new Date(CAL_YEAR, CAL_MONTH, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const startDate   = new Date(firstDay);
    startDate.setDate(firstDay.getDate() - startOffset);
    const lastDay     = new Date(CAL_YEAR, CAL_MONTH + 1, 0).getDate();
    const totalCells  = Math.ceil((startOffset + lastDay) / 7) * 7;

    const dowHtml = DAYS_ES_S.map(d => `<div class="cal-dow">${d}</div>`).join('');
    let cells = '';
    const MAX = 3;

    for (let i = 0; i < totalCells; i++) {
      const d = new Date(startDate); d.setDate(startDate.getDate() + i);
      const iso      = toISO(d);
      const inMonth  = d.getMonth() === CAL_MONTH && d.getFullYear() === CAL_YEAR;
      const isToday  = iso === todayISO;
      const ids      = evMap[iso] || [];
      const hidden   = ids.slice(MAX);

      const evHtml = ids.slice(0, MAX).map(id => {
        const ev = CAL_EV_DATA[id];
        return `<div class="cal-ev ${ev.cls}" onclick="showCalPopover(this,'${id}')">${ev.chip}</div>`;
      }).join('') + (hidden.length
        ? `<div class="cal-ev cev-x" onclick="showDayPopover(this,'${iso}',[${ids.map(id=>`'${id}'`).join(',')}])">+${hidden.length} más</div>`
        : '');

      cells += `<div class="cal-cell${isToday ? ' today' : ''}${!inMonth ? ' other' : ''}">
        <div class="cal-cell-dd">${d.getDate()}</div>${evHtml}</div>`;
    }
    grid.innerHTML = `<div class="cal-dow-row">${dowHtml}</div><div class="cal-body">${cells}</div>`;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    // Esperar a que la DB esté lista
    if(window.DB) {
      await window.DB.query('accounting_movements');
    } else {
      await new Promise(r => {
        const check = () => window.DB_STATE_LOADED ? r() : setTimeout(check, 100);
        check();
      });
    }
    renderDashboard();
    renderMonthCalendar();
    // Recargar cada 5 minutos si el módulo sigue abierto
    setInterval(renderDashboard, 300_000);
  });
</script>
