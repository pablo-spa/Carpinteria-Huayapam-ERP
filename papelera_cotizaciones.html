<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papelera de Cotizaciones</title>
<style>

.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.page-title { font-size: 20px; font-weight: 800; }
.page-sub   { font-size: 13px; color: var(--subtext); margin-top: 2px; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar input {
  padding: 7px 12px; border: 1px solid var(--crust); border-radius: var(--radius);
  background: var(--base); color: var(--text); font-size: 13px; font-family: inherit;
  width: 220px;
}
.toolbar input:focus { outline: none; border-color: var(--blue); }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--subtext);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  color: var(--subtext); padding: 8px 10px; border-bottom: 2px solid var(--crust);
  text-align: left; white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--crust); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--mantle); }
td { padding: 10px 10px; vertical-align: middle; }

.folio { font-weight: 700; font-size: 13px; }
.meta  { font-size: 12px; color: var(--subtext); margin-top: 2px; }

.btn-restore { background: var(--green-bg,rgba(64,160,43,.12)); color: var(--green); border: 1px solid transparent; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-restore:hover { filter: brightness(.9); }
.btn-del { background: var(--red-bg,rgba(210,15,57,.1)); color: var(--red); border: 1px solid transparent; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-del:hover { filter: brightness(.9); }

.actions { display: flex; gap: 6px; justify-content: flex-end; }

.badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }
.badge-amber { background: rgba(223,142,29,.15); color: var(--amber); }
.badge-green { background: rgba(64,160,43,.15);  color: var(--green); }
.badge-blue  { background: rgba(30,102,245,.12);  color: var(--blue); }
.badge-red   { background: rgba(210,15,57,.12);   color: var(--red); }
.badge-gray  { background: var(--surface0); color: var(--subtext); }

.toast-wrap { position:fixed; top:70px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
</style>
</head>
<body>
<div id="app" style="padding:20px;">
  <div class="page-header">
    <div>
      <div class="page-title">🗑 Papelera de Cotizaciones</div>
      <div class="page-sub">Cotizaciones eliminadas — puedes restaurarlas o borrarlas definitivamente</div>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Buscar folio, proyecto, cliente…" oninput="render()">
    </div>
  </div>
  <div id="content"></div>
</div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="db.js"></script>
<script src="ui.js"></script>
<script>
let ALL = [];

async function init() {
  if (window.parent?.cargar_coleccion) {
    await Promise.all([
      window.parent.cargar_coleccion('quotations'),
      window.parent.cargar_coleccion('projects'),
      window.parent.cargar_coleccion('contacts'),
    ].map(p => p.catch(() => {})));
  }
  reload();
}

function reload() {
  const db = window.DB.get();
  const projects = db.projects || [];
  const contacts = db.contacts || [];
  ALL = (db.quotations || [])
    .filter(q => q.eliminada === true)
    .map(q => {
      const proj = projects.find(p => p.id === q.projectId);
      const cli  = contacts.find(c => c.id === q.clientId);
      return {
        ...q,
        _proyNombre:   proj ? (proj.nombre || proj.name || proj.codigo || proj.code || '') : '',
        _clientNombre: cli  ? (cli.nombre  || cli.name  || '') : '',
      };
    })
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = q
    ? ALL.filter(c =>
        (c.folio || '').toLowerCase().includes(q) ||
        c._proyNombre.toLowerCase().includes(q) ||
        c._clientNombre.toLowerCase().includes(q)
      )
    : ALL;

  const cont = document.getElementById('content');
  if (!list.length) {
    cont.innerHTML = `<div class="empty-state"><div class="icon">🗑</div><p>${
      q ? 'Sin resultados para esa búsqueda.' : 'La papelera está vacía.'
    }</p></div>`;
    return;
  }

  const rows = list.map(q => {
    const statusBadge = statusClass(q.status);
    const fmt = n => n != null ? '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits:0}) : '—';
    return `<tr>
      <td>
        <div class="folio">${q.folio || q.id?.slice(0,8) || '—'}</div>
        <div class="meta">${q.date || '—'}</div>
      </td>
      <td>${q._proyNombre || '<span style="color:var(--subtext)">—</span>'}</td>
      <td>${q._clientNombre || '<span style="color:var(--subtext)">—</span>'}</td>
      <td><span class="badge ${statusBadge}">${q.status || '—'}</span></td>
      <td style="text-align:right;">${fmt(q.total)}</td>
      <td>
        <div class="actions">
          <button class="btn-restore" onclick="restore('${q.id}')">↩ Restaurar</button>
          <button class="btn-del"     onclick="eliminate('${q.id}')">✕ Eliminar</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  cont.innerHTML = `
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr>
          <th>Folio</th><th>Proyecto</th><th>Cliente</th><th>Estado</th>
          <th style="text-align:right;">Total</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function statusClass(s) {
  if (!s) return 'badge-gray';
  if (s === 'Activa')   return 'badge-green';
  if (s === 'Aceptada') return 'badge-blue';
  if (s === 'Cancelada') return 'badge-red';
  return 'badge-amber';
}

async function restore(id) {
  const q = ALL.find(x => x.id === id);
  if (!q) return;
  delete q.eliminada;
  q.eliminada = false;

  if (window.parent?.setDocumentInFirebase)
    await window.parent.setDocumentInFirebase('quotations', id, q);
  if (window.parent?.DB_STATE?.quotations) {
    const i = window.parent.DB_STATE.quotations.findIndex(x => x.id === id);
    if (i >= 0) window.parent.DB_STATE.quotations[i].eliminada = false;
  }
  toast('Cotización restaurada.');
  reload();
}

async function eliminate(id) {
  if (!window.confirm('¿Eliminar esta cotización definitivamente? Esta acción no se puede deshacer.')) return;

  if (window.parent?.deleteDocumentFromFirebase)
    await window.parent.deleteDocumentFromFirebase('quotations', id);
  if (window.parent?.DB_STATE?.quotations)
    window.parent.DB_STATE.quotations = window.parent.DB_STATE.quotations.filter(x => x.id !== id);

  toast('Cotización eliminada permanentemente.');
  reload();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
