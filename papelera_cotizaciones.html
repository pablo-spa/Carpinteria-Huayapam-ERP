<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papelera de Cotizaciones</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.hdr {
  background: var(--mantle); border-bottom: 1px solid var(--crust);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; z-index: 10;
}
.hdr-title { font-size: 18px; font-weight: 800; color: var(--text); }

.filters { display: flex; gap: 8px; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); align-items: center; }
.search-box {
  display: flex; align-items: center; background: var(--mantle);
  border: 1px solid var(--crust); border-radius: 8px; padding: 0 12px;
  height: 36px; width: 260px; gap: 8px; flex-shrink: 0;
}
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-size: 13px; font-family: inherit; height: 100%; }
.search-box input:focus { border-color: transparent; outline: none; }

.main { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--subtext);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Standard Table inside Card */
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.tbl-wrap { overflow-x: auto; width: 100%; }
.tbl { width: 100%; border-collapse: collapse; min-width: 760px; }
.tbl th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--crust); font-size: 13px; vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface0); }
.tbl tr:last-child td { border-bottom: none; }

.folio { font-weight: 700; font-size: 13px; }
.meta  { font-size: 12px; color: var(--subtext); margin-top: 2px; }

.btn-restore { background: var(--green-bg,rgba(64,160,43,.12)); color: var(--green); border: 1px solid transparent; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-restore:hover { filter: brightness(.9); }
.btn-del { background: var(--red-bg,rgba(210,15,57,.1)); color: var(--red); border: 1px solid transparent; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-del:hover { filter: brightness(.9); }

.actions { display: flex; gap: 6px; justify-content: flex-end; }

</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div class="hdr-title">🗑 Papelera de Cotizaciones</div>
  </div>
</div>

<div class="filters">
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;">🔍</span>
    <input type="text" id="search" placeholder="Buscar folio, proyecto, cliente…" oninput="render()">
  </div>
</div>

<div class="main" id="content"></div>


<script src="db.js"></script>
<script src="ui.js"></script>
<script>
let ALL = [];

async function init() {
  if (window.parent?.cargar_coleccion) {
    await Promise.all([
      window.parent.cargar_coleccion('quotations'),
      window.parent.cargar_coleccion('quotations_viaticos'),
      window.parent.cargar_coleccion('projects'),
      window.parent.cargar_coleccion('contacts'),
    ].map(p => p.catch(() => {})));
  }
  reload();
}

function reload() {
  const db = window.DB.get();
  const projects = db.projects || [];
  const contacts = db.contacts || [];
  
  const qMuebles = (db.quotations || []).map(q => ({ ...q, _collection: 'quotations' }));
  const qViaticos = (db.quotations_viaticos || []).map(q => ({ ...q, _collection: 'quotations_viaticos' }));

  ALL = [...qMuebles, ...qViaticos]
    .filter(q => q.eliminada === true)
    .map(q => {
      const proj = projects.find(p => p.id === q.projectId);
      const cli  = contacts.find(c => c.id === q.clientId);
      return {
        ...q,
        _proyNombre:   proj ? (proj.nombre || proj.name || proj.codigo || proj.code || '') : '',
        _clientNombre: cli  ? (cli.nombre  || cli.name  || '') : '',
      };
    })
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  render();
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = q
    ? ALL.filter(c =>
        (c.folio || '').toLowerCase().includes(q) ||
        c._proyNombre.toLowerCase().includes(q) ||
        c._clientNombre.toLowerCase().includes(q)
      )
    : ALL;

  const cont = document.getElementById('content');
  if (!list.length) {
    cont.innerHTML = `<div class="empty-state"><div class="icon">🗑</div><p>${
      q ? 'Sin resultados para esa búsqueda.' : 'La papelera está vacía.'
    }</p></div>`;
    return;
  }

  const rows = list.map(q => {
    const statusBadge = statusClass(q.status);
    const icon = q.type === 'viaticos' ? '🚚' : '🛋️';
    const fmt = n => n != null ? '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits:0}) : '—';
    return `<tr>
      <td>
        <div class="folio">${icon} ${q.folio || q.id?.slice(0,8) || '—'}</div>
        <div class="meta">${q.date || '—'}</div>
      </td>
      <td>${q._proyNombre || '<span style="color:var(--subtext)">—</span>'}</td>
      <td>${q._clientNombre || '<span style="color:var(--subtext)">—</span>'}</td>
      <td><span class="pill ${statusBadge}">${q.status || '—'}</span></td>
      <td style="text-align:right;">${fmt(q.total)}</td>
      <td>
        <div class="actions">
          <button class="btn-restore" onclick="restore('${q.id}', '${q._collection}')">↩ Restaurar</button>
          <button class="btn-del"     onclick="eliminate('${q.id}', '${q._collection}')">✕ Eliminar</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  cont.innerHTML = `
    <div class="card">
      <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Folio</th><th>Proyecto</th><th>Cliente</th><th>Estado</th>
          <th style="text-align:right;">Total</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>`;
}

function statusClass(s) {
  if (!s) return 'pill-gray';
  if (s === 'Activa')   return 'pill-green';
  if (s === 'Aceptada') return 'pill-blue';
  if (s === 'Cancelada') return 'pill-red';
  return 'pill-amber';
}

async function restore(id, collection) {
  const db = window.DB.get();
  const targetArray = db[collection] || [];
  const q = targetArray.find(x => x.id === id);
  
  if (!q) return;
  delete q.eliminada;
  q.eliminada = false;

  if (window.parent?.setDocumentInFirebase)
    await window.parent.setDocumentInFirebase(collection, id, q);
  if (window.parent?.DB_STATE?.[collection]) {
    const i = window.parent.DB_STATE[collection].findIndex(x => x.id === id);
    if (i >= 0) window.parent.DB_STATE[collection][i].eliminada = false;
  }
  
  window.DB.save(db);
  toast('Cotización restaurada.');
  reload();
}

async function eliminate(id, collection) {
  if (!window.confirm('¿Eliminar esta cotización definitivamente? Esta acción no se puede deshacer.')) return;

  if (window.parent?.deleteDocumentFromFirebase)
    await window.parent.deleteDocumentFromFirebase(collection, id);
  if (window.parent?.DB_STATE?.[collection])
    window.parent.DB_STATE[collection] = window.parent.DB_STATE[collection].filter(x => x.id !== id);
    
  const db = window.DB.get();
  if (db[collection]) {
      db[collection] = db[collection].filter(x => x.id !== id);
      window.DB.save(db);
  }

  toast('Cotización eliminada permanentemente.');
  reload();
}


document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
