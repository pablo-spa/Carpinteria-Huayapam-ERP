<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyectos — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --green: #40a02b; --green-bg: #e5f4e3;
  --blue: #1e66f5; --blue-bg: #e6eaf6;
  --amber: #df8e1d; --amber-bg: #fdf3e5;
  --red: #d20f39;
  --purple: #8839ef; --purple-bg: rgba(136,57,239,0.12);
  --radius: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --green: #a6da95; --green-bg: rgba(166,218,149,0.15);
    --blue: #8caaee; --blue-bg: rgba(140,170,238,0.15);
    --amber: #f9e2af; --amber-bg: rgba(249,226,175,0.15);
    --red: #f38ba8;
    --purple: #cba6f7; --purple-bg: rgba(203,166,247,0.15);
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--base); color: var(--text);
}

.hdr {
  background: var(--mantle); border-bottom: 1px solid var(--crust);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; z-index: 10;
}
.hdr-title { font-size: 18px; font-weight: 800; color: var(--text); }
.btn {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity .15s; border: none; font-family: inherit;
}
.btn-blue { background: var(--blue); color: #fff; }
.btn-dark { background: var(--surface0); color: var(--text); border: 1px solid var(--surface1); }
.btn-red { background: var(--red); color: #fff; }
.btn:hover { opacity: 0.9; }

.main { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.search-bar {
  display: flex; gap: 12px; align-items: center; background: var(--mantle);
  padding: 8px 16px; border-radius: 99px; border: 1px solid var(--crust);
}
.search-bar input {
  flex: 1; background: transparent; border: none; font-size: 14px; color: var(--text); outline: none;
}
.status-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.f-btn {
  background: var(--mantle); border: 1px solid var(--crust); padding: 6px 12px;
  border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--subtext);
  cursor: pointer; transition: 0.2s;
}
.f-btn.act { background: var(--text); color: var(--base); border-color: var(--text); }

/* List table */
.proj-table { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }

.list-header {
  display: grid; grid-template-columns: 70px 3fr 2fr 190px;
  padding: 10px 20px; background: var(--crust);
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--subtext); gap: 16px; align-items: center;
}

.row-card {
  background: var(--mantle); border-top: 1px solid var(--crust);
  padding: 14px 20px;
  display: grid; grid-template-columns: 70px 3fr 2fr 190px; gap: 16px;
  align-items: center; cursor: pointer; transition: background 0.15s;
}
.row-card:first-of-type { border-top: none; }
.row-card:hover { background: var(--base); }

.r-code { font-family: monospace; font-size: 16px; font-weight: 800; color: var(--blue); }
.r-main { display: flex; flex-direction: column; gap: 3px; }
.r-title { font-size: 14px; font-weight: 700; color: var(--text); }
.r-sub { font-size: 12px; color: var(--subtext); }

.r-dates { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--subtext); }

.r-prog-wrap { display: flex; flex-direction: column; gap: 6px; }
.r-prog-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--subtext); }
.prog-track { height: 6px; background: var(--crust); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s; }

.pill { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; display: inline-block; }
.pill-gray   { background: var(--surface0); color: var(--text); }
.pill-blue   { background: var(--blue-bg); color: var(--blue); }
.pill-green  { background: var(--green-bg); color: var(--green); }
.pill-amber  { background: var(--amber-bg); color: var(--amber); }
.pill-purple { background: var(--purple-bg); color: var(--purple); }

.empty-state { padding: 48px; text-align: center; color: var(--subtext); font-size: 14px; }

.client-group-hdr {
  padding: 8px 20px; background: var(--crust);
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--subtext); display: flex; align-items: center; gap: 10px;
  border-top: 1px solid var(--surface0);
}
.client-group-hdr:first-child { border-top: none; }
.client-group-hdr .client-count {
  background: var(--surface0); color: var(--subtext); border-radius: 99px;
  padding: 1px 7px; font-size: 10px; font-weight: 700;
}

@media (max-width: 768px) {
  .list-header { display: none; }
  .row-card { grid-template-columns: 1fr; gap: 10px; border-top: 1px solid var(--crust); }
  .r-code { display: none; }
  .r-title::before { content: attr(data-code) " — "; color: var(--blue); font-family: monospace; }
}

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6); display: none; align-items: flex-start; justify-content: center;
  z-index: 1000; padding: 40px 20px; overflow-y: auto; backdrop-filter: blur(4px);
}
.modal {
  background: var(--base); width: 100%; max-width: 680px; border-radius: var(--radius-lg);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; margin: auto;
}
.m-hdr { padding: 20px 24px; border-bottom: 1px solid var(--crust); background: var(--mantle); display: flex; justify-content: space-between; align-items: center; }
.m-hdr h2 { font-size: 17px; font-weight: 800; }
.m-close { cursor: pointer; background: transparent; border: none; font-size: 20px; color: var(--subtext); }
.m-close:hover { color: var(--text); }

.m-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.m-foot { padding: 16px 24px; border-top: 1px solid var(--crust); background: var(--mantle); display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.m-field { display: flex; flex-direction: column; gap: 6px; }
.m-field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
.m-field input, .m-field select {
  background: var(--base); border: 1px solid var(--crust); padding: 9px 12px;
  border-radius: 8px; color: var(--text); font-family: inherit; font-size: 13px;
}
.m-field input:focus, .m-field select:focus { outline: none; border-color: var(--blue); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 12px; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">Proyectos</div>
  <button class="btn btn-blue" onclick="openModal(null)">+ Nuevo Proyecto</button>
</div>

<div class="main">

  <div class="search-bar">
    <span style="color:var(--subtext);">🔍</span>
    <input type="text" id="srch" placeholder="Buscar por código, cliente o nombre...">
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
    <div class="status-filters" style="margin-bottom:0;">
      <button class="f-btn act" data-filter="all"           onclick="filterData('all')">Todos</button>
      <button class="f-btn"     data-filter="Planificación" onclick="filterData('Planificación')">Planificación</button>
      <button class="f-btn"     data-filter="En Producción" onclick="filterData('En Producción')">En Producción</button>
      <button class="f-btn"     data-filter="En Pausa"      onclick="filterData('En Pausa')">En Pausa</button>
      <button class="f-btn"     data-filter="Terminado"     onclick="filterData('Terminado')">Terminado</button>
      <button class="f-btn"     data-filter="archived"      onclick="filterData('archived')">Archivados</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--subtext); white-space:nowrap;">
      Ordenar por
      <select id="sort-select" onchange="renderList()" style="background:var(--mantle); border:1px solid var(--crust); border-radius:8px; padding:5px 10px; color:var(--text); font-size:12px; font-weight:700; font-family:inherit; cursor:pointer;">
        <option value="fecha">Fecha</option>
        <option value="cliente">Cliente</option>
        <option value="codigo">Código</option>
      </select>
    </div>
  </div>

  <div class="proj-table" id="p-table">
    <div class="list-header" id="list-header">
      <div>Código</div>
      <div>Proyecto / Cliente</div>
      <div>Estado / Inicio</div>
      <div>Avance</div>
    </div>
    <div class="proj-rows" id="p-list"></div>
  </div>

</div>

<!-- Modal Nuevo/Editar -->
<div class="modal-overlay" id="mod-overlay">
  <div class="modal">
    <div class="m-hdr">
      <h2 id="mod-title">Nuevo Proyecto</h2>
      <button class="m-close" onclick="closeModal()">✕</button>
    </div>
    <div class="m-body">
      <input type="hidden" id="m-id">

      <div class="grid-3">
        <div class="m-field">
          <label>Código</label>
          <input type="text" id="m-code" maxlength="4" placeholder="0001">
        </div>
        <div class="m-field">
          <label>Nombre del Proyecto</label>
          <input type="text" id="m-name" placeholder="Ej: Cocina integral Ramírez">
        </div>
        <div class="m-field">
          <label>Estado</label>
          <select id="m-status">
            <option value="Planificación">Planificación</option>
            <option value="En Producción">En Producción</option>
            <option value="En Pausa">En Pausa</option>
            <option value="Terminado">Terminado / Entregado</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="m-field">
          <label>Cliente / Contacto</label>
          <div style="display:flex; gap:8px;">
            <select id="m-contact" data-searchable style="flex:1;"></select>
            <button class="btn btn-dark" onclick="showNewContactForm()" style="padding:4px 12px; font-size:11px; white-space:nowrap;">+ Nuevo</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="m-field"><label>F. Inicio</label><input type="date" id="m-start"></div>
          <div class="m-field"><label>F. Fin Est.</label><input type="date" id="m-end"></div>
        </div>
      </div>

      <!-- Nuevo contacto inline -->
      <div id="new-contact-pane" style="display:none; background:var(--mantle); padding:12px; border-radius:8px; border:1px dashed var(--surface1);">
        <div style="font-size:11px; font-weight:800; color:var(--subtext); margin-bottom:8px; text-transform:uppercase;">Crear Nuevo Contacto</div>
        <div class="grid-2">
          <div class="m-field"><label>Nombre</label><input type="text" id="mc-name" placeholder="Ej: Juan Pérez"></div>
          <div class="m-field"><label>Teléfono</label><input type="text" id="mc-phone" placeholder="951 000 0000"></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
          <button class="btn btn-dark" style="padding:4px 10px; font-size:11px;" onclick="document.getElementById('new-contact-pane').style.display='none'">Cancelar</button>
          <button class="btn btn-blue" style="padding:4px 10px; font-size:11px;" onclick="saveInlineContact()">Guardar Contacto</button>
        </div>
      </div>

      <div class="m-field">
        <label>Piezas / Muebles a Fabricar (separados por coma)</label>
        <input type="text" id="m-pieces" placeholder="Ej: Cocina, Alacena, Isla">
      </div>
    </div>

    <div class="m-foot">
      <button class="btn btn-dark" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-blue" onclick="saveProject()">Guardar Proyecto</button>
    </div>
  </div>
</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
  let currentFilter = 'all';

  document.getElementById('srch').addEventListener('input', applyFilters);

  function pillClass(estado) {
    if (!estado) return 'pill-gray';
    if (estado === 'En Producción')   return 'pill-blue';
    if (estado === 'Terminado' || estado === 'completado' || estado.includes('Entregado')) return 'pill-green';
    if (estado === 'Planificación')   return 'pill-amber';
    if (estado === 'En Pausa')        return 'pill-purple';
    return 'pill-gray';
  }

  function getRealHours(codigo) {
    const db = window.DB.get();
    let total = 0;
    (db.attendance || []).forEach(a => {
      const lista = a.proyectos || a.projects || [];
      lista.forEach(p => {
        if (p.p === codigo) total += (parseFloat(p.t || p.horas) || 0);
      });
    });
    return total;
  }

  function nextProjectCode() {
    const d = window.DB.get();
    let max = 0;
    (d.projects || []).filter(p => !p._init && (p.codigo || p.code)).forEach(p => {
      const raw = p.codigo || p.code || '';
      const n = parseInt(raw.replace(/\D/g, ''), 10);
      if (!isNaN(n) && n > max) max = n;
    });
    return String(max + 1).padStart(4, '0');
  }

  function projectCard(p, d) {
    const contactoId = p.contactoId || p.contactId;
    const contact    = (d.contacts || []).find(c => c.id === contactoId) || { name: 'Sin contacto' };
    const contactNombre = contact.nombre || contact.name || 'Sin contacto';
    const codigo     = p.codigo || p.code || '';
    const nombre     = p.nombre || p.name || '';
    const estado     = p.estado || p.status || '';
    const fechaInicio = p.fechaInicio || p.startDate || '';
    const fechaFin   = p.fechaFin || p.endDate || '';
    const avance     = p.avance ?? p.progress ?? 0;
    const estHrs     = p.horasEstimadas || p.estimatedHours || 0;
    const realHrs    = getRealHours(codigo);

    return `
      <div class="row-card" data-status="${estado}" data-client="${contactNombre.toLowerCase()}" onclick="window.location.href='proyecto_detalle.html?id=${p.id}'">
        <div class="r-code">${codigo}</div>
        <div class="r-main">
          <div class="r-title" data-code="${codigo}">${nombre}</div>
          <div class="r-sub">👤 ${contactNombre}</div>
        </div>
        <div class="r-dates">
          <div><span class="pill ${pillClass(estado)}">${estado || 'Sin estado'}</span></div>
          <div style="margin-top:5px;">Inicio: ${fechaInicio || '—'}</div>
          ${fechaFin ? `<div>Entrega: ${fechaFin}</div>` : ''}
        </div>
        <div class="r-prog-wrap">
          <div class="r-prog-meta"><span>Avance</span><span>${avance}%</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${avance}%"></div></div>
          <div style="font-size:10px; color:var(--subtext); text-align:right; margin-top:2px;">
            ${realHrs.toFixed(1)} hrs reales / ${estHrs.toFixed(1)} hrs est.
          </div>
        </div>
      </div>
    `;
  }

  function renderList() {
    const d          = window.DB.get();
    const lc         = document.getElementById('p-list');
    const sortMode   = document.getElementById('sort-select').value;
    const isArchived = currentFilter === 'archived';

    let projects = (d.projects || [])
      .filter(p => (p.nombre || p.name) && !p._init)
      .filter(p => isArchived ? (p.archivado || p.archived) === true : !(p.archivado || p.archived));

    if (projects.length === 0) {
      lc.innerHTML = '<div class="empty-state">No hay proyectos' + (isArchived ? ' archivados' : '') + '.</div>';
      applyFilters();
      return;
    }

    document.getElementById('list-header').style.display = sortMode === 'cliente' ? 'none' : '';

    if (sortMode === 'cliente') {
      const contactMap = {};
      (d.contacts || []).forEach(c => { contactMap[c.id] = c.nombre || c.name || c.givenName || 'Sin nombre'; });

      const grouped = {};
      projects.forEach(p => {
        const cId = p.contactoId || p.contactId;
        const clientName = contactMap[cId] || 'Sin contacto';
        if (!grouped[clientName]) grouped[clientName] = [];
        grouped[clientName].push(p);
      });

      const clientsSorted = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'es'));
      clientsSorted.forEach(client => {
        grouped[client].sort((a, b) => new Date(b.fechaInicio || b.startDate) - new Date(a.fechaInicio || a.startDate));
      });

      lc.innerHTML = clientsSorted.map(client => {
        const projs = grouped[client];
        return `
          <div class="client-group-hdr" data-client-hdr="${client.toLowerCase()}">
            ${client}
            <span class="client-count">${projs.length}</span>
          </div>
          ${projs.map(p => projectCard(p, d)).join('')}
        `;
      }).join('');

    } else if (sortMode === 'codigo') {
      projects.sort((a, b) => (a.codigo || a.code || '').localeCompare(b.codigo || b.code || '', undefined, { numeric: true }));
      lc.innerHTML = projects.map(p => projectCard(p, d)).join('');

    } else {
      projects.sort((a, b) => {
        const aEst = (a.estado || a.status || '') === 'Terminado' || (a.estado || a.status || '') === 'completado';
        const bEst = (b.estado || b.status || '') === 'Terminado' || (b.estado || b.status || '') === 'completado';
        if (aEst && !bEst) return 1;
        if (bEst && !aEst) return -1;
        return new Date(b.fechaInicio || b.startDate) - new Date(a.fechaInicio || a.startDate);
      });
      lc.innerHTML = projects.map(p => projectCard(p, d)).join('');
    }

    applyFilters();
  }

  function filterData(status) {
    currentFilter = status;
    document.querySelectorAll('.f-btn').forEach(b => {
      b.classList.remove('act');
      if (b.dataset.filter === status) b.classList.add('act');
    });
    renderList();
  }

  function applyFilters() {
    const term = document.getElementById('srch').value.toLowerCase();
    document.querySelectorAll('.row-card').forEach(c => {
      const matchText = c.textContent.toLowerCase().includes(term);
      const stat      = c.getAttribute('data-status');

      let matchCat = true;
      if (currentFilter !== 'all' && currentFilter !== 'archived') {
        if (currentFilter === 'Terminado') {
          matchCat = stat === 'Terminado' || stat === 'completado' || stat.includes('Entregado');
        } else {
          matchCat = stat === currentFilter;
        }
      }

      const show = matchText && matchCat;
      c.style.display = show ? (window.innerWidth <= 768 ? 'flex' : 'grid') : 'none';
    });

    document.querySelectorAll('.client-group-hdr').forEach(hdr => {
      const clientKey = hdr.dataset.clientHdr;
      const hasVisible = Array.from(document.querySelectorAll(`.row-card[data-client="${clientKey}"]`))
        .some(el => el.style.display !== 'none');
      hdr.style.display = hasVisible ? '' : 'none';
    });
  }

  // ── Modal ──────────────────────────────────────────

  function populateContactSelect() {
    const d = window.DB.get();
    const sel = document.getElementById('m-contact');
    sel.innerHTML = '<option value="">— Sin contacto —</option>' +
      (d.contacts || []).filter(c => !c._init).map(c =>
        `<option value="${c.id}">${c.nombre || c.name || c.givenName || '-'} (${c.tipo || 'cliente'})</option>`
      ).join('');
    if (sel._ssInit) sel._ssRefresh(); else SearchableSelect.init(sel);
  }

  function openModal(id) {
    document.getElementById('new-contact-pane').style.display = 'none';
    document.getElementById('mod-overlay').style.display = 'flex';
    populateContactSelect();

    if (id) {
      const d = window.DB.get();
      const p = d.projects.find(x => x.id === id);
      document.getElementById('mod-title').textContent = 'Editar Proyecto';
      document.getElementById('m-id').value    = p.id;
      document.getElementById('m-code').value  = p.codigo  || p.code    || '';
      document.getElementById('m-name').value  = p.nombre  || p.name    || '';
      document.getElementById('m-status').value = p.estado || p.status  || 'Planificación';
      document.getElementById('m-contact').value = p.contactoId || p.contactId || '';
      document.getElementById('m-start').value = p.fechaInicio || p.startDate || '';
      document.getElementById('m-end').value   = p.fechaFin   || p.endDate   || '';
      document.getElementById('m-pieces').value = (p.piezas || p.pieces || []).join(', ');
    } else {
      document.getElementById('mod-title').textContent = 'Nuevo Proyecto';
      document.getElementById('m-id').value    = '';
      document.getElementById('m-code').value  = nextProjectCode();
      document.getElementById('m-name').value  = '';
      document.getElementById('m-status').value = 'Planificación';
      document.getElementById('m-contact').value = '';
      document.getElementById('m-start').value = new Date().toISOString().slice(0, 10);
      document.getElementById('m-end').value   = '';
      document.getElementById('m-pieces').value = '';
    }
  }

  function closeModal() { document.getElementById('mod-overlay').style.display = 'none'; }

  function showNewContactForm() {
    document.getElementById('new-contact-pane').style.display = 'block';
    document.getElementById('mc-name').value  = '';
    document.getElementById('mc-phone').value = '';
  }

  function saveInlineContact() {
    const nombre = document.getElementById('mc-name').value.trim();
    const phone  = document.getElementById('mc-phone').value.trim();
    if (!nombre) { toast('Nombre obligatorio.', 'warn'); return; }
    const id = crypto.randomUUID();
    const d  = window.DB.get();
    d.contacts.push({ id, name: nombre, nombre, phone, tipo: 'cliente', activo: true, email: '', address: '' });
    window.DB.save(d);
    populateContactSelect();
    document.getElementById('m-contact').value = id;
    document.getElementById('new-contact-pane').style.display = 'none';
  }

  function saveProject() {
    const id       = document.getElementById('m-id').value;
    const codigo   = document.getElementById('m-code').value.trim();
    const nombre   = document.getElementById('m-name').value.trim();
    const piecesStr = document.getElementById('m-pieces').value;

    if (!codigo || !nombre) { toast('Código y Nombre son obligatorios.', 'warn'); return; }

    const d = window.DB.get();
    const existing = id ? d.projects.find(x => x.id === id) : null;

    const p = {
      codigo,
      nombre,
      estado:     document.getElementById('m-status').value,
      contactoId: document.getElementById('m-contact').value,
      fechaInicio: document.getElementById('m-start').value,
      fechaFin:   document.getElementById('m-end').value,
      piezas:     piecesStr ? piecesStr.split(',').map(s => s.trim()).filter(Boolean) : []
    };

    if (existing) {
      Object.assign(existing, p);
      window.DB.save(d);
    } else {
      p.id              = crypto.randomUUID();
      p.horasEstimadas  = 0;
      p.horasPorCategoria = {};
      p.maderaPt        = 0;
      p.costoMateriales = 0;
      p.valorTotal      = 0;
      p.pagos           = 0;
      p.avance          = 0;
      p.hitos           = [];
      window.DB.addProject(p);
    }

    closeModal();
    renderList();
  }

  async function init() {
    await window.DB.query('projects');
    renderList();
  }
  init();

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;top:70px;right:14px;z-index:9999;background:${type==='warn'?'var(--amber)':'var(--green)'};color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
</body>
