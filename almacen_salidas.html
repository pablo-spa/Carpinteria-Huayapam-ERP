<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Salidas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --blue: #1e66f5; --green: #40a02b; --amber: #df8e1d;
  --red: #d20f39;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --blue: #8caaee; --green: #a6da95; --amber: #f9e2af;
    --red: #f38ba8;
  }
}
body { background: var(--base); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 80px; }
.hdr { padding: 16px 24px; background: var(--mantle); border-bottom: 1px solid var(--crust); display: flex; align-items: center; justify-content: space-between; }
.main { max-width: 800px; margin: 24px auto; padding: 24px; background: var(--mantle); border-radius: 12px; border: 1px solid var(--crust); }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.field label { font-size: 13px; font-weight: 700; color: var(--subtext); }
.field input, .field select, .field textarea { padding: 10px; border-radius: 8px; border: 1px solid var(--surface0); background: var(--base); color: var(--text); font-size: 14px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue); }
.btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-amber { background: var(--amber); color: var(--mantle); border: 1px solid rgba(0,0,0,0.1); }
.items-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.items-table th, .items-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--crust); font-size: 14px; }
.items-table th { font-weight: 700; color: var(--subtext); font-size: 12px; text-transform: uppercase; }
.items-table input, .items-table select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--surface0); background: var(--base); color: var(--text); }
.items-table input:focus { outline: none; border-color: var(--blue); }
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex; align-items:center; gap:16px;">
    <button onclick="if(window.parent && window.parent.openModule){window.parent.openModule('almacen_hub.html','Portal Almacén')}else{window.history.back()}" style="background:none;border:none;font-size:14px;font-weight:700;color:var(--subtext);cursor:pointer;">← Volver</button>
    <h2 style="font-size: 18px;">Vale de Salida (Entrega a Trabajador)</h2>
  </div>
  <button class="btn btn-amber" onclick="save()">Salida de Inventario</button>
</div>
<div class="main">
  <div style="display:flex; gap:16px; margin-bottom:16px;">
    <div class="field" style="flex:1;">
      <label>Entregado a (Carpintero / Operario)</label>
      <select id="worker">
        <option>Encargado de Almacén</option>
        <option>Operario 1 (Especialista)</option>
        <option>Operario 2 (Carpintero)</option>
      </select>
    </div>
    <div class="field" style="flex:1;">
      <label>Proyecto Asignado</label>
      <select id="proj">
        <option value="PRY-01">Proyecto PRY-01</option>
        <option value="TALLER">Uso de Taller (General)</option>
      </select>
    </div>
  </div>
  
  <h3 style="margin-top:24px; margin-bottom:8px; font-size:15px; color:var(--text);">Materiales Entregados</h3>
  <table class="items-table">
    <thead><tr><th style="width:40%">Material (Catálogo)</th><th style="width:25%">Cantidad</th><th style="width:25%">Unidad</th></tr></thead>
    <tbody id="itemsList">
      <tr>
        <td>
          <select>
            <option>MDF 15mm (Stock: 47)</option>
            <option>Triplay 15mm (Stock: 18)</option>
            <option>Bisagra clip 110 (Stock: 142)</option>
          </select>
        </td>
        <td><input type="number" min="1" placeholder="Ej. 2"></td>
        <td><input type="text" value="pza" disabled style="background:var(--mantle); color:var(--subtext);"></td>
      </tr>
    </tbody>
  </table>
  <button class="btn" style="background:var(--surface0); color:var(--text); margin-top:16px;" onclick="add()">+ Añadir renglón</button>
</div>
<script>
function add() {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><select><option>MDF 15mm (Stock: 47)</option><option>Triplay 15mm (Stock: 18)</option><option>Bisagra clip 110 (Stock: 142)</option></select></td><td><input type="number" min="1" placeholder="Ej. 1"></td><td><input type="text" value="pza" disabled style="background:var(--mantle); color:var(--subtext);"></td>`;
  document.getElementById('itemsList').appendChild(tr);
}
function save() {
  alert('Se ha registrado la salida de material del inventario general hacia el trabajador especificado.');
  if(window.parent && window.parent.openModule){window.parent.openModule('almacen_hub.html','Portal Almacén')}else{window.history.back()}
}
</script>
</body>
</html>
