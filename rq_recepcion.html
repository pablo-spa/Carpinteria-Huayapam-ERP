<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepción de Material</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --blue: #1e66f5; --green: #40a02b; --amber: #df8e1d; --red: #d20f39;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --blue: #8caaee; --green: #a6da95; --amber: #f9e2af; --red: #f38ba8;
  }
}
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding-bottom: 40px; }
.hdr { padding: 16px 24px; background: var(--mantle); border-bottom: 1px solid var(--crust); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
.main { max-width: 860px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface0); color: var(--subtext); }
.badge-comprado { background: rgba(30,102,245,0.15); color: var(--blue); }
.badge-recibido { background: rgba(64,160,43,0.15); color: var(--green); }
.btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: opacity .15s; font-size: 12px; font-family: inherit; }
.btn:hover { opacity: .8; }
.btn-green { background: var(--green); color: #fff; }
.item-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; gap: 8px; }
.chk { width: 18px; height: 18px; cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
</style>
</head>
<body>
<div class="hdr">
  <button onclick="window.history.back()" style="background:none;border:none;font-size:14px;font-weight:700;color:var(--subtext);cursor:pointer;">← Volver</button>
  <h2 style="font-size:18px;">Recepción de Material (Almacén)</h2>
</div>

<div class="main" id="main-list">
  <div style="text-align:center;padding:40px;color:var(--subtext);">Cargando pedidos comprados...</div>
</div>

<script src="db.js"></script>
<script>
async function init() {
  const orders = await window.DB.query('purchase_orders');
  const pending  = orders.filter(o => o.id && !o._init && o.status === 'Comprado');
  const recibidos = orders
    .filter(o => o.id && !o._init && o.status !== 'Comprado')
    .sort((a, b) => new Date(b.createdAt||b.fechaRecepcion||b.date) - new Date(a.createdAt||a.fechaRecepcion||a.date));
  const container = document.getElementById('main-list');
  container.innerHTML = '';

  if (pending.length === 0) {
    container.innerHTML = '<div class="empty"><div style="font-size:48px;margin-bottom:12px;">📦</div><div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;">Sin pedidos para recibir</div><div>Los pedidos marcados como "Comprado" en el panel de Compras aparecerán aquí.</div></div>';
  } else {
    pending.forEach(o => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + o.id;

      const items = (o.items || []).map((i, idx) => `
        <div class="ficha-item">
          <label class="ficha-item-name" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" class="chk" id="chk-${o.id}-${idx}" checked style="width:16px;height:16px;flex-shrink:0;">
            ${i.name || i.code || '—'}
          </label>
          <span class="ficha-item-qty">${i.qty}× ${i.unit || 'pza'}</span>
        </div>`).join('');

      card.className = 'ficha';
      card.innerHTML = `
        <div class="ficha-hdr">
          <span class="ficha-folio">${o.folio || o.id}</span>
          <span class="pill pill-green">Comprado</span>
        </div>
        <div class="ficha-meta">
          <span>📁 ${o.project||'Stock General'}</span>
          ${o.requester?`<span>👤 ${o.requester}</span>`:''}
          ${o.fechaCompra?`<span>📅 ${o.fechaCompra}</span>`:''}
          ${o.cuentaPago?`<span>🏦 ${o.cuentaPago}</span>`:''}
          ${o.notes?`<span>📝 ${o.notes}</span>`:''}
        </div>
        <div id="sf-rec-${o.id}"></div>
        <div class="ficha-items">${items}</div>
        <div class="ficha-actions">
          <button class="btn btn-green" onclick="recibir('${o.id}')">✓ Confirmar Recepción</button>
        </div>`;

      container.appendChild(card);
    });
  }

  if (recibidos.length) {
    const histDiv = document.createElement('div');
    histDiv.innerHTML = `
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:20px 0 8px;">
        Todas las órdenes (${recibidos.length})
      </div>
      ${recibidos.map(o => {
        const itemsHtml = (o.items||[]).map(i =>
          `<div class="ficha-item"><span class="ficha-item-name">${i.name||i.code}</span><span class="ficha-item-qty">${i.qty}× ${i.unit||'pza'}</span></div>`
        ).join('');
        return `<div class="ficha" style="opacity:.65;">
          <div class="ficha-hdr"><span class="ficha-folio">${o.folio||o.id}</span><span class="pill pill-green">Recibido</span></div>
          <div class="ficha-meta">
            <span>📁 ${o.project||'Stock'}</span>
            ${o.requester?`<span>👤 ${o.requester}</span>`:''}
            ${o.fechaRecepcion?`<span>📅 ${o.fechaRecepcion}</span>`:''}
          </div>
          <div class="ficha-items">${itemsHtml}</div>
        </div>`;
      }).join('')}`;
    container.appendChild(histDiv);
  }
}

async function recibir(id) {
  const orders = await window.DB.query('purchase_orders');
  const order = orders.find(o => o.id === id);
  if (!order) return;

  order.status = 'Recibido';
  order.fechaRecepcion = new Date().toISOString().slice(0, 10);

  if (window.parent && window.parent.setDocumentInFirebase) {
    await window.parent.setDocumentInFirebase('purchase_orders', id, order);
    if (window.parent.DB_STATE && window.parent.DB_STATE.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(o => o.id === id);
      if (idx !== -1) window.parent.DB_STATE.purchase_orders[idx] = order;
    }
  }
  // Update inventory stock for items with codes (always, not just when parent exists)
  if (order.items) {
    order.items.forEach(i => {
      if (i.code) window.DB.logInventoryPurchase(i.code, parseFloat(i.qty) || 0, parseFloat(i.price) || 0, order.fechaRecepcion);
    });
  }

  const card = document.getElementById('card-' + id);
  if (card) {
    card.style.opacity = '0.5';
    card.style.pointerEvents = 'none';
    setTimeout(() => card.remove(), 400);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
