<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepción de Material</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.main { max-width: 860px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
.item-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; gap: 8px; }
.chk { width: 18px; height: 18px; cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
</style>
</head>
<body>
<div class="hdr">
  <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
  <h2 style="font-size:18px;">Recepción de Material (Almacén)</h2>
</div>

<div class="main" id="main-list">
  <div style="text-align:center;padding:40px;color:var(--subtext);">Cargando pedidos comprados...</div>
</div>

<script src="db.js"></script>
<script src="ui.js"></script>
<script>
const PILL_MAP = {
  'Pedido':'pill-amber','Solicitado':'pill-amber',
  'Confirmado':'pill-blue',
  'Autorizado':'pill-green',
  'Comprado':'pill-green',
  'Recibido':'pill-green',
  'Cancelado':'pill-red'
};

function statusFlow(cur) {
  const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
  const ci = steps.findIndex(([s]) => s === cur);
  return '<div class="sf-flow">' + steps.map(([,lbl],i) =>
    (i>0?'<span class="sf-sep">›</span>':'')+
    `<span class="sf-step ${i<ci?'sf-done':i===ci?'sf-active':''}">${lbl}</span>`
  ).join('') + '</div>';
}

async function init() {
  const orders = await window.DB.query('purchase_orders');
  const sorted  = orders
    .filter(o => o.id && !o._init)
    .sort((a,b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));

  // Sección 1: Por recibir — solo las marcadas como Comprado
  const porRecibir = sorted.filter(o => o.status === 'Comprado');
  // Sección 2: Todas las demás (read-only, con su estado real)
  const resto      = sorted.filter(o => o.status !== 'Comprado');

  const container = document.getElementById('main-list');
  container.innerHTML = '';

  // ── Sección 1: Accionables ──
  const secLbl1 = document.createElement('div');
  secLbl1.style.cssText = 'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:4px 0 8px;';
  secLbl1.textContent = `Por Recibir (${porRecibir.length})`;
  container.appendChild(secLbl1);

  if (porRecibir.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div style="font-size:48px;margin-bottom:12px;">📦</div><div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;">Sin pedidos para recibir</div><div>Los pedidos marcados como "Comprado" en el Panel de Compras aparecerán aquí.</div>';
    container.appendChild(empty);
  } else {
    porRecibir.forEach(o => {
      const card = document.createElement('div');
      card.className = 'ficha';
      card.id = 'card-' + o.id;
      const items = (o.items||[]).map((i,idx) => `
        <div class="ficha-item">
          <label class="ficha-item-name" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" class="chk" id="chk-${o.id}-${idx}" checked style="width:16px;height:16px;flex-shrink:0;">
            ${i.name||i.code||'—'}
          </label>
          <span class="ficha-item-qty">${i.qty}× ${i.unit||'pza'}</span>
        </div>`).join('');
      card.innerHTML = `
        <div class="ficha-hdr">
          <span class="ficha-folio">${o.folio||o.id}</span>
          <span class="pill pill-blue">Comprado</span>
        </div>
        <div class="ficha-meta">
          <span>📁 ${o.project||'Stock General'}</span>
          ${o.requester?`<span>👤 ${o.requester}</span>`:''}
          ${o.fechaCompra?`<span>📅 ${o.fechaCompra}</span>`:''}
          ${o.cuentaPago?`<span>🏦 ${o.cuentaPago}</span>`:''}
          ${o.notes?`<span>📝 ${o.notes}</span>`:''}
        </div>
        ${statusFlow(o.status)}
        <div class="ficha-items">${items}</div>
        <div class="ficha-actions">
          <button class="btn btn-green" onclick="recibir('${o.id}')">✓ Confirmar Recepción</button>
        </div>`;
      container.appendChild(card);
    });
  }

  // ── Sección 2: Todas las demás (read-only, estado correcto) ──
  if (resto.length) {
    const secLbl2 = document.createElement('div');
    secLbl2.style.cssText = 'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:20px 0 8px;';
    secLbl2.textContent = `Todas las órdenes (${resto.length})`;
    container.appendChild(secLbl2);

    resto.forEach(o => {
      const pill = PILL_MAP[o.status] || 'pill-gray';
      const itemsHtml = (o.items||[]).map(i =>
        `<div class="ficha-item"><span class="ficha-item-name">${i.name||i.code||'—'}</span><span class="ficha-item-qty">${i.qty}× ${i.unit||'pza'}</span></div>`
      ).join('');
      const div = document.createElement('div');
      div.className = 'ficha';
      div.style.opacity = '.7';
      div.innerHTML = `
        <div class="ficha-hdr"><span class="ficha-folio">${o.folio||o.id}</span><span class="pill ${pill}">${o.status}</span></div>
        <div class="ficha-meta">
          <span>📁 ${o.project||'Stock General'}</span>
          ${o.requester?`<span>👤 ${o.requester}</span>`:''}
          ${(o.fechaRecepcion||o.fechaCompra||o.date)?`<span>📅 ${o.fechaRecepcion||o.fechaCompra||o.date}</span>`:''}
          ${o.cuentaPago?`<span>🏦 ${o.cuentaPago}</span>`:''}
        </div>
        ${statusFlow(o.status)}
        <div class="ficha-items">${itemsHtml}</div>`;
      container.appendChild(div);
    });
  }
}

async function recibir(id) {
  if (!confirm('¿Confirmar recepción de este pedido? Se actualizará el inventario.')) return;

  const orders = await window.DB.query('purchase_orders');
  const order = orders.find(o => o.id === id);
  if (!order) return;

  order.status = 'Recibido';
  order.fechaRecepcion = new Date().toISOString().slice(0, 10);

  try {
    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', id, order);
    }

    // Actualizar stock del inventario esperando todas las operaciones
    if (order.items) {
      const invPromises = [];
      order.items.forEach(i => {
        if (i.code) invPromises.push(window.DB.logInventoryPurchase(i.code, parseFloat(i.qty)||0, parseFloat(i.price)||0, order.fechaRecepcion));
      });
      await Promise.all(invPromises);
    }

    if (window.parent?.DB_STATE?.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(o => o.id === id);
      if (idx !== -1) window.parent.DB_STATE.purchase_orders[idx] = order;
      else window.parent.DB_STATE.purchase_orders.push(order);
    }

    toast(`✓ ${order.folio} recibido — inventario actualizado`);
    // Recargar para reflejar el cambio de estado
    await init();
  } catch (e) {
    console.error("Error confirmando recepción:", e);
    order.status = 'Comprado'; // Revertir cambio local
    toast('Error conectando con la base de datos.', 'error');
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
