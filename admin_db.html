<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Base de Datos - Firebase</title>
<style>
  :root {
    --bg: #11111b; --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --text: #cdd6f4; --subtext: #a6adc8; --muted: #7f849c;
    --blue: #89b4fa; --green: #a6e3a1; --red: #f38ba8; --amber: #f9e2af;
    --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; }

  .layout { display: flex; height: 100vh; }
  .sidebar { width: 280px; background: var(--mantle); border-right: 1px solid var(--crust); display: flex; flex-direction: column; }
  .sb-header { padding: 16px; border-bottom: 1px solid var(--crust); font-weight: 700; font-size: 14px; color: var(--subtext); text-transform: uppercase; }
  .sb-list { flex: 1; overflow-y: auto; padding: 12px; }
  .table-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: var(--subtext); font-size: 13px; font-weight: 600; margin-bottom: 4px; transition: 0.1s; display: flex; justify-content: space-between; align-items: center; }
  .table-item:hover { background: var(--surface0); color: var(--text); }
  .table-item.act { background: var(--blue); color: #fff; }
  .badge { background: var(--crust); padding: 2px 6px; border-radius: 4px; font-size: 10px; }

  .main { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; }
  .title { font-size: 24px; font-weight: 800; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-top: 4px; }
  
  .card { background: var(--base); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; }
  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: var(--blue); text-transform: uppercase; display: flex; justify-content: space-between;}

  .cols-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .col-pill { background: var(--mantle); border: 1px solid var(--crust); padding: 10px; border-radius: 8px; font-size: 13px; font-family: monospace; font-weight: 600; display: flex; justify-content: space-between; }
  
  .raw-preview { background: var(--crust); padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: var(--subtext); max-height: 300px; overflow-y: auto; overflow-x: auto; }
  
  button.danger { background: var(--red); color: #111; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
  button { cursor: pointer; padding: 8px 16px; border: none; border-radius: 6px; background: var(--surface0); color: var(--text); font-weight: bold; }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="sb-header">Colecciones Firestore</div>
    <div class="sb-list" id="table-list"></div>
    <div style="padding: 16px; border-top: 1px solid var(--crust);">
       <button class="danger" style="width:100%; font-size:12px;" onclick="limpiarTodoFalso()">Limpiar datos de ejemplo</button>
       <div style="font-size:10px; color:var(--subtext); margin-top:8px; text-align:center;">Borra pedidos y compras. Mantiene trabajadores, contactos e inventario.</div>
    </div>
  </div>

  <div class="main">
    <div id="no-sel" style="text-align:center; padding:100px; color:var(--muted);">
      <div style="font-size:20px; font-weight:800; color:var(--text); margin-bottom:8px;">Esquema de Bases de Datos</div>
      <div style="max-width:500px; margin:0 auto; line-height:1.5;">Vista del estado actual de tu base de datos Firebase.</div>
    </div>
    
    <div id="sel-view" style="display:none; flex-direction:column; gap:24px;">
      <div class="head">
        <div>
          <div class="title" id="t-name">Colección</div>
          <div class="subtitle" id="t-count">0 registros</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
            <span>Columnas Detectadas</span>
            <button class="danger" onclick="vaciarColeccion()">Vaciar Colección</button>
        </div>
        <div class="cols-grid" id="t-cols"></div>
      </div>

      <div class="card">
        <div class="card-title">Vista Previa (Primeros 3 Registros)</div>
        <div class="raw-preview" id="t-raw"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let doc, deleteDoc;
  import("https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js").then((mod) => {
    doc = mod.doc;
    deleteDoc = mod.deleteDoc;
  });
  
  const db = window.parent.db;
  const state = window.parent.DB_STATE || {};
  let currentTable = null;

  function renderTables() {
    const list = document.getElementById('table-list');
    const collectionsToLoad = ['workers', 'contacts', 'inventory', 'projects', 'project_phases', 'quotations', 'pieces', 'orders', 'production_logs', 'payroll_weeks', 'payroll_lines', 'worker_loans', 'worker_loan_payments', 'attendance', 'expense_categories', 'purchase_orders', 'purchase_order_lines', 'lumber_batches', 'lumber_boards', 'material_requests', 'suppliers', 'project_worker_hours', 'viajes', 'anticipos_viaticos', 'gastos_viaticos', 'notifications', 'accounting_movements', 'settings', 'systemEvents', 'wood', 'users'];
    
    list.innerHTML = collectionsToLoad.map(k => {
      const arr = state[k] || [];
      return `
      <div class="table-item${currentTable===k?' act':''}" onclick="selectTable('${k}')">
        <span>${k}</span>
        <span class="badge">${arr.length}</span>
      </div>
    `}).join('');
  }

  window.selectTable = function(t) {
    currentTable = t;
    renderTables();
    document.getElementById('no-sel').style.display = 'none';
    document.getElementById('sel-view').style.display = 'flex';
    
    document.getElementById('t-name').textContent = t;
    const records = state[t] || [];
    document.getElementById('t-count').textContent = `${records.length} registros`;

    const cols = new Set();
    records.forEach(r => {
      if (r !== null && typeof r === 'object') {
        Object.keys(r).forEach(k => cols.add(k));
      } else {
        cols.add('ValorPrimitivo');
      }
    });
    
    const cg = document.getElementById('t-cols');
    if (cols.size === 0) {
      cg.innerHTML = `<div style="color:var(--muted); font-size:13px;">No hay registros o no tienen columnas.</div>`;
    } else {
      cg.innerHTML = Array.from(cols).sort().map(c => `<div class="col-pill"><span>${c}</span></div>`).join('');
    }

    document.getElementById('t-raw').textContent = records.length ? JSON.stringify(records.slice(0,3), null, 2) : '[]';
  }

  window.vaciarColeccion = async function() {
      if(!currentTable) return;
      if(!confirm("¿Estás seguro de ELIMINAR TODOS los registros de: " + currentTable + "? Esto es irreversible.")) return;

      try {
          const records = state[currentTable] || [];
          for (const raw of records) {
              const id = raw.id || raw._id;
              if (id) {
                  await deleteDoc(doc(db, currentTable, id));
              }
          }
          state[currentTable] = [];
          alert("Colección vaciada correctamente.");
          renderTables();
          selectTable(currentTable);
      } catch(e) { alert("Error: " + e.message); }
  }

  window.limpiarTodoFalso = async function() {
      if(!confirm("Esto borrará operaciones (pedidos, compras, produccion, nomina) manteniendo: Trabajadores, Contactos, Inventario, Configuracion. ¿Continuar?")) return;

      const toClean = [
        'projects', 'project_phases', 'quotations', 'pieces', 'orders', 'production_logs', 
        'payroll_weeks', 'payroll_lines', 'worker_loans', 'worker_loan_payments', 'attendance', 
        'purchase_orders', 'purchase_order_lines', 'lumber_batches', 'lumber_boards', 
        'material_requests', 'project_worker_hours', 'viajes', 'anticipos_viaticos', 
        'gastos_viaticos', 'accounting_movements', 'wood', 'notifications', 'systemEvents'
      ];
      
      let totalDeleted = 0;
      for (const col of toClean) {
          const records = state[col] || [];
          for (const raw of records) {
              const id = raw.id || raw._id;
              if (id) {
                  try {
                      await deleteDoc(doc(db, col, id));
                      totalDeleted++;
                  } catch(e) { console.error("Could not delete from", col, id, e); }
              }
          }
          state[col] = [];
      }
      
      alert(`Limpieza completa. Registros eliminados: ${totalDeleted}`);
      renderTables();
      if(currentTable) selectTable(currentTable);
  }

  renderTables();
</script>
</body>
</html>
