<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Listas — Carpintería Huayapam</title>
<style>


body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--base); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar { width: 260px; background: var(--mantle); border-right: 1px solid var(--crust); display: flex; flex-direction: column; flex-shrink: 0; }
.sb-hdr { padding: 14px 16px; border-bottom: 1px solid var(--crust); font-size: 12px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: .05em; }
.sb-body { flex: 1; overflow-y: auto; padding: 8px; }
.sb-section {
  font-size: 10px; font-weight: 800; color: var(--subtext);
  text-transform: uppercase; letter-spacing: .08em;
  padding: 16px 10px 5px;
  border-top: 1px solid var(--crust);
  margin-top: 4px;
}
.sb-section:first-child { border-top: none; margin-top: 0; padding-top: 6px; }
.sb-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; transition: all .12s; }
.sb-item:hover { background: var(--surface0); }
.sb-item.act { background: var(--blue); color: #fff; }
.sb-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,.1); }
.sb-item.act .sb-badge { background: rgba(255,255,255,.25); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.m-hdr { padding: 16px 24px; border-bottom: 1px solid var(--crust); background: var(--mantle); flex-shrink: 0; }
.m-hdr h2 { font-size: 18px; font-weight: 800; }
.m-hdr p { font-size: 13px; color: var(--subtext); margin-top: 3px; }
.m-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }

/* Add row */
.add-bar { display: flex; gap: 8px; }
.add-bar input, .add-bar select { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--crust); background: var(--mantle); color: var(--text); font-family: inherit; font-size: 13px; }
.add-bar input:focus, .add-bar select:focus { outline: none; border-color: var(--blue); }
.btn { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; transition: opacity .15s; }
.btn:hover { opacity: .85; }
.btn-blue  { background: var(--blue); color: #fff; }
.btn-ghost { background: var(--surface0); color: var(--text); }

/* Items */
.item-row { display: flex; align-items: center; gap: 8px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; padding: 8px 10px; transition: border-color .15s; }
.item-row:hover { border-color: var(--surface1); }
.item-inp { flex: 1; border: none; background: transparent; color: var(--text); font-family: inherit; font-size: 13px; }
.item-inp:focus { outline: none; }
.item-sel { border: 1px solid var(--crust); background: var(--base); color: var(--text); font-family: inherit; font-size: 12px; border-radius: 6px; padding: 4px 6px; }
.item-code { font-size: 11px; font-family: monospace; font-weight: 700; background: var(--surface0); padding: 3px 7px; border-radius: 5px; color: var(--subtext); min-width: 48px; text-align: center; }
.rm-btn { background: none; border: none; color: var(--subtext); cursor: pointer; font-size: 16px; padding: 2px 6px; line-height: 1; }
.rm-btn:hover { color: var(--red); }
.empty { text-align: center; padding: 40px; color: var(--subtext); font-size: 14px; }
.no-sel { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--subtext); font-size: 15px; font-weight: 600; }
.saving-badge { font-size: 11px; color: var(--green); font-weight: 700; padding: 3px 8px; border-radius: 5px; background: var(--blue-bg); display: none; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-hdr">Catálogos del Sistema</div>
  <div class="sb-body" id="sb-body">
    <!-- rendered by JS -->
  </div>
</div>

<div class="main" id="main-area">
  <div class="no-sel" id="no-sel">← Selecciona una lista para editarla</div>
  <div id="list-view" style="display:none; flex-direction:column; overflow:hidden; flex:1;">
    <div class="m-hdr">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h2 id="l-name">Lista</h2>
          <p id="l-desc"></p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="recode-inv-btn" onclick="recodifyInventory()" style="display:none;padding:7px 13px;border:1px solid var(--crust);border-radius:8px;background:var(--surface0);color:var(--text);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;">⟳ Recodificar Inventario</button>
          <span class="saving-badge" id="saving-badge">✓ Guardado</span>
        </div>
      </div>
    </div>
    <div class="m-body">
      <div class="add-bar" id="add-bar"><!-- populated per list type --></div>
      <div id="items-container"></div>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script>
  // ── List definitions ────────────────────────────────────────────────
  // type: 'list'       → stored as single doc {list:[string, ...]}  in collection
  // type: 'obj-list'   → stored as single doc {list:[{id,name,type,...}, ...]}
  // type: 'collection' → each item is its own Firestore document

  const DEFAULT_WORKER_ROLES = ['Jefe de Planta','Maestro A','Maestro B','Oficial A','Oficial B','Chalán','Barniz','Pulido','Empaque','Chofer','Almacén','Compras','Administración','Contador','Mantenimiento','Limpieza','Aprendiz'];

  // Código auto-generado del nombre: iniciales si hay varias palabras, o primeras 3 letras
  function autoCode(name) {
    const words = name.trim().split(/\s+/);
    if (words.length >= 2) return words.map(w => w[0]).join('').toUpperCase().substring(0, 4);
    return name.replace(/\s/g, '').substring(0, 3).toUpperCase();
  }

  const DEFAULT_PIECE_TYPES = [
    // Closets y Armarios
    { id:'pt-closet',    code:'CLO', name:'Closet' },
    { id:'pt-vestidor',  code:'VES', name:'Vestidor' },
    { id:'pt-armario',   code:'ARM', name:'Armario' },
    // Puertas
    { id:'pt-pta-int',   code:'PTI', name:'Puerta Interior' },
    { id:'pt-pta-ext',   code:'PTE', name:'Puerta Exterior' },
    { id:'pt-pta-cls',   code:'PTC', name:'Puerta de Closet' },
    { id:'pt-pta-cor',   code:'PCR', name:'Puerta Corrediza' },
    { id:'pt-pta-plg',   code:'PPL', name:'Puerta Plegable' },
    { id:'pt-pta-srv',   code:'PSV', name:'Puerta de Servicio' },
    // Ventanas
    { id:'pt-ven-fij',   code:'VNF', name:'Ventana Fija' },
    { id:'pt-ven-aba',   code:'VNA', name:'Ventana Abatible' },
    { id:'pt-ven-cor',   code:'VNC', name:'Ventana Corrediza' },
    { id:'pt-ven-plg',   code:'VNP', name:'Ventana Plegable' },
    { id:'pt-ven-pro',   code:'VNR', name:'Ventana Proyectante' },
    // Cocina
    { id:'pt-coc-int',   code:'CCI', name:'Cocina Integral' },
    { id:'pt-alacena',   code:'ALC', name:'Alacena' },
    { id:'pt-barra',     code:'BAR', name:'Barra de Cocina' },
    { id:'pt-isla',      code:'ISL', name:'Isla de Cocina' },
    // Dormitorio
    { id:'pt-cama',      code:'CAM', name:'Cama' },
    { id:'pt-cabecera',  code:'CAB', name:'Cabecera' },
    { id:'pt-cam-cab',   code:'CCA', name:'Cama con Cabecera' },
    { id:'pt-cuna',      code:'CUN', name:'Cuna' },
    { id:'pt-litera',    code:'LIT', name:'Litera' },
    { id:'pt-buro',      code:'BUR', name:'Buró' },
    { id:'pt-tocador',   code:'TCD', name:'Tocador' },
    // Sala / Comedor
    { id:'pt-mesa-com',  code:'MCM', name:'Mesa de Comedor' },
    { id:'pt-mesa-cen',  code:'MCN', name:'Mesa de Centro' },
    { id:'pt-mesa-aux',  code:'MAX', name:'Mesa Auxiliar' },
    { id:'pt-librero',   code:'LBR', name:'Librero' },
    { id:'pt-mueble-tv', code:'MTV', name:'Mueble de TV' },
    { id:'pt-aparador',  code:'APR', name:'Aparador' },
    // Oficina
    { id:'pt-escritorio',code:'ESC', name:'Escritorio' },
    { id:'pt-archivero', code:'ARH', name:'Archivero' },
    // Baño
    { id:'pt-mueble-ban',code:'MBN', name:'Mueble de Baño' },
    // Exterior / Otros
    { id:'pt-deck',      code:'DCK', name:'Deck / Terraza' },
    { id:'pt-escalera',  code:'ECA', name:'Escalera' },
    { id:'pt-panel',     code:'PNL', name:'Panel Decorativo' },
    { id:'pt-duela',     code:'DUE', name:'Duela (Piso)' },
    { id:'pt-tarima',    code:'TAR', name:'Tarima / Plataforma' },
    { id:'pt-otro',      code:'OTR', name:'Otro' },
  ];

  const LISTS = [
    {
      section: 'Recursos Humanos',
      items: [
        { key: 'worker_roles', col: 'worker_roles', type: 'list',
          name: 'Puestos de Trabajadores', desc: 'Roles y categorías del personal' },
      ]
    },
    {
      section: 'Finanzas',
      items: [
        { key: 'expense_categories', col: 'expense_categories', type: 'expense',
          name: 'Categorías de Gastos / Ingresos', desc: 'Clasificación para movimientos financieros' },
        { key: 'bank_accounts', col: 'bank_accounts', type: 'list',
          name: 'Cuentas Bancarias', desc: 'Cuentas usadas en movimientos y compras (ej. CHU, CAJA, SMTP)' },
        { key: 'viatico_categories', col: 'viatico_categories', type: 'list',
          name: 'Categorías de Viáticos', desc: 'Tipos de gasto en viajes (Transporte, Comidas, Alojamiento…)' },
      ]
    },
    {
      section: 'Inventario y Compras',
      items: [
        { key: 'concept_categories',   col: 'concept_categories',   type: 'catlist',
          name: 'Categorías de Inventario', desc: 'Cada categoría tiene un código de 2 dígitos para el código de producto (ej. Ferretería → 01)' },
        { key: 'inventory_brands',     col: 'inventory_brands',     type: 'brand',
          name: 'Marcas de Inventario',     desc: 'Marca de cada producto con código de 3 dígitos (ej. Sika → 001). Sin marca = 000' },
        { key: 'concept_units',        col: 'concept_units',        type: 'list',
          name: 'Unidades de Medida',       desc: 'pza, gln, kg, lt, mt, caja…' },
        { key: 'inventory_locations',  col: 'inventory_locations',  type: 'list',
          name: 'Ubicaciones en Almacén',   desc: 'Áreas o estantes donde se guardan los productos' },
      ]
    },
    {
      section: 'Producción y Cotización',
      items: [
        { key: 'piece_types', col: 'piece_types', type: 'piece',
          name: 'Tipos de Pieza', desc: 'Puerta, Closet, Cocina, Mesa… (usados en cotizaciones)' },
        { key: 'actividades_trabajo', col: 'actividades_trabajo', type: 'list',
          name: 'Actividades de Trabajo', desc: 'Operaciones registradas en producción diaria (Cepillado, Corte, Barniz…)' },
      ]
    },
    {
      section: 'Documentos',
      items: [
        { key: 'document_categories', col: 'document_categories', type: 'list',
          name: 'Categorías de Documentos', desc: 'Clasificación de documentos (Contratos, Planos, Facturas…)' },
      ]
    },
    {
      section: 'Herramientas',
      items: [
        { key: 'tool_categories', col: 'tool_categories', type: 'iconlist',
          name: 'Categorías de Herramientas', desc: 'Clasificación de herramientas por tipo de uso (Corte, Perforación, Medición…)' },
        { key: 'tool_types', col: 'tool_types', type: 'list',
          name: 'Tipos de Herramienta', desc: 'Personal o Compartida — indica a quién pertenece la herramienta' },
        { key: 'tool_states', col: 'tool_states', type: 'list',
          name: 'Estados de Herramienta', desc: 'Condición actual de la herramienta (Nueva, Buena, Mantenimiento, Baja…)' },
      ]
    },
    {
      section: 'Almacén de Madera',
      items: [
        { key: 'wood_price_catalog', col: 'wood_price_catalog', type: 'woodcat',
          name: 'Precios Estándar de Madera', desc: 'Catálogo de tipos de madera con precio estimado por unidad — usado en cotizaciones' },
        { key: 'wood_types',     col: 'wood_types',     type: 'list', name: 'Especies de Madera',   desc: 'Pino, Cedro, Parota, Encino…' },
        { key: 'wood_formats',   col: 'wood_formats',   type: 'list', name: 'Formatos de Madera',   desc: 'Tabla, Tablón, Duela, Viga…' },
        { key: 'wood_quality',   col: 'wood_quality',   type: 'list', name: 'Calidades de Madera',  desc: 'Primera, Segunda, Extra…' },
        { key: 'wood_locations', col: 'wood_locations', type: 'list', name: 'Ubicaciones en Bodega', desc: 'Área Principal, Bodega, Exterior…' },
      ]
    },
  ];

  let currentDef = null;
  let STATE = {}; // { key: items[] }

  // ── Load all list data ───────────────────────────────────────────────
  async function loadAll() {
    await window.DB.query('contacts'); // ensure DB_STATE_LOADED
    // Cargar en paralelo todas las colecciones que no están en la carga inicial
    await Promise.all(LISTS.flatMap(s => s.items.map(def => window.DB.query(def.col))));
    const d = window.DB.get();

    for (const section of LISTS) {
      for (const def of section.items) {
        const raw = d[def.key] || [];
        if (def.type === 'iconlist') {
          const rawList = raw[0]?.list || raw.filter(x => x?.label || typeof x === 'string');
          // Migrate: strings → {label, icon}; objects stay as-is
          STATE[def.key] = rawList.map(x =>
            typeof x === 'string' ? { label: x, icon: '🧰' } : { label: x.label||x.name||'', icon: x.icon||'🧰' }
          );
          const ICON_DEFAULTS = [
            { label:'Perforación',     icon:'🔩' }, { label:'Corte',        icon:'🪚' },
            { label:'Lijado',          icon:'📋' }, { label:'Cepillado',    icon:'🪵' },
            { label:'Medición',        icon:'📐' }, { label:'Sujeción',     icon:'🔧' },
            { label:'Router / Fresado',icon:'⚙️'  }, { label:'Ensamble / Mano',icon:'🔨' },
            { label:'Acabado',         icon:'🎨' }, { label:'Otro',         icon:'🧰' },
          ];
          if (!STATE[def.key].length) {
            STATE[def.key] = ICON_DEFAULTS;
            if (window.parent?.setDocumentInFirebase)
              window.parent.setDocumentInFirebase(def.col, 'main', { list: ICON_DEFAULTS });
            if (window.parent?.DB_STATE)
              window.parent.DB_STATE[def.key] = [{ _id: 'main', list: ICON_DEFAULTS }];
          }
        } else if (def.type === 'list') {
          STATE[def.key] = raw[0]?.list || raw.filter(x => typeof x === 'string');
          const DEFAULTS = {
            worker_roles: DEFAULT_WORKER_ROLES,
            document_categories: ['Contratos','Planos','Facturas','Permisos y Licencias','Recursos Humanos','Manuales','Garantias','Presupuestos','Otros'],
            tool_types: ['Personal','Compartida'],
            tool_states: ['Nueva','Buena','Mantenimiento','Baja'],
          };
          if (!STATE[def.key].length && DEFAULTS[def.key]) {
            STATE[def.key] = [...DEFAULTS[def.key]];
            if (window.parent?.setDocumentInFirebase)
              window.parent.setDocumentInFirebase(def.col, 'main', { list: DEFAULTS[def.key] });
            if (window.parent?.DB_STATE)
              window.parent.DB_STATE[def.key] = [{ _id: 'main', list: DEFAULTS[def.key] }];
          }
        } else if (def.type === 'catlist') {
          // Lista de objetos {name, catCode} guardada como doc 'main' {list:[...]}
          const rawList = raw[0]?.list || raw.filter(x => typeof x === 'string' || x?.name);
          STATE[def.key] = rawList.map(x =>
            typeof x === 'string' ? { name: x, catCode: '' } : x
          );
        } else if (def.type === 'brand') {
          STATE[def.key] = raw.filter(x => x.id && !x._init && x.name);
        } else if (def.type === 'expense') {
          // Deduplicar por nombre (puede haber duplicados en Firestore)
          const seen = new Set();
          STATE[def.key] = raw.filter(x => {
            if (!x.id || x._init) return false;
            const k = (x.name || '').toLowerCase().trim();
            if (seen.has(k)) return false;
            seen.add(k);
            return true;
          });
        } else if (def.type === 'piece') {
          STATE[def.key] = raw.filter(x => x.id && !x._init && x.name);
          if (!STATE[def.key].length) {
            STATE[def.key] = DEFAULT_PIECE_TYPES.map(p => ({...p}));
            for (const p of DEFAULT_PIECE_TYPES) {
              if (window.parent?.setDocumentInFirebase) window.parent.setDocumentInFirebase('piece_types', p.id, p);
            }
            if (window.parent?.DB_STATE) window.parent.DB_STATE['piece_types'] = DEFAULT_PIECE_TYPES.map(p => ({...p}));
          }
        } else if (def.type === 'woodcat') {
          STATE[def.key] = raw.filter(x => x.id && !x._init && x.nombre)
            .sort((a, b) => (a.nombre||'').localeCompare(b.nombre||''));
        } else {
          STATE[def.key] = raw;
        }
      }
    }
    renderSidebar();
  }

  // ── Sidebar ──────────────────────────────────────────────────────────
  function renderSidebar() {
    const sb = document.getElementById('sb-body');
    sb.innerHTML = LISTS.map(section => `
      <div class="sb-section">${section.section}</div>
      ${section.items.map(def => {
        const count = STATE[def.key]?.length || 0;
        return `<div class="sb-item${currentDef?.key === def.key ? ' act' : ''}" onclick="selectList('${def.key}')">
          <span>${def.name}</span>
          <span class="sb-badge">${count}</span>
        </div>`;
      }).join('')}
    `).join('');
  }

  // ── Select list ──────────────────────────────────────────────────────
  function selectList(key) {
    for (const s of LISTS) {
      const found = s.items.find(i => i.key === key);
      if (found) { currentDef = found; break; }
    }
    document.getElementById('no-sel').style.display = 'none';
    document.getElementById('list-view').style.display = 'flex';
    document.getElementById('l-name').textContent = currentDef.name;
    document.getElementById('l-desc').textContent = currentDef.desc;
    document.getElementById('recode-inv-btn').style.display = currentDef.key === 'concept_categories' ? '' : 'none';
    renderAddBar();
    renderItems();
    renderSidebar();
  }

  // ── Add bar ──────────────────────────────────────────────────────────
  function renderAddBar() {
    const bar = document.getElementById('add-bar');
    if (currentDef.type === 'iconlist') {
      bar.innerHTML = `
        <input type="text" id="new-icon" value="🧰" style="width:52px;text-align:center;font-size:18px;padding:6px 8px;border:1px solid var(--crust);border-radius:6px;background:var(--base);color:var(--text);" title="Emoji">
        <input type="text" id="new-val" placeholder="Nombre de categoría…" style="flex:1;" onkeydown="if(event.key==='Enter') addItem()">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'list') {
      bar.innerHTML = `
        <input type="text" id="new-val" placeholder="Nuevo valor…" onkeydown="if(event.key==='Enter') addItem()">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'catlist') {
      const nextCode = String(Math.max(0, ...STATE[currentDef.key].map(x => parseInt(x.catCode)||0)) + 1).padStart(2,'0');
      bar.innerHTML = `
        <input type="text" id="new-icon" value="📦" style="width:52px;text-align:center;font-size:18px;padding:6px 8px;border:1px solid var(--crust);border-radius:6px;background:var(--base);color:var(--text);" title="Emoji">
        <input type="text" id="new-val" placeholder="Nombre de categoría…" style="flex:2;" onkeydown="if(event.key==='Enter') addItem()">
        <input type="text" id="new-catcode" value="${nextCode}" maxlength="2" placeholder="00"
          style="width:54px; text-align:center; font-family:monospace; font-weight:700; padding:8px; border:1px solid var(--crust); border-radius:6px; background:var(--base); color:var(--text);">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'brand') {
      const nextBCode = String(Math.max(0, ...STATE[currentDef.key].map(x => parseInt(x.brandCode)||0)) + 1).padStart(3,'0');
      bar.innerHTML = `
        <input type="text" id="new-val" placeholder="Nombre de marca…" style="flex:2;" onkeydown="if(event.key==='Enter') addItem()">
        <input type="text" id="new-brandcode" value="${nextBCode}" maxlength="3" placeholder="001"
          style="width:60px; text-align:center; font-family:monospace; font-weight:700; padding:8px; border:1px solid var(--crust); border-radius:6px; background:var(--base); color:var(--text);">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'expense') {
      bar.innerHTML = `
        <input type="text" id="new-val" placeholder="Nombre de categoría…" style="flex:2;" onkeydown="if(event.key==='Enter') addItem()">
        <select id="new-type">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
          <option value="transferencia">Transferencia</option>
        </select>
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'piece') {
      bar.innerHTML = `
        <input type="text" id="new-val" placeholder="Nombre de la pieza…" onkeydown="if(event.key==='Enter') addItem()">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    } else if (currentDef.type === 'woodcat') {
      bar.innerHTML = `
        <input type="text" id="new-val" placeholder="Tipo de madera (ej: Pino Primera)…" style="flex:2;" onkeydown="if(event.key==='Enter') addItem()">
        <select id="new-unit" style="width:90px;">
          <option value="pt">pt</option>
          <option value="lámina">lámina</option>
          <option value="m²">m²</option>
          <option value="pieza">pieza</option>
        </select>
        <input type="number" id="new-price" placeholder="$ Precio est." min="0" step="1" style="width:110px; text-align:right;">
        <button class="btn btn-blue" onclick="addItem()">+ Agregar</button>`;
    }
  }

  // ── Render items ─────────────────────────────────────────────────────
  function renderItems() {
    const container = document.getElementById('items-container');
    const items = STATE[currentDef.key] || [];

    if (!items.length) {
      container.innerHTML = `<div class="empty">No hay entradas. Agrega la primera arriba.</div>`;
      return;
    }

    if (currentDef.type === 'iconlist') {
      container.innerHTML = `
        <div class="item-row" style="font-size:10px;font-weight:700;color:var(--subtext);text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--crust);">
          <span style="width:52px;text-align:center;">Emoji</span>
          <span style="flex:1;">Nombre de Categoría</span>
          <span style="width:32px;"></span>
        </div>` +
        items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.icon||'🧰')}"
            style="width:52px;text-align:center;font-size:18px;padding:6px 8px;"
            title="Emoji de la categoría"
            onchange="updateItem(${i}, this.value, 'icon')" onblur="updateItem(${i}, this.value, 'icon')">
          <input class="item-inp" value="${escHtml(item.label||'')}" style="flex:1;"
            onchange="updateItem(${i}, this.value, 'label')" onblur="updateItem(${i}, this.value, 'label')">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'list') {
      container.innerHTML = items.map((val, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(val)}" onchange="updateItem(${i}, this.value)" onblur="updateItem(${i}, this.value)">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'catlist') {
      container.innerHTML = `
        <div class="item-row" style="font-size:10px;font-weight:700;color:var(--subtext);text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--crust);">
          <span style="width:52px;text-align:center;">Emoji</span>
          <span style="flex:1;">Nombre de Categoría</span>
          <span style="width:60px;text-align:center;">Cód. (2 díg.)</span>
          <span style="width:32px;"></span>
        </div>` +
        items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.icon||'📦')}" style="width:52px;text-align:center;font-size:18px;padding:6px 8px;"
            onchange="updateItem(${i}, this.value, 'icon')" onblur="updateItem(${i}, this.value, 'icon')">
          <input class="item-inp" value="${escHtml(item.name||'')}" style="flex:1;"
            onchange="updateItem(${i}, this.value, 'name')" onblur="updateItem(${i}, this.value, 'name')">
          <input class="item-inp" value="${escHtml(item.catCode||'')}" maxlength="2" placeholder="00"
            style="width:60px;text-align:center;font-family:monospace;font-weight:800;font-size:15px;"
            onchange="updateItem(${i}, this.value, 'catCode')" onblur="updateItem(${i}, this.value, 'catCode')">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'brand') {
      container.innerHTML = `
        <div class="item-row" style="font-size:10px;font-weight:700;color:var(--subtext);text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--crust);">
          <span style="width:70px;text-align:center;">Cód. (3 díg.)</span>
          <span style="flex:1;">Nombre de Marca</span>
          <span style="width:32px;"></span>
        </div>` +
        items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.brandCode||'')}" maxlength="3" placeholder="001"
            style="width:70px;text-align:center;font-family:monospace;font-weight:800;font-size:15px;"
            onchange="updateItem(${i}, this.value, 'brandCode')" onblur="updateItem(${i}, this.value, 'brandCode')">
          <input class="item-inp" value="${escHtml(item.name||'')}" placeholder="Nombre de marca" style="flex:1;"
            onchange="updateItem(${i}, this.value, 'name')" onblur="updateItem(${i}, this.value, 'name')">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'expense') {
      const typeLabel = { gasto: 'Gasto', ingreso: 'Ingreso', transferencia: 'Transferencia' };
      const typeClr   = { gasto: 'color:var(--red)', ingreso: 'color:var(--green)', transferencia: 'color:var(--amber)' };
      container.innerHTML = items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.name)}" onchange="updateItem(${i}, this.value, 'name')" onblur="updateItem(${i}, this.value, 'name')">
          <select class="item-sel" onchange="updateItem(${i}, this.value, 'type')">
            ${['gasto','ingreso','transferencia'].map(t =>
              `<option value="${t}" ${item.type===t?'selected':''}>${typeLabel[t]}</option>`
            ).join('')}
          </select>
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'piece') {
      container.innerHTML = items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.name||'')}" placeholder="Nombre" onchange="updateItem(${i}, this.value, 'name')" onblur="updateItem(${i}, this.value, 'name')">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    } else if (currentDef.type === 'woodcat') {
      container.innerHTML = `
        <div class="item-row" style="font-size:10px;font-weight:700;color:var(--subtext);text-transform:uppercase;padding:4px 0;border-bottom:1px solid var(--crust);">
          <span style="flex:2;">Tipo de Madera</span>
          <span style="width:80px;text-align:center;">Unidad</span>
          <span style="width:100px;text-align:right;">$ Precio Est.</span>
          <span style="width:32px;"></span>
        </div>` +
        items.map((item, i) => `
        <div class="item-row">
          <input class="item-inp" value="${escHtml(item.nombre||'')}" placeholder="Nombre" style="flex:2;"
            onchange="updateItem(${i}, this.value, 'nombre')" onblur="updateItem(${i}, this.value, 'nombre')">
          <select class="item-sel" style="width:80px;" onchange="updateItem(${i}, this.value, 'unidad')">
            ${['pt','lámina','m²','pieza'].map(u=>`<option value="${u}"${item.unidad===u?' selected':''}>${u}</option>`).join('')}
          </select>
          <input class="item-inp" value="${item.precioEst||0}" type="number" min="0" step="1"
            style="width:100px;text-align:right;font-weight:700;"
            onchange="updateItem(${i}, this.value, 'precioEst')" onblur="updateItem(${i}, this.value, 'precioEst')">
          <button class="rm-btn" onclick="deleteItem(${i})">✕</button>
        </div>`).join('');
    }
  }

  // ── CRUD ─────────────────────────────────────────────────────────────
  async function addItem() {
    const val = document.getElementById('new-val')?.value.trim();
    if (!val) return;

    if (currentDef.type === 'iconlist') {
      const icon = document.getElementById('new-icon')?.value.trim() || '🧰';
      if (STATE[currentDef.key].some(x => x.label === val)) return alert('Ya existe esa categoría.');
      STATE[currentDef.key].push({ label: val, icon });
      await saveList();
      document.getElementById('new-icon').value = '🧰';
    } else if (currentDef.type === 'list') {
      if (STATE[currentDef.key].includes(val)) return alert('Ya existe ese valor.');
      STATE[currentDef.key].push(val);
      await saveList();
    } else if (currentDef.type === 'catlist') {
      const catCode = String(document.getElementById('new-catcode')?.value || '').padStart(2,'0').slice(0,2);
      const icon = document.getElementById('new-icon')?.value.trim() || '📦';
      STATE[currentDef.key].push({ name: val, catCode, icon });
      await saveCatList();
      document.getElementById('new-icon').value = '📦';
    } else if (currentDef.type === 'brand') {
      const brandCode = String(document.getElementById('new-brandcode')?.value || '').padStart(3,'0').slice(0,3);
      const id = 'brand-' + Date.now().toString(36);
      STATE[currentDef.key].push({ id, name: val, brandCode });
      await saveItem({ id, name: val, brandCode });
    } else if (currentDef.type === 'expense') {
      const type = document.getElementById('new-type')?.value || 'gasto';
      const id = 'cat-' + Date.now().toString(36);
      STATE[currentDef.key].push({ id, name: val, type });
      await saveItem({ id, name: val, type });
    } else if (currentDef.type === 'piece') {
      const code = autoCode(val);
      const id = 'pt-' + Date.now().toString(36);
      STATE[currentDef.key].push({ id, code, name: val });
      await saveItem({ id, code, name: val });
    } else if (currentDef.type === 'woodcat') {
      const unidad    = document.getElementById('new-unit')?.value || 'pt';
      const precioEst = parseFloat(document.getElementById('new-price')?.value) || 0;
      const id = 'wc-' + Date.now().toString(36);
      const entry = { id, nombre: val, unidad, precioEst, notas: '' };
      STATE[currentDef.key].push(entry);
      await saveItem(entry);
      const priceEl = document.getElementById('new-price');
      if (priceEl) priceEl.value = '';
    }

    document.getElementById('new-val').value = '';
    renderItems();
    renderSidebar();
  }

  async function updateItem(idx, newVal, field) {
    newVal = newVal.trim();
    if (!newVal) return;

    if (currentDef.type === 'iconlist') {
      STATE[currentDef.key][idx][field] = newVal;
      await saveList();
    } else if (currentDef.type === 'list') {
      STATE[currentDef.key][idx] = newVal;
      await saveList();
    } else if (currentDef.type === 'catlist') {
      STATE[currentDef.key][idx][field] = newVal;
      await saveCatList();
    } else if (field) {
      if (currentDef.type === 'woodcat' && field === 'precioEst') {
        STATE[currentDef.key][idx][field] = parseFloat(newVal) || 0;
      } else {
        STATE[currentDef.key][idx][field] = newVal;
      }
      if (currentDef.type === 'piece' && field === 'name') STATE[currentDef.key][idx].code = autoCode(newVal);
      await saveItem(STATE[currentDef.key][idx]);
    }
  }

  async function deleteItem(idx) {
    const items = STATE[currentDef.key];
    const item  = items[idx];
    const label = typeof item === 'string' ? item : (item.nombre || item.name || item.id);
    if (!confirm(`¿Eliminar "${label}"?`)) return;

    if (currentDef.type === 'iconlist') {
      items.splice(idx, 1);
      await saveList();
    } else if (currentDef.type === 'list') {
      items.splice(idx, 1);
      await saveList();
    } else if (currentDef.type === 'catlist') {
      items.splice(idx, 1);
      await saveCatList();
    } else {
      const removed = items.splice(idx, 1)[0];
      if (window.parent?.deleteDocumentFromFirebase && removed.id) {
        await window.parent.deleteDocumentFromFirebase(currentDef.col, removed.id);
      }
      // Update DB_STATE
      if (window.parent?.DB_STATE?.[currentDef.key]) {
        window.parent.DB_STATE[currentDef.key] = window.parent.DB_STATE[currentDef.key]
          .filter(x => x.id !== removed.id);
      }
    }

    renderItems();
    renderSidebar();
    flash();
  }

  // ── Save helpers ─────────────────────────────────────────────────────
  async function saveList() {
    const list = STATE[currentDef.key];
    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase(currentDef.col, 'main', { list });
    }
    if (window.parent?.DB_STATE) {
      window.parent.DB_STATE[currentDef.key] = [{ _id: 'main', list }];
    }
    flash();
  }

  async function saveCatList() {
    // Igual que saveList pero la lista es de objetos {name, catCode}
    const list = STATE[currentDef.key];
    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase(currentDef.col, 'main', { list });
    }
    if (window.parent?.DB_STATE) {
      window.parent.DB_STATE[currentDef.key] = [{ _id: 'main', list }];
    }
    flash();
  }

  async function saveItem(item) {
    if (!item.id) return;
    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase(currentDef.col, item.id, item);
    }
    // Update DB_STATE
    if (window.parent?.DB_STATE?.[currentDef.key]) {
      const idx = window.parent.DB_STATE[currentDef.key].findIndex(x => x.id === item.id);
      if (idx !== -1) window.parent.DB_STATE[currentDef.key][idx] = item;
      else window.parent.DB_STATE[currentDef.key].push(item);
    }
    flash();
  }

  function flash() {
    const b = document.getElementById('saving-badge');
    b.style.display = 'inline';
    clearTimeout(b._t);
    b._t = setTimeout(() => b.style.display = 'none', 2000);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  async function recodifyInventory() {
    const cats = STATE['concept_categories'] || [];
    if (!cats.length) { alert('No hay categorías definidas.'); return; }

    await window.DB.query('inventory');
    await window.DB.query('inventory_brands');
    const d = window.DB.get();
    const inventory = (d.inventory || []).filter(i => !i._init && i.name);
    const brands = (d.inventory_brands || []).filter(b => b?.id && b.name);

    const catCodeMap = {};
    cats.forEach(c => { catCodeMap[c.name] = String(c.catCode || '00').padStart(2,'0').slice(0,2); });

    const counters = {};
    let updated = 0;
    for (const item of inventory) {
      const cc  = catCodeMap[item.category] || '00';
      const brand = brands.find(b => b.id === item.brandId || b.name === item.brand);
      const mmm = String(brand?.brandCode || '000').padStart(3,'0').slice(0,3);
      const pfx = cc + mmm;
      const seq = counters[pfx] ?? 0;
      counters[pfx] = seq + 1;
      const newCode = cc + '-' + mmm + '-' + String(seq).padStart(2,'0');
      if (item.code !== newCode) {
        item.code = newCode;
        if (window.parent?.setDocumentInFirebase) window.parent.setDocumentInFirebase('inventory', item.id, item);
        updated++;
      }
    }
    window.DB.save(d);

    const b = document.getElementById('saving-badge');
    b.textContent = `✓ ${updated} productos recodificados`;
    b.style.display = 'inline';
    clearTimeout(b._t);
    b._t = setTimeout(() => { b.style.display = 'none'; b.textContent = '✓ Guardado'; }, 3500);
  }

  document.addEventListener('DOMContentLoaded', loadAll);
</script>
