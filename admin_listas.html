<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar Listas (Catálogos)</title>
<style>
  :root {
    --bg: #11111b; --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --text: #cdd6f4; --subtext: #a6adc8; --muted: #7f849c;
    --blue: #89b4fa; --green: #a6e3a1; --red: #f38ba8; --amber: #f9e2af;
    --surface0: #313244; --surface1: #45475a; --surface2: #585b70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; height: 100vh;}
  
  .sidebar { width: 280px; background: var(--mantle); border-right: 1px solid var(--crust); display: flex; flex-direction: column; }
  .sb-header { padding: 16px; border-bottom: 1px solid var(--crust); font-weight: 700; font-size: 14px; color: var(--subtext); text-transform: uppercase; }
  .sb-list { flex: 1; overflow-y: auto; padding: 12px; }
  .list-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; color: var(--subtext); font-size: 13px; font-weight: 600; margin-bottom: 4px; transition: 0.1s; display: flex; justify-content: space-between; align-items: center; }
  .list-item:hover { background: var(--surface0); color: var(--text); }
  .list-item.act { background: var(--blue); color: #fff; }
  .badge { background: var(--crust); padding: 2px 6px; border-radius: 4px; font-size: 10px; }

  .main { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; }
  .title { font-size: 24px; font-weight: 800; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-top: 4px; }
  
  .card { background: var(--base); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; }
  .items-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  
  .val-row { display: flex; align-items: center; gap: 8px; background: var(--mantle); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--crust); }
  .val-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 14px; font-family: inherit; }
  .val-input:focus { outline: none; border-bottom: 1px solid var(--blue); }
  
  .btn-icon { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; transition: 0.2s; }
  .btn-icon:hover { color: var(--red); }
  
  .add-row { display: flex; gap: 12px; margin-top: 16px; }
  .add-input { flex: 1; background: var(--mantle); border: 1px solid var(--crust); padding: 10px 12px; border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
  .add-input:focus { outline: none; border-color: var(--blue); }
  .btn { background: var(--blue); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-family: inherit; font-size: 13px; cursor: pointer; }

</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-header">Catálogos de Listas</div>
  <div class="sb-list" id="sidebar-lists"></div>
</div>

<div class="main">
  <div id="no-sel" style="text-align:center; padding:100px; color:var(--muted); font-weight:600;">Selecciona una lista del menú lateral</div>
  
  <div id="sel-view" style="display:none; flex-direction:column; gap:24px;">
    <div class="head">
      <div>
        <div class="title" id="t-name">Lista</div>
        <div class="subtitle" id="t-desc">Descripción de la lista</div>
      </div>
    </div>

    <div class="card">
      <div class="add-row">
        <input type="text" id="new-item-input" class="add-input" placeholder="Nuevo valor...">
        <button class="btn" onclick="addItem()">+ Agregar</button>
      </div>
      <div class="items-list" id="items-container"></div>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script>
  const listsDefs = [
    { key: 'worker_roles', name: 'Categorías de Empleados', desc: 'Puestos y roles de trabajadores' },
    { key: 'wood_formats', name: 'Tipos de Pieza (Madera)', desc: 'Tabla, Tablón, Hoja, Viga' },
    { key: 'wood_types', name: 'Material/Especie de Madera', desc: 'Especies (Tzalam, Encino, MDF, etc)' },
    { key: 'wood_quality', name: 'Calidad de Madera', desc: 'Primera, Segunda, etc' },
    { key: 'wood_locations', name: 'Ubicaciones de Madera', desc: 'Diferentes ubicaciones en el taller' },
    { key: 'concept_categories', name: 'Categorías de Inventario', desc: 'Tableros, Herrajes, Químicos, etc' },
    { key: 'concept_units', name: 'Unidades de Medida', desc: 'pza, gln, kg, etc' },
    { key: 'expense_categories', name: 'Categorías de Gastos/Movimientos', desc: 'Clasificación financiera' },
    { key: 'project_types', name: 'Tipos de Proyectos', desc: 'Cocinas, Closets, etc' },
    { key: 'payment_methods', name: 'Métodos de Pago', desc: 'Cuentas y formas de pago' }
  ];

  let currentKey = null;

  function renderSidebar() {
    const d = window.DB.get();
    const sb = document.getElementById('sidebar-lists');
    sb.innerHTML = listsDefs.map(def => {
      const arr = d[def.key] || [];
      return `
        <div class="list-item${currentKey===def.key?' act':''}" onclick="selectList('${def.key}')">
          <span>${def.name}</span>
          <span class="badge">${arr.length}</span>
        </div>
      `;
    }).join('');
  }

  function selectList(key) {
    currentKey = key;
    renderSidebar();
    
    document.getElementById('no-sel').style.display = 'none';
    document.getElementById('sel-view').style.display = 'flex';
    
    const def = listsDefs.find(d => d.key === key);
    document.getElementById('t-name').textContent = def.name;
    document.getElementById('t-desc').textContent = def.desc;
    
    renderItems();
  }

  function renderItems() {
    if(!currentKey) return;
    const d = window.DB.get();
    const arr = d[currentKey] || [];
    
    document.getElementById('items-container').innerHTML = arr.map((val, idx) => {
      if (typeof val === 'object' && val !== null) {
        return `
          <div class="val-row" style="gap:4px;">
            <input type="text" class="val-input" value="${val.name || ''}" onchange="updateItemObj(${idx}, 'name', this.value)" style="flex:2;">
            <select class="val-input" onchange="updateItemObj(${idx}, 'type', this.value)" style="flex:1;">
              <option value="ingreso" ${val.type==='ingreso'?'selected':''}>Ingreso</option>
              <option value="gasto" ${val.type==='gasto'?'selected':''}>Gasto</option>
              <option value="transferencia" ${val.type==='transferencia'?'selected':''}>Transferencia</option>
            </select>
            <button class="btn-icon" onclick="deleteItem(${idx})">✕</button>
          </div>
        `;
      }
      return `
      <div class="val-row">
        <input type="text" class="val-input" value="${val}" onchange="updateItem(${idx}, this.value)">
        <button class="btn-icon" onclick="deleteItem(${idx})">✕</button>
      </div>
      `;
    }).join('');
  }

  function addItem() {
    const input = document.getElementById('new-item-input');
    const val = input.value.trim();
    if(!val || !currentKey) return;
    
    const d = window.DB.get();
    if(!d[currentKey]) d[currentKey] = [];
    
    if (currentKey === 'expense_categories') {
      d[currentKey].push({ name: val, type: 'gasto' });
      window.DB.save(d);
      input.value = '';
      renderItems();
      renderSidebar();
    } else {
      if(!d[currentKey].includes(val)) {
        d[currentKey].push(val);
        window.DB.save(d);
        input.value = '';
        renderItems();
        renderSidebar();
      } else {
        console.warn('Ese valor ya existe en la lista.');
      }
    }
  }

  function updateItemObj(idx, field, newVal) {
    newVal = newVal.trim();
    const d = window.DB.get();
    if (d[currentKey][idx]) {
      d[currentKey][idx][field] = newVal;
      window.DB.save(d);
    }
  }

  function updateItem(idx, newVal) {
    newVal = newVal.trim();
    if(!newVal || !currentKey) return;
    const d = window.DB.get();
    d[currentKey][idx] = newVal;
    window.DB.save(d);
    // Don't re-render immediately to avoid losing focus if they just clicked away, 
    // but the array is updated in DB.
  }

  function deleteItem(idx) {
    if(!currentKey) return;
    // Removed confirm() for iframe compatibility
    const d = window.DB.get();
    d[currentKey].splice(idx, 1);
    window.DB.save(d);
    renderItems();
    renderSidebar();
  }

  renderSidebar();
</script>
</body>
</html>
