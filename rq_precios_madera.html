<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precios de Madera — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
.main { padding: 16px 20px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.table-wrap { overflow-x: auto; width: 100%; }

.count-tag { font-size: 12px; color: var(--subtext); font-weight: 600; padding: 6px 2px; display: block; }

/* Toast */
#toast-wrap { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast-msg { background: var(--green); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); }

/* Modal */
.modal-input { padding: 9px 10px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-family: inherit; width: 100%; font-size: 13px; height: 40px; outline: none; }
.modal-input:focus { border-color: var(--blue); }
.modal-label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; display: block; }
.field-group { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Precios de Madera</h2>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="hdr-search">
      <span style="color:var(--subtext);font-size:13px;flex-shrink:0;">🔍</span>
      <input type="text" id="srch" placeholder="Buscar…" oninput="render()">
    </div>
    <button class="btn btn-green" onclick="openModal()">+ Agregar</button>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr id="tbl-head">
            <th data-col="nombre" class="sortable sort-asc">Nombre</th>
            <th data-col="tipo" class="sortable">Especie</th>
            <th data-col="calidad" class="sortable">Calidad</th>
            <th data-col="precio" class="sortable num" style="text-align:right;">Precio Est.</th>
            <th data-col="lastUpdated" class="sortable">Últ. Actualización</th>
            <th data-col="notas" class="sortable">Notas</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div id="empty-state" style="display:none; text-align:center; padding:48px 24px; color:var(--subtext);">
      <div style="font-size:28px; margin-bottom:8px;">🪵</div>
      <div style="font-size:14px; font-weight:600;">Sin resultados</div>
    </div>
  </div>
  <span class="count-tag" id="count-tag"></span>
</div>

<!-- Modal de Madera -->
<div id="mod-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div style="background:var(--mantle); border:1px solid var(--crust); border-radius:14px; width:100%; max-width:560px; padding:24px; display:flex; flex-direction:column; gap:16px; max-height:92vh; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--crust);">
      <h2 id="mod-title" style="font-size:18px; font-weight:800;">Madera</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--subtext);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <input type="hidden" id="m-id">

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="field-group">
        <label class="modal-label">Nombre del Concepto</label>
        <input type="text" id="m-nombre" class="modal-input" placeholder="Ej. Pino de primera 1x4x10">
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="field-group">
          <label class="modal-label">Especie</label>
          <select id="m-tipo" class="modal-input" data-searchable></select>
        </div>
        <div class="field-group">
          <label class="modal-label">Formato</label>
          <select id="m-categoria" class="modal-input" data-searchable></select>
        </div>
        <div class="field-group">
          <label class="modal-label">Calidad</label>
          <select id="m-calidad" class="modal-input" data-searchable></select>
        </div>
      </div>
      <div class="field-group">
        <label class="modal-label">Precio Estimado ($)</label>
        <input type="number" id="m-precio" class="modal-input" step="any" min="0" placeholder="0.00">
      </div>
      <div class="field-group">
        <label class="modal-label">Notas</label>
        <input type="text" id="m-notas" class="modal-input" placeholder="Observaciones...">
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; padding-top:14px; border-top:1px solid var(--crust);">
      <button id="btn-delete-item" onclick="deleteItem()" class="btn btn-red" style="display:none;">Eliminar concepto</button>
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button onclick="closeModal()" class="btn">Cancelar</button>
        <button onclick="saveItem()" class="btn btn-blue">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
const COL = 'wood_price_catalog';

let TIPOS = [];
let CATS  = [];
let QUALS = [];

let FORMAT_UNIT_MAP = {};
function unitForFormat(fmt) { return FORMAT_UNIT_MAP[fmt] || 'pt'; }
function buildFormatUnitMap() {
  const raw = window.parent?.DB_STATE?.wood_formats || window.DB.get().wood_formats || [];
  const list = raw[0]?.list || raw;
  list.forEach(x => {
    if (typeof x === 'object' && x.name) FORMAT_UNIT_MAP[x.name] = x.unit || 'pt';
    else if (typeof x === 'string') FORMAT_UNIT_MAP[x] = 'pt';
  });
}
let DATA  = [];
let sortCol = 'nombre';
let sortDir = 1; // 1 asc, -1 desc

function fmt(n) { return '$' + (parseFloat(n)||0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function daysSince(dateStr) {
  if (!dateStr) return null;
  const [d,m,y] = dateStr.split('/').map(Number);
  const then = new Date(y, m-1, d);
  return Math.floor((Date.now() - then) / 86400000);
}
function todayStr() { const n = new Date(); return `${n.getDate()}/${n.getMonth()+1}/${n.getFullYear()}`; }

function getList(key) {
  const raw = window.parent?.DB_STATE?.[key] || window.DB.get()[key] || [];
  return raw[0]?.list || raw.filter(x => typeof x === 'string');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── Sort ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tbl-head').addEventListener('click', e => {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    render();
  });
});

function updateSortHeaders() {
  document.querySelectorAll('#tbl-head th').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
  });
}

function sortValue(item, col) {
  switch (col) {
    case 'nombre':    return (item.nombre    || '').toLowerCase();
    case 'tipo':      return (item.tipo      || '').toLowerCase();
    case 'categoria': return (item.categoria || '').toLowerCase();
    case 'calidad':   return (item.calidad   || '').toLowerCase();
    case 'unidad':    return (item.unidad    || '').toLowerCase();
    case 'precio':       return parseFloat(item.precioEst) || 0;
    case 'lastUpdated':  return item.lastUpdated || '';
    case 'notas':        return (item.notas     || '').toLowerCase();
    default:          return '';
  }
}

function render() {
  updateSortHeaders();
  const term  = document.getElementById('srch').value.toLowerCase().trim();

  let items = DATA.slice();

  if (term) {
    items = items.filter(d =>
      (d.nombre||'').toLowerCase().includes(term) ||
      (d.notas||'').toLowerCase().includes(term) ||
      (d.tipo||'').toLowerCase().includes(term) ||
      (d.categoria||'').toLowerCase().includes(term)
    );
  }

  items.sort((a, b) => {
    const av = sortValue(a, sortCol);
    const bv = sortValue(b, sortCol);
    if (typeof av === 'number') return (av - bv) * sortDir;
    return av.localeCompare(bv, 'es') * sortDir;
  });

  const tbody    = document.getElementById('tbl-body');
  const empty    = document.getElementById('empty-state');
  const countTag = document.getElementById('count-tag');

  if (!items.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    countTag.textContent = '';
    return;
  }
  empty.style.display = 'none';
  countTag.textContent = `${items.length} concepto${items.length !== 1 ? 's' : ''}`;

  tbody.innerHTML = items.map(d => {
    const age = d.lastUpdated ? daysSince(d.lastUpdated) : null;
    const dateCls = age === null ? '' : age > 180 ? 'color:var(--red);font-weight:600;' : age > 60 ? 'color:var(--amber);' : 'color:var(--subtext);';
    return `
    <tr class="clickable" onclick="openModal('${d.id}')">
      <td>
        ${esc(d.nombre)}
        ${d.categoria ? `<div style="font-size:11px;color:var(--subtext);margin-top:2px;">${esc(d.categoria)}</div>` : ''}
      </td>
      <td>${esc(d.tipo||'—')}</td>
      <td>${esc(d.calidad||'—')}</td>
      <td class="num">${fmt(d.precioEst)}</td>
      <td style="font-size:12px;${dateCls}">${d.lastUpdated||'—'}</td>
      <td>${esc(d.notas||'—')}</td>
    </tr>`;
  }).join('');
}

// ── Modal item management ───────────────────────────────────────────
function setModalSelect(id, val) {
  const el = document.getElementById(id);
  el.value = val||'';
  el._ssSync?.();
}

function openModal(id) {
  document.getElementById('mod-overlay').style.display = 'flex';
  const item = id ? DATA.find(x => x.id === id) : null;

  document.getElementById('btn-delete-item').style.display = item ? 'block' : 'none';

  if (!item) {
    document.getElementById('mod-title').textContent = 'Nuevo Concepto de Madera';
    document.getElementById('m-id').value = '';
    document.getElementById('m-nombre').value = '';
    document.getElementById('m-precio').value = '';
    document.getElementById('m-notas').value = '';
    setModalSelect('m-tipo', TIPOS[0]||'');
    setModalSelect('m-categoria', CATS[0]||'');
    setModalSelect('m-calidad', QUALS[0]||'');
    return;
  }

  document.getElementById('mod-title').textContent = 'Editar Concepto de Madera';
  document.getElementById('m-id').value = item.id;
  document.getElementById('m-nombre').value = item.nombre||'';
  document.getElementById('m-precio').value = item.precioEst||'';
  document.getElementById('m-notas').value = item.notas||'';
  setModalSelect('m-tipo', item.tipo||'');
  setModalSelect('m-categoria', item.categoria||'');
  setModalSelect('m-calidad', item.calidad||'');
}

function closeModal() {
  document.getElementById('mod-overlay').style.display = 'none';
}

async function saveItem() {
  const id = document.getElementById('m-id').value;
  const nombre = document.getElementById('m-nombre').value.trim();
  if (!nombre) { alert('El nombre es requerido.'); return; }

  let item = id ? DATA.find(x => x.id === id) : null;
  if (!item) item = { id: crypto.randomUUID() };

  item.nombre = nombre;
  item.tipo = document.getElementById('m-tipo').value;
  item.categoria = document.getElementById('m-categoria').value;
  item.calidad = document.getElementById('m-calidad').value;
  item.unidad = unitForFormat(item.categoria);
  item.precioEst = parseFloat(document.getElementById('m-precio').value) || 0;
  item.notas = document.getElementById('m-notas').value.trim();
  item.lastUpdated = todayStr();

  const payload = { ...item };
  await window.parent.setDocumentInFirebase(COL, item.id, payload);

  // Sync locally
  if (window.parent?.DB_STATE) {
    if (!window.parent.DB_STATE[COL]) window.parent.DB_STATE[COL] = [];
    const idx = window.parent.DB_STATE[COL].findIndex(x => (x.id || x._id) === item.id);
    if (idx >= 0) window.parent.DB_STATE[COL][idx] = { ...item };
    else window.parent.DB_STATE[COL].push({ ...item });
  }

  const existIdx = DATA.findIndex(x => x.id === item.id);
  if (existIdx >= 0) DATA[existIdx] = item;
  else DATA.push(item);

  closeModal();
  render();
  toast('Concepto guardado correctamente.');
}

async function deleteItem() {
  const id = document.getElementById('m-id').value;
  const item = DATA.find(x => x.id === id);
  if (!id || !item) return;

  async function doDelete() {
    await window.parent.deleteDocumentFromFirebase(COL, id);
    if (window.parent?.DB_STATE?.[COL]) {
      window.parent.DB_STATE[COL] = window.parent.DB_STATE[COL].filter(x => (x.id || x._id) !== id);
    }
    DATA = DATA.filter(x => x.id !== id);
    closeModal();
    render();
    toast('Concepto eliminado.');
  }

  if (window.parent?.showConfirm) {
    window.parent.showConfirm(
      'Eliminar concepto',
      `¿Eliminar "${item.nombre}"?\nEsta acción no se puede deshacer.`,
      'Eliminar', 'btn-red',
      doDelete
    );
  } else if (confirm(`¿Eliminar "${item.nombre}"?`)) {
    doDelete();
  }
}

function initSelects() {
  function initSel(id, list) {
    const el = document.getElementById(id);
    el.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
    if (el._ssInit) el._ssRefresh(); else SearchableSelect.init(el);
  }

  initSel('m-tipo',      TIPOS);
  initSel('m-categoria', CATS);
  initSel('m-calidad',   QUALS);
}

async function init() {
  const p = window.parent;

  await Promise.all([
    window.DB.query('wood_types'),
    window.DB.query('wood_formats'),
    window.DB.query('wood_quality'),
  ]);

  const DEFAULTS = {
    wood_types:   ['Pino','Cedro','Parota','Encino','Mezquite','Fresno','Caoba','Nogal','Hule'],
    wood_formats: ['Tabla','Tablón','Tabloncillo','Duela','Viga','Cuartón','Triplay','MDF','Deck'],
    wood_quality: ['Extra','Primera','Segunda','Tercera'],
  };
  for (const [key, vals] of Object.entries(DEFAULTS)) {
    if (!getList(key).length && p?.setDocumentInFirebase)
      p.setDocumentInFirebase(key, 'main', { list: vals });
  }

  TIPOS = getList('wood_types')   || DEFAULTS.wood_types;
  CATS  = getList('wood_formats').map(x => typeof x === 'object' ? x.name : x).filter(Boolean) || DEFAULTS.wood_formats;
  QUALS = getList('wood_quality') || DEFAULTS.wood_quality;
  buildFormatUnitMap();

  initSelects();

  if (p?.DB_STATE) delete p.DB_STATE[COL];
  if (p?.cargar_coleccion) await p.cargar_coleccion(COL);
  const raw = await window.DB.query(COL, {});
  DATA = raw.map(d => ({ ...d, id: d.id || d._id })).filter(d => d.id);

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
