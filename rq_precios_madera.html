<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precios de Madera — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.hdr { position: sticky; top: 0; z-index: 100; background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hdr-title { font-size: 18px; font-weight: 800; white-space: nowrap; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); align-items: center; }
.filters::-webkit-scrollbar { display: none; }
.search-box { display: flex; align-items: center; background: var(--mantle); border: 1px solid var(--surface0); border-radius: 8px; padding: 6px 12px; width: 220px; gap: 8px; flex-shrink: 0; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-size: 13px; font-family: inherit; }
.filter-select { padding: 8px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; font-family: inherit; transition: border-color .15s; }
.filter-select:focus { border-color: var(--blue); }

.main { padding: 16px 20px; }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.table-wrap { overflow-x: auto; width: 100%; }
.pm-table { width: 100%; border-collapse: collapse; }
.pm-table th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; }
.pm-table td { padding: 11px 14px; vertical-align: middle; border-bottom: 1px solid var(--crust); font-size: 13px; }
.pm-table tbody tr:hover { background: var(--surface0); }
.pm-table tr:last-child td { border-bottom: none; }

.cat-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--surface0); color: var(--subtext); white-space: nowrap; }

/* Inline edit */
.editable { cursor: pointer; }
.editable:hover { text-decoration: underline dotted; }
.inline-inp { padding: 4px 8px; background: var(--base); border: 1px solid var(--blue); border-radius: 6px; font-size: 13px; font-family: inherit; color: var(--text); outline: none; width: 100%; }
.inline-inp.num { width: 100px; text-align: right; }
.inline-sel { padding: 4px 8px; background: var(--base); border: 1px solid var(--blue); border-radius: 6px; font-size: 13px; font-family: inherit; color: var(--text); outline: none; }

.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.pm-table tbody tr:hover .row-actions { opacity: 1; }
.act-btn { padding: 3px 8px; font-size: 11px; font-weight: 700; background: var(--surface0); border: 1px solid var(--crust); border-radius: 5px; cursor: pointer; color: var(--subtext); white-space: nowrap; transition: .12s; }
.act-btn:hover { border-color: var(--blue); color: var(--blue); }
.act-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.act-btn.save { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

.count-tag { font-size: 12px; color: var(--subtext); font-weight: 600; padding: 6px 2px; display: block; }

/* Modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.overlay.open { display: flex; }
.modal { background: var(--mantle); border: 1px solid var(--crust); border-radius: 14px; width: 100%; max-width: 460px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal-title { font-size: 16px; font-weight: 800; }
.modal-field { display: flex; flex-direction: column; gap: 4px; }
.modal-field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; letter-spacing: .04em; }
.modal-input { padding: 9px 10px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-family: inherit; width: 100%; font-size: 13px; height: 40px; outline: none; }
.modal-input:focus { border-color: var(--blue); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div class="hdr-title">Precios de Madera</div>
  </div>
  <button class="btn btn-green" onclick="openModal()">+ Agregar</button>
</div>

<div class="filters">
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;flex-shrink:0;">🔍</span>
    <input type="text" id="srch" placeholder="Buscar…" oninput="render()">
  </div>
  <select id="cat-filter" class="filter-select" onchange="render()">
    <option value="all">Todas las categorías</option>
    <option value="Madera Maciza">Madera Maciza</option>
    <option value="MDF">MDF</option>
    <option value="Triplay">Triplay</option>
    <option value="Tablón">Tablón</option>
    <option value="Panel">Panel</option>
    <option value="Otro">Otro</option>
  </select>
  <select id="unit-filter" class="filter-select" onchange="render()">
    <option value="all">Todas las unidades</option>
    <option value="pt">pt (pie tabla)</option>
    <option value="lámina">lámina</option>
    <option value="m²">m²</option>
    <option value="pieza">pieza</option>
  </select>
</div>

<div class="main">
  <div class="card">
    <div class="table-wrap">
      <table class="pm-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Unidad</th>
            <th>Precio Est.</th>
            <th>Notas</th>
            <th style="width:80px;"></th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div id="empty-state" style="display:none; text-align:center; padding:48px 24px; color:var(--subtext);">
      <div style="font-size:28px; margin-bottom:8px;">🪵</div>
      <div style="font-size:14px; font-weight:600;">Sin resultados</div>
    </div>
  </div>
  <span class="count-tag" id="count-tag"></span>
</div>

<!-- Modal agregar -->
<div class="overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="modal-title">Agregar precio</div>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--subtext);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div class="modal-field">
      <label>Nombre</label>
      <input class="modal-input" id="m-nombre" type="text" placeholder="Ej: Cedro Primera, MDF 15mm…" onkeydown="if(event.key==='Enter') saveModal()">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Categoría</label>
        <select class="modal-input" id="m-cat">
          <option value="Madera Maciza">Madera Maciza</option>
          <option value="MDF">MDF</option>
          <option value="Triplay">Triplay</option>
          <option value="Tablón">Tablón</option>
          <option value="Panel">Panel</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Unidad</label>
        <select class="modal-input" id="m-unidad">
          <option value="pt">pt (pie tabla)</option>
          <option value="lámina">lámina</option>
          <option value="m²">m²</option>
          <option value="pieza">pieza</option>
        </select>
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Precio estimado ($)</label>
        <input class="modal-input" id="m-precio" type="number" min="0" step="1" placeholder="0" onkeydown="if(event.key==='Enter') saveModal()">
      </div>
      <div class="modal-field">
        <label>Notas</label>
        <input class="modal-input" id="m-notas" type="text" placeholder="Opcional…" onkeydown="if(event.key==='Enter') saveModal()">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script src="db.js"></script>
<script>
const COL = 'wood_price_catalog';
let DATA = [];
let editingId = null;

function fmt(n) { return '$' + (parseFloat(n)||0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  const term = document.getElementById('srch').value.toLowerCase().trim();
  const catF  = document.getElementById('cat-filter').value;
  const unitF = document.getElementById('unit-filter').value;

  let items = DATA.filter(d => {
    if (catF  !== 'all' && (d.categoria||'Otro') !== catF)  return false;
    if (unitF !== 'all' && d.unidad !== unitF) return false;
    if (term && !(d.nombre||'').toLowerCase().includes(term) && !(d.notas||'').toLowerCase().includes(term) && !(d.categoria||'').toLowerCase().includes(term)) return false;
    return true;
  });

  const tbody = document.getElementById('tbl-body');
  const empty = document.getElementById('empty-state');
  const countTag = document.getElementById('count-tag');

  if (!items.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    countTag.textContent = '';
    return;
  }
  empty.style.display = 'none';
  countTag.textContent = `${items.length} concepto${items.length !== 1 ? 's' : ''}`;

  tbody.innerHTML = items.map(d => {
    const isEditing = editingId === d.id;
    if (isEditing) {
      return `<tr id="row-${d.id}" style="background:var(--base);">
        <td><input class="inline-inp" id="e-nombre" value="${esc(d.nombre)}" placeholder="Nombre"></td>
        <td><select class="inline-sel" id="e-cat">
          ${['Madera Maciza','MDF','Triplay','Tablón','Panel','Otro'].map(c=>`<option${(d.categoria||'Otro')===c?' selected':''}>${c}</option>`).join('')}
        </select></td>
        <td><select class="inline-sel" id="e-unidad">
          ${['pt','lámina','m²','pieza'].map(u=>`<option${d.unidad===u?' selected':''}>${u}</option>`).join('')}
        </select></td>
        <td><input class="inline-inp num" id="e-precio" type="number" min="0" step="1" value="${d.precioEst||0}"></td>
        <td><input class="inline-inp" id="e-notas" value="${esc(d.notas)}" placeholder="Notas…"></td>
        <td><div class="row-actions" style="opacity:1;">
          <button class="act-btn save" onclick="commitEdit('${d.id}')">Guardar</button>
          <button class="act-btn" onclick="cancelEdit()">✕</button>
        </div></td>
      </tr>`;
    }
    return `<tr id="row-${d.id}">
      <td style="font-weight:700;">${esc(d.nombre)}</td>
      <td><span class="cat-badge">${esc(d.categoria||'Otro')}</span></td>
      <td style="color:var(--subtext);font-size:12px;font-weight:600;">${esc(d.unidad||'pt')}</td>
      <td style="font-weight:700;">${fmt(d.precioEst)}</td>
      <td style="color:var(--subtext);font-size:12px;">${esc(d.notas||'—')}</td>
      <td><div class="row-actions">
        <button class="act-btn" onclick="startEdit('${d.id}')">Editar</button>
        <button class="act-btn danger" onclick="deleteEntry('${d.id}')">🗑</button>
      </div></td>
    </tr>`;
  }).join('');
}

function startEdit(id) {
  editingId = id;
  render();
  document.getElementById('e-nombre')?.focus();
}

function cancelEdit() {
  editingId = null;
  render();
}

async function commitEdit(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  d.nombre    = document.getElementById('e-nombre').value.trim() || d.nombre;
  d.categoria = document.getElementById('e-cat').value;
  d.unidad    = document.getElementById('e-unidad').value;
  d.precioEst = parseFloat(document.getElementById('e-precio').value) || 0;
  d.notas     = document.getElementById('e-notas').value.trim();
  await window.DB.update(COL, id, { nombre: d.nombre, categoria: d.categoria, unidad: d.unidad, precioEst: d.precioEst, notas: d.notas });
  editingId = null;
  DATA.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));
  render();
}

async function deleteEntry(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  if (!await window.parent.showConfirm('Eliminar precio', `¿Eliminar "${d.nombre}"?`, 'Eliminar', 'btn-red')) return;
  await window.DB.delete(COL, id);
  DATA = DATA.filter(x => x.id !== id);
  render();
}

function openModal() {
  document.getElementById('m-nombre').value = '';
  document.getElementById('m-precio').value = '';
  document.getElementById('m-notas').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('m-nombre').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

async function saveModal() {
  const nombre    = document.getElementById('m-nombre').value.trim();
  const categoria = document.getElementById('m-cat').value;
  const unidad    = document.getElementById('m-unidad').value;
  const precioEst = parseFloat(document.getElementById('m-precio').value) || 0;
  const notas     = document.getElementById('m-notas').value.trim();
  if (!nombre) { document.getElementById('m-nombre').focus(); return; }

  const id = nombre.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,40) + '-' + Date.now().toString(36);
  const entry = { id, nombre, categoria, unidad, precioEst, notas };
  await window.DB.add(COL, entry, id);
  DATA.push(entry);
  DATA.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));
  closeModal();
  render();
}

async function init() {
  const p = window.parent;
  if (p?.DB_STATE) delete p.DB_STATE[COL];
  if (p?.cargar_coleccion) await p.cargar_coleccion(COL);
  DATA = await window.DB.query(COL, {});
  DATA.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
