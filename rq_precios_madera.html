<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precios de Madera — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); align-items: center; }
.filters::-webkit-scrollbar { display: none; }
.search-box { display: flex; align-items: center; background: var(--mantle); border: 1px solid var(--surface0); border-radius: 8px; padding: 6px 12px; width: 220px; gap: 8px; flex-shrink: 0; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-size: 13px; font-family: inherit; }
.filter-select { padding: 8px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; font-family: inherit; transition: border-color .15s; }
.filter-select:focus { border-color: var(--blue); }

.main { padding: 16px 20px; }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.table-wrap { overflow-x: auto; width: 100%; }
.pm-table { width: 100%; border-collapse: collapse; }
.pm-table th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; }
.pm-table td { padding: 8px 10px; vertical-align: middle; border-bottom: 1px solid var(--crust); font-size: 13px; }
.pm-table tbody tr:last-child td { border-bottom: none; }

.inline-inp { padding: 6px 8px; background: var(--base); border: 1px solid var(--surface1); border-radius: 6px; font-size: 13px; font-family: inherit; color: var(--text); outline: none; width: 100%; }
.inline-inp:focus { border-color: var(--blue); }
.inline-inp.num { width: 90px; text-align: right; }

.act-btn { padding: 3px 8px; font-size: 11px; font-weight: 700; background: var(--surface0); border: 1px solid var(--crust); border-radius: 5px; cursor: pointer; color: var(--subtext); white-space: nowrap; transition: .12s; }
.act-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

.count-tag { font-size: 12px; color: var(--subtext); font-weight: 600; padding: 6px 2px; display: block; }

/* Edit mode row highlight */
.edit-row td { background: var(--base); }
.edit-row td:first-child { border-left: 3px solid var(--blue); }

/* Toast */
#toast-wrap { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast-msg { background: var(--green); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Precios de Madera</h2>
  </div>
  <div id="header-actions"></div>
</div>

<div class="filters">
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;flex-shrink:0;">🔍</span>
    <input type="text" id="srch" placeholder="Buscar…" oninput="render()">
  </div>
  <select id="tipo-filter" class="filter-select" onchange="render()">
    <option value="all">Todas las especies</option>
  </select>
  <select id="cat-filter" class="filter-select" onchange="render()">
    <option value="all">Todos los formatos</option>
  </select>
  <select id="unit-filter" class="filter-select" onchange="render()">
    <option value="all">Todas las unidades</option>
  </select>
</div>

<div class="main">
  <div class="card">
    <div class="table-wrap">
      <table class="pm-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Formato</th>
            <th>Calidad</th>
            <th>Unidad</th>
            <th>Precio Est.</th>
            <th>Notas</th>
            <th style="width:40px;"></th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div id="empty-state" style="display:none; text-align:center; padding:48px 24px; color:var(--subtext);">
      <div style="font-size:28px; margin-bottom:8px;">🪵</div>
      <div style="font-size:14px; font-weight:600;">Sin resultados</div>
    </div>
  </div>
  <span class="count-tag" id="count-tag"></span>
</div>

<div id="toast-wrap"></div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
const COL = 'wood_price_catalog';

let TIPOS = [];
let CATS  = [];
let QUALS = [];
let UNITS = [];
let DATA      = [];
let editMode  = false;

function fmt(n) { return '$' + (parseFloat(n)||0).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function tipoOpts(sel)  { return `<option value=""${!sel?' selected':''}>— N/A</option>` + TIPOS.map(v => `<option${sel===v?' selected':''}>${v}</option>`).join(''); }
function catOpts(sel)   { return `<option value=""${!sel?' selected':''}>— N/A</option>` + CATS .map(v => `<option${sel===v?' selected':''}>${v}</option>`).join(''); }
function qualOpts(sel)  { return `<option value=""${!sel?' selected':''}>— N/A</option>` + QUALS.map(v => `<option${sel===v?' selected':''}>${v}</option>`).join(''); }
function unitOpts(sel)  { return `<option value=""${!sel?' selected':''}>— N/A</option>` + UNITS.map(v => `<option${sel===v?' selected':''}>${v}</option>`).join(''); }

function getList(key) {
  const raw = window.parent?.DB_STATE?.[key] || window.DB.get()[key] || [];
  return raw[0]?.list || raw.filter(x => typeof x === 'string');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function updateHeader() {
  const el = document.getElementById('header-actions');
  if (editMode) {
    el.innerHTML = `
      <button class="btn" onclick="cancelEditMode()">Cancelar</button>
      <button class="btn btn-blue" onclick="addRow()">+ Agregar fila</button>
      <button class="btn btn-green" onclick="saveAll()">Guardar cambios</button>
    `;
  } else {
    el.innerHTML = `<button class="btn btn-blue" onclick="enterEditMode()">✎ Editar lista</button>`;
  }
}

function render() {
  const term  = document.getElementById('srch').value.toLowerCase().trim();
  const tipoF = document.getElementById('tipo-filter').value;
  const catF  = document.getElementById('cat-filter').value;
  const unitF = document.getElementById('unit-filter').value;

  const items = DATA.filter(d => {
    if (d._isNew) return true; // siempre mostrar filas nuevas
    if (tipoF !== 'all' && (d.tipo||'') !== tipoF) return false;
    if (catF  !== 'all' && (d.categoria||'') !== catF) return false;
    if (unitF !== 'all' && (d.unidad||'') !== unitF) return false;
    if (term && !(d.nombre||'').toLowerCase().includes(term) &&
                !(d.notas||'').toLowerCase().includes(term) &&
                !(d.tipo||'').toLowerCase().includes(term) &&
                !(d.categoria||'').toLowerCase().includes(term)) return false;
    return true;
  });

  const tbody    = document.getElementById('tbl-body');
  const empty    = document.getElementById('empty-state');
  const countTag = document.getElementById('count-tag');

  if (!items.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    countTag.textContent = '';
    return;
  }
  empty.style.display = 'none';
  countTag.textContent = editMode ? '' : `${items.length} concepto${items.length !== 1 ? 's' : ''}`;

  if (editMode) {
    tbody.innerHTML = items.map(d => `
      <tr class="edit-row" data-id="${d.id}">
        <td><input class="inline-inp" id="e-nombre-${d.id}" value="${esc(d.nombre)}" placeholder="Nombre del concepto"></td>
        <td><select id="e-tipo-${d.id}" data-searchable>${tipoOpts(d.tipo||'')}</select></td>
        <td><select id="e-cat-${d.id}" data-searchable>${catOpts(d.categoria||'')}</select></td>
        <td><select id="e-calidad-${d.id}" data-searchable>${qualOpts(d.calidad||'')}</select></td>
        <td><select id="e-unidad-${d.id}" data-searchable>${unitOpts(d.unidad||'')}</select></td>
        <td><input class="inline-inp num" id="e-precio-${d.id}" type="number" min="0" step="1" value="${d.precioEst||0}"></td>
        <td><input class="inline-inp" id="e-notas-${d.id}" value="${esc(d.notas||'')}" placeholder="Notas…"></td>
        <td><button class="act-btn danger" data-action="delete" data-id="${d.id}">🗑</button></td>
      </tr>
    `).join('');

    // Inicializar SearchableSelect en todos los selects de la tabla
    document.querySelectorAll('#tbl-body select[data-searchable]').forEach(sel => SearchableSelect.init(sel));

  } else {
    tbody.innerHTML = items.map(d => `
      <tr data-id="${d.id}">
        <td style="font-weight:700;">${esc(d.nombre)}</td>
        <td style="color:var(--subtext);font-size:12px;">${esc(d.tipo||'—')}</td>
        <td style="color:var(--subtext);font-size:12px;">${esc(d.categoria||'—')}</td>
        <td style="color:var(--subtext);font-size:12px;">${esc(d.calidad||'—')}</td>
        <td style="color:var(--subtext);font-size:12px;font-weight:600;">${esc(d.unidad||'—')}</td>
        <td style="font-weight:700;">${fmt(d.precioEst)}</td>
        <td style="color:var(--subtext);font-size:12px;">${esc(d.notas||'—')}</td>
        <td></td>
      </tr>
    `).join('');
  }
}

// Event delegation para el botón de eliminar
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tbl-body').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action="delete"]');
    if (btn) deleteEntry(btn.dataset.id);
  });
});

function enterEditMode() {
  editMode = true;
  updateHeader();
  render();
}

function cancelEditMode() {
  DATA = DATA.filter(d => !d._isNew);
  editMode = false;
  cleanupSS();
  updateHeader();
  render();
}

function addRow() {
  const id = 'new-' + Date.now().toString(36);
  DATA.push({ id, _isNew: true, nombre: '', tipo: '', categoria: '', calidad: '', unidad: '', precioEst: 0, notas: '' });
  render();
  setTimeout(() => document.getElementById(`e-nombre-${id}`)?.focus(), 60);
}

async function saveAll() {
  const saves = [];

  for (const d of DATA) {
    const nombreEl = document.getElementById(`e-nombre-${d.id}`);
    if (!nombreEl) continue; // fila filtrada, no modificar

    const nombre = nombreEl.value.trim();
    if (d._isNew && !nombre) continue; // fila nueva vacía, ignorar

    d.nombre    = nombre || d.nombre;
    d.tipo      = document.getElementById(`e-tipo-${d.id}`)?.value     || '';
    d.categoria = document.getElementById(`e-cat-${d.id}`)?.value      || '';
    d.calidad   = document.getElementById(`e-calidad-${d.id}`)?.value  || '';
    d.unidad    = document.getElementById(`e-unidad-${d.id}`)?.value   || '';
    d.precioEst = parseFloat(document.getElementById(`e-precio-${d.id}`)?.value) || 0;
    d.notas     = document.getElementById(`e-notas-${d.id}`)?.value.trim() || '';
    delete d._isNew;

    const payload = { ...d };
    saves.push(window.parent.setDocumentInFirebase(COL, d.id, payload));
  }

  // Limpiar filas nuevas vacías que no se guardaron
  DATA = DATA.filter(d => !d._isNew);

  await Promise.all(saves);

  // Sincronizar DB_STATE
  if (window.parent?.DB_STATE) {
    if (!window.parent.DB_STATE[COL]) window.parent.DB_STATE[COL] = [];
    for (const d of DATA) {
      const idx = window.parent.DB_STATE[COL].findIndex(x => (x.id || x._id) === d.id);
      if (idx >= 0) window.parent.DB_STATE[COL][idx] = { ...d };
      else window.parent.DB_STATE[COL].push({ ...d });
    }
  }

  editMode = false;
  cleanupSS();
  DATA.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));
  updateHeader();
  render();
  toast(`${saves.length} precio${saves.length !== 1 ? 's' : ''} guardado${saves.length !== 1 ? 's' : ''}.`);
}

async function deleteEntry(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;

  if (!d._isNew) {
    const confirmed = await new Promise(resolve =>
      window.parent.showConfirm('Eliminar precio', `¿Eliminar "${d.nombre}"?`, 'Eliminar', 'btn-red',
        () => resolve(true), () => resolve(false))
    );
    if (!confirmed) return;
    await window.parent.deleteDocumentFromFirebase(COL, id);
    if (window.parent?.DB_STATE?.[COL])
      window.parent.DB_STATE[COL] = window.parent.DB_STATE[COL].filter(x => (x.id || x._id) !== id);
  }

  DATA = DATA.filter(x => x.id !== id);
  render();
}

function cleanupSS() {
  // Remover dropdowns huérfanos de SearchableSelect del body
  document.querySelectorAll('.ss-dropdown').forEach(el => el.remove());
}

function populateFilter(id, list, allLabel) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="all">${allLabel}</option>` +
    list.map(v => `<option value="${v}">${v}</option>`).join('');
}

async function init() {
  const p = window.parent;

  await Promise.all([
    window.DB.query('wood_types'),
    window.DB.query('wood_formats'),
    window.DB.query('wood_quality'),
    window.DB.query('concept_units'),
  ]);

  const DEFAULTS = {
    wood_types:    ['Pino','Cedro','Parota','Encino','Mezquite','Fresno','Caoba','Nogal','Hule'],
    wood_formats:  ['Tabla','Tablón','Tabloncillo','Duela','Viga','Cuartón','Triplay','MDF'],
    wood_quality:  ['Extra','Primera','Segunda','Tercera'],
    concept_units: ['pt','lámina','m²','pieza','pza','ml','kg'],
  };
  for (const [key, vals] of Object.entries(DEFAULTS)) {
    if (!getList(key).length && p?.setDocumentInFirebase)
      p.setDocumentInFirebase(key, 'main', { list: vals });
  }

  TIPOS = getList('wood_types')    || DEFAULTS.wood_types;
  CATS  = getList('wood_formats')  || DEFAULTS.wood_formats;
  QUALS = getList('wood_quality')  || DEFAULTS.wood_quality;
  UNITS = getList('concept_units') || DEFAULTS.concept_units;

  populateFilter('tipo-filter', TIPOS, 'Todas las especies');
  populateFilter('cat-filter',  CATS,  'Todos los formatos');
  populateFilter('unit-filter', UNITS, 'Todas las unidades');

  if (p?.DB_STATE) delete p.DB_STATE[COL];
  if (p?.cargar_coleccion) await p.cargar_coleccion(COL);
  const raw = await window.DB.query(COL, {});
  DATA = raw.map(d => ({ ...d, id: d.id || d._id })).filter(d => d.id);
  DATA.sort((a,b) => (a.nombre||'').localeCompare(b.nombre||'','es'));

  updateHeader();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
