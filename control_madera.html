<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Tablas — Carpintería Huayapam</title>
<style>
.hdr { position: sticky; top: 0; z-index: 100; background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hdr-title { font-size: 18px; font-weight: 800; }

.search-box { display: flex; align-items: center; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; padding: 8px 12px; width: 240px; gap: 8px; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-size: 13px; font-family: inherit; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); }
.filters::-webkit-scrollbar { display: none; }
.filter-select { padding: 8px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; font-family: inherit; }
.filter-select:focus { border-color: var(--blue); }

.main { padding: 16px 20px; }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.tbl-wrap { overflow-x: auto; width: 100%; }
.tbl { width: 100%; border-collapse: collapse; min-width: 760px; }
.tbl th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--crust); font-size: 13px; vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface0); cursor: pointer; }
.tbl tr:last-child td { border-bottom: none; }

.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.badge-verde { background: var(--green-bg); color: var(--green); }
.badge-aire  { background: var(--amber-bg); color: var(--amber); }
.badge-seco  { background: var(--blue-bg);  color: var(--blue); }

.td-hint { color: var(--subtext); font-size: 11px; font-weight: 600; display: block; margin-top: 2px; }
.id-text { font-family: monospace; font-size: 12px; font-weight: 700; }

</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="window.history.back()">← Volver</button>
    <div class="hdr-title">Almacén de Madera</div>
  </div>
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;flex-shrink:0;">🔍</span>
    <input type="text" placeholder="Buscar ID, especie…" autofocus>
  </div>
</div>

<div class="filters" style="display:flex; align-items:center;">
  <select id="filt-format" class="filter-select" onchange="renderWood()">
    <option value="all">Tipos de Pieza</option>
  </select>
  <select id="filt-species" class="filter-select" onchange="renderWood()">
    <option value="all">Todas las Especies</option>
  </select>
  <select id="filt-lote" class="filter-select" onchange="renderWood()">
    <option value="all">Todos los Lotes</option>
  </select>
  <select id="filt-quality" class="filter-select" onchange="renderWood()">
    <option value="all">Todas las Calidades</option>
  </select>
</div>

<div class="main">
  <div class="card">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>ID Tabla</th>
            <th>Lote</th>
            <th>Tipo Pieza</th>
            <th>Especie</th>
            <th>Dimensiones</th>
            <th>Volumen (PT)</th>
            <th>Calidad</th>
            <th>Ubicación</th>
            <th>Fecha Entr.</th>
          </tr>
        </thead>
        <tbody id="wood-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
  let inited = false;
  let STATE_LISTS = { formats: [], types: [], quality: [] };

  function initFilters(wood) {
    if(inited) return;
    inited = true;

    const lotes = new Set();
    wood.forEach(w => { if(w.lote) lotes.add(w.lote); });

    const extractList = raw => (Array.isArray(raw) && raw.length && raw[0]?.list) ? raw[0].list : (Array.isArray(raw) ? raw.filter(x => typeof x === 'string') : []);

    // Fall back to data-derived values if Firestore list is empty
    const formats  = extractList(STATE_LISTS.formats);
    const types    = extractList(STATE_LISTS.types).length  ? extractList(STATE_LISTS.types)   : [...new Set(wood.map(w => w.species).filter(Boolean))].sort();
    const quality  = extractList(STATE_LISTS.quality).length ? extractList(STATE_LISTS.quality) : [...new Set(wood.map(w => w.quality).filter(Boolean))].sort();

    const fmtSel  = document.getElementById('filt-format');
    const spSel   = document.getElementById('filt-species');
    const lotSel  = document.getElementById('filt-lote');
    const qualSel = document.getElementById('filt-quality');

    fmtSel.innerHTML  = '<option value="all">Tipos de Pieza</option>'        + formats.map(f => `<option value="${f}">${f}</option>`).join('');
    spSel.innerHTML   = '<option value="all">Todas las Especies</option>'     + types.map(s => `<option value="${s}">${s}</option>`).join('');
    lotSel.innerHTML  = '<option value="all">Todos los Lotes</option>'        + Array.from(lotes).sort().map(s => `<option value="${s}">${s}</option>`).join('');
    qualSel.innerHTML = '<option value="all">Todas las Calidades</option>'    + quality.map(s => `<option value="${s}">${s}</option>`).join('');

    [fmtSel, spSel, lotSel, qualSel].forEach(sel => SearchableSelect.init(sel));
  }

  let STATE_WOOD = [];

  async function init() {
    const [inv, legacyWood, woodFormats, woodTypes, woodQuality] = await Promise.all([
      window.DB.query("inventory", { category: "madera" }),
      window.DB.query("wood"),
      window.DB.query("wood_formats"),
      window.DB.query("wood_types"),
      window.DB.query("wood_quality"),
      window.DB.query("wood_locations"),
    ]);
    STATE_WOOD = inv && inv.length > 0 ? inv : legacyWood;
    STATE_LISTS = { formats: woodFormats || [], types: woodTypes || [], quality: woodQuality || [] };
    renderWood();
  }
  
  document.addEventListener('DOMContentLoaded', init);

  function renderWood() {
    let wood = STATE_WOOD || [];
    
    initFilters(wood);
    
    const fFmt = document.getElementById('filt-format').value;
    const fSp = document.getElementById('filt-species').value;
    const fLot = document.getElementById('filt-lote').value;
    const fQual = document.getElementById('filt-quality').value;
    
    if(fFmt !== 'all') wood = wood.filter(w => w.format === fFmt);
    if(fSp !== 'all') wood = wood.filter(w => w.species === fSp);
    if(fLot !== 'all') wood = wood.filter(w => w.lote === fLot);
    if(fQual !== 'all') wood = wood.filter(w => w.quality === fQual);

    // Render Table
    const tbody = document.getElementById('wood-body');
    tbody.innerHTML = wood.map(w => {
      let bClass = 'badge-verde';
      const q = w.quality ? w.quality.toLowerCase() : '';
      if(q.includes('primera')) bClass = 'badge-seco';
      else if(q.includes('segunda')) bClass = 'badge-aire';
      
      const entryDate = w.entryDate || '-';

      return `
        <tr>
          <td><span class="id-text">${w.code}</span></td>
          <td><span class="td-hint">${w.lote}</span></td>
          <td>${w.format || 'Tabla'}</td>
          <td>${w.species}</td>
          <td>${w.t}" × ${w.w}" × ${w.l}'</td>
          <td class="pt-val">${w.pt ? w.pt.toFixed(2) : '-'}</td>
          <td><span class="badge ${bClass}">${w.quality || '-'}</span></td>
          <td>${w.location}</td>
          <td style="color:var(--subtext);font-size:12px;">${entryDate}</td>
        </tr>
      `;
    }).join('');
  }
</script>
</body>
</html>
