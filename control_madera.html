<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Tablas — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --green: #40a02b; --green-bg: rgba(64,160,43,0.15);
  --amber: #df8e1d; --amber-bg: rgba(223,142,29,0.15);
  --blue: #1e66f5; --blue-bg: rgba(30,102,245,0.15);
  --radius: 10px; --radius-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --green: #a6da95; --green-bg: rgba(166,218,149,0.15);
    --amber: #f9e2af; --amber-bg: rgba(249,226,175,0.15);
    --blue: #8caaee; --blue-bg: rgba(140,170,238,0.15);
  }
}

body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--mantle); border-bottom: 1px solid var(--crust);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.header-title { font-size: 18px; font-weight: 800; color: var(--text); }
.header-actions { display: flex; gap: 12px; }

.search-box { display: flex; align-items: center; background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 6px 12px; min-width: 240px; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-family: inherit; font-size: 13px; margin-left: 8px; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 16px 24px; background: var(--base); border-bottom: 1px solid var(--crust); }
.filters::-webkit-scrollbar { display: none; }
.filter-select { padding: 8px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; transition: 0.15s; }
.filter-select:focus { border-color: var(--blue); }
.filter-btn { padding: 6px 14px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--subtext); cursor: pointer; white-space: nowrap; transition: all .15s; }
.filter-btn:hover { background: var(--surface0); color: var(--text); }
.filter-btn.act { background: var(--text); color: var(--base); border-color: var(--text); }

.main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 100px; }

/* Dashboard Cards */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.dash-card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.dc-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--subtext); }
.dc-val { font-size: 28px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.dc-sub { font-size: 12px; font-weight: 600; color: var(--subtext); display: flex; align-items: center; gap: 6px; }
.dc-sub span { color: var(--green); }

/* Main Table */
.data-card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }

.table-wrap { overflow-x: auto; scrollbar-width: none; width: 100%; }
.table-wrap::-webkit-scrollbar { display: none; }
.madera-table { width: 100%; border-collapse: collapse; min-width: 800px; }
.madera-table th {
  text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 800; text-transform: uppercase;
  color: var(--subtext); border-bottom: 2px solid var(--crust); letter-spacing: .05em; background: var(--surface0);
}
.madera-table td { padding: 14px 16px; vertical-align: middle; border-bottom: 1px solid var(--crust); font-size: 13px; font-weight: 500; }
.madera-table tr:hover { background: var(--surface0); cursor: pointer; }
.madera-table tr:last-child td { border-bottom: none; }

.badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing:.04em; white-space: nowrap; }
.badge-verde { background: var(--green-bg); color: var(--green); }
.badge-aire { background: var(--amber-bg); color: var(--amber); }
.badge-seco { background: var(--blue-bg); color: var(--blue); }

.pt-val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); }
.td-hint { color: var(--subtext); font-size: 11px; font-weight: 600; display: block; margin-top: 2px; }
.id-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; }

</style>
</head>
<body>

<div class="header">
  <div style="display:flex; align-items:center; gap:16px;">
    <button onclick="if(window.parent && window.parent.openModule){window.parent.openModule('almacen_hub.html','Portal Almacén')}else{window.history.back()}" style="background:none;border:none;font-size:14px;font-weight:700;color:var(--subtext);cursor:pointer;padding:4px 8px;border-radius:6px; transition:0.15s;" onmouseover="this.style.background='var(--surface0)';this.style.color='var(--text)';" onmouseout="this.style.background='none';this.style.color='var(--subtext)';">← Volver</button>
    <div class="header-title">Almacén de Madera</div>
  </div>
  <div class="header-actions">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" placeholder="Escanear o buscar ID..." autofocus>
    </div>
  </div>
</div>

<div class="filters" style="display:flex; align-items:center;">
  <select id="filt-format" class="filter-select" onchange="renderWood()">
    <option value="all">Tipos de Pieza</option>
  </select>
  <select id="filt-species" class="filter-select" onchange="renderWood()">
    <option value="all">Todas las Especies</option>
  </select>
  <select id="filt-lote" class="filter-select" onchange="renderWood()">
    <option value="all">Todos los Lotes</option>
  </select>
  <select id="filt-quality" class="filter-select" onchange="renderWood()">
    <option value="all">Todas las Calidades</option>
  </select>
</div>

<div class="main">

  <div class="data-card">
    <div class="table-wrap">
      <table class="madera-table">
        <thead>
          <tr>
            <th>ID Tabla</th>
            <th>Lote</th>
            <th>Tipo Pieza</th>
            <th>Especie</th>
            <th>Dimensiones</th>
            <th>Volumen (PT)</th>
            <th>Calidad</th>
            <th>Ubicación</th>
            <th>Fecha Entr.</th>
          </tr>
        </thead>
        <tbody id="wood-body">
          <!-- Rendered by JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="db.js"></script>
<script>
  let inited = false;
  function initFilters(wood) {
    if(inited) return;
    const species = new Set();
    const lotes = new Set();
    const qualities = new Set();
    
    wood.forEach(w => {
      if(w.species) species.add(w.species);
      if(w.lote) lotes.add(w.lote);
      if(w.quality) qualities.add(w.quality);
    });
    
    const d = window.DB.get();
    document.getElementById('filt-format').innerHTML = '<option value="all">Tipos de Pieza</option>' +
       (d.wood_formats || []).map(f => `<option value="${f}">${f}</option>`).join('');

    document.getElementById('filt-species').innerHTML = '<option value="all">Todas las Especies</option>' + 
      Array.from(species).map(s => `<option value="${s}">${s}</option>`).join('');
      
    document.getElementById('filt-lote').innerHTML = '<option value="all">Todos los Lotes</option>' + 
      Array.from(lotes).map(s => `<option value="${s}">${s}</option>`).join('');
      
    document.getElementById('filt-quality').innerHTML = '<option value="all">Todas las Calidades</option>' + 
      Array.from(qualities).map(s => `<option value="${s}">${s}</option>`).join('');
      
    inited = true;
  }

  let STATE_WOOD = [];
  
  async function init() {
     const inv = await window.DB.query("inventory", { category: "madera" });
     // To handle legacy wood arrays seamlessly during transition:
     const legacyWood = await window.DB.query("wood");
     STATE_WOOD = inv && inv.length > 0 ? inv : legacyWood;
     renderWood();
  }
  
  document.addEventListener('DOMContentLoaded', init);

  function renderWood() {
    let wood = STATE_WOOD || [];
    
    initFilters(wood);
    
    const fFmt = document.getElementById('filt-format').value;
    const fSp = document.getElementById('filt-species').value;
    const fLot = document.getElementById('filt-lote').value;
    const fQual = document.getElementById('filt-quality').value;
    
    if(fFmt !== 'all') wood = wood.filter(w => w.format === fFmt);
    if(fSp !== 'all') wood = wood.filter(w => w.species === fSp);
    if(fLot !== 'all') wood = wood.filter(w => w.lote === fLot);
    if(fQual !== 'all') wood = wood.filter(w => w.quality === fQual);

    // Render Table
    const tbody = document.getElementById('wood-body');
    tbody.innerHTML = wood.map(w => {
      let bClass = 'badge-verde';
      const q = w.quality ? w.quality.toLowerCase() : '';
      if(q.includes('primera')) bClass = 'badge-seco';
      else if(q.includes('segunda')) bClass = 'badge-aire';
      
      const entryDate = w.entryDate || '-';

      return `
        <tr>
          <td><span class="id-text">${w.code}</span></td>
          <td><span class="td-hint">${w.lote}</span></td>
          <td>${w.format || 'Tabla'}</td>
          <td>${w.species}</td>
          <td>${w.t}" × ${w.w}" × ${w.l}'</td>
          <td class="pt-val">${w.pt ? w.pt.toFixed(2) : '-'}</td>
          <td><span class="badge ${bClass}">${w.quality || '-'}</span></td>
          <td>${w.location}</td>
          <td style="color:var(--subtext);font-size:12px;">${entryDate}</td>
        </tr>
      `;
    }).join('');
  }
</script>
</body>
</html>
