<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Tablas — Carpintería Huayapam</title>
<style>
.hdr { position: sticky; top: 0; z-index: 100; background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hdr-title { font-size: 18px; font-weight: 800; }

.search-box { display: flex; align-items: center; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; padding: 8px 12px; width: 240px; gap: 8px; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-size: 13px; font-family: inherit; }

.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); }
.filters::-webkit-scrollbar { display: none; }
.filter-select { padding: 8px 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; outline: none; font-family: inherit; }
.filter-select:focus { border-color: var(--blue); }

.main { padding: 16px 20px; }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.tbl-wrap { overflow-x: auto; width: 100%; }
.tbl { width: 100%; border-collapse: collapse; min-width: 760px; }
.tbl th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--crust); font-size: 13px; vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface0); cursor: pointer; }
.tbl tr:last-child td { border-bottom: none; }

.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.badge-verde { background: var(--green-bg); color: var(--green); }
.badge-aire  { background: var(--amber-bg); color: var(--amber); }
.badge-seco  { background: var(--blue-bg);  color: var(--blue); }

.td-hint { color: var(--subtext); font-size: 11px; font-weight: 600; display: block; margin-top: 2px; }
.col-code { font-family: monospace; font-size: 12px; font-weight: 700; white-space: nowrap; }
@media (max-width: 900px) { .col-loc, .col-date { display: none; } }
@media (max-width: 600px) { .col-cost { display: none; } }

</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div class="hdr-title">Inventario de Madera</div>
  </div>
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;flex-shrink:0;">🔍</span>
    <input type="text" placeholder="Buscar ID, especie…" autofocus>
  </div>
</div>

<div class="filters">
  <select id="filt-format" class="filter-select" onchange="renderWood()">
    <option value="all">Todos los formatos</option>
  </select>
  <select id="filt-species" class="filter-select" onchange="renderWood()">
    <option value="all">Todas las especies</option>
  </select>
  <select id="filt-stock" class="filter-select" onchange="renderWood()">
    <option value="all">Todo el stock</option>
    <option value="in">Con stock</option>
    <option value="out">Sin stock</option>
  </select>
</div>

<div class="main">
  <div class="card">
    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th class="col-code">Código</th>
            <th>Especie / Material</th>
            <th>Formato</th>
            <th>Dimensiones</th>
            <th>Stock</th>
            <th class="col-cost">Costo</th>
            <th class="col-date">Entrada</th>
            <th class="col-loc">Ubicación</th>
          </tr>
        </thead>
        <tbody id="wood-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="db.js"></script>
<script>
  let STATE_WOOD = [];

  async function init() {
    const p = window.parent;
    if (p?.DB_STATE) delete p.DB_STATE.inventory;
    if (p?.cargar_coleccion) await p.cargar_coleccion('inventory');

    STATE_WOOD = await window.DB.query('inventory', { category: 'madera' });
    STATE_WOOD.sort((a, b) => (a.species || a.name || '').localeCompare(b.species || b.name || '', 'es'));

    populateFilters();
    document.querySelector('.search-box input').addEventListener('input', renderWood);
    renderWood();
  }

  document.addEventListener('DOMContentLoaded', init);

  function populateFilters() {
    const formats  = [...new Set(STATE_WOOD.map(w => w.format).filter(Boolean))].sort((a,b) => a.localeCompare(b,'es'));
    const species  = [...new Set(STATE_WOOD.map(w => w.species).filter(Boolean))].sort((a,b) => a.localeCompare(b,'es'));

    const fmtSel = document.getElementById('filt-format');
    const spSel  = document.getElementById('filt-species');

    fmtSel.innerHTML = `<option value="all">Todos los formatos</option>` +
      formats.map(f => `<option value="${f}">${f}</option>`).join('');
    spSel.innerHTML  = `<option value="all">Todas las especies</option>` +
      species.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  function renderWood() {
    const term    = document.querySelector('.search-box input').value.toLowerCase().trim();
    const fFormat = document.getElementById('filt-format').value;
    const fSpec   = document.getElementById('filt-species').value;
    const fStock  = document.getElementById('filt-stock').value;

    let items = STATE_WOOD.filter(w => {
      if (fFormat !== 'all' && (w.format || '') !== fFormat) return false;
      if (fSpec   !== 'all' && (w.species || '') !== fSpec)  return false;
      const s = parseFloat(w.stock) || 0;
      if (fStock === 'in'  && s <= 0) return false;
      if (fStock === 'out' && s >  0) return false;
      if (term && !(w.species || w.name || '').toLowerCase().includes(term) &&
                  !(w.code || '').toLowerCase().includes(term) &&
                  !(w.lote || '').toLowerCase().includes(term)) return false;
      return true;
    });

    const tbody = document.getElementById('wood-body');
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--subtext);">Sin resultados</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(w => {
      const stock = parseFloat(w.stock) || 0;
      const min   = parseFloat(w.min)   || 0;
      const isLow = stock <= min && min > 0;

      let stockColor = '';
      if (stock === 0) stockColor = 'color: var(--red); font-weight: 700;';
      else if (isLow) stockColor = 'color: var(--amber); font-weight: 700;';
      else stockColor = 'font-weight: 600;';

      const dims = (w.t && w.w && w.l)
        ? `${w.t}"×${w.w}"×${w.l}'`
        : (w.name || '—');

      const sub = [w.lote ? `Lote: ${w.lote}` : '', w.quality || ''].filter(Boolean).join(' · ');

      return `<tr>
        <td class="col-code">${w.code || '—'}</td>
        <td>
          <div style="font-weight:700;">${w.species || w.name || '—'}</div>
          ${sub ? `<div class="td-hint">${sub}</div>` : ''}
        </td>
        <td style="font-size:12px;">${w.format || '—'}</td>
        <td style="font-size:12px;font-family:monospace;">${dims}</td>
        <td><span style="${stockColor}">${stock}</span></td>
        <td class="col-cost" style="font-weight:600;">$${(w.cost||0).toFixed(2)}</td>
        <td class="col-date" style="font-size:12px;color:var(--subtext);">${w.entryDate || w.lastPurchaseDate || '—'}</td>
        <td class="col-loc" style="font-size:12px;color:var(--subtext);">${w.location || '—'}</td>
      </tr>`;
    }).join('');
  }
</script>
</body>
</html>
