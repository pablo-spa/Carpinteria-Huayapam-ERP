<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.main-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
.m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }

/* Tabs system */
.tabs-hdr { display: flex; gap: 8px; border-bottom: 1px solid var(--crust); margin-bottom: 20px; padding-bottom: 2px; }
.tab-btn { background: transparent; border: none; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--subtext); cursor: pointer; border-radius: var(--radius); transition: all 0.15s; }
.tab-btn:hover { background: var(--surface0); color: var(--text); }
.tab-btn.active { background: var(--blue-bg); color: var(--blue-text); }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Form layout */
.inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px; align-items: end; }
.inline-form .form-group { margin-bottom: 0; }

.machine-card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.15s; }
.machine-card:hover { border-color: var(--surface1); }
.machine-card-hdr { display: flex; justify-content: space-between; align-items: flex-start; }
.machine-name { font-size: 15px; font-weight: 800; color: var(--text); }
.machine-info-row { display: flex; justify-content: space-between; font-size: 12px; border-top: 1px solid var(--crust); padding-top: 8px; }
.machine-info-lbl { color: var(--subtext); font-weight: 600; }
.machine-info-val { font-weight: 700; color: var(--text); }

.status-badge-click { cursor: pointer; transition: opacity 0.12s; }
.status-badge-click:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Bitácora de Mantenimiento</h2>
  </div>
</div>

<div class="main-scroll">
  <div class="tabs-hdr">
    <button class="tab-btn active" onclick="switchTab('tab-registros', this)">🛠️ Mantenimientos Preventivos y Correctivos</button>
    <button class="tab-btn" onclick="switchTab('tab-maquinaria', this)">⚙️ Estado de Maquinaria</button>
  </div>

  <!-- PESTAÑA: REGISTROS DE SERVICIOS -->
  <div id="tab-registros" class="tab-pane active">
    <!-- Formulario Mantenimiento Express -->
    <div class="inline-form">
      <div class="field">
        <label>Máquina / Equipo</label>
        <select id="m-maquina" class="form-control"></select>
      </div>
      <div class="field">
        <label>Tipo de Evento</label>
        <select id="m-tipo" class="form-control">
          <option value="preventivo">Mantenimiento Preventivo</option>
          <option value="correctivo">Mantenimiento Correctivo</option>
          <option value="calibracion">Calibración / Ajuste</option>
          <option value="inspeccion">Inspección de Seguridad</option>
        </select>
      </div>
      <div class="field" style="grid-column: span 2;">
        <label>Descripción / Tarea Realizada</label>
        <input type="text" id="m-desc" class="form-control" placeholder="Ej. Cambio de bandas, afilado de discos, recarga de extintor...">
      </div>
      <div class="field">
        <label>Costo ($)</label>
        <input type="number" id="m-costo" class="form-control" placeholder="0.00" step="50">
      </div>
      <div class="field">
        <label>Próximo Servicio</label>
        <input type="date" id="m-proximo" class="form-control">
      </div>
      <div>
        <button class="btn btn-blue" onclick="agregarRegistro()" style="width:100%; height:38px;">Registrar Servicio</button>
      </div>
    </div>

    <!-- Historial de mantenimientos en tabla unificada -->
    <div class="table-wrapper">
      <table class="tbl" id="tbl-mantenimientos">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Máquina / Equipo</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Costo</th>
            <th>Próximo Servicio</th>
            <th style="width:40px;"></th>
          </tr>
        </thead>
        <tbody id="tbody-mantenimientos">
          <!-- Dinámico -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- PESTAÑA: ESTADO DE MAQUINARIA -->
  <div id="tab-maquinaria" class="tab-pane">
    <div class="m-grid" id="maquinaria-grid">
      <!-- Dinámico -->
    </div>
  </div>
</div>

<script src="db.js"></script>
<script src="ui.js"></script>
<script>
let EQUIPOS = [];

async function init() {
  await Promise.all([
    window.DB.query('machine_logs'),
    window.DB.query('machine_states'),
  ]);

  const db = window.DB.get();
  
  // Cargar máquinas desde la lista de maquinaria o por defecto si no existen
  const systemListDoc = (db.maquinaria || []);
  EQUIPOS = systemListDoc.length ? systemListDoc.map(m => typeof m === 'string' ? { id: m, name: m } : m)
            : [
                { id: 'Sierra de Mesa', name: 'Sierra de Mesa Principal' },
                { id: 'Cepillo de Codo', name: 'Cepillo de Codo' },
                { id: 'Canteadora', name: 'Canteadora de Madera' },
                { id: 'Extintor Central', name: 'Extintor PQS Central' },
                { id: 'Torno de Madera', name: 'Torno Copiador' }
              ];

  populateSelects();
  renderRegistros();
  renderMaquinaria();
}

function populateSelects() {
  const mSel = document.getElementById('m-maquina');
  mSel.innerHTML = EQUIPOS.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

async function agregarRegistro() {
  const maquina = document.getElementById('m-maquina').value;
  const tipo = document.getElementById('m-tipo').value;
  const desc = document.getElementById('m-desc').value.trim();
  const costo = parseFloat(document.getElementById('m-costo').value) || 0;
  const proximo = document.getElementById('m-proximo').value;

  if (!desc) {
    toast('Por favor agrega una descripción del mantenimiento.', 'warn');
    return;
  }

  const nuevoRegistro = {
    id: crypto.randomUUID(),
    maquinaId: maquina,
    fecha: new Date().toISOString().slice(0, 10),
    tipo,
    descripcion: desc,
    costo,
    proximoServicio: proximo || ''
  };

  const db = window.DB.get();
  if (!db.machine_logs) db.machine_logs = [];
  db.machine_logs.unshift(nuevoRegistro);

  const batchOps = [{ type: 'set', col: 'machine_logs', id: nuevoRegistro.id, data: nuevoRegistro }];

  // Si fue un mantenimiento correctivo, forzar el estado en revisión temporalmente
  if (tipo === 'correctivo') {
    const mState = db.machine_states?.find(x => x.id === maquina) || { id: maquina };
    mState.estado = 'mantenimiento';
    if (!db.machine_states) db.machine_states = [];
    if (!db.machine_states.find(x => x.id === maquina)) db.machine_states.push(mState);
    batchOps.push({ type: 'set', col: 'machine_states', id: maquina, data: mState });
  }

  if (window.parent?.runBatchedWrites) {
    await window.parent.runBatchedWrites(batchOps);
  }
  window.DB.save(db);

  document.getElementById('m-desc').value = '';
  document.getElementById('m-costo').value = '';
  document.getElementById('m-proximo').value = '';

  toast('Servicio de mantenimiento registrado correctamente.');
  renderRegistros();
  renderMaquinaria();
}

function renderRegistros() {
  const tbody = document.getElementById('tbody-mantenimientos');
  const db = window.DB.get();
  const logs = db.machine_logs || [];

  if (logs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--subtext);">No hay registros de servicios.</td></tr>`;
    return;
  }

  tbody.innerHTML = logs.map(l => {
    let badgeCls = 'badge-green';
    if (l.tipo === 'correctivo') badgeCls = 'badge-red';
    if (l.tipo === 'calibracion') badgeCls = 'badge-blue';
    if (l.tipo === 'inspeccion') badgeCls = 'badge-purple';

    return `
      <tr>
        <td>${l.fecha}</td>
        <td style="font-weight:700;">${l.maquinaId}</td>
        <td><span class="badge ${badgeCls}">${l.tipo.toUpperCase()}</span></td>
        <td>${l.descripcion}</td>
        <td style="font-weight:800;">$${(l.costo || 0).toFixed(2)}</td>
        <td>${l.proximoServicio ? `<span class="badge badge-gray">📅 ${l.proximoServicio}</span>` : '—'}</td>
        <td>
          <button class="rm-btn" onclick="eliminarRegistro('${l.id}')">🗑</button>
        </td>
      </tr>
    `;
  }).join('');
}

async function toggleEstado(maquinaId) {
  const db = window.DB.get();
  if (!db.machine_states) db.machine_states = [];
  let mState = db.machine_states.find(x => x.id === maquinaId);
  if (!mState) {
    mState = { id: maquinaId, estado: 'activo' };
    db.machine_states.push(mState);
  }

  mState.estado = mState.estado === 'activo' ? 'mantenimiento' : 'activo';

  if (window.parent?.setDocumentInFirebase) {
    await window.parent.setDocumentInFirebase('machine_states', maquinaId, mState);
  }
  window.DB.save(db);
  toast(`Estado del equipo actualizado.`);
  renderMaquinaria();
}

function renderMaquinaria() {
  const grid = document.getElementById('maquinaria-grid');
  const db = window.DB.get();
  const states = db.machine_states || [];
  const logs = db.machine_logs || [];

  grid.innerHTML = EQUIPOS.map(e => {
    const mState = states.find(x => x.id === e.id) || { estado: 'activo' };
    const statusCls = mState.estado === 'activo' ? 'badge-green' : 'badge-amber';
    const statusText = mState.estado === 'activo' ? '🟢 OPERATIVA / ACTIVA' : '🛠️ EN MANTENIMIENTO';

    const totalCost = logs.filter(l => l.maquinaId === e.id).reduce((s, l) => s + (l.costo || 0), 0);
    const lastService = logs.find(l => l.maquinaId === e.id)?.fecha || '—';

    return `
      <div class="machine-card">
        <div class="machine-card-hdr">
          <span class="machine-name">${e.name}</span>
          <span class="badge ${statusCls} status-badge-click" onclick="toggleEstado('${e.id}')">${statusText}</span>
        </div>
        <div class="machine-info-row">
          <span class="machine-info-lbl">Último Servicio</span>
          <span class="machine-info-val">${lastService}</span>
        </div>
        <div class="machine-info-row">
          <span class="machine-info-lbl">Costo Acumulado</span>
          <span class="machine-info-val" style="color:var(--red-text)">$${totalCost.toLocaleString('es-MX', {minimumFractionDigits:2})}</span>
        </div>
      </div>
    `;
  }).join('');
}

async function eliminarRegistro(id) {
  const ok = await showConfirm('Eliminar registro', '¿Estás seguro de que deseas eliminar este registro?', 'Eliminar', 'btn-red');
  if (!ok) return;

  try {
    if (window.parent?.deleteDocumentFromFirebase) {
      await window.parent.deleteDocumentFromFirebase('machine_logs', id);
    }
    const db = window.DB.get();
    if (db.machine_logs) {
      db.machine_logs = db.machine_logs.filter(x => x.id !== id);
      window.DB.save(db);
    }
    toast('Registro eliminado.');
    renderRegistros();
    renderMaquinaria();
  } catch(e) {
    toast('Error al eliminar: ' + e.message, 'error');
  }
}

init();
</script>
</body>
</html>
