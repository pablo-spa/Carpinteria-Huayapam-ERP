<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }



.main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.empty-icon { font-size: 72px; margin-bottom: 20px; opacity: 0.9; }
.empty-title { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
.empty-desc { font-size: 15px; color: var(--subtext); max-width: 440px; line-height: 1.6; }

.wip-badge { display: inline-block; background: var(--amber-bg); color: var(--amber); padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; border: 1px solid rgba(223,142,29,0.2); }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Bitácora de Mantenimiento</h2>
  </div>
</div>

<div class="main">
  <div class="wip-badge">En Construcción</div>
  <div class="empty-icon">🛠️</div>
  <div class="empty-title">Próximamente</div>
  <div class="empty-desc">
    Aquí podrás programar y registrar los mantenimientos preventivos y correctivos a la maquinaria del taller, así como llevar el control de vencimientos de extintores y equipos de seguridad.
  </div>
</div>

</body>
</html>
