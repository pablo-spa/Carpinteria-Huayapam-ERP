<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseñas y Cuentas — Carpintería Huayapam</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.main { max-width: 780px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }

/* Cards */
.pw-card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; overflow: hidden; transition: border-color .15s; }
.pw-card:hover { border-color: var(--surface1); }

.pw-card-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
.pw-card-row:hover { background: var(--base); }

.pw-icon { width: 38px; height: 38px; border-radius: 9px; background: var(--surface0); border: 1px solid var(--crust); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.pw-body { flex: 1; min-width: 0; }
.pw-title { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pw-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
.pw-url { font-size: 11px; color: var(--subtext); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.pw-desc { font-size: 11px; color: var(--subtext); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.pw-arrow { font-size: 10px; color: var(--subtext); flex-shrink: 0; transition: transform .2s; }
.pw-card.expanded .pw-arrow { transform: rotate(180deg); }

/* Detail panel */
.pw-detail { display: none; padding: 0 16px 16px; border-top: 1px solid var(--crust); }
.pw-card.expanded .pw-detail { display: block; }

.pw-fields { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.pw-field { display: flex; flex-direction: column; gap: 3px; }
.pw-field-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--subtext); }
.pw-field-val { display: flex; align-items: center; gap: 8px; }
.pw-field-text { font-size: 13px; color: var(--text); font-weight: 600; word-break: break-all; }
.pw-field-text.mono { font-family: monospace; font-size: 13px; }
.pw-hidden { letter-spacing: 3px; font-size: 11px; color: var(--subtext); }

.pw-copy-btn { padding: 3px 8px; font-size: 11px; font-weight: 700; background: var(--surface0); border: 1px solid var(--crust); border-radius: 5px; cursor: pointer; color: var(--subtext); transition: .12s; flex-shrink: 0; }
.pw-copy-btn:hover { border-color: var(--blue); color: var(--blue); }
.pw-eye-btn { padding: 3px 8px; font-size: 12px; background: var(--surface0); border: 1px solid var(--crust); border-radius: 5px; cursor: pointer; color: var(--subtext); transition: .12s; flex-shrink: 0; }
.pw-eye-btn:hover { border-color: var(--blue); color: var(--blue); }

.pw-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--crust); }
.pw-act-btn { padding: 5px 12px; font-size: 12px; font-weight: 700; background: var(--surface0); border: 1px solid var(--crust); border-radius: 6px; cursor: pointer; color: var(--subtext); transition: .12s; }
.pw-act-btn:hover { border-color: var(--blue); color: var(--blue); }
.pw-act-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

/* Empty */
.empty-state { text-align: center; padding: 60px 20px; color: var(--subtext); }
.empty-icon { font-size: 36px; margin-bottom: 10px; opacity: .5; }
.empty-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.empty-sub { font-size: 13px; }

/* Modal */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.overlay.open { display: flex; }
.modal { background: var(--mantle); border: 1px solid var(--crust); border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-title { font-size: 16px; font-weight: 800; }
.modal-field { display: flex; flex-direction: column; gap: 4px; }
.modal-field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; letter-spacing: .04em; }
.modal-input { padding: 9px 10px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-family: inherit; width: 100%; font-size: 13px; height: 40px; outline: none; }
.modal-input:focus { border-color: var(--blue); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

.extra-fields { display: flex; flex-direction: column; gap: 8px; }
.extra-field-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.extra-field-row input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-family: inherit; font-size: 13px; outline: none; height: 38px; width: 100%; }
.extra-field-row input:focus { border-color: var(--blue); }
.rm-field-btn { width: 32px; height: 38px; border-radius: 6px; border: 1px solid var(--crust); background: var(--surface0); color: var(--subtext); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: .12s; }
.rm-field-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.add-field-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12px; font-weight: 700; background: var(--surface0); border: 1px solid var(--crust); border-radius: 6px; cursor: pointer; color: var(--subtext); width: fit-content; transition: .12s; }
.add-field-btn:hover { border-color: var(--blue); color: var(--blue); }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div class="hdr-title">Contraseñas y Cuentas</div>
  </div>
  <button class="btn btn-green" onclick="openModal()">+ Nueva contraseña</button>
</div>

<div class="main" id="card-list">
  <div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-title">Cargando…</div></div>
</div>

<!-- Modal -->
<div class="overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="modal-title" id="modal-title">Nueva contraseña</div>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--subtext);font-size:20px;cursor:pointer;">✕</button>
    </div>

    <div class="modal-field">
      <label>Título / Nombre de la cuenta</label>
      <input class="modal-input" id="m-titulo" type="text" placeholder="Ej: Firebase, Gmail Empresa…">
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label>Dirección / URL</label>
        <input class="modal-input" id="m-url" type="text" placeholder="https://…">
      </div>
      <div class="modal-field">
        <label>Usuario / Correo</label>
        <input class="modal-input" id="m-usuario" type="text" placeholder="usuario@ejemplo.com">
      </div>
    </div>

    <div class="modal-field">
      <label>Contraseña</label>
      <div style="display:flex; gap:8px;">
        <input class="modal-input" id="m-pass" type="password" placeholder="Contraseña" style="flex:1;">
        <button type="button" onclick="togglePassVis('m-pass', this)" style="padding:0 10px; background:var(--surface0); border:1px solid var(--crust); border-radius:6px; cursor:pointer; font-size:14px; color:var(--subtext);">👁</button>
      </div>
    </div>

    <div class="modal-field">
      <label>Descripción</label>
      <input class="modal-input" id="m-desc" type="text" placeholder="Para qué se usa esta cuenta…">
    </div>

    <div class="modal-field">
      <label>Campos adicionales</label>
      <div class="extra-fields" id="extra-fields"></div>
      <button type="button" class="add-field-btn" onclick="addExtraField()" style="margin-top:6px;">+ Agregar campo</button>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast-wrap" style="position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

<script src="db.js"></script>
<script>
const COL = 'passwords';
let DATA = [];
let editingId = null;
let visiblePasswords = new Set();

function toast(msg, type = 'ok') {
  const wrap = document.getElementById('toast-wrap');
  const bg = type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--green)';
  const el = document.createElement('div');
  el.style.cssText = `background:${bg};color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:auto;`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function siteIcon(url) {
  if (!url) return '🔑';
  const lower = url.toLowerCase();
  if (lower.includes('google') || lower.includes('gmail')) return '🔵';
  if (lower.includes('firebase')) return '🔥';
  if (lower.includes('github')) return '🐙';
  if (lower.includes('facebook') || lower.includes('meta')) return '🟦';
  if (lower.includes('instagram')) return '📸';
  if (lower.includes('twitter') || lower.includes('x.com')) return '🐦';
  if (lower.includes('amazon') || lower.includes('aws')) return '📦';
  if (lower.includes('apple') || lower.includes('icloud')) return '🍎';
  if (lower.includes('microsoft') || lower.includes('outlook')) return '🪟';
  return '🔑';
}

function render() {
  const el = document.getElementById('card-list');
  if (!DATA.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🔐</div>
      <div class="empty-title">Sin cuentas guardadas</div>
      <div class="empty-sub">Agrega tu primera contraseña con el botón de arriba.</div>
    </div>`;
    return;
  }

  el.innerHTML = DATA.map(d => {
    const isVis = visiblePasswords.has(d.id);
    const extras = (d.camposExtra || []).map((f, i) => `
      <div class="pw-field">
        <div class="pw-field-label">${esc(f.label)}</div>
        <div class="pw-field-val">
          <span class="pw-field-text">${esc(f.valor)}</span>
          <button class="pw-copy-btn" onclick="copyText('${esc(f.valor)}', event)">Copiar</button>
        </div>
      </div>`).join('');

    return `
    <div class="pw-card" id="pc-${d.id}">
      <div class="pw-card-row" onclick="toggleCard('${d.id}')">
        <div class="pw-icon">${siteIcon(d.url)}</div>
        <div class="pw-body">
          <div class="pw-title">${esc(d.titulo || '—')}</div>
          <div class="pw-sub">
            ${d.url ? `<span class="pw-url">${esc(d.url)}</span>` : ''}
            ${d.descripcion ? `<span class="pw-desc">${d.url ? '· ' : ''}${esc(d.descripcion)}</span>` : ''}
          </div>
        </div>
        <div class="pw-arrow">▼</div>
      </div>
      <div class="pw-detail">
        <div class="pw-fields">
          ${d.url ? `<div class="pw-field">
            <div class="pw-field-label">Dirección / URL</div>
            <div class="pw-field-val">
              <span class="pw-field-text">${esc(d.url)}</span>
              <button class="pw-copy-btn" onclick="copyText('${esc(d.url)}', event)">Copiar</button>
              ${d.url.startsWith('http') ? `<button class="pw-copy-btn" onclick="window.open('${esc(d.url)}', '_blank'); event.stopPropagation()">Abrir</button>` : ''}
            </div>
          </div>` : ''}
          ${d.usuario ? `<div class="pw-field">
            <div class="pw-field-label">Usuario / Correo</div>
            <div class="pw-field-val">
              <span class="pw-field-text">${esc(d.usuario)}</span>
              <button class="pw-copy-btn" onclick="copyText('${esc(d.usuario)}', event)">Copiar</button>
            </div>
          </div>` : ''}
          ${d.contrasena ? `<div class="pw-field">
            <div class="pw-field-label">Contraseña</div>
            <div class="pw-field-val">
              <span class="pw-field-text mono ${isVis ? '' : 'pw-hidden'}" id="pass-val-${d.id}">${isVis ? esc(d.contrasena) : '••••••••••'}</span>
              <button class="pw-eye-btn" id="eye-${d.id}" onclick="togglePassShow('${d.id}', event)">${isVis ? '🙈' : '👁'}</button>
              <button class="pw-copy-btn" onclick="copyText('${esc(d.contrasena)}', event)">Copiar</button>
            </div>
          </div>` : ''}
          ${d.descripcion ? `<div class="pw-field">
            <div class="pw-field-label">Descripción</div>
            <div class="pw-field-val"><span class="pw-field-text">${esc(d.descripcion)}</span></div>
          </div>` : ''}
          ${extras}
        </div>
        <div class="pw-actions">
          <button class="pw-act-btn" onclick="editEntry('${d.id}'); event.stopPropagation()">✏️ Editar</button>
          <button class="pw-act-btn danger" onclick="deleteEntry('${d.id}'); event.stopPropagation()">🗑 Eliminar</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  document.getElementById('pc-' + id)?.classList.toggle('expanded');
}

function togglePassShow(id, e) {
  e.stopPropagation();
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  if (visiblePasswords.has(id)) {
    visiblePasswords.delete(id);
  } else {
    visiblePasswords.add(id);
  }
  const valEl = document.getElementById('pass-val-' + id);
  const eyeEl = document.getElementById('eye-' + id);
  if (valEl) {
    const vis = visiblePasswords.has(id);
    valEl.textContent = vis ? d.contrasena : '••••••••••';
    valEl.classList.toggle('pw-hidden', !vis);
    if (eyeEl) eyeEl.textContent = vis ? '🙈' : '👁';
  }
}

async function copyText(text, e) {
  e?.stopPropagation();
  try {
    await navigator.clipboard.writeText(text);
    toast('Copiado al portapapeles.');
  } catch {
    toast('No se pudo copiar.', 'warn');
  }
}

function togglePassVis(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

let _extraCount = 0;
function addExtraField(label = '', valor = '') {
  const id = ++_extraCount;
  const wrap = document.getElementById('extra-fields');
  const row = document.createElement('div');
  row.className = 'extra-field-row';
  row.id = 'ef-' + id;
  row.innerHTML = `
    <input type="text" placeholder="Etiqueta" value="${esc(label)}" data-ef-label="${id}">
    <input type="text" placeholder="Valor" value="${esc(valor)}" data-ef-valor="${id}">
    <button type="button" class="rm-field-btn" onclick="document.getElementById('ef-${id}').remove()">✕</button>
  `;
  wrap.appendChild(row);
}

function readExtraFields() {
  const rows = document.querySelectorAll('.extra-field-row');
  const result = [];
  rows.forEach(row => {
    const id = row.id.replace('ef-', '');
    const label = row.querySelector(`[data-ef-label="${id}"]`)?.value.trim() || '';
    const valor = row.querySelector(`[data-ef-valor="${id}"]`)?.value.trim() || '';
    if (label || valor) result.push({ label, valor });
  });
  return result;
}

function openModal(entry = null) {
  editingId = entry ? entry.id : null;
  document.getElementById('modal-title').textContent = entry ? 'Editar contraseña' : 'Nueva contraseña';
  document.getElementById('m-titulo').value  = entry?.titulo      || '';
  document.getElementById('m-url').value     = entry?.url         || '';
  document.getElementById('m-usuario').value = entry?.usuario     || '';
  document.getElementById('m-pass').value    = entry?.contrasena  || '';
  document.getElementById('m-pass').type     = 'password';
  document.getElementById('m-desc').value    = entry?.descripcion || '';
  document.getElementById('extra-fields').innerHTML = '';
  _extraCount = 0;
  (entry?.camposExtra || []).forEach(f => addExtraField(f.label, f.valor));
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('m-titulo').focus(), 50);
}

function closeModal() {
  editingId = null;
  document.getElementById('modal-overlay').classList.remove('open');
}

async function saveModal() {
  const titulo     = document.getElementById('m-titulo').value.trim();
  const url        = document.getElementById('m-url').value.trim();
  const usuario    = document.getElementById('m-usuario').value.trim();
  const contrasena = document.getElementById('m-pass').value;
  const descripcion = document.getElementById('m-desc').value.trim();
  const camposExtra = readExtraFields();

  if (!titulo) { document.getElementById('m-titulo').focus(); toast('El título es obligatorio.', 'warn'); return; }

  const payload = { titulo, url, usuario, contrasena, descripcion, camposExtra };

  if (editingId) {
    await window.parent.setDocumentInFirebase(COL, editingId, payload);
    if (window.parent?.DB_STATE?.[COL]) {
      const idx = window.parent.DB_STATE[COL].findIndex(x => x.id === editingId);
      if (idx !== -1) window.parent.DB_STATE[COL][idx] = { id: editingId, ...payload };
    }
    const idx = DATA.findIndex(x => x.id === editingId);
    if (idx !== -1) DATA[idx] = { id: editingId, ...payload };
    toast('Contraseña actualizada.');
  } else {
    const id = 'pw-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    await window.parent.setDocumentInFirebase(COL, id, payload);
    const entry = { id, ...payload };
    if (window.parent?.DB_STATE) {
      if (!window.parent.DB_STATE[COL]) window.parent.DB_STATE[COL] = [];
      window.parent.DB_STATE[COL].push({ ...entry });
    }
    DATA.push(entry);
    toast('Contraseña guardada.');
  }

  closeModal();
  render();
}

function editEntry(id) {
  const d = DATA.find(x => x.id === id);
  if (d) openModal(d);
}

async function deleteEntry(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  const confirmed = await new Promise(resolve =>
    window.parent.showConfirm('Eliminar cuenta', `¿Eliminar "${d.titulo}"? Esta acción no se puede deshacer.`, 'Eliminar', 'btn-red',
      () => resolve(true), () => resolve(false))
  );
  if (!confirmed) return;
  await window.parent.deleteDocumentFromFirebase(COL, id);
  if (window.parent?.DB_STATE?.[COL])
    window.parent.DB_STATE[COL] = window.parent.DB_STATE[COL].filter(x => x.id !== id);
  DATA = DATA.filter(x => x.id !== id);
  render();
  toast('Cuenta eliminada.');
}

async function init() {
  const p = window.parent;
  if (p?.DB_STATE) delete p.DB_STATE[COL];
  if (p?.cargar_coleccion) await p.cargar_coleccion(COL);
  DATA = await window.DB.query(COL, {});
  DATA.sort((a, b) => (a.titulo || '').localeCompare(b.titulo || '', 'es'));
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
