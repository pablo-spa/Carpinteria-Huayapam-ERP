<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio RH - Trabajadores</title>
  <style>
    :root {
      --bg: #eff1f5;
      --surface: #ffffff;
      --border: #dce0e8;
      --border-strong: #bcc0cc;
      --text: #4c4f69;
      --muted: #8c8fa1;
      --primary: #1e66f5;
      --primary-hover: #1e66f5e6;
      --radius: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e2e;
        --surface: #181825;
        --border: #313244;
        --border-strong: #45475a;
        --text: #cdd6f4;
        --muted: #a6adc8;
        --primary: #8caaee;
        --primary-hover: #8caaeed9;
      }
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover { background: var(--primary-hover); }
    
    .table-container {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: rgba(0,0,0,0.02);
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    @media (prefers-color-scheme: dark) {
      th { background: rgba(255,255,255,0.02); }
    }
    tr:last-child th, tr:last-child td { border-bottom: none; }
    
    tbody tr { cursor: pointer; transition: background 0.15s; }
    tbody tr:hover { background: rgba(0,0,0,0.02); }
    @media (prefers-color-scheme: dark) {
      tbody tr:hover { background: rgba(255,255,255,0.03); }
    }
    
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: var(--text);
    }
    
    /* Modal Ficha */
    .modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      display: none; justify-content: center; align-items: center;
      backdrop-filter: blur(2px);
      z-index: 1000;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border-strong);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.02);
    }
    @media (prefers-color-scheme: dark) {
      .modal-header { background: rgba(255,255,255,0.02); }
    }
    .modal-title { font-weight: 700; font-size: 18px; }
    .modal-close {
      background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted);
    }
    .modal-body { padding: 20px; }
    
    .ficha-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    .f-field { display: flex; flex-direction: column; gap: 4px; }
    .f-field.full { grid-column: 1 / -1; }
    .f-field.half { grid-column: span 2; }
    
    .f-field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .f-input {
      background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px;
      border-radius: 6px; font-family: inherit; font-size: 14px; width: 100%; box-sizing: border-box;
      min-height: 40px;
    }
    .f-input:disabled { opacity: 0.7; background: rgba(0,0,0,0.05); }
    .f-input:focus { outline: none; border-color: var(--primary); }
    
    .ficha-profile {
      display: flex; gap: 16px; align-items: center; margin-bottom: 24px;
    }
    .ficha-avatar {
      width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
    }
    
    .modal-footer {
      padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><span>👷‍♂️</span> Directorio de Trabajadores</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <label style="font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="show-inactive" onchange="renderList()" style="accent-color:var(--primary);">
        Mostrar bajas
      </label>
      <button class="btn" onclick="openFicha()">+ Nuevo Trabajador</button>
    </div>
  </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width:50px;"></th>
                <th>ID Personal</th>
                <th>Nombre</th>
                <th>Puesto</th>
                <th>RFC</th>
                <th>Celular</th>
                <th>Fecha Ingreso</th>
                <th>Años</th>
                <th>Vacaciones Disponibles</th>
                <th>Sueldo Diario</th>
                <th>Sueldo Semanal ($)</th>
              </tr>
            </thead>
            <tbody id="worker-list">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>


  <!-- Ficha Modal -->
  <div class="modal-overlay" id="ficha-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="ficha-title">Ficha de Trabajador</div>
        <button class="modal-close" onclick="closeFicha()">✕</button>
      </div>
      <div class="modal-body" style="overflow-y:auto; max-height:80vh;">
        <div class="ficha-profile">
          <div class="ficha-avatar" id="f-avatar">N</div>
          <div>
            <div style="font-size:18px; font-weight:700;" id="f-display-name">Nuevo Trabajador</div>
            <div style="font-size:13px; color:var(--muted);" id="f-id-pers">-</div>
          </div>
        </div>
        
        <input type="hidden" id="f-id">
        <div class="ficha-grid">
          <div class="f-field">
            <label>Nombre(s)</label>
            <input type="text" class="f-input" id="f-given-name" oninput="recalcValues()">
          </div>
          <div class="f-field">
            <label>Apellido Paterno</label>
            <input type="text" class="f-input" id="f-paterno" oninput="recalcValues()">
          </div>
          <div class="f-field">
            <label>Apellido Materno</label>
            <input type="text" class="f-input" id="f-materno" oninput="recalcValues()">
          </div>
          <div class="f-field full">
            <label>Nombre Completo</label>
            <input type="text" class="f-input" id="f-name" disabled>
          </div>
          <div class="f-field">
            <label>ID Personal</label>
            <input type="text" class="f-input" id="f-id-personal" disabled>
          </div>
          <div class="f-field">
            <label>Fecha de Nacimiento</label>
            <input type="date" class="f-input" id="f-birth" onchange="recalcValues()">
          </div>
          <div class="f-field">
            <label>RFC</label>
            <input type="text" class="f-input" id="f-rfc" style="text-transform:uppercase;">
          </div>
          
          <div class="f-field">
            <label>Categoría</label>
            <select class="f-input" id="f-role"></select>
          </div>
          <div class="f-field">
            <label>Empleado en Carpintería</label>
            <select class="f-input" id="f-in-workshop">
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="f-field">
            <label>Medir Asistencia</label>
            <select class="f-input" id="f-measure-att">
              <option value="Si">Sí</option>
              <option value="No">No</option>
            </select>
          </div>
          
          <div class="f-field">
            <label>Número Celular</label>
            <input type="text" class="f-input" id="f-phone">
          </div>
          <div class="f-field">
            <label>Contacto Emergencia</label>
            <input type="text" class="f-input" id="f-emergency" placeholder="Nombre - Tel">
          </div>
          <div class="f-field">
            <label>NSS</label>
            <input type="text" class="f-input" id="f-nss">
          </div>
          
          <div class="f-field full"><hr style="border:0; border-top:1px dashed var(--border); margin:4px 0;"></div>
          
          <div class="f-field">
            <label>Fecha de Entrada</label>
            <input type="date" class="f-input" id="f-start-date" onchange="recalcValues()">
          </div>
          <div class="f-field">
            <label>Años Trabajados</label>
            <input type="text" class="f-input" id="f-years-worked" disabled>
          </div>
          <div class="f-field">
            <label>Fecha de Salida</label>
            <input type="date" class="f-input" id="f-end-date">
          </div>
          
          <div class="f-field">
            <label>Vacaciones (Acumuladas)</label>
            <input type="number" class="f-input" id="f-vacation" step="1" min="0" disabled>
          </div>
          <div class="f-field half">
            <label>Días agregados al mes (Ene 2025)</label>
            <input type="number" class="f-input" id="f-vac-added" step="0.5" value="0">
          </div>
          
          <div class="f-field full"><hr style="border:0; border-top:1px dashed var(--border); margin:4px 0;"></div>

          <div class="f-field">
            <label>Horas Semanales</label>
            <input type="number" class="f-input" id="f-hours-week" step="1" value="48" oninput="recalcValues()">
          </div>
          <div class="f-field">
            <label>Sueldo Semanal ($)</label>
            <input type="number" class="f-input" id="f-salary" step="any" min="0" oninput="recalcValues()">
          </div>
          <div class="f-field">
            <label>Sueldo x Hora ($)</label>
            <input type="text" class="f-input" id="f-salary-hr" disabled>
          </div>

          <div class="f-field full"><hr style="border:0; border-top:1px dashed var(--border); margin:4px 0;"></div>
          
          <div class="f-field full">
            <label>Notas, LLamadas de Atención o Archivos</label>
            <div id="f-notes-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:8px; max-height:150px; overflow-y:auto; padding:8px; background:rgba(0,0,0,0.02); border:1px solid var(--border); border-radius:6px;">
              <!-- Notes injected here -->
            </div>
            <div style="display:flex; gap:8px; align-items:flex-end;">
              <div style="flex:1;">
                 <label>Nueva Nota / Llamada de Atención</label>
                 <textarea class="f-input" id="f-new-note" rows="2" placeholder="Describa el suceso o nota..."></textarea>
                 
                 <div style="margin-top:6px; display:flex; align-items:center; gap:8px;">
                    <label for="f-file-attach" style="cursor:pointer; display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--primary); font-weight:600;"><span style="font-size:16px;">📎</span> Adjuntar Archivo</label>
                    <input type="file" id="f-file-attach" style="display:none;" onchange="updateFileName()">
                    <span id="f-file-name" style="font-size:12px; color:var(--muted); font-style:italic;"></span>
                 </div>
              </div>
              <div style="flex:0; min-width: 120px;">
                 <label style="opacity:0">A</label>
                 <button class="btn" style="width:100%" onclick="addNote()">Añadir</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btn-baja" style="background:rgba(210,15,57,.1); border:1px solid #d20f39; color:#d20f39; display:none;" onclick="darDeBaja()">Dar de Baja</button>
        <button class="btn" id="btn-reactivar" style="background:rgba(64,160,43,.1); border:1px solid #40a02b; color:#40a02b; display:none;" onclick="reactivar()">Reactivar</button>
        <div style="flex:1;"></div>
        <button class="btn" style="background:var(--bg); border:1px solid var(--border); color:var(--text);" onclick="closeFicha()">Cancelar</button>
        <button class="btn" onclick="saveFicha()">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    async function renderList() {
      const showInactive = document.getElementById('show-inactive')?.checked;
      const allWorkers = await window.DB.query("contacts", { tipo: "trabajador" });
      const workers = showInactive ? allWorkers : allWorkers.filter(w => w.activo !== false);
      const d = window.DB.get(); // to optionally save
      let dbUpdated = false;
      
      if (!d.contacts) d.contacts = [];
      
      workers.forEach(w => {
        if(!w.personalId) {
          // Attempt to generate if missing
          const g = w.givenName || (w.name ? w.name.split(' ')[0] : '');
          const p = w.paterno || (w.name && w.name.split(' ').length > 1 ? w.name.split(' ')[1] : '');
          const bDate = w.birthDate || '2000-01-01'; // Fallback to 00 if no birth date
          
          if(g) {
            let part1 = g.substring(0,2).toUpperCase();
            if (part1.length === 1) part1 += 'X';
            let part2 = p ? p.substring(0,1).toUpperCase() : 'X';
            let part3 = bDate.substring(2,4);
            w.personalId = `${part1}${part2}${part3}`;
            dbUpdated = true;
            
            // push to d.contacts to save
            const idx = d.contacts.findIndex(x => x.id === w.id);
            if (idx >= 0) {
                 d.contacts[idx].personalId = w.personalId;
                 if(window.parent && window.parent.setDocumentInFirebase) {
                     window.parent.setDocumentInFirebase("contacts", w.id, d.contacts[idx]);
                 }
            }
          }
        }
      });
      if(dbUpdated) window.DB.save(d);

      const tbody = document.getElementById('worker-list');
      tbody.innerHTML = '';
      
      workers.forEach(w => {
        const namePart = w.name ? w.name.charAt(0).toUpperCase() : 'N';
        
        let yr = 0;
        if(w.startDate) {
          const ms = Date.now() - new Date(w.startDate).getTime();
          yr = Math.floor(ms / (1000*3600*24*365.25));
          if(yr < 0) yr = 0;
        }

        const hrsWeek = w.hoursWeek || 48;
        const sDir = (w.baseSalary && hrsWeek > 0) ? ((w.baseSalary / hrsWeek) * 8) : 0;
        
        const tr = document.createElement('tr');
        tr.onclick = () => openFicha(w);
        if (w.activo === false) tr.style.opacity = '0.45';

        tr.innerHTML = `
          <td><div class="avatar">${namePart}</div></td>
          <td><b>${w.personalId || '-'}</b></td>
          <td style="font-weight:600;">${w.name || '-'}${w.activo === false ? ' <span style="font-size:10px;font-weight:700;color:#d20f39;background:rgba(210,15,57,.12);padding:2px 6px;border-radius:4px;">BAJA</span>' : ''}</td>
          <td>${w.role || '-'}</td>
          <td>${w.rfc || '-'}</td>
          <td>${w.phone || '-'}</td>
          <td>${w.startDate || '-'}</td>
          <td>${yr}</td>
          <td style="font-weight:bold;">${w.vacationDays !== undefined ? w.vacationDays : '-'} d</td>
          <td>$${parseFloat(sDir).toLocaleString('es-MX')}</td>
          <td style="color:var(--primary); font-weight:600;">$${parseFloat(w.baseSalary||0).toLocaleString('es-MX')}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    
    function recalcValues() {
      const g = document.getElementById('f-given-name').value.trim();
      const p = document.getElementById('f-paterno').value.trim();
      const m = document.getElementById('f-materno').value.trim();
      
      const full = [p, m, g].filter(Boolean).join(' ');
      document.getElementById('f-name').value = full;
      
      document.getElementById('f-display-name').textContent = full || 'Nuevo Trabajador';
      document.getElementById('f-avatar').textContent = full ? full.charAt(0).toUpperCase() : 'N';
      
      const bDate = document.getElementById('f-birth').value;
      if(p && g && bDate) {
        let part1 = g.substring(0,2).toUpperCase();
        let part2 = p.substring(0,1).toUpperCase();
        let part3 = bDate.substring(2,4); // YY
        document.getElementById('f-id-personal').value = `${part1}${part2}${part3}`;
      } else {
        document.getElementById('f-id-personal').value = '';
      }
      document.getElementById('f-id-pers').textContent = document.getElementById('f-id-personal').value || '-';
      
      const eDate = document.getElementById('f-start-date').value;
      let yr = 0;
      let vDays = 0;
      if(eDate) {
        const ms = Date.now() - new Date(eDate).getTime();
        yr = Math.floor(ms / (1000*3600*24*365.25));
        if(yr < 0) yr = 0;
        
        if (yr === 1) vDays = 12;
        else if (yr === 2) vDays = 14;
        else if (yr === 3) vDays = 16;
        else if (yr === 4) vDays = 18;
        else if (yr === 5) vDays = 20;
        else if (yr >= 6 && yr <= 10) vDays = 22;
        else if (yr >= 11 && yr <= 15) vDays = 24;
        else if (yr >= 16 && yr <= 20) vDays = 26;
        else if (yr >= 21 && yr <= 25) vDays = 28;
        else if (yr >= 26) vDays = 30;
      }
      document.getElementById('f-years-worked').value = yr;
      
      const vAdd = parseFloat(document.getElementById('f-vac-added').value) || 0;
      document.getElementById('f-vacation').value = Math.max(0, vDays + vAdd);
      
      const hrs = parseFloat(document.getElementById('f-hours-week').value) || 0;
      const sal = parseFloat(document.getElementById('f-salary').value) || 0;
      document.getElementById('f-salary-hr').value = (hrs > 0) ? (sal / hrs).toFixed(2) : '0.00';
    }

    let currentWorkerId = null;
    let currentNotes = [];
    let currentWorkerActivo = true;
    
    function renderNotes() {
      const cnt = document.getElementById('f-notes-list');
      if (currentNotes.length === 0) {
        cnt.innerHTML = '<span style="color:var(--muted); font-size:12px; text-align:center;">No hay notas registradas.</span>';
        return;
      }
      
      cnt.innerHTML = currentNotes.map((n, i) => `
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:8px; font-size:13px; position:relative;">
          <div style="font-weight:600; margin-bottom:4px; font-size:11px; color:var(--muted);">${new Date(n.date).toLocaleDateString()} a las ${n.time}</div>
          ${n.text ? `<div style="white-space:pre-wrap; margin-bottom:4px;">${n.text}</div>` : ''}
          ${n.fileName ? `<div style="display:inline-block; margin-top:4px; padding:4px 8px; background:rgba(30,102,245,0.1); color:var(--primary); font-size:11px; border-radius:4px; font-weight:600;"><span style="font-size:14px; vertical-align:middle;">📎</span> ${n.fileName}</div>` : ''}
          <button style="position:absolute; top:8px; right:8px; background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;" onclick="removeNote(${i})">✕</button>
        </div>
      `).join('');
    }
    
    function updateFileName() {
      const fileInput = document.getElementById('f-file-attach');
      const text = document.getElementById('f-file-name');
      text.textContent = fileInput.files.length > 0 ? fileInput.files[0].name : '';
    }

    function addNote() {
      const input = document.getElementById('f-new-note');
      const fileInput = document.getElementById('f-file-attach');
      const text = input.value.trim();
      const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : null;
      
      if (!text && !fileName) return;
      const d = new Date();
      currentNotes.push({
        date: d.toISOString().split('T')[0],
        time: d.toLocaleTimeString('es-MX', {hour: '2-digit', minute:'2-digit'}),
        text: text,
        fileName: fileName
      });
      input.value = '';
      fileInput.value = '';
      document.getElementById('f-file-name').textContent = '';
      renderNotes();
    }
    
    function removeNote(idx) {
      if(confirm('¿Eliminar esta nota?')) {
        currentNotes.splice(idx, 1);
        renderNotes();
      }
    }

    function openFicha(w = null) {
      document.getElementById('ficha-modal').style.display = 'flex';
      
      const d = window.DB.get();
      const DEFAULT_ROLES = ['Jefe de Planta','Maestro A','Maestro B','Oficial A','Oficial B','Chalán','Barniz','Pulido','Empaque','Chofer','Almacén','Compras','Administración','Contador','Mantenimiento','Limpieza','Aprendiz'];
      const rolesRaw = d.worker_roles || [];
      let rolesList = DEFAULT_ROLES;
      if (rolesRaw.length > 0) {
        rolesList = rolesRaw[0]?.list || rolesRaw.filter(r => typeof r === 'string');
        if (!rolesList.length) rolesList = DEFAULT_ROLES;
      }
      document.getElementById('f-role').innerHTML = '<option value="">-- Seleccionar Puesto --</option>' + rolesList.map(r => `<option value="${r}">${r}</option>`).join('');
      
      if(w) {
        currentWorkerId = w.id;
        currentNotes = w.notes ? [...w.notes] : [];
        currentWorkerActivo = w.activo !== false;
        document.getElementById('ficha-title').textContent = 'Editar Trabajador';
        document.getElementById('f-id').value = w.id;
        document.getElementById('f-given-name').value = w.givenName || '';
        document.getElementById('f-paterno').value = w.paterno || '';
        document.getElementById('f-materno').value = w.materno || '';
        document.getElementById('f-name').value = w.name || '';
        document.getElementById('f-birth').value = w.birthDate || '';
        document.getElementById('f-rfc').value = w.rfc || '';
        document.getElementById('f-role').value = w.role || '';
        document.getElementById('f-in-workshop').value = w.inWorkshop || 'Si';
        document.getElementById('f-measure-att').value = w.measureAtt || 'Si';
        document.getElementById('f-phone').value = w.phone || '';
        document.getElementById('f-start-date').value = w.startDate || '';
        document.getElementById('f-end-date').value = w.endDate || '';
        document.getElementById('f-vac-added').value = w.vacAdded || 0;
        document.getElementById('f-hours-week').value = w.hoursWeek || 48;
        document.getElementById('f-salary').value = w.baseSalary || 0;
        document.getElementById('f-emergency').value = w.emergencyContact || '';
        document.getElementById('f-nss').value = w.nss || '';
        
        document.getElementById('f-display-name').textContent = w.name || 'Trabajador';
        document.getElementById('f-avatar').textContent = w.name ? w.name.charAt(0).toUpperCase() : 'N';
      } else {
        currentWorkerId = null;
        currentNotes = [];
        currentWorkerActivo = true;
        document.getElementById('ficha-title').textContent = 'Nuevo Trabajador';
        document.getElementById('f-id').value = '';
        document.getElementById('f-given-name').value = '';
        document.getElementById('f-paterno').value = '';
        document.getElementById('f-materno').value = '';
        document.getElementById('f-name').value = '';
        document.getElementById('f-birth').value = '';
        document.getElementById('f-rfc').value = '';
        document.getElementById('f-role').value = '';
        document.getElementById('f-in-workshop').value = 'Si';
        document.getElementById('f-measure-att').value = 'Si';
        document.getElementById('f-phone').value = '';
        document.getElementById('f-start-date').value = '';
        document.getElementById('f-end-date').value = '';
        document.getElementById('f-vac-added').value = 0;
        document.getElementById('f-hours-week').value = 48;
        document.getElementById('f-salary').value = '';
        document.getElementById('f-emergency').value = '';
        document.getElementById('f-nss').value = '';

        document.getElementById('f-display-name').textContent = 'Nuevo Trabajador';
        document.getElementById('f-avatar').textContent = 'N';
      }
      
      // Show/hide baja/reactivar buttons
      const btnBaja = document.getElementById('btn-baja');
      const btnReact = document.getElementById('btn-reactivar');
      if (w) {
        btnBaja.style.display   = currentWorkerActivo ? 'inline-flex' : 'none';
        btnReact.style.display  = currentWorkerActivo ? 'none' : 'inline-flex';
      } else {
        btnBaja.style.display   = 'none';
        btnReact.style.display  = 'none';
      }

      renderNotes();
      recalcValues();
    }
    
    function closeFicha() {
      document.getElementById('ficha-modal').style.display = 'none';
    }

    async function darDeBaja() {
      if (!currentWorkerId) return;
      const name = document.getElementById('f-name').value || 'este trabajador';
      if (!confirm(`¿Confirmar baja de ${name}? Ya no aparecerá en nómina, reloj ni listas de operaciones.`)) return;
      await setActivoDirectly(false);
    }

    async function reactivar() {
      if (!currentWorkerId) return;
      const name = document.getElementById('f-name').value || 'este trabajador';
      if (!confirm(`¿Reactivar a ${name}?`)) return;
      await setActivoDirectly(true);
    }

    async function setActivoDirectly(activo) {
      const id = currentWorkerId;
      // Update parent DB_STATE directly
      if (window.parent && window.parent.DB_STATE && window.parent.DB_STATE.contacts) {
        const idx = window.parent.DB_STATE.contacts.findIndex(c => c.id === id || c._id === id);
        if (idx !== -1) {
          window.parent.DB_STATE.contacts[idx].activo = activo;
          const updated = window.parent.DB_STATE.contacts[idx];
          if (window.parent.setDocumentInFirebase) {
            await window.parent.setDocumentInFirebase('contacts', updated.id || updated._id, updated);
          }
        }
      }
      currentWorkerActivo = activo;
      closeFicha();
      await renderList();
    }
    
    function saveFicha() {
      const g = document.getElementById('f-given-name').value.trim();
      const p = document.getElementById('f-paterno').value.trim();
      const nameStr = document.getElementById('f-name').value.trim();
      if(!g || !p) return alert('Nombre(s) y Apellido Paterno son obligatorios');
      
      const d = window.DB.get();
      const id = document.getElementById('f-id').value;
      
      const wData = {
        tipo: 'trabajador',
        activo: currentWorkerActivo,
        givenName: g,
        paterno: p,
        materno: document.getElementById('f-materno').value.trim(),
        name: nameStr,
        personalId: document.getElementById('f-id-personal').value,
        birthDate: document.getElementById('f-birth').value,
        rfc: document.getElementById('f-rfc').value.trim().toUpperCase(),
        role: document.getElementById('f-role').value.trim(),
        inWorkshop: document.getElementById('f-in-workshop').value,
        measureAtt: document.getElementById('f-measure-att').value,
        phone: document.getElementById('f-phone').value.trim(),
        startDate: document.getElementById('f-start-date').value,
        endDate: document.getElementById('f-end-date').value,
        vacationDays: parseInt(document.getElementById('f-vacation').value) || 0,
        vacAdded: parseFloat(document.getElementById('f-vac-added').value) || 0,
        hoursWeek: parseFloat(document.getElementById('f-hours-week').value) || 0,
        baseSalary: parseFloat(document.getElementById('f-salary').value) || 0,
        emergencyContact: document.getElementById('f-emergency').value.trim(),
        nss: document.getElementById('f-nss').value.trim(),
        notes: currentNotes
      };
      
      if (!d.contacts) d.contacts = [];
      if(id) {
        const idx = d.contacts.findIndex(x => x.id === id);
        if(idx >= 0) {
          d.contacts[idx] = { ...d.contacts[idx], ...wData };
          if(window.parent && window.parent.setDocumentInFirebase) {
              window.parent.setDocumentInFirebase("contacts", d.contacts[idx].id, d.contacts[idx]);
          }
        } else {
           // fallback if it was a ghost worker
           const wIdx = d.workers.findIndex(x => x.id === id);
           if (wIdx >= 0) {
               d.contacts.push({ ...d.workers[wIdx], ...wData, tipo: 'trabajador' });
               if(window.parent && window.parent.setDocumentInFirebase) {
                   window.parent.setDocumentInFirebase("contacts", d.contacts[d.contacts.length-1].id, d.contacts[d.contacts.length-1]);
               }
               // remove from workers so it doesn't duplicate
               d.workers.splice(wIdx, 1);
               if(window.parent && window.parent.deleteDocumentFromFirebase) {
                   window.parent.deleteDocumentFromFirebase("workers", id);
               }
           }
        }
      } else {
        wData.id = crypto.randomUUID();
        wData.loanBalance = 0;
        wData.savedHours = 0;
        d.contacts.push(wData);
        if(window.parent && window.parent.setDocumentInFirebase) {
            window.parent.setDocumentInFirebase("contacts", wData.id, wData);
        }
      }
      
      window.DB.save(d);
      closeFicha();
      init();
    }
    
    // Init
    async function init() {
       document.getElementById('worker-list').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;">Cargando...</td></tr>';
       await renderList();
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
