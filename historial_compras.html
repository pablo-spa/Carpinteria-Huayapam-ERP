<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Compras</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --blue: #1e66f5; --green: #40a02b; --amber: #df8e1d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --blue: #8caaee; --green: #a6da95; --amber: #f9e2af;
  }
}
body { background: var(--base); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; }
.hdr { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; margin-bottom: 12px; }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface0); color: var(--subtext); }
.badge-done { background: rgba(64,160,43,0.15); color: var(--green); }
.item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; }
.item-subtext { color: var(--subtext); font-size: 11px; }
.total-row { display: flex; justify-content: flex-end; font-weight: 700; font-size: 14px; padding-top: 12px; }
</style>
</head>
<body>
<div class="hdr">
  <h2>Historial de Compras (Completadas)</h2>
  <div style="display:flex; gap:8px;">
    <input type="text" id="srch" placeholder="Buscar por Folio, Proveedor..." style="padding:8px 12px; border-radius:6px; border:1px solid var(--surface0); background:var(--base); color:var(--text); font-size:13px;" oninput="applyFilter()">
  </div>
</div>

<div id="app"></div>

<script src="db.js"></script>
<script>
  let STATE_ORDERS = [];

  function fmt(num) { return '$' + parseFloat(num).toLocaleString('es-MX', {minimumFractionDigits:2}); }

  async function loadData() {
    STATE_ORDERS = await window.DB.query("purchase_orders");
    if (!STATE_ORDERS || STATE_ORDERS.length === 0) STATE_ORDERS = window.DB.get().orders || [];
    // only received or delivered
    STATE_ORDERS = STATE_ORDERS.filter(o => !o._init && ['Comprado', 'Recibido', 'Entregado'].includes(o.status));
    STATE_ORDERS.sort((a,b) => new Date(b.date) - new Date(a.date));
    render();
  }

  function render() {
    const list = document.getElementById('app');
    let html = '';
    
    STATE_ORDERS.forEach(o => {
       const badge = (o.status === 'Recibido' || o.status === 'Entregado') ? 'badge-done' : 'badge-amber';
       
       let total = 0;
       
       let itmsHtml = `
         <div class="item-row" style="font-weight:700; color:var(--subtext); font-size:11px; text-transform:uppercase; border:none; padding-bottom:4px;">
           <div>Item / Cantidad</div>
           <div>P. Unitario</div>
           <div>Subtotal</div>
         </div>
       `;
       
       (o.items || []).forEach(i => {
          const sub = (i.qty * i.price) || 0;
          total += sub;
          itmsHtml += `
            <div class="item-row">
              <div>${i.qty}x ${i.name} <span class="item-subtext">(${i.unit})</span></div>
              <div>${fmt(i.price||0)}</div>
              <div>
                <div>${fmt(sub)}</div>
              </div>
            </div>
          `;
       });
       
       html += `
       <div class="card">
        <div class="card-title">
          <span>Folio ${o.folio} / ${o.project || 'Stock General'} - Proveedor: ${o.supplier || o.provider || '-'}</span>
          <span class="badge ${badge}">${o.status}</span>
        </div>
        <div style="font-size:12px; color:var(--subtext); margin-bottom:12px;">Comprado por ${o.requester || '-'}. Fecha: ${o.date}</div>
        
        ${itmsHtml}
        
        <div class="total-row">
          Total de la Orden: ${fmt(total)}
        </div>
      </div>
       `;
    });
    
    if(!html) html = '<div class="card" style="text-align:center;color:var(--subtext);">No hay compras registradas.</div>';
    list.innerHTML = html;
  }

  function applyFilter() {
    const term = document.getElementById('srch').value.toLowerCase();
    const cards = document.querySelectorAll('#app .card');
    cards.forEach(c => {
       const text = c.innerText.toLowerCase();
       c.style.display = text.includes(term) ? 'block' : 'none';
    });
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
