<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Compras</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.main { max-width: 1000px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.filters { display: flex; gap: 8px; padding: 12px 24px; background: var(--base); border-bottom: 1px solid var(--crust); align-items: center; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; margin-bottom: 12px; }
.item-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; }
.item-subtext { color: var(--subtext); font-size: 11px; }
.total-row { display: flex; justify-content: flex-end; font-weight: 700; font-size: 14px; padding-top: 12px; }
.search-box { display: flex; align-items: center; gap: 6px; background: var(--base); border: 1px solid var(--surface0); border-radius: 8px; padding: 6px 12px; min-width: 240px; }
.search-box input { border: none; background: transparent; outline: none; color: var(--text); flex: 1; font-family: inherit; font-size: 13px; height: auto; width: 100%; padding: 0; }
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Historial de Compras</h2>
  </div>
</div>

<div class="filters">
  <div class="search-box">
    <span style="color:var(--subtext);font-size:14px;">🔍</span>
    <input type="text" id="srch" placeholder="Buscar por Folio, Proveedor..." oninput="applyFilter()">
  </div>
</div>

<div class="main" id="app"></div>

<script src="db.js"></script>
<script>
  let STATE_ORDERS = [];
  let canDelete = false;

  function fmt(num) { return '$' + parseFloat(num).toLocaleString('es-MX', {minimumFractionDigits:2}); }

  async function loadData() {
    STATE_ORDERS = await window.DB.query("purchase_orders");
    if (!STATE_ORDERS || STATE_ORDERS.length === 0) STATE_ORDERS = window.DB.get().orders || [];
    STATE_ORDERS = STATE_ORDERS.filter(o => !o._init && ['Comprado', 'Recibido', 'Entregado', 'Cancelado'].includes(o.status));
    STATE_ORDERS.sort((a,b) => new Date(b.date) - new Date(a.date));
    const role = window.parent?.CURRENT_USER_ROLE || '';
    canDelete = ['programador','admin','gerencia'].includes(role);
    render();
  }

  async function deleteOrder(id) {
    const o = STATE_ORDERS.find(x => x.id === id);
    if (!o) return;
    if (!confirm(`¿Eliminar la orden ${o.folio || id}? Esta acción no se puede deshacer.`)) return;
    try {
      await window.parent.deleteDocumentFromFirebase('purchase_orders', id);
      STATE_ORDERS = STATE_ORDERS.filter(x => x.id !== id);
      render();
    } catch(e) { alert('Error al eliminar: ' + e.message); }
  }

  function render() {
    const list = document.getElementById('app');
    let html = '';

    STATE_ORDERS.forEach(o => {
       const pill = (o.status === 'Recibido' || o.status === 'Entregado') ? 'pill-green' : o.status === 'Cancelado' ? 'pill-red' : 'pill-amber';
       let total = 0;

       let itmsHtml = `
         <div class="item-row" style="font-weight:700; color:var(--subtext); font-size:11px; text-transform:uppercase; border:none; padding-bottom:4px;">
           <div>Item / Cantidad</div>
           <div>P. Unitario</div>
           <div>Subtotal</div>
         </div>
       `;

       (o.items || []).forEach(i => {
          const sub = (i.qty * i.price) || 0;
          total += sub;
          itmsHtml += `
            <div class="item-row">
              <div>${i.qty}x ${i.name} <span class="item-subtext">(${i.unit})</span></div>
              <div>${fmt(i.price||0)}</div>
              <div>${fmt(sub)}</div>
            </div>
          `;
       });

       const delBtn = canDelete
         ? `<button onclick="deleteOrder('${o.id}')" style="background:none;border:none;cursor:pointer;color:var(--subtext);font-size:14px;padding:2px 6px;border-radius:4px;line-height:1;" title="Eliminar orden">🗑</button>`
         : '';

       html += `
       <div class="card">
        <div class="card-title">
          <span>Folio ${o.folio} / ${o.project || 'Stock General'} — Proveedor: ${o.supplier || o.provider || '-'}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pill ${pill}">${o.status}</span>
            ${delBtn}
          </div>
        </div>
        <div style="font-size:12px; color:var(--subtext); margin-bottom:12px;">Comprado por ${o.requester || '-'}. Fecha: ${o.date}</div>
        ${itmsHtml}
        <div class="total-row">Total de la Orden: ${fmt(total)}</div>
      </div>
       `;
    });

    if(!html) html = '<div class="card" style="text-align:center;color:var(--subtext);">No hay compras registradas.</div>';
    list.innerHTML = html;
  }

  function applyFilter() {
    const term = document.getElementById('srch').value.toLowerCase();
    const cards = document.querySelectorAll('#app .card');
    cards.forEach(c => {
       const text = c.innerText.toLowerCase();
       c.style.display = text.includes(term) ? 'block' : 'none';
    });
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
