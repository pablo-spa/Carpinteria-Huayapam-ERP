<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos de Acceso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; }
.hdr-title { font-size: 18px; font-weight: 800; }
.hdr-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }

.main { max-width: 1000px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

.legend {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  font-size: 12px; padding-bottom: 8px;
}
.leg-item { display: flex; align-items: center; gap: 6px; }
.leg-dot  { width: 10px; height: 10px; border-radius: 50%; }

/* Standard Table inside Card */
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); overflow: hidden; }
.tbl-wrap { overflow-x: auto; width: 100%; }
.tbl { width: 100%; border-collapse: collapse; min-width: 760px; }
.tbl th { padding: 10px 14px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); border-bottom: 2px solid var(--crust); background: var(--surface0); white-space: nowrap; text-align: center; }
.tbl th:first-child { text-align: left; width: 220px; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--crust); font-size: 13px; vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface0); }
.tbl tr:last-child td { border-bottom: none; }
.tbl td:first-child { font-weight: 600; font-size: 13px; }

.group-row td {
  background: var(--crust); color: var(--blue);
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
  padding: 8px 14px;
}

td.perm-cell { text-align: center; padding: 6px; }

.tog {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 82px; padding: 5px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 700; cursor: pointer; user-select: none;
  border: 1px solid transparent; transition: filter .12s;
}
.tog:hover:not(.tog-locked) { filter: brightness(.88); }
.tog-locked { cursor: default; opacity: .7; }

.tog-full     { background: rgba(64,160,43,.15);   color: var(--green); border-color: rgba(64,160,43,.3); }
.tog-readonly { background: rgba(30,102,245,.12);  color: var(--blue);  border-color: rgba(30,102,245,.25); }
.tog-none     { background: var(--surface0);       color: var(--subtext); }

.toast-wrap { position:fixed; top:70px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div>
      <div class="hdr-title">🔐 Permisos de Acceso</div>
      <div class="hdr-sub">Haz clic en una celda para cambiar el nivel: Completo → Solo lectura → Sin acceso</div>
    </div>
  </div>
  <button class="btn btn-blue" onclick="savePermissions()">Guardar cambios</button>
</div>

<div class="main">

  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div> Acceso completo</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div> Solo lectura</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--subtext)"></div> Sin acceso</div>
    <div class="leg-item" style="color:var(--subtext);">— Programador siempre tiene acceso completo</div>
  </div>

  <div class="card">
    <div class="tbl-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th>Módulo / Sección</th>
          <th>Admin</th>
          <th>Gerencia</th>
          <th>Contador</th>
          <th>Compras</th>
          <th>Almacén</th>
          <th>Producción</th>
        </tr>
      </thead>
      <tbody id="perm-body"></tbody>
    </table>
    </div>
  </div>

</div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// Roles editables (programador siempre completo, se omite de la tabla)
const ROLES = ['admin', 'gerencia', 'contador', 'compras', 'almacen', 'produccion'];

const SECTIONS = [
  { type: 'group', title: 'General' },
  { id: 'dashboard',   label: 'Dashboard',       sub: 'Dashboard · Directorio CRM' },

  { type: 'group', title: 'Diseño y Proyectos' },
  { id: 'proyectos',    label: 'Proyectos',        sub: 'Lista y detalle de proyectos' },
  { id: 'cotizaciones', label: 'Cotizaciones',     sub: 'Nueva cotización · PDF' },
  { id: 'fichas_tecnicas', label: 'Fichas Técnicas', sub: 'Fichas técnicas de piezas' },

  { type: 'group', title: 'Contabilidad y RRHH' },
  { id: 'finanzas', label: 'Contabilidad', sub: 'Ingresos, gastos y transferencias' },
  { id: 'nomina',   label: 'Nómina Semanal',        sub: 'Cálculo y registro de nómina' },
  { id: 'rh',       label: 'Trabajadores (RH)',      sub: 'Fichas, asistencias, trabajadores' },
  { id: 'reloj',    label: 'Reloj Checador',         sub: 'Registro de entrada/salida' },
  { id: 'viaticos', label: 'Viáticos',               sub: 'Gestión de viajes y anticipos' },
  { id: 'accidentes', label: 'Bitácora Accidentes',  sub: 'Registro de incidentes y salud laboral' },

  { type: 'group', title: 'Compras y Almacén' },
  { id: 'pedidos',    label: 'Pedidos / Autorizaciones', sub: 'Hoja de pedido · Autorizar pedidos · Confirmar pedidos' },
  { id: 'compras_oc', label: 'Panel de Compras',         sub: 'Cotizar precios · marcar como comprado' },
  { id: 'almacen',    label: 'Inventario y Almacén',     sub: 'Inventario · Salidas · Recepción de almacén' },
  { id: 'herramientas', label: 'Herramientas',           sub: 'Control y salida de herramientas' },
  { id: 'madera',     label: 'Almacén de Madera',        sub: 'Control de madera · Escaneo' },

  { type: 'group', title: 'Operaciones' },
  { id: 'produccion', label: 'Producción Diaria',  sub: 'Registro de trabajos del día' },
  { id: 'vehiculos',  label: 'Vehículos y Flotilla', sub: 'Mantenimiento, seguros y gasolina' },
  { id: 'mantenimiento', label: 'Bitácora Mantenimiento', sub: 'Servicios a maquinaria, taller y extintores' },

  { type: 'group', title: 'Administración' },
  { id: 'documentos',    label: 'Documentos',         sub: 'Repositorio de documentos Drive' },

  { type: 'group', title: 'Administración del Sistema' },
  { id: 'admin_usuarios', label: 'Gestión de Usuarios', sub: 'Crear y editar usuarios del sistema' },
  { id: 'admin_listas',   label: 'Reglas, Ajustes y Listas', sub: 'admin_config · admin_listas' },
  { id: 'admin_db',       label: 'Esquema de DB',       sub: 'Estructura de colecciones' },
  { id: 'admin_permisos', label: 'Permisos de Acceso',  sub: 'Esta pantalla' },
  { id: 'admin_papelera', label: 'Papelera Cotizaciones', sub: 'Restaurar o eliminar cotizaciones' },
  { id: 'admin_bugs',     label: 'Bugs y Reportes',     sub: 'Reporte de errores del sistema' },
  { id: 'wiki',           label: 'Wiki / Manual',       sub: 'Manual del sistema' },
];

let perms = {};

function init() {
  if (window.parent?.PERMISOS) perms = JSON.parse(JSON.stringify(window.parent.PERMISOS));
  SECTIONS.filter(s => !s.type).forEach(s => {
    if (!perms[s.id]) perms[s.id] = {};
    ROLES.forEach(r => { if (perms[s.id][r] === undefined) perms[s.id][r] = 'none'; });
  });
  renderTable();
}

function cycle(secId, role) {
  const order = ['full', 'readonly', 'none'];
  const cur = perms[secId]?.[role] || 'none';
  perms[secId][role] = order[(order.indexOf(cur) + 1) % order.length];
  renderTable();
}

function togHTML(secId, role) {
  const v = perms[secId]?.[role] || 'none';
  const map = { full: ['tog-full', 'Completo'], readonly: ['tog-readonly', 'Lectura'], none: ['tog-none', 'No'] };
  const [cls, lbl] = map[v] || map.none;
  return `<span class="tog ${cls}" data-sec="${secId}" data-role="${role}">${lbl}</span>`;
}

function renderTable() {
  let html = '';
  SECTIONS.forEach(s => {
    if (s.type === 'group') {
      html += `<tr class="group-row"><td colspan="${ROLES.length + 1}">${s.title}</td></tr>`;
    } else {
      html += `<tr>
        <td>
          <div>${s.label}</div>
          <div style="font-size:11px;color:var(--subtext);margin-top:1px;">${s.sub}</div>
        </td>
        ${ROLES.map(r => `<td class="perm-cell">${togHTML(s.id, r)}</td>`).join('')}
      </tr>`;
    }
  });
  document.getElementById('perm-body').innerHTML = html;
}

document.addEventListener('click', e => {
  const tog = e.target.closest('.tog:not(.tog-locked)');
  if (!tog) return;
  const { sec, role } = tog.dataset;
  if (sec && role) cycle(sec, role);
});

async function savePermissions() {
  try {
    const data = JSON.parse(JSON.stringify(perms));
    // Ensure programador always gets full on save
    SECTIONS.filter(s => !s.type).forEach(s => {
      if (!data[s.id]) data[s.id] = {};
      data[s.id].programador = 'full';
    });
    await window.parent.setDocumentInFirebase('config_params', 'permisos', data);
    window.parent.PERMISOS = data;
    toast('Permisos guardados.');
  } catch(e) {
    toast('Error: ' + e.message, 'err');
  }
}

function toast(msg, type = 'ok') {
  const wrap = document.getElementById('toast-wrap');
  const bg = type === 'err' ? 'var(--red)' : 'var(--green)';
  const el = document.createElement('div');
  el.style.cssText = `background:${bg};color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
