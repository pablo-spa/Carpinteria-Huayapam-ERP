<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloj Checador - Carpintería Huayapam</title>
<script src="db.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--base);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  gap: 0;
}

.clock {
  font-size: 5.5rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--text);
}

.date-str {
  font-size: 1.1rem;
  color: var(--subtext);
  margin-top: 6px;
  margin-bottom: 36px;
  text-transform: capitalize;
}

.scan-input {
  width: 100%;
  max-width: 400px;
  padding: 14px 24px;
  font-size: 1.4rem;
  text-align: center;
  border: 2px solid var(--surface1);
  border-radius: 9999px;
  background: var(--mantle);
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  margin-bottom: 28px;
  font-family: inherit;
}
.scan-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(137,180,250,.18);
}
.scan-input::placeholder { color: var(--subtext); font-size: 1.1rem; }

.status-box {
  background: var(--mantle);
  border: 1px solid var(--crust);
  border-radius: 16px;
  padding: 28px 32px;
  width: 90%;
  max-width: 480px;
  text-align: center;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: background .3s, border-color .3s, box-shadow .3s;
}
.status-box.success { background: rgba(166,227,161,.08); border-color: var(--green); box-shadow: 0 0 40px rgba(166,227,161,.18); }
.status-box.warning { background: rgba(249,226,175,.08); border-color: var(--amber); box-shadow: 0 0 40px rgba(249,226,175,.18); }
.status-box.error   { background: rgba(243,139,168,.08); border-color: var(--red);   box-shadow: 0 0 40px rgba(243,139,168,.18); }

.idle-msg { color: var(--subtext); font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.idle-icon { font-size: 2.8rem; opacity: .5; }

.worker-name { font-size: 1.9rem; font-weight: 700; margin-bottom: 4px; }
.worker-role { color: var(--subtext); margin-bottom: 14px; font-size: .95rem; }
.scan-type   { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.scan-detail { font-size: 1rem; opacity: .75; margin-top: 8px; }
</style>
</head>
<body>

<div class="clock"  id="clock">00:00:00</div>
<div class="date-str" id="date-str">Cargando...</div>

<input type="text" id="scan-input" class="scan-input" placeholder="Escanea tu gafete" autofocus autocomplete="off" spellcheck="false">

<div class="status-box" id="status-box">
  <div class="idle-msg" id="idle-msg">
    <span class="idle-icon">🪪</span>
    Aproxima tu gafete al escáner
  </div>
  <div id="active-content" style="display:none;">
    <div class="worker-name"  id="w-name"></div>
    <div class="worker-role"  id="w-role"></div>
    <div class="scan-type"    id="s-type"></div>
    <div class="scan-detail"  id="s-detail"></div>
  </div>
</div>

<script>
/* ── Clock ──────────────────────────────── */
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('es-MX', { hour12: false });
  document.getElementById('date-str').textContent = now.toLocaleDateString('es-MX',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }
  ).replace(/^\w/, c => c.toUpperCase());
}
setInterval(tick, 1000);
tick();

/* ── Workers ────────────────────────────── */
let WORKERS_CACHE = [];
async function init() {
  const all = await window.DB.query('contacts', { tipo: 'trabajador', activo: true });
  WORKERS_CACHE = window.parent?.getWorkersSorted ? window.parent.getWorkersSorted(all) : all;
}
document.addEventListener('DOMContentLoaded', init);

/* ── Scanner ────────────────────────────── */
const input = document.getElementById('scan-input');
document.addEventListener('click', () => input.focus());
setInterval(() => { if (document.activeElement !== input) input.focus(); }, 1000);

let resetTimeout;
input.addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const code = input.value.trim();
    input.value = '';
    if (code) await processScan(code);
  }
});

/* ── Scan logic ─────────────────────────── */
async function processScan(code) {
  const worker = WORKERS_CACHE.find(w => w.scanCode === code || w.id === code || w.personalId === code);
  if (!worker) { showStatus('error', 'CÓDIGO NO RECONOCIDO', '', '', 'Empleado no encontrado'); return; }

  const now      = new Date();
  const todayStr = now.toISOString().split('T')[0];
  const timeStr  = now.toLocaleTimeString('es-MX', { hour12: false });

  const logs = await window.DB.query('attendance_logs', { workerId: worker.id, fecha: todayStr });
  const db   = window.DB.get();

  const rawCfg = db.settings;
  const cfg = Array.isArray(rawCfg) ? (rawCfg.find(x => x._id === 'main') || rawCfg[0] || {}) : (rawCfg || {});
  const horaEntrada    = cfg.horaEntrada        || '08:00';
  const minutosRetardo = cfg.minutosRetardo      ?? 15;
  const minutosFalta   = cfg.minutosFalta        ?? 60;
  const horaSalida     = cfg.horaSalida          || '17:30';
  const tolSalidaMin   = cfg.toleranciaSalidaMin ?? 15;
  const tolAntesSalida = 5;
  const descansoMin    = cfg.tiempoDescansoMin   ?? 30;

  const pendingEntry = logs.find(l => !l.hora_salida);

  /* SALIDA */
  if (logs.length > 0 && pendingEntry) {
    const log  = pendingEntry;
    const exitMins         = now.getHours() * 60 + now.getMinutes();
    const [hSal, mSal]     = horaSalida.split(':').map(Number);
    const officialExitMins = hSal * 60 + mSal;
    const diffFromExit     = exitMins - officialExitMins;

    const entradaEfectiva     = log.hora_entrada_efectiva || log.hora_entrada || horaEntrada;
    const [hEE, mEE]          = entradaEfectiva.substring(0, 5).split(':').map(Number);
    const entradaEfectivaMins = hEE * 60 + mEE;

    let horasNormal = 0, horasExtra = 0, salidaEfectiva = '';

    if (diffFromExit > tolSalidaMin) {
      salidaEfectiva = timeStr.substring(0, 5);
      horasExtra     = diffFromExit / 60;
      horasNormal    = Math.max(0, (officialExitMins - entradaEfectivaMins - descansoMin)) / 60;
    } else if (diffFromExit >= -tolAntesSalida) {
      salidaEfectiva = horaSalida;
      horasNormal    = Math.max(0, (officialExitMins - entradaEfectivaMins - descansoMin)) / 60;
    } else {
      salidaEfectiva = timeStr.substring(0, 5);
      horasNormal    = Math.max(0, (exitMins - entradaEfectivaMins - descansoMin)) / 60;
    }

    horasNormal = Math.round(horasNormal * 100) / 100;
    horasExtra  = Math.round(horasExtra  * 100) / 100;

    const updatedLog = {
      ...log,
      hora_salida:          timeStr,
      hora_salida_efectiva: salidaEfectiva,
      tipo:                 'salida',
      estado:               log.status || 'trabajo',
      horasNormal,
      horasExtra,
      horasDoble:           0,
      horasTotales:         horasNormal + horasExtra,
      retardoMin:           log.retardoMin || 0,
      descansoMin,
    };

    if (window.parent?.setDocumentInFirebase)
      window.parent.setDocumentInFirebase('attendance_logs', log.id, updatedLog);
    if (window.parent?.DB_STATE?.attendance_logs) {
      const idx = window.parent.DB_STATE.attendance_logs.findIndex(l => l.id === log.id);
      if (idx !== -1) window.parent.DB_STATE.attendance_logs[idx] = updatedLog;
    }

    const hrsLabel = horasExtra > 0
      ? `${horasNormal.toFixed(1)}h normales + ${horasExtra.toFixed(1)}h extra`
      : `${horasNormal.toFixed(1)} hrs trabajadas`;
    showStatus('success', 'SALIDA REGISTRADA', worker.name || worker.givenName, worker.role, hrsLabel);

  } else if (logs.length > 0) {
    showStatus('warning', 'TURNO COMPLETO', worker.name || worker.givenName, worker.role, 'Ya registraste entrada y salida hoy');

  } else {
    /* ENTRADA */
    const [hE, mE]       = horaEntrada.split(':').map(Number);
    const oficialStartMs = new Date().setHours(hE, mE, 0, 0);
    const diffMins       = Math.floor((now - oficialStartMs) / 60000);

    let statusTxt = 'trabajo', statusClass = 'success', retardoMin = 0;
    let entradaEfectiva = horaEntrada;
    let detalle = '';

    if (diffMins <= 0) {
      entradaEfectiva = horaEntrada;
      detalle = `${Math.abs(diffMins)} min antes del inicio`;
    } else if (diffMins <= minutosRetardo) {
      entradaEfectiva = horaEntrada;
      detalle = 'A tiempo';
    } else {
      statusTxt = 'retardo'; statusClass = 'warning';
      retardoMin = diffMins;
      entradaEfectiva = timeStr.substring(0, 5);
      detalle = diffMins > minutosFalta
        ? `Retardo muy largo: ${diffMins} min — revisar con RH`
        : `Retardo de ${diffMins} min`;
    }

    const newCheckin = {
      id:                    crypto.randomUUID(),
      workerId:              worker.id,
      fecha:                 todayStr,
      hora_entrada:          timeStr,
      hora_entrada_efectiva: entradaEfectiva,
      tipo:                  'entrada',
      registrado_por:        'reloj',
      status:                statusTxt,
      retardoMin,
      alerta_rh:             retardoMin > minutosFalta,
    };

    if (window.parent?.setDocumentInFirebase)
      window.parent.setDocumentInFirebase('attendance_logs', newCheckin.id, newCheckin);
    if (window.parent?.DB_STATE) {
      if (!window.parent.DB_STATE.attendance_logs) window.parent.DB_STATE.attendance_logs = [];
      window.parent.DB_STATE.attendance_logs.push(newCheckin);
    }

    showStatus(statusClass, 'ENTRADA REGISTRADA', worker.name || worker.givenName, worker.role, detalle);
  }
}

/* ── UI ─────────────────────────────────── */
function showStatus(type, title, name, role, detail = '') {
  const box    = document.getElementById('status-box');
  const idle   = document.getElementById('idle-msg');
  const active = document.getElementById('active-content');

  box.className = 'status-box ' + type;
  idle.style.display   = 'none';
  active.style.display = 'block';

  if (type === 'error' && !name) {
    document.getElementById('w-name').textContent   = 'ERROR';
    document.getElementById('w-role').textContent   = '';
    document.getElementById('s-type').textContent   = title;
    document.getElementById('s-detail').textContent = detail;
  } else {
    document.getElementById('w-name').textContent   = name;
    document.getElementById('w-role').textContent   = role || '';
    document.getElementById('s-type').textContent   = title;
    document.getElementById('s-detail').textContent = detail;
  }

  clearTimeout(resetTimeout);
  resetTimeout = setTimeout(() => {
    box.className = 'status-box';
    idle.style.display   = 'block';
    active.style.display = 'none';
  }, 4000);
}
</script>
</body>
</html>
