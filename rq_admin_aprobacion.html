<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorizar Pedidos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding-bottom: 40px; }
.main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 12px; }
.card-meta { font-size: 12px; color: var(--subtext); margin-bottom: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
.status-flow { display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin:8px 0 4px; }
.sf-step { font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--surface0); color:var(--subtext); white-space:nowrap; }
.sf-done  { background:rgba(64,160,43,0.15); color:var(--green); opacity:.7; }
.sf-active{ background:rgba(30,102,245,0.15); color:var(--blue); }
.sf-sep { font-size:9px; color:var(--subtext); margin:0 1px; }
.col-hdr { display: grid; grid-template-columns: 2.5fr 1.5fr 1fr 1fr 1fr; gap: 8px; font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; padding: 6px 0; border-bottom: 1px solid var(--crust); margin-bottom: 4px; }
.item-row { display: grid; grid-template-columns: 2.5fr 1.5fr 1fr 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; }
.item-subtext { color: var(--subtext); font-size: 11px; }
.price-pending { color: var(--amber); font-size: 11px; }
.total-row { display: flex; justify-content: flex-end; font-weight: 700; font-size: 15px; padding-top: 12px; color: var(--text); gap: 8px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--crust); }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: opacity .15s; font-family: inherit; font-size: 13px; }
.btn:hover { opacity: .8; }
.btn-green { background: var(--green); color: #fff; }
.btn-red   { background: var(--red); color: #fff; }
.btn-gray  { background: var(--surface0); color: var(--text); }
.empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.empty-sub { font-size: 14px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--crust); background: var(--mantle); color: var(--subtext); font-size: 12px; font-weight: 600; cursor: pointer; }
.tab.act { background: var(--text); color: var(--base); border-color: var(--text); }
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <div>
      <h2 class="hdr-title">Autorizar Pedidos</h2>
      <div class="hdr-sub" id="hdr-count" style="font-size:12px; color:var(--subtext); margin-top:2px;">Cargando…</div>
    </div>
  </div>
  <button class="btn btn-green" onclick="window.parent?.openModule('rq_almacen.html?status=Autorizado','Hoja de Pedido')" style="padding:8px 14px; font-size:13px;">Nueva Hoja de Pedido</button>
</div>

<!-- New Order Modal (reemplazado por rq_almacen) -->
<div id="new-order-modal" style="display:none; pointer-events:none; visibility:hidden; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(2px);">
  <div style="background:var(--base); border-radius:14px; width:100%; max-width:580px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.3); overflow:hidden;">
    <div style="padding:16px 20px; border-bottom:1px solid var(--crust); background:var(--mantle); display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:16px; font-weight:800;">Nuevo Pedido Autorizado</span>
      <button onclick="closeNewOrder()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--subtext);">✕</button>
    </div>
    <div style="padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field-g">
          <label class="lbl-g">Proyecto</label>
          <select id="no-proj" data-searchable style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--crust); background:var(--mantle); color:var(--text); font-family:inherit; font-size:13px;">
            <option value="">— Stock General —</option>
          </select>
        </div>
        <div class="field-g">
          <label class="lbl-g">Proveedor</label>
          <select id="no-prov" data-searchable style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--crust); background:var(--mantle); color:var(--text); font-family:inherit; font-size:13px;">
            <option value="">— Sin especificar —</option>
          </select>
        </div>
      </div>
      <div class="field-g">
        <label class="lbl-g">Notas</label>
        <textarea id="no-notes" rows="2" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--crust); background:var(--mantle); color:var(--text); font-family:inherit; font-size:13px;" placeholder="Justificación o indicaciones para Compras…"></textarea>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label class="lbl-g">Materiales</label>
          <button onclick="addNoRow()" class="btn" style="padding:4px 10px; font-size:12px;">+ Renglón</button>
        </div>
        <table style="width:100%; border-collapse:collapse;">
          <thead><tr>
            <th style="text-align:left; font-size:11px; font-weight:700; color:var(--subtext); padding:4px 6px; border-bottom:2px solid var(--crust);">Concepto</th>
            <th style="text-align:right; font-size:11px; font-weight:700; color:var(--subtext); padding:4px 6px; border-bottom:2px solid var(--crust); width:70px;">Cant.</th>
            <th style="text-align:left; font-size:11px; font-weight:700; color:var(--subtext); padding:4px 6px; border-bottom:2px solid var(--crust); width:80px;">Unidad</th>
            <th style="text-align:right; font-size:11px; font-weight:700; color:var(--subtext); padding:4px 6px; border-bottom:2px solid var(--crust); width:90px;">Precio unit.</th>
            <th style="width:30px; border-bottom:2px solid var(--crust);"></th>
          </tr></thead>
          <tbody id="no-items"></tbody>
        </table>
      </div>
    </div>
    <div style="padding:14px 20px; border-top:1px solid var(--crust); background:var(--mantle); display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" onclick="closeNewOrder()">Cancelar</button>
      <button class="btn btn-green" onclick="saveNewOrder()">Crear y Autorizar</button>
    </div>
  </div>
</div>
<style>
.lbl-g { font-size:10px; font-weight:700; color:var(--subtext); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px; }
.no-inp { width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--crust); background:var(--base); color:var(--text); font-family:inherit; font-size:13px; }
.no-inp:focus { outline:none; border-color:var(--blue); }

/* Concept autocomplete */
.ac-wrap { position:relative; }
.ac-drop { position:fixed; background:var(--base); border:1px solid var(--surface0); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:9999; max-height:200px; overflow-y:auto; display:none; }
.ac-drop.open { display:block; }
.ac-item { padding:8px 12px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--crust); }
.ac-item:last-child { border-bottom:none; }
.ac-item:hover, .ac-item.focused { background:var(--surface0); }
.ac-item-name { font-weight:600; color:var(--text); }
.ac-item-meta { font-size:11px; color:var(--subtext); margin-left:8px; white-space:nowrap; }
.ac-new { color:var(--blue); font-style:italic; }
</style>

<div class="main">
  <div id="orders-list"></div>
</div>

<script src="searchable-select.js"></script>
<script src="ui.js"></script>
<script src="db.js"></script>
<script>
  let ALL_ORDERS = [];

  async function init() {
    const orders = await window.DB.query('purchase_orders');
    const fallback = await window.DB.query('orders');
    ALL_ORDERS = orders.length ? orders : fallback;
    ALL_ORDERS = ALL_ORDERS.filter(o => o.id && !o._init);
    render();
  }

  function statusFlow(cur) {
    const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
    const ci = steps.findIndex(([s]) => s === cur);
    return '<div class="status-flow">' + steps.map(([,lbl], i) =>
      (i > 0 ? '<span class="sf-sep">›</span>' : '') +
      `<span class="sf-step ${i < ci ? 'sf-done' : i === ci ? 'sf-active' : ''}">${lbl}</span>`
    ).join('') + '</div>';
  }

  const PILL_MAP = {'Pedido':'pill-amber','Solicitado':'pill-amber','Confirmado':'pill-blue','Autorizado':'pill-green','Comprado':'pill-green','Recibido':'pill-green','Cancelado':'pill-red'};
  const fmt = n => '$'+parseFloat(n).toLocaleString('es-MX',{minimumFractionDigits:2});

  function projLabel(o, d) {
    const p = (d.projects||[]).find(p => p.id === o.projectId || (p.codigo||p.code) === o.project);
    return p ? `${p.codigo||p.code} – ${p.nombre||p.name}` : (o.project || 'Stock General');
  }

  // Ficha con tabla de precios (visible para admin/compras/contabilidad)
  function fichaConPrecios(o, d, withActions) {
    const items = o.items || [];
    const allPriced = items.every(i => parseFloat(i.price) > 0);
    const iqty = i => parseFloat(i.tipo === 'madera' ? i.cantidad : i.qty) || 0;
    const total = items.reduce((s,i) => s + iqty(i)*(parseFloat(i.price)||0), 0);
    const canApprove = allPriced && withActions;
    const pill = PILL_MAP[o.status] || 'pill-gray';
    return `
      <div class="ficha" id="card-${o.id}" ${!withActions?'style="opacity:.75;"':''}>
        <div class="ficha-hdr"><span class="ficha-folio">${o.folio||o.id}</span><span class="pill ${pill}">${o.status}</span></div>
        <div class="ficha-meta">
          <span>📁 ${projLabel(o,d)}</span>
          ${o.requester?`<span>👤 ${o.requester}</span>`:''}
          ${o.date?`<span>📅 ${o.date}</span>`:''}
          ${o.cuentaPago?`<span>🏦 ${o.cuentaPago}</span>`:''}
          ${o.notes?`<span>📝 ${o.notes}</span>`:''}
        </div>
        ${statusFlow(o.status)}
        <div class="ficha-items" style="display:flex; flex-direction:column; gap:8px; margin:12px 0 8px;">
          ${items.map(i => window.renderPurchaseCardItem(i, { showPrice: true, showSupplier: true, orderProvider: o.provider })).join('')}
        </div>
        ${allPriced&&total>0?`<div class="ficha-total" style="display:flex; justify-content:flex-end; font-size:16px; font-weight:800; padding:12px 4px 4px;"><span>Total:</span><span style="margin-left:12px;">${fmt(total)}</span></div>`:''}
        ${withActions ? `
        <div class="ficha-actions">
          <button class="btn btn-red"  onclick="act('${o.id}','Cancelado')">✕ Rechazar</button>
          <button class="btn btn-gray" onclick="act('${o.id}','Pedido')">↩ Re-Cotizar</button>
          <button class="btn btn-green" style="${canApprove?'':'opacity:.4;pointer-events:none;'}"
            onclick="act('${o.id}','Autorizado')">✓ Autorizar${allPriced&&total>0?' '+fmt(total):' (faltan precios)'}</button>
        </div>` : ''}
      </div>`;
  }

  function secHdr(label, count) {
    return `<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:20px 0 8px;">${label}${count!=null?' ('+count+')':''}</div>`;
  }

  function render() {
    const list = document.getElementById('orders-list');
    const d = window.DB.get();
    list.innerHTML = '';

    const sorted = [...ALL_ORDERS].sort((a,b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));
    const pending = sorted.filter(o => o.status === 'Confirmado');
    const rest    = sorted.filter(o => o.status !== 'Confirmado');

    document.getElementById('hdr-count').textContent =
      pending.length ? `${pending.length} pedido(s) esperando autorización` : 'Sin pedidos pendientes';

    if (!sorted.length) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Sin pedidos registrados</div></div>`;
      return;
    }

    // Sección 1: Accionables
    list.insertAdjacentHTML('beforeend', secHdr('⏳ Por Autorizar', pending.length));
    if (pending.length) {
      pending.forEach(o => list.insertAdjacentHTML('beforeend', fichaConPrecios(o, d, true)));
    } else {
      list.insertAdjacentHTML('beforeend', `<div style="color:var(--subtext);text-align:center;padding:20px;background:var(--mantle);border-radius:12px;border:1px solid var(--crust);margin-bottom:14px;">Sin pedidos esperando autorización.</div>`);
    }

    // Sección 2: En proceso (activas, no terminales)
    const TERMINAL = ['Cancelado','Recibido','Entregado'];
    const enProceso = rest.filter(o => !TERMINAL.includes(o.status));
    if (enProceso.length) {
      const isOpen = localStorage.getItem('rq_apro_hist') !== 'closed';
      list.insertAdjacentHTML('beforeend', `
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--subtext);padding:20px 0 8px;cursor:pointer;display:flex;justify-content:space-between;" onclick="toggleAproHist(this)">
          <span>En Proceso (${enProceso.length})</span><span>${isOpen ? '▲' : '▼'}</span>
        </div>
        <div id="apro-hist-body" style="display:${isOpen ? 'block' : 'none'};">`);
      enProceso.forEach(o => list.insertAdjacentHTML('beforeend', fichaConPrecios(o, d, false)));
      list.insertAdjacentHTML('beforeend', '</div>');
    }
  }

  function toggleAproHist(hdr) {
    const body = document.getElementById('apro-hist-body');
    if (!body) return;
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    hdr.querySelector('span:last-child').textContent = open ? '▼' : '▲';
    localStorage.setItem('rq_apro_hist', open ? 'closed' : 'open');
  }

  async function act(id, newStatus) {
    const order = ALL_ORDERS.find(o => o.id === id);
    if (!order) return;

    const verb = newStatus === 'Autorizado' ? 'autorizar' : newStatus === 'Cancelado' ? 'rechazar' : 'solicitar re-cotización de';
    if (!await showConfirm(`¿Seguro que deseas ${verb} este pedido?`)) return;

    order.status = newStatus;
    if (window.parent && window.parent.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', id, order);
      // Mirror to orders collection if present
      const d = window.DB.get();
      if (d.orders && d.orders.find(o => o.id === id)) {
        await window.parent.setDocumentInFirebase('orders', id, order);
      }
      // Update parent DB_STATE
      if (window.parent.DB_STATE) {
        ['purchase_orders','orders'].forEach(col => {
          if (window.parent.DB_STATE[col]) {
            const idx = window.parent.DB_STATE[col].findIndex(o => o.id === id);
            if (idx !== -1) window.parent.DB_STATE[col][idx] = order;
          }
        });
      }
    }
    render();
  }

  // ── New order modal ──────────────────────────────────────────────────
  async function openNewOrder() {
    const [contacts, projects, inventory] = await Promise.all([
      window.DB.query('contacts'),
      window.DB.query('projects'),
      window.DB.query('inventory'),
    ]);

    // Cache inventory for autocomplete
    window._NO_INV = inventory.filter(i => i.name && !i._init);

    // Populate project dropdown
    const projSel = document.getElementById('no-proj');
    const validProjs = projects.filter(p => (p.codigo||p.code) && (p.nombre||p.name));
    projSel.innerHTML = '<option value="">— Stock General —</option>' +
      validProjs.map(p => `<option value="${(p.codigo||p.code)}">${(p.codigo||p.code)} – ${(p.nombre||p.name)}</option>`).join('');

    // Populate supplier dropdown
    const provSel = document.getElementById('no-prov');
    const provs = contacts.filter(c => c.tipo === 'proveedor' && (c.name || c.givenName));
    provSel.innerHTML = '<option value="">— Sin especificar —</option>' +
      provs.map(p => `<option value="${(p.nombre||p.name)||p.givenName}">${(p.nombre||p.name)||p.givenName}</option>`).join('');

    if (projSel._ssInit) projSel._ssRefresh(); else SearchableSelect.init(projSel);
    if (provSel._ssInit) provSel._ssRefresh(); else SearchableSelect.init(provSel);

    document.getElementById('no-items').innerHTML = '';
    document.getElementById('no-notes').value = '';
    addNoRow();

    document.getElementById('new-order-modal').style.display = 'flex';
  }

  function closeNewOrder() {
    document.getElementById('new-order-modal').style.display = 'none';
    document.querySelectorAll('.ac-drop').forEach(d => d.remove());
  }

  function addNoRow(name='', unit='pza', price=0, qty=1) {
    const tbody = document.getElementById('no-items');
    const tr = document.createElement('tr');
    const rowId = 'row-' + Math.random().toString(36).slice(2,8);
    tr.dataset.rowId = rowId;

    tr.innerHTML = `
      <td style="padding:4px 4px;">
        <div class="ac-wrap">
          <input class="no-inp ac-input" type="text" placeholder="Buscar concepto…" value="${name}" autocomplete="off"
            oninput="acFilter(this)" onfocus="acFilter(this)" onkeydown="acKey(event,this)">
          <div class="ac-drop" id="drop-${rowId}"></div>
        </div>
      </td>
      <td style="padding:4px 4px;"><input class="no-inp i-qty" type="number" value="${qty}" min="0.01" step="any" style="text-align:right; width:70px;"></td>
      <td style="padding:4px 4px;"><input class="no-inp i-unit" type="text" value="${unit}" style="width:70px;"></td>
      <td style="padding:4px 4px;"><input class="no-inp i-price" type="number" value="${price||''}" min="0" step="any" placeholder="0.00" style="text-align:right; width:90px;"></td>
      <td style="padding:4px 2px; text-align:center;">
        <button onclick="this.closest('tr').remove()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px; line-height:1;">✕</button>
      </td>`;
    tbody.appendChild(tr);
  }

  // ── Autocomplete logic ───────────────────────────────────────────────
  function acScore(text, q) {
    const t = text.toLowerCase(), ql = q.toLowerCase();
    if (!ql) return 0;
    if (t === ql) return 0;
    if (t.startsWith(ql)) return 1;
    if (t.includes(ql)) return 2;
    // fuzzy
    let ti = 0;
    for (let i = 0; i < ql.length; i++) {
      ti = t.indexOf(ql[i], ti);
      if (ti === -1) return Infinity;
      ti++;
    }
    return 3;
  }

  function acFilter(input) {
    const tr = input.closest('tr');
    const rowId = tr.dataset.rowId;
    const drop = document.getElementById('drop-' + rowId);
    const q = input.value.trim();
    const inv = window._NO_INV || [];

    let results = inv
      .map(i => ({ ...i, s: acScore(i.name, q) }))
      .filter(i => i.s < Infinity)
      .sort((a, b) => a.s - b.s)
      .slice(0, 12);

    drop.innerHTML = '';

    if (results.length === 0 && !q) { drop.classList.remove('open'); return; }

    // Position fixed dropdown under the input
    const rect = input.getBoundingClientRect();
    drop.style.top    = (rect.bottom + 4) + 'px';
    drop.style.left   = rect.left + 'px';
    drop.style.width  = rect.width + 'px';

    results.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.dataset.idx = idx;
      div.innerHTML = `<span class="ac-item-name">${item.name}</span><span class="ac-item-meta">${item.unit||'pza'} · ${item.category||''}</span>`;
      div.addEventListener('mousedown', e => {
        e.preventDefault();
        acSelect(input, item.name, item.unit || 'pza');
      });
      drop.appendChild(div);
    });

    // "Agregar nuevo" option when typed text doesn't exactly match
    if (q && !inv.find(i => i.name.toLowerCase() === q.toLowerCase())) {
      const div = document.createElement('div');
      div.className = 'ac-item ac-new';
      div.innerHTML = `<span class="ac-item-name">+ Agregar "<strong>${q}</strong>" como nuevo concepto</span>`;
      div.addEventListener('mousedown', e => {
        e.preventDefault();
        acSelect(input, q, tr.querySelector('.i-unit').value || 'pza');
      });
      drop.appendChild(div);
    }

    drop.classList.add('open');
  }

  function acSelect(input, name, unit) {
    input.value = name;
    const tr = input.closest('tr');
    tr.querySelector('.i-unit').value = unit;
    const rowId = tr.dataset.rowId;
    document.getElementById('drop-' + rowId)?.classList.remove('open');
    tr.querySelector('.i-qty').focus();
  }

  function acKey(e, input) {
    const tr = input.closest('tr');
    const drop = document.getElementById('drop-' + tr.dataset.rowId);
    if (!drop) return;
    const items = drop.querySelectorAll('.ac-item');
    let focused = drop.querySelector('.ac-item.focused');
    const idx = focused ? parseInt(focused.dataset.idx ?? -1) : -1;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      items.forEach(i => i.classList.remove('focused'));
      const next = items[Math.min(idx + 1, items.length - 1)];
      if (next) next.classList.add('focused');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      items.forEach(i => i.classList.remove('focused'));
      const prev = items[Math.max(idx - 1, 0)];
      if (prev) prev.classList.add('focused');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (focused) focused.dispatchEvent(new MouseEvent('mousedown'));
      else drop.classList.remove('open');
    } else if (e.key === 'Escape') {
      drop.classList.remove('open');
    }
  }

  // Close dropdowns when clicking outside
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.ac-wrap')) {
      document.querySelectorAll('.ac-drop').forEach(d => d.classList.remove('open'));
    }
  });

  async function saveNewOrder() {
    const proj  = document.getElementById('no-proj').value;
    const prov  = document.getElementById('no-prov').value;
    const notes = document.getElementById('no-notes').value.trim();

    const items = [];
    document.querySelectorAll('#no-items tr').forEach(tr => {
      const name  = (tr.querySelector('.ac-input')?.value || '').trim();
      const qty   = parseFloat(tr.querySelector('.i-qty')?.value) || 0;
      const unit  = (tr.querySelector('.i-unit')?.value || 'pza').trim();
      const price = parseFloat(tr.querySelector('.i-price')?.value) || 0;
      if (name && qty > 0) {
        const invItem = (window._NO_INV || []).find(i => i.name.toLowerCase() === name.toLowerCase());
        items.push({ name, qty, unit, price, code: invItem?.code || '' });
      }
    });

    if (!items.length) { toast('Agrega al menos un material.', 'error'); return; }

    const now = new Date();
    const folio = 'ADM-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') +
                  String(now.getDate()).padStart(2,'0') + '-' + String(now.getTime()).slice(-4);

    const order = {
      id: crypto.randomUUID(),
      folio,
      date: now.toISOString().slice(0,10),
      status: 'Autorizado',
      project: proj,
      provider: prov,
      notes,
      items,
      createdAt: now.toISOString(),
      authorizedAt: now.toISOString(),
    };

    try {
      if (window.parent?.setDocumentInFirebase) {
        await window.parent.setDocumentInFirebase('purchase_orders', order.id, order);
        if (window.parent.DB_STATE) {
          if (!window.parent.DB_STATE.purchase_orders) window.parent.DB_STATE.purchase_orders = [];
          window.parent.DB_STATE.purchase_orders.push(order);
        }
      }
      ALL_ORDERS.push(order);
      closeNewOrder();
      setTab('all');
      toast(`Pedido ${folio} creado y autorizado.`);
    } catch(e) {
      console.error('Error guardando pedido:', e);
      toast('Error al guardar el pedido: ' + e.message, 'error');
    }
  }

  init();

function toast(msg, type='ok') {
  const el = document.createElement('div');
  const bg = type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--green)';
  el.style.cssText = `position:fixed;top:70px;right:14px;z-index:9999;background:${bg};color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:300px;`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showConfirm(msg, okLabel = 'Confirmar') {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;';
    ov.innerHTML = `<div style="background:var(--base,#eff1f5);border-radius:12px;padding:24px 28px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25);"><p style="margin:0 0 20px;font-size:14px;font-weight:600;color:var(--text,#4c4f69);line-height:1.5;">${msg}</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button id="sc-no" style="padding:8px 18px;border-radius:7px;border:1px solid var(--crust,#dce0e8);background:var(--mantle,#e6e9ef);color:var(--text,#4c4f69);font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button><button id="sc-yes" style="padding:8px 18px;border-radius:7px;border:none;background:var(--blue,#1e66f5);color:#fff;font-size:13px;font-weight:700;cursor:pointer;">${okLabel}</button></div></div>`;
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelector('#sc-no').onclick  = () => done(false);
    ov.querySelector('#sc-yes').onclick = () => done(true);
    ov.addEventListener('mousedown', e => { if (e.target === ov) done(false); });
  });
}
</script>
</body>
