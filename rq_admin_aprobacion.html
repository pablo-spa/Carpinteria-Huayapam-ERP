<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorizar Pedidos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8;
  --surface0: #ccd0da; --surface1: #bcc0cc;
  --text: #4c4f69; --subtext: #8c8fa1;
  --blue: #1e66f5; --green: #40a02b; --amber: #df8e1d; --red: #d20f39;
}
@media (prefers-color-scheme: dark) {
  :root {
    --base: #1e1e2e; --mantle: #181825; --crust: #11111b;
    --surface0: #313244; --surface1: #45475a;
    --text: #cdd6f4; --subtext: #a6adc8;
    --blue: #8caaee; --green: #a6da95; --amber: #f9e2af; --red: #f38ba8;
  }
}
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding-bottom: 40px; }
.hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; }
.hdr h2 { font-size: 18px; font-weight: 800; }
.hdr-sub { font-size: 13px; color: var(--subtext); }
.main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 12px; }
.card-meta { font-size: 12px; color: var(--subtext); margin-bottom: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface0); color: var(--subtext); white-space: nowrap; }
.badge-pending { background: rgba(223,142,29,0.15); color: var(--amber); }
.badge-quoted  { background: rgba(30,102,245,0.15); color: var(--blue); }
.badge-authorized { background: rgba(64,160,43,0.15); color: var(--green); }
.col-hdr { display: grid; grid-template-columns: 2.5fr 1.5fr 1fr 1fr 1fr; gap: 8px; font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; padding: 6px 0; border-bottom: 1px solid var(--crust); margin-bottom: 4px; }
.item-row { display: grid; grid-template-columns: 2.5fr 1.5fr 1fr 1fr 1fr; gap: 8px; font-size: 13px; color: var(--text); padding: 8px 0; border-top: 1px solid var(--crust); align-items: center; }
.item-subtext { color: var(--subtext); font-size: 11px; }
.price-pending { color: var(--amber); font-size: 11px; }
.total-row { display: flex; justify-content: flex-end; font-weight: 700; font-size: 15px; padding-top: 12px; color: var(--text); gap: 8px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--crust); }
.btn { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: opacity .15s; font-family: inherit; font-size: 13px; }
.btn:hover { opacity: .8; }
.btn-green { background: var(--green); color: #fff; }
.btn-red   { background: var(--red); color: #fff; }
.btn-gray  { background: var(--surface0); color: var(--text); }
.empty { text-align: center; padding: 60px 20px; color: var(--subtext); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.empty-sub { font-size: 14px; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--crust); background: var(--mantle); color: var(--subtext); font-size: 12px; font-weight: 600; cursor: pointer; }
.tab.act { background: var(--text); color: var(--base); border-color: var(--text); }
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h2>Autorizar Pedidos</h2>
    <div class="hdr-sub" id="hdr-count">Cargando…</div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab act" onclick="setTab('pending')">Pendientes</div>
    <div class="tab" onclick="setTab('all')">Todos</div>
  </div>
  <div id="orders-list"></div>
</div>

<script src="db.js"></script>
<script>
  let ALL_ORDERS = [];
  let currentTab = 'pending';

  async function init() {
    const orders = await window.DB.query('purchase_orders');
    const fallback = await window.DB.query('orders');
    ALL_ORDERS = orders.length ? orders : fallback;
    ALL_ORDERS = ALL_ORDERS.filter(o => o.id && !o._init);
    render();
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('act'));
    document.querySelectorAll('.tab').forEach(t => {
      if ((tab === 'pending' && t.textContent === 'Pendientes') ||
          (tab === 'all'     && t.textContent === 'Todos')) t.classList.add('act');
    });
    render();
  }

  function render() {
    const list = document.getElementById('orders-list');
    const d = window.DB.get();

    let filtered = currentTab === 'pending'
      ? ALL_ORDERS.filter(o => o.status === 'Cotizado' || o.status === 'Pedido' || o.status === 'Solicitado')
      : ALL_ORDERS;

    const pending = ALL_ORDERS.filter(o => o.status === 'Cotizado' || o.status === 'Pedido' || o.status === 'Solicitado');
    document.getElementById('hdr-count').textContent =
      pending.length ? `${pending.length} pedido(s) esperando autorización` : 'Sin pedidos pendientes';

    if (!filtered.length) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${currentTab === 'pending' ? '✅' : '📭'}</div>
          <div class="empty-title">${currentTab === 'pending' ? 'Sin pedidos pendientes' : 'Sin pedidos registrados'}</div>
          <div class="empty-sub">${currentTab === 'pending' ? 'No hay pedidos esperando autorización.' : 'Los pedidos creados en Pedidos Kanban aparecerán aquí.'}</div>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(o => {
      const proj = d.projects.find(p => p.id === o.projectId || p.code === o.project) || null;
      const projLabel = proj ? `${proj.code} – ${proj.name}` : (o.project || 'Sin proyecto');

      const statusMap = {
        'Pedido':     ['badge-pending', 'Solicitado'],
        'Solicitado': ['badge-pending', 'Solicitado'],
        'Cotizado':   ['badge-quoted',  'Cotizado por Compras'],
        'Autorizado': ['badge-authorized', 'Autorizado'],
        'Comprado':   ['badge-authorized', 'Comprado'],
        'Recibido':   ['badge-authorized', 'Recibido'],
        'Cancelado':  ['',              'Cancelado'],
      };
      const [badgeClass, badgeLabel] = statusMap[o.status] || ['', o.status || 'Sin estado'];

      const items = o.items || [];
      const allPriced = items.every(i => parseFloat(i.price) > 0);
      const total = items.reduce((s, i) => s + (parseFloat(i.qty) || 0) * (parseFloat(i.price) || 0), 0);
      const canApprove = allPriced && (o.status === 'Cotizado' || o.status === 'Pedido' || o.status === 'Solicitado');
      const isPending  = o.status === 'Cotizado' || o.status === 'Pedido' || o.status === 'Solicitado';

      return `
        <div class="card" id="card-${o.id}">
          <div class="card-title">
            <span>${o.folio || o.id}</span>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
          </div>
          <div class="card-meta">
            <span>📁 ${projLabel}</span>
            ${o.requester ? `<span>👤 ${o.requester}</span>` : ''}
            ${o.date ? `<span>📅 ${o.date}</span>` : ''}
            ${o.provider ? `<span>🏪 ${o.provider}</span>` : ''}
            ${o.notes ? `<span>📝 ${o.notes}</span>` : ''}
          </div>
          <div class="col-hdr">
            <div>Concepto</div><div>Proveedor</div><div style="text-align:right">Cant.</div>
            <div style="text-align:right">P. Unit.</div><div style="text-align:right">Subtotal</div>
          </div>
          ${items.map(i => {
            const sub = (parseFloat(i.qty)||0) * (parseFloat(i.price)||0);
            const priceStr = parseFloat(i.price) > 0
              ? `$${parseFloat(i.price).toLocaleString('es-MX',{minimumFractionDigits:2})}`
              : `<span class="price-pending">⚠ Sin precio</span>`;
            return `<div class="item-row">
              <div>${i.name || i.code || '—'} <span class="item-subtext">(${i.unit||'pza'})</span></div>
              <div class="item-subtext">${i.provider || o.provider || '—'}</div>
              <div style="text-align:right">${i.qty}</div>
              <div style="text-align:right">${priceStr}</div>
              <div style="text-align:right; font-weight:600">${sub > 0 ? '$'+sub.toLocaleString('es-MX',{minimumFractionDigits:2}) : '—'}</div>
            </div>`;
          }).join('')}
          ${allPriced && total > 0 ? `<div class="total-row"><span>Total:</span><span>$${total.toLocaleString('es-MX',{minimumFractionDigits:2})}</span></div>` : ''}
          ${isPending ? `
          <div class="actions">
            <button class="btn btn-red"   onclick="act('${o.id}','Cancelado')">✕ Rechazar</button>
            <button class="btn btn-gray"  onclick="act('${o.id}','Pedido')">↩ Pedir Re-Cotización</button>
            <button class="btn btn-green ${canApprove?'':'disabled'}" style="${canApprove?'':'opacity:.4;pointer-events:none;'}"
              onclick="act('${o.id}','Autorizado')">✓ Autorizar${allPriced&&total>0?' $'+total.toLocaleString('es-MX',{minimumFractionDigits:2}):' (faltan precios)'}</button>
          </div>` : ''}
        </div>`;
    }).join('');
  }

  async function act(id, newStatus) {
    const order = ALL_ORDERS.find(o => o.id === id);
    if (!order) return;

    const verb = newStatus === 'Autorizado' ? 'autorizar' : newStatus === 'Cancelado' ? 'rechazar' : 'solicitar re-cotización de';
    if (!confirm(`¿Seguro que deseas ${verb} este pedido?`)) return;

    order.status = newStatus;
    if (window.parent && window.parent.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', id, order);
      // Mirror to orders collection if present
      const d = window.DB.get();
      if (d.orders && d.orders.find(o => o.id === id)) {
        await window.parent.setDocumentInFirebase('orders', id, order);
      }
      // Update parent DB_STATE
      if (window.parent.DB_STATE) {
        ['purchase_orders','orders'].forEach(col => {
          if (window.parent.DB_STATE[col]) {
            const idx = window.parent.DB_STATE[col].findIndex(o => o.id === id);
            if (idx !== -1) window.parent.DB_STATE[col][idx] = order;
          }
        });
      }
    }
    render();
  }

  init();
</script>
</body>
</html>
