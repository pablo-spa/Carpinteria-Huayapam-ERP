<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escanear Madera — Carpintería Huayapam</title>
<style>
:root { --radius: 10px; --radius-lg: 14px; }
body { padding-bottom: 60px; min-height: 100vh; }

.hdr { background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 16px 24px; position: sticky; top: 0; z-index: 10; }
.hdr h1 { font-size: 18px; font-weight: 700; color: var(--text); }

.main { max-width: 600px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }

.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: var(--radius-lg); padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); transition: all 0.3s ease; }

.c-title { font-size: 13px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; border-bottom: 1px solid var(--crust); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.input-grp { display: flex; flex-direction: column; gap: 6px; }
.lbl { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
select.inp, input.inp-txt { padding: 10px 12px; border: 1px solid var(--surface0); border-radius: 8px; background: var(--base); color: var(--text); font-size: 14px; font-weight: 500; font-family: inherit; width: 100%; transition: border-color .15s; }
select.inp:focus, input.inp-txt:focus { outline: none; border-color: var(--blue); }


/* Inactive State for Scan Card */
#scan-card { opacity: 0.4; pointer-events: none; }

.dim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; background: var(--base); padding: 16px; border-radius: 8px; border: 1px solid var(--surface0); margin-bottom: 20px; }
.dim-col { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.dim-col label { font-size: 10px; color: var(--subtext); font-weight: 700; text-transform: uppercase; }
.dim-col input { width: 100%; padding: 8px; border: 1px solid var(--crust); border-radius: 6px; background: var(--mantle); color: var(--text); font-size: 16px; font-weight: 600; text-align: center; font-family: inherit; }
.dim-col input:focus { outline: none; border-color: var(--blue); }

.bcode-inp { width: 100%; border: 2px solid var(--surface1); border-radius: 8px; background: var(--base); color: var(--text); font-size: 20px; font-weight: 700; padding: 12px 16px; font-family: ui-monospace, monospace; text-align: center; letter-spacing: 0.1em; transition: all .15s; }
.bcode-inp:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,102,245,0.2); }
.bcode-inp::placeholder { color: var(--surface1); font-weight: 400; }

.pt-res { text-align: center; margin-bottom: 20px; }
.pt-big { font-size: 32px; font-weight: 800; color: var(--green); line-height: 1; }
.pt-sub { font-size: 11px; font-weight: 700; color: var(--subtext); margin-top: 4px; text-transform: uppercase; }

/* History */
.hist { margin-top: 16px; }
.h-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px; margin-bottom: 8px; font-size: 13px; animation: popIn 0.2s ease; }
@keyframes popIn { from { transform: scale(0.95); opacity:0; } to { transform: scale(1); opacity:1; } }
.h-id { font-family: monospace; font-weight: 700; color: var(--text); font-size: 14px; }
.h-det { color: var(--subtext); font-size: 11px; }
.h-pt { color: var(--green); font-weight: 800; font-size: 14px; }

</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h1>Escanear Madera</h1>
  </div>
</div>

<div class="main">

  <!-- STEP 1: Context -->
  <div class="card" id="ctx-card">
    <div class="c-title">Paso 1: Contexto del Ingreso <span id="ctx-status">🔓</span></div>
    
    <div class="row-2">
      <div class="input-grp">
        <label class="lbl">Tipo de Pieza</label>
        <select class="inp" id="ctx-format" tabindex="1"></select>
      </div>
      <div class="input-grp">
        <label class="lbl">Especie / Material</label>
        <select class="inp" id="ctx-species" tabindex="1"></select>
      </div>
      <div class="input-grp">
        <label class="lbl">Identificador de Lote</label>
        <input type="text" id="ctx-lote" class="inp-txt" placeholder="Ej: L-805" value="L-805" tabindex="2">
      </div>
    </div>

    <div class="row-2">
      <div class="input-grp">
        <label class="lbl">Calidad</label>
        <select class="inp" id="ctx-quality" tabindex="3"></select>
      </div>
      <div class="input-grp">
        <label class="lbl">Ubicación Destino</label>
        <select class="inp" id="ctx-loc" tabindex="4"></select>
      </div>
      <div class="input-grp">
        <label class="lbl">Fecha de Entrada</label>
        <input type="date" class="inp-txt" id="ctx-date" tabindex="5">
      </div>
    </div>

    <button class="btn btn-blue" id="btn-lock" onclick="toggleContext()" tabindex="5">Fijar Contexto e Iniciar Escaneo</button>
  </div>

  <!-- STEP 2: Dimensions & Scanner -->
  <div class="card" id="scan-card">
    <div class="c-title">Paso 2: Dimensiones y Etiqueta</div>

    <div class="pt-res">
      <div class="pt-big" id="pt-val">6.00</div>
      <div class="pt-sub">Pies Tablares (Calculado)</div>
    </div>

    <div class="dim-grid">
      <div class="dim-col"><label>Grosor (plg)</label><input type="number" id="dim-t" value="1.5" step="0.5" oninput="calc()" tabindex="6"></div>
      <div class="dim-col"><label>Ancho (plg)</label><input type="number" id="dim-w" value="6" step="0.5" oninput="calc()" tabindex="7"></div>
      <div class="dim-col"><label>Largo (pies)</label><input type="number" id="dim-l" value="8" step="1" oninput="calc()" tabindex="8"></div>
    </div>

    <div class="input-grp">
      <label class="lbl" style="text-align:center;">Escanea la etiqueta / Ingresa ID</label>
      <input type="text" class="bcode-inp" id="barcode" placeholder="|||| ||| |||||" onkeydown="handleScan(event)" tabindex="9">
    </div>

    <button id="btn-registrar" class="btn btn-green" style="width:100%;margin-top:16px;font-size:16px;padding:14px;" onclick="registrarTabla()" tabindex="10">✚ Registrar Tabla</button>

  </div>

  <!-- History -->
  <div class="hist">
    <div class="c-title" style="border:none; margin:0;">Tablas ingresadas (Esta sesión)</div>
    <div id="hist-list"></div>
  </div>

</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
  let isLocked = false;

  document.addEventListener("DOMContentLoaded", async () => {
    await window.DB.query('inventory'); // wait for DB_STATE_LOADED
    // Cargar catálogos de madera (lazy-load)
    await Promise.all([
      window.DB.query('wood_formats'),
      window.DB.query('wood_types'),
      window.DB.query('wood_quality'),
      window.DB.query('wood_locations'),
    ]);
    const d = window.DB.get();
    const getList = key => { const raw = d[key]||[]; return raw[0]?.list || raw.filter(x=>typeof x==='string'); };

    // Sembrar defaults si alguna lista está vacía
    const DEFAULTS = {
      wood_formats:   ['Tabla', 'Tablón', 'Tabloncillo', 'Duela', 'Viga', 'Cuartón', 'Triplay', 'MDF'],
      wood_types:     ['Pino', 'Cedro', 'Parota', 'Encino', 'Mezquite', 'Fresno', 'Caoba', 'Nogal', 'Hule'],
      wood_quality:   ['Extra', 'Primera', 'Segunda', 'Tercera'],
      wood_locations: ['Bodega Principal', 'Área de Trabajo', 'Área de Secado', 'Exterior'],
    };
    for (const [key, vals] of Object.entries(DEFAULTS)) {
      if (!getList(key).length) {
        if (window.parent?.setDocumentInFirebase) window.parent.setDocumentInFirebase(key, 'main', { list: vals });
        if (window.parent?.DB_STATE) window.parent.DB_STATE[key] = [{ _id: 'main', list: vals }];
      }
    }
    const getList2 = key => { const raw = window.parent?.DB_STATE?.[key]||d[key]||[]; return raw[0]?.list || raw.filter(x=>typeof x==='string'); };

    const fmtSel  = document.getElementById('ctx-format');
    const spSel   = document.getElementById('ctx-species');
    const qualSel = document.getElementById('ctx-quality');
    const locSel  = document.getElementById('ctx-loc');

    fmtSel.innerHTML  = getList2('wood_formats').map(x  => `<option value="${x}">${x}</option>`).join('');
    spSel.innerHTML   = getList2('wood_types').map(x    => `<option value="${x}">${x}</option>`).join('');
    qualSel.innerHTML = getList2('wood_quality').map(x  => `<option value="${x}">${x}</option>`).join('');
    locSel.innerHTML  = getList2('wood_locations').map(x => `<option value="${x}">${x}</option>`).join('');

    [fmtSel, spSel, qualSel, locSel].forEach(sel => SearchableSelect.init(sel));

    document.getElementById('ctx-date').value = new Date().toISOString().split('T')[0];
  });

  function toggleContext() {
    isLocked = !isLocked;
    const ctx = document.getElementById('ctx-card');
    const scan = document.getElementById('scan-card');
    const btn = document.getElementById('btn-lock');
    const status = document.getElementById('ctx-status');

    ctx.querySelectorAll('input, select').forEach(el => el.disabled = isLocked);
    ctx.querySelectorAll('.ss-wrap').forEach(el => { el.style.pointerEvents = isLocked ? 'none' : ''; el.style.opacity = isLocked ? '0.55' : ''; });

    if (isLocked) {
      scan.style.opacity = '1';
      scan.style.pointerEvents = 'auto';
      btn.className = 'btn btn-dark';
      btn.textContent = 'Desbloquear y Cambiar Contexto';
      status.textContent = '🔒 Fijo';
      document.getElementById('barcode').focus();
    } else {
      scan.style.opacity = '0.4';
      scan.style.pointerEvents = 'none';
      btn.className = 'btn btn-blue';
      btn.textContent = 'Fijar Contexto e Iniciar Escaneo';
      status.textContent = '🔓';
    }
  }

  function calc() {
    const t = parseFloat(document.getElementById('dim-t').value) || 0;
    const w = parseFloat(document.getElementById('dim-w').value) || 0;
    const l = parseFloat(document.getElementById('dim-l').value) || 0;
    const pt = (t * w * l) / 12;
    document.getElementById('pt-val').textContent = pt > 0 ? pt.toFixed(2) : '0.00';
  }

  let _saving = false;

  async function registrarTabla() {
    if (_saving) return;
    const code = document.getElementById('barcode').value.trim();
    if (!code) { document.getElementById('barcode').focus(); return; }

    _saving = true;
    const btn = document.getElementById('btn-registrar');
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

    const pt = document.getElementById('pt-val').textContent;
    const fmtType = document.getElementById('ctx-format').value;
    const sp  = document.getElementById('ctx-species').value;
    const lt  = document.getElementById('ctx-lote').value;
    const ql  = document.getElementById('ctx-quality').value;
    const dt  = document.getElementById('ctx-date').value;
    const loc = document.getElementById('ctx-loc').value;
    const thick  = parseFloat(document.getElementById('dim-t').value) || 0;
    const width  = parseFloat(document.getElementById('dim-w').value) || 0;
    const length = parseFloat(document.getElementById('dim-l').value) || 0;

    await window.DB.addWood({ code, lote: lt, format: fmtType, species: sp, t: thick, w: width, l: length, pt: parseFloat(pt), quality: ql, entryDate: dt, location: loc });

    const list = document.getElementById('hist-list');
    const el = document.createElement('div');
    el.className = 'h-item';
    el.innerHTML = `
      <div>
        <div class="h-id">${code}</div>
        <div class="h-det">${fmtType} | ${sp} (Lote: ${lt})</div>
      </div>
      <div class="h-pt">+${pt} pt</div>
    `;
    list.prepend(el);

    document.getElementById('barcode').value = '';
    const inp = document.getElementById('barcode');
    inp.style.backgroundColor = 'var(--green-bg)';
    setTimeout(() => { inp.style.backgroundColor = 'var(--base)'; inp.focus(); }, 150);

    if (btn) { btn.disabled = false; btn.textContent = '✚ Registrar Tabla'; }
    _saving = false;
  }

  function handleScan(e) {
    if (e.key === 'Enter') registrarTabla();
  }

  calc();
</script>
</body>
</html>
