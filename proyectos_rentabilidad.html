<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rentabilidad de Proyectos</title>
<style>
  :root {
    --bg: #eff1f5; --surface: #ffffff; --border: #dce0e8; --border-strong: #bcc0cc;
    --text: #4c4f69; --muted: #8c8fa1;
    --primary: #1e66f5; --primary-hover: #1e66f5e6;
    --green: #40a02b; --red: #d20f39; --amber: #df8e1d;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e2e; --surface: #181825; --border: #313244; --border-strong: #45475a;
      --text: #cdd6f4; --muted: #a6adc8;
      --primary: #8caaee; --primary-hover: #8caaeed9;
      --green: #a6e3a1; --red: #f38ba8; --amber: #f9e2af;
    }
  }
  body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
  
  .table-container { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  th { background: rgba(0,0,0,0.02); font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; }
  @media (prefers-color-scheme: dark) { th { background: rgba(255,255,255,0.02); } }
  tr:last-child th, tr:last-child td { border-bottom: none; }
  
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(0,0,0,0.02); }
  @media (prefers-color-scheme: dark) { tbody tr:hover { background: rgba(255,255,255,0.03); } }
  
  .stat-group { display: flex; flex-direction: column; gap:4px; }
  .stat-row { display: flex; justify-content: space-between; font-size:12px; }
  .over-budget { color: var(--red); font-weight:600; }
  .under-budget { color: var(--green); font-weight:600; }
  .warn-budget { color: var(--amber); font-weight:600; }
  
  .pill { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--border); }
  .pill.Terminado { background: rgba(64,160,43,0.1); color: var(--green); }
  @media (prefers-color-scheme:dark) { .pill.Terminado { background: rgba(166,227,161,0.1); } }
  
</style>
</head>
<body>

  <div class="header">
    <h1>
      <button onclick="if(window.parent && window.parent.openModule){window.parent.openModule('index.html','Inicio')}else{window.history.back()}" style="background:none;border:none;font-size:24px;font-weight:800;color:var(--muted);cursor:pointer;">←</button>
      <span>📊</span> Rentabilidad de Proyectos
    </h1>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Proyecto / ID</th>
          <th>Estado</th>
          <th>Madera (Presupuesto vs Real)</th>
          <th>Material ($ Presupuesto vs Real)</th>
          <th>Mano de Obra ($ Presupuesto vs Real)</th>
          <th>Estado General</th>
        </tr>
      </thead>
      <tbody id="proj-list">
      </tbody>
    </table>
  </div>

  <script src="db.js"></script>
  <script>
    function fmt(num) {
      if(isNaN(num)) return '$0.00';
      return '$' + parseFloat(num).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function renderList() {
      const d = window.DB.get();
      const projs = d.projects || [];
      const cont = d.accounting_movements || [];
      
      const tbody = document.getElementById('proj-list');
      tbody.innerHTML = '';
      
      if(projs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 24px; color:var(--muted)">No hay proyectos registrados</td></tr>';
        return;
      }
      
      projs.forEach(p => {
        // Find real expenses linked to this project
        const pMovs = cont.filter(m => m.projectId === p.id && m.type === 'Gasto' && m.status === 'confirmed');
        
        let matReal = 0;
        let pMaderaPresup = p.estimatedWood || 0;
        let pMaderaReal = p.usedWood || 0;
        let moPresup = p.estimatedLabor || 0;
        let moReal = p.realLabor || 0; // Usually from timesheets, fallback to explicit realLabor.

        // Also if `p.budgetMaterial` exists
        let matPresup = p.budgetMaterial || 0;
        
        pMovs.forEach(m => {
          matReal += m.amount || 0;
        });
        
        let woodClass = '';
        if(pMaderaReal > pMaderaPresup) woodClass = 'over-budget';
        else if (pMaderaReal > 0 && pMaderaReal >= pMaderaPresup * 0.9) woodClass = 'warn-budget';
        else woodClass = 'under-budget';

        let matClass = '';
        if(matReal > matPresup) matClass = 'over-budget';
        else if (matReal > 0 && matReal >= matPresup * 0.9) matClass = 'warn-budget';
        else matClass = 'under-budget';

        let moClass = '';
        if(moReal > moPresup) moClass = 'over-budget';
        else if (moReal > 0 && moReal >= moPresup * 0.9) moClass = 'warn-budget';
        else moClass = 'under-budget';

        let overall = '';
        if(woodClass === 'over-budget' || matClass === 'over-budget' || moClass === 'over-budget') {
          overall = '<span class="pill" style="background:rgba(210,15,57,0.1); color:var(--red)">Pérdida/Desvío</span>';
        } else if (p.status === 'Terminado') {
          overall = '<span class="pill Terminado">Saludable</span>';
        } else {
          overall = '<span class="pill" style="color:var(--text)">En curso</span>';
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.name}</strong><br><span style="color:var(--muted); font-size:11px;">ID: ${p.id}</span></td>
          <td><span class="pill ${p.status}">${p.status}</span></td>
          <td>
            <div class="stat-group">
              <div class="stat-row"><span>Cotizado:</span> <span>${pMaderaPresup} pts</span></div>
              <div class="stat-row"><span>Usado:</span> <span class="${woodClass}">${pMaderaReal} pts</span></div>
            </div>
          </td>
          <td>
            <div class="stat-group">
              <div class="stat-row"><span>Presupuesto:</span> <span>${fmt(matPresup)}</span></div>
              <div class="stat-row"><span>Real:</span> <span class="${matClass}">${fmt(matReal)}</span></div>
            </div>
          </td>
          <td>
            <div class="stat-group">
              <div class="stat-row"><span>Cotizado:</span> <span>${fmt(moPresup)}</span></div>
              <div class="stat-row"><span>Costo Real:</span> <span class="${moClass}">${fmt(moReal)}</span></div>
            </div>
          </td>
          <td>${overall}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    renderList();
  </script>
</body>
</html>
