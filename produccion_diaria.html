<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Registro del Día — Carpintería Huayapam</title>
<style>
.hdr { position: sticky; top: 0; z-index: 100; background: var(--mantle); border-bottom: 1px solid var(--crust); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.date-input { background: var(--base); border: 1px solid var(--crust); border-radius: 8px; padding: 4px 8px; color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit; }
.date-input:focus { outline: none; border-color: var(--blue); }
/* ── Calendar & Week Section ── */
.cal-section {
  background: var(--base);
  border-bottom: 1px solid var(--crust);
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}
.week-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.cal-nav-btn {
  background: var(--mantle);
  border: 1px solid var(--crust);
  border-radius: 50%;
  color: var(--text);
  font-size: 20px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  padding: 0;
  line-height: 1;
}
.cal-nav-btn:hover {
  background: var(--surface0);
  border-color: var(--surface1);
}
.cal-nav-btn:active {
  transform: scale(0.92);
}
.week-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  min-width: 220px;
  text-align: center;
  user-select: none;
}
.cal-strip {
  display: flex;
  gap: 12px;
  width: 100%;
  max-width: 480px;
  justify-content: center;
}
@media (max-width: 480px) {
  .cal-strip {
    justify-content: space-between;
    gap: 4px;
  }
}
.cal-day {
  flex: 1; min-width: 44px; max-width: 56px; text-align: center; padding: 8px 4px; border-radius: 8px;
  cursor: pointer; transition: all 0.15s; border: 1.5px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.cal-day:hover { background: var(--surface0); }
.cal-day.is-active { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.cal-day.is-weekend { opacity: 0.7; }
.cal-day.is-weekend.is-active { opacity: 1; }
.cal-day-name { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--subtext); margin-bottom: 2px; }
.cal-day-num  { font-size: 16px; font-weight: 800; line-height: 1.2; }
.cal-day-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; display: inline-block; }
.dot-cerrado { background: var(--green); }
.dot-pendiente { background: var(--amber); }
.dot-libre { background: var(--subtext); opacity: 0.3; }

/* ── Banner ── */
.banner {
  margin: 12px 12px 0; padding: 10px 14px; border-radius: var(--radius-lg);
  font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.banner-green  { background: var(--green-bg);  color: var(--green-text);  border: 1px solid var(--green); }
.banner-amber  { background: var(--amber-bg);  color: var(--amber-text);  border: 1px solid var(--amber); }

/* ── Main ── */
.main { max-width: 1200px; margin: 0 auto; padding: 24px; padding-bottom: 110px; display: flex; flex-direction: column; gap: 4px; }
.sec-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--subtext); padding: 12px 0 8px; border-bottom: 1px solid var(--crust); margin-bottom: 8px; }

/* ── Worker Card ── */
.worker-card {
  background: var(--mantle); border: 1px solid var(--crust); border-radius: 8px;
  overflow: hidden; margin-bottom: 6px; transition: all .12s; border-left: 3px solid transparent;
}
.worker-card:hover:not(.open-det) { background: var(--surface0); transform: translateX(2px); }
.worker-card.st-trabajo    { border-left-color: var(--green); }
.worker-card.st-falta      { border-left-color: var(--red); opacity: .8; }
.worker-card.st-retardo    { border-left-color: var(--amber); }
.worker-card.st-vacaciones { border-left-color: var(--blue); }
.worker-card.open-det { border-color: var(--blue); border-left-color: var(--blue); border-radius: 8px; background: var(--base); transform: none; }

/* Card row */
.wcard-row { display: flex; align-items: center; gap: 14px; padding: 11px 16px; min-height: 54px; cursor: pointer; user-select: none; }
.wcard-row:hover { background: transparent; }
.w-avatar {
  width: 38px; height: 38px; border-radius: 99px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; background: var(--base); color: var(--subtext); transition: .15s;
}
.st-trabajo    .w-avatar { background: var(--green-bg);  color: var(--green-text); }
.st-falta      .w-avatar { background: var(--red-bg);    color: var(--red-text); }
.st-retardo    .w-avatar { background: var(--amber-bg);  color: var(--amber-text); }
.st-vacaciones .w-avatar { background: var(--blue-bg);   color: var(--blue-text); }

.w-info { flex: 1; min-width: 0; }
.w-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-sub  { font-size: 12px; color: var(--subtext); }

.sbtn-row { display: flex; gap: 5px; flex-shrink: 0; }
.sbtn {
  cursor: pointer; border: 1.5px solid var(--crust);
  border-radius: 8px; background: var(--base); color: var(--subtext);
  font-size: 14px; font-weight: 700; font-family: inherit;
  width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.sbtn:active { transform: scale(.88); }
.sbtn.on-trabajo    { background: var(--green);  border-color: var(--green);  color: #fff; }
.sbtn.on-falta      { background: var(--red);    border-color: var(--red);    color: #fff; }
.sbtn.on-retardo    { background: var(--amber);  border-color: var(--amber);  color: #fff; }
.sbtn.on-vacaciones { background: var(--blue);   border-color: var(--blue);   color: #fff; }

.dst-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.dsbtn {
  cursor: pointer; border: 1px solid var(--crust); border-radius: 6px;
  background: var(--mantle); color: var(--subtext); font-size: 11px; font-weight: 700;
  font-family: inherit; padding: 6px 12px; height: 32px; display: flex; align-items: center; justify-content: center; transition: all .12s;
}
.dsbtn:hover { background: var(--surface0); }
.dsbtn:active { transform: scale(.95); }
.dsbtn.on-trabajo    { background: var(--green);  border-color: var(--green);  color: #fff; }
.dsbtn.on-falta      { background: var(--red);    border-color: var(--red);    color: #fff; }
.dsbtn.on-retardo    { background: var(--amber);  border-color: var(--amber);  color: #fff; }
.dsbtn.on-vacaciones { background: var(--blue);   border-color: var(--blue);   color: #fff; }

.edit-btn {
  cursor: pointer; background: var(--base); border: 1.5px solid var(--crust);
  border-radius: 8px; color: var(--subtext); font-size: 12px; font-weight: 700;
  padding: 5px 10px; font-family: inherit; white-space: nowrap; flex-shrink: 0;
}

/* Edit confirmation overlay (inside card) */
.edit-confirm {
  display: none; border-top: 1px solid var(--crust);
  background: var(--amber-bg); padding: 12px 14px;
  flex-direction: column; gap: 8px;
}
.edit-confirm.open { display: flex; }
.edit-confirm-msg { font-size: 13px; font-weight: 700; color: var(--amber-text); }
.edit-confirm-btns { display: flex; gap: 8px; }

/* Detail section */
.wcard-detail { border-top: 1px dashed var(--crust); padding: 16px; display: none; flex-direction: column; gap: 18px; background: var(--base); }
.wcard-detail.open { display: flex; }

/* Field */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--subtext); }
.field input, .field select {
  background: var(--base); border: 1.5px solid var(--crust);
  border-radius: 8px; padding: 8px 12px; color: var(--text);
  font-size: 14px; font-family: inherit; min-height: 42px; width: 100%;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--blue); }

/* Retardo row */
.retardo-row { display: flex; align-items: center; gap: 10px; }
.retardo-input {
  background: var(--base); border: 2px solid var(--amber);
  border-radius: 8px; padding: 8px; color: var(--text);
  font-size: 18px; font-weight: 700; text-align: center; font-family: inherit;
  width: 90px; min-height: 42px;
}
.retardo-input:focus { outline: none; }

/* Hours grid */
.hrs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.hr-wrap { display: flex; flex-direction: column; gap: 4px; }
.hr-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; }
.hr-input {
  background: var(--base); border: 2px solid var(--crust);
  border-radius: 8px; padding: 8px; color: var(--text);
  font-size: 22px; font-weight: 800; text-align: center; font-family: inherit;
  width: 100%; min-height: 52px;
}
.hr-input:focus { outline: none; }
.hr-x1  { border-color: var(--green); }
.hr-x15 { border-color: var(--amber); }
.hr-x2  { border-color: var(--red); }
.hrs-equiv { font-size: 12px; font-weight: 700; color: var(--subtext); text-align: center; margin-top: 2px; }

/* Project rows */
.proj-section { display: flex; flex-direction: column; gap: 8px; }
.proj-row { background: var(--base); border: 1px solid var(--crust); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.proj-row-top { display: grid; grid-template-columns: 1fr 76px; gap: 8px; align-items: end; }
.proj-row-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
.rm-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; color: var(--subtext); font-size: 16px; cursor: pointer; padding: 2px;
}
.rm-btn:hover { color: var(--red); }
.proj-hours-bar { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; text-align: center; }
.phb-ok    { background: var(--green-bg);  color: var(--green-text); }
.phb-warn  { background: var(--amber-bg);  color: var(--amber-text); }
.phb-over  { background: var(--red-bg);    color: var(--red-text); }
.phb-empty { background: var(--surface0);  color: var(--subtext); }
.add-proj-btn {
  cursor: pointer; background: var(--base); border: 1.5px dashed var(--crust);
  border-radius: 8px; color: var(--subtext); font-size: 13px; font-weight: 600;
  padding: 9px 14px; font-family: inherit; width: 100%; text-align: left; transition: .15s;
}
.add-proj-btn:hover { border-color: var(--green); color: var(--green-text); background: var(--green-bg); }

/* Listo row */
.listo-row { display: flex; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--crust); }
.listo-row .btn-green { flex: 1; justify-content: center; }

/* Footer */
.footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--mantle); border-top: 2px solid var(--crust);
  padding: 10px 16px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.footer-stats { display: flex; gap: 16px; }
.stat { display: flex; flex-direction: column; }
.stat .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--subtext); font-weight: 700; }
.stat .val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.val-green { color: var(--green); }
.val-red   { color: var(--red); }
.val-amber { color: var(--amber); }

.empty-state { text-align: center; padding: 20px; color: var(--subtext); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="hdr">
  <div style="display:flex;align-items:center;gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">
      Registro del Día
      <span class="badge" id="hdr-badge" style="font-size:11px;padding:2px 6px;background:var(--surface0);color:var(--subtext);border-radius:4px;font-weight:700;margin-left:8px;">—</span>
    </h2>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="btn btn-green" id="btn-cerrar" onclick="cerrarDia()">✓ Cerrar día</button>
    <button class="btn btn-amber" id="btn-reabrir" style="display:none;" onclick="reabrirDia()">↩ Reabrir día</button>
  </div>
</div>

<!-- ── Calendar & Week Section ── -->
<div class="cal-section">
  <!-- Hidden Date Picker (for state compatibility) -->
  <input type="date" id="fecha" style="display:none;" onchange="onDateChange()">
  
  <!-- Week Selector Row -->
  <div class="week-selector">
    <button class="cal-nav-btn" onclick="navWeek(-1)" title="Semana anterior">‹</button>
    <span class="week-label" id="week-label">Cargando semana…</span>
    <button class="cal-nav-btn" onclick="navWeek(1)" title="Semana siguiente">›</button>
  </div>

  <!-- Calendar Strip -->
  <div class="cal-strip" id="cal-strip"></div>
</div>

<!-- ── Banner (closed/reopen message) ── -->
<div id="banner-cerrado" class="banner banner-green" style="display:none;">
  ✓ Este día fue cerrado. Para modificar, usa el botón "↩ Reabrir día".
</div>

<!-- ── Main content ── -->
<div class="main" id="main-content">
  <div class="sec-lbl" id="lbl-pendientes">Cargando…</div>
  <div id="list-pendientes"></div>
  <div id="manual-add-section"></div>
  <div id="registrados-section" style="display:none;">
    <div class="sec-lbl" id="lbl-registrados">Registrados (0)</div>
    <div id="list-registrados"></div>
  </div>
</div>

<!-- ── Footer ── -->
<div class="footer">
  <div class="footer-stats">
    <div class="stat"><span class="lbl">Trabajaron</span><span class="val val-green" id="f-t">0</span></div>
    <div class="stat"><span class="lbl">Faltas</span><span class="val val-red" id="f-f">0</span></div>
    <div class="stat"><span class="lbl">Retardos</span><span class="val val-amber" id="f-r">0</span></div>
    <div class="stat"><span class="lbl">Hrs equiv.</span><span class="val" id="f-h">0.0</span></div>
    <div class="stat"><span class="lbl">Pendientes</span><span class="val" id="f-p" style="color:var(--subtext)">0</span></div>
  </div>
</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script src="ui.js"></script>
<script>
// ── Constants ─────────────────────────────────────────────────
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_S = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ── Global state ──────────────────────────────────────────────
let WORKERS         = [];
let VISIBLE_WORKERS = [];   // workers mostrados para la fecha actual (filtrado por asistencia)
let PROYECTOS       = [];   // { id: code, n: "0042 — Nombre", pieces: [] }
let ACTIVIDADES     = [];   // strings from actividades_trabajo

let calWeekOffset = 0;
let currentDate   = '';
let diaCerrado    = false;
let STATE = {};  // { [date]: { cerrado:bool, data:{ [workerId]: workerState } } }

// ── DB helpers ────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0,10); }

function blankWorkerState() {
  return {
    status: '', retardoMin: '',
    horasNormal: '', horasExtra: '', horasDoble: '',
    proyectos: [{ p:'', horas:'', actividad:'', descripcion:'', pieza:'' }],
    notas: '', done: false
  };
}

function horasEq(ws) {
  return (parseFloat(ws.horasNormal)||0)
       + (parseFloat(ws.horasExtra) ||0)*1.5
       + (parseFloat(ws.horasDoble) ||0)*2;
}

function isComplete(ws) {
  if (!ws.status) return false;
  if (ws.status === 'falta' || ws.status === 'vacaciones') return true;
  return (parseFloat(ws.horasNormal)||0) + (parseFloat(ws.horasExtra)||0) + (parseFloat(ws.horasDoble)||0) > 0;
}

// ── Load data from DB ─────────────────────────────────────────
async function loadMasterData() {
  const [workers, projects, actRaw] = await Promise.all([
    window.DB.query('contacts', { tipo: 'trabajador' }),
    window.DB.query('projects'),
    window.DB.query('actividades_trabajo'),
    window.DB.query('attendance_logs'),
    window.DB.query('attendance'),
  ]);

  const filteredWorkers = workers.filter(w => w.activo !== false && (w.name || w.nombre) && !w._init);
  const sortedWorkers = window.parent?.getWorkersSorted ? window.parent.getWorkersSorted(filteredWorkers) : filteredWorkers;
  WORKERS = sortedWorkers
    .map(w => {
      const name = w.name || [w.nombre, w.apellidoPaterno].filter(Boolean).join(' ') || '';
      const parts = name.split(' ');
      return {
        id: w.id,
        nombre: w.nombre || parts[0] || 'Sin nombre',
        ape:    w.apellidoPaterno || parts.slice(1).join(' ') || '',
        cat:    w.role || '',
        ini:    name.substring(0,2).toUpperCase()
      };
    });

  PROYECTOS = projects
    .filter(p => !p._init && !(p.archivado || p.archived) && (p.codigo || p.code) && (p.nombre || p.name) &&
      ['en producción','planificación','en pausa'].includes(((p.estado || p.status)||'').toLowerCase()))
    .map(p => {
      const cod = p.codigo || p.code;
      const nom = p.nombre || p.name;
      return { id: cod, n: cod + ' — ' + nom, pieces: p.piezas || p.pieces || [] };
    });
  PROYECTOS.push({ id: 'general', n: 'Trabajo general', pieces: [] });

  // actividades_trabajo is stored as {list:[...]} in a single 'main' doc
  const mainDoc = actRaw.find(r => r._id === 'main' || r.list);
  ACTIVIDADES = mainDoc?.list || [];
}

function loadDayFromDB(dateStr) {
  const db   = window.DB.get();
  // Production records: attendance with date field
  const recs  = (db.attendance || []).filter(a => (a.fecha || a.date) === dateStr && !a._init && (a.trabajadorId || a.workerId) && (a.estado || a.status));
  // Día cerrado SOLO si algún registro tiene el flag explícito diaCerrado:true
  const cerrado = recs.some(a => a.diaCerrado === true);

  const data = {};
  WORKERS.forEach(w => {
    const rec = recs.find(r => (r.trabajadorId || r.workerId) === w.id);
    if (rec) {
      data[w.id] = {
        status:      rec.estado     || rec.status    || '',
        retardoMin:  rec.retardoMin || '',
        horasNormal: rec.horasNormal != null ? rec.horasNormal : (rec.hours || ''),
        horasExtra:  rec.horasExtra  != null ? rec.horasExtra  : '',
        horasDoble:  rec.horasDoble  != null ? rec.horasDoble  : '',
        proyectos:   (rec.proyectos || rec.projects)?.length ? (rec.proyectos || rec.projects) : [{ p:'', horas:'', actividad:'', descripcion:'', pieza:'' }],
        notas:       rec.notas || '',
        done:        true
      };
    } else {
      data[w.id] = blankWorkerState();
    }
  });
  return { cerrado, data };
}

function getState(dateStr) {
  if (!STATE[dateStr]) {
    STATE[dateStr] = loadDayFromDB(dateStr);
  }
  return STATE[dateStr];
}

function getWS(wId) { return getState(currentDate).data[wId]; }

// ── Calendar ──────────────────────────────────────────────────
function payWeekDays(weekOffset) {
  const today = new Date();
  const dow   = today.getDay();
  // Days since last Saturday: Sat=0, Sun=1, Mon=2, ..., Fri=6
  const dToSat = (dow + 1) % 7;
  const sat = new Date(today);
  sat.setDate(today.getDate() - dToSat + weekOffset * 7);
  sat.setHours(12,0,0,0);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(sat); d.setDate(sat.getDate() + i); return d;
  });
}

function getWeekOffsetForDate(dateStr) {
  const targetDate = new Date(dateStr + 'T12:00:00');
  const today = new Date();
  today.setHours(12,0,0,0);
  
  // Find Saturday of target week
  const targetDow = targetDate.getDay();
  const targetDToSat = (targetDow + 1) % 7;
  const targetSat = new Date(targetDate);
  targetSat.setDate(targetDate.getDate() - targetDToSat);
  targetSat.setHours(12,0,0,0);
  
  // Find Saturday of today's week
  const todayDow = today.getDay();
  const todayDToSat = (todayDow + 1) % 7;
  const todaySat = new Date(today);
  todaySat.setDate(today.getDate() - todayDToSat);
  todaySat.setHours(12,0,0,0);
  
  // Calculate difference in weeks
  const diffTime = targetSat.getTime() - todaySat.getTime();
  const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
  return Math.round(diffDays / 7);
}

function updateWeekLabel() {
  const label = document.getElementById('week-label');
  if (!label) return;
  
  const days = payWeekDays(calWeekOffset);
  const start = days[0];
  const end = days[6];
  
  const options = { day: 'numeric', month: 'short' };
  const startStr = start.toLocaleDateString('es-MX', options);
  const endStr = end.toLocaleDateString('es-MX', options);
  const yearStr = end.getFullYear();
  
  label.textContent = `Semana: ${startStr} – ${endStr} (${yearStr})`;
}

function buildCalendar() {
  updateWeekLabel();
  const days  = payWeekDays(calWeekOffset);
  const strip = document.getElementById('cal-strip');
  const db    = window.DB.get();

  strip.innerHTML = days.map((d,i) => {
    const dateStr  = d.toISOString().slice(0,10);
    const isWknd   = i < 2; // Sat + Sun
    const isActive = dateStr === currentDate;

    // Cerrado: state en memoria OR flag diaCerrado:true en algún registro guardado
    let cerrado = STATE[dateStr]?.cerrado;
    if (!cerrado) {
      cerrado = (db.attendance || []).some(a => (a.fecha || a.date) === dateStr && !a._init && a.diaCerrado === true);
    }

    const dotClass = cerrado
      ? 'dot-cerrado'
      : isWknd
        ? 'dot-libre'
        : 'dot-pendiente';

    return `
      <div class="cal-day ${isActive?'is-active':''} ${isWknd?'is-weekend':''}" onclick="setDate('${dateStr}')">
        <div class="cal-day-name">${DIAS_S[d.getDay()]}</div>
        <div class="cal-day-num">${d.getDate()}</div>
        <div class="cal-day-dot ${dotClass}"></div>
      </div>
    `;
  }).join('');
}

function navWeek(dir) {
  calWeekOffset += dir;
  
  // Keep the same day of the week selected
  const oldDays = payWeekDays(calWeekOffset - dir);
  let activeIndex = oldDays.findIndex(d => d.toISOString().slice(0,10) === currentDate);
  if (activeIndex === -1) activeIndex = 2; // Default to Monday (index 2)
  
  const newDays = payWeekDays(calWeekOffset);
  const newDateStr = newDays[activeIndex].toISOString().slice(0,10);
  
  document.getElementById('fecha').value = newDateStr;
  onDateChange();
}

function setDate(dateStr) {
  if (dateStr === currentDate) return;
  calWeekOffset = getWeekOffsetForDate(dateStr);
  document.getElementById('fecha').value = dateStr;
  onDateChange();
}

// ── Date change ───────────────────────────────────────────────
function onDateChange() {
  currentDate = document.getElementById('fecha').value;
  calWeekOffset = getWeekOffsetForDate(currentDate);
  buildCalendar();

  const dayState = getState(currentDate);
  diaCerrado = dayState.cerrado;
  updateCerradoUI();
  renderAll();
}

function updateCerradoUI() {
  document.getElementById('banner-cerrado').style.display = diaCerrado ? 'flex' : 'none';
  document.getElementById('btn-cerrar').style.display    = diaCerrado ? 'none' : '';
  document.getElementById('btn-reabrir').style.display   = diaCerrado ? ''     : 'none';
  document.getElementById('hdr-badge').textContent = diaCerrado ? 'Cerrado' : 'Pendiente';
}

// ── Filtrar por asistencia del día ────────────────────────────
function getPresentWorkerIds(dateStr) {
  const db = window.DB.get();
  const present = new Set();

  // Reloj checador: attendance_logs
  (db.attendance_logs || []).forEach(c => {
    if (c.fecha === dateStr) {
      const wId = c.workerId || c.trabajadorId;
      if (wId) present.add(wId);
    }
  });

  // Registros de producción ya guardados para este día
  (db.attendance || []).forEach(a => {
    if ((a.fecha || a.date) === dateStr && !a._init && (a.trabajadorId || a.workerId) && (a.estado || a.status)) {
      const wId = a.trabajadorId || a.workerId;
      if (wId) present.add(wId);
    }
  });

  return present;
}

// ── Render all workers ────────────────────────────────────────
function renderAll() {
  const listPend = document.getElementById('list-pendientes');
  const listReg  = document.getElementById('list-registrados');
  listPend.innerHTML = '';
  listReg.innerHTML  = '';
  document.getElementById('registrados-section').style.display = 'none';

  const presentIds = getPresentWorkerIds(currentDate);

  // Mostrar solo trabajadores presentes (reloj/asistencia) o ya registrados en produccion
  VISIBLE_WORKERS = WORKERS.filter(w => presentIds.has(w.id) || getWS(w.id).done || getWS(w.id).status);
  const otherWorkers = WORKERS.filter(w => !VISIBLE_WORKERS.includes(w));

  VISIBLE_WORKERS.forEach(w => {
    const ws   = getWS(w.id);
    const card = buildCard(w);

    if (ws.done) {
      listReg.appendChild(card);
      card.querySelector('.sbtn-row').style.display = 'none';
      card.querySelector('.edit-btn').style.display = '';
      document.getElementById('registrados-section').style.display = '';
    } else {
      listPend.appendChild(card);
    }
    buildChips(w.id);
    renderProyRows(w.id);
    updHrsTotal(w.id);
  });

  renderManualAdd(otherWorkers);
  updateLabels();
  updateFooter();
}

// ── Agregar trabajador manualmente ────────────────────────────
function renderManualAdd(otherWorkers) {
  const sect = document.getElementById('manual-add-section');
  if (!sect) return;
  if (otherWorkers.length === 0) { sect.innerHTML = ''; return; }

  const opts = otherWorkers.map(w =>
    `<option value="${w.id}">${w.nombre} ${w.ape}${w.cat ? ' · ' + w.cat : ''}</option>`
  ).join('');

  sect.innerHTML = `
    <div style="margin:8px 0;background:var(--mantle);border:1px solid var(--crust);border-radius:var(--radius-lg);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--subtext);">Agregar trabajador</span>
      <select id="manual-worker-sel" data-searchable style="flex:1;min-width:180px;max-width:340px;">
        <option value="">— Seleccionar —</option>
        ${opts}
      </select>
      <button class="btn btn-dark" style="padding:6px 12px;font-size:12px;" onclick="addManualWorker()">+ Agregar</button>
    </div>
  `;
  SearchableSelect.init(document.getElementById('manual-worker-sel'));
}

function addManualWorker() {
  const sel = document.getElementById('manual-worker-sel');
  const wId = sel?.value;
  if (!wId) return;
  const w = WORKERS.find(x => x.id === wId);
  if (!w || VISIBLE_WORKERS.includes(w)) return;
  VISIBLE_WORKERS.push(w);

  const card = buildCard(w);
  document.getElementById('list-pendientes').appendChild(card);
  buildChips(w.id);
  renderProyRows(w.id);
  updHrsTotal(w.id);

  const otherWorkers = WORKERS.filter(x => !VISIBLE_WORKERS.includes(x));
  renderManualAdd(otherWorkers);
  updateLabels();
  updateFooter();
}

// ── Build card ────────────────────────────────────────────────

    <div class="edit-confirm" id="econf-${w.id}">

      <div class="edit-confirm-btns">
        <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="cancelEdit('${w.id}')">Cancelar</button>
        <button class="btn btn-amber" style="padding:6px 12px;font-size:12px;" onclick="confirmEdit('${w.id}')">Sí, editar</button>
      </div>
    </div>

    <!-- Detail -->
    <div class="wcard-detail" id="det-${w.id}">

// ── Project rows ──────────────────────────────────────────────
function actOpts(sel) {
  const empty = `<option value="">— Sin especificar —</option>`;
  return empty + ACTIVIDADES.map(a => `<option value="${a}"${sel===a?' selected':''}>${a}</option>`).join('');
}

function projOpts(sel) {
  return `<option value="">— Sin proyecto —</option>` +
    PROYECTOS.map(p => `<option value="${p.id}"${sel===p.id?' selected':''}>${p.n}</option>`).join('');
}

function piezaOpts(projCode, selPieza) {
  const proj = PROYECTOS.find(p => p.id === projCode);
  const pieces = proj?.pieces || [];
  if (pieces.length === 0) return null; // no pieza field
  return `<option value="">— Sin pieza —</option>` +
    pieces.map(pz => `<option value="${pz}"${selPieza===pz?' selected':''}>${pz}</option>`).join('');
}

function renderProyRows(wId) {
  const ws   = getWS(wId);
  const cont = document.getElementById(`proys-${wId}`);
  if (!cont) return;

  cont.innerHTML = ws.proyectos.map((pr, i) => {
    const showRm = ws.proyectos.length > 1;
    const piezaOptsHtml = piezaOpts(pr.p, pr.pieza);
    const piezaHtml = piezaOptsHtml
      ? `<div class="field">
           <label>Pieza</label>
           <select onchange="getWS('${wId}').proyectos[${i}].pieza=this.value">${piezaOptsHtml}</select>
         </div>`
      : '';

    return `
      <div class="proj-row">
        ${showRm ? `<button class="rm-btn" onclick="removeProy('${wId}',${i})">✕</button>` : ''}
        <div class="proj-row-top">
          <div class="field">
            <label>Proyecto</label>
            <select onchange="onProjChange('${wId}',${i},this.value)">${projOpts(pr.p)}</select>
          </div>
          <div class="field">
            <label>Horas</label>
            <input type="number" min="0" max="16" step="0.5" placeholder="0"
              value="${pr.horas}"
              oninput="getWS('${wId}').proyectos[${i}].horas=this.value;updProjBar('${wId}')"
              onclick="this.select()"
              style="font-size:18px;font-weight:800;text-align:center;">
          </div>
        </div>
        <div class="proj-row-mid">
          <div class="field">
            <label>Actividad</label>
            <select onchange="getWS('${wId}').proyectos[${i}].actividad=this.value">${actOpts(pr.actividad)}</select>
          </div>
          <div class="field">
            <label>Descripción <span style="font-weight:400;color:var(--subtext)">(opcional)</span></label>
            <input type="text" placeholder="Ej: 10 puertas cocina"
              value="${pr.descripcion||''}"
              oninput="getWS('${wId}').proyectos[${i}].descripcion=this.value">
          </div>
        </div>
        ${piezaHtml}
      </div>
    `;
  }).join('');

  updProjBar(wId);
}

function onProjChange(wId, i, newProjId) {
  getWS(wId).proyectos[i].p     = newProjId;
  getWS(wId).proyectos[i].pieza = '';   // reset pieza when project changes
  renderProyRows(wId);
}

function addProy(wId) {
  getWS(wId).proyectos.push({ p:'', horas:'', actividad:'', descripcion:'', pieza:'' });
  renderProyRows(wId);
}

function removeProy(wId, i) {
  getWS(wId).proyectos.splice(i, 1);
  renderProyRows(wId);
  updProjBar(wId);
}

function updProjBar(wId) {
  const ws     = getWS(wId);
  const total  = horasEq(ws);
  const assigned = ws.proyectos.reduce((s, pr) => s + (parseFloat(pr.horas)||0), 0);
  const bar    = document.getElementById(`proj-bar-${wId}`);
  if (!bar) return;
  if (assigned === 0) {
    bar.className = 'proj-hours-bar phb-empty'; bar.textContent = 'Sin horas asignadas a proyectos';
  } else if (total === 0) {
    bar.className = 'proj-hours-bar phb-warn'; bar.textContent = `Asignado: ${assigned.toFixed(1)} hrs (ingresa horas del día primero)`;
  } else {
    const diff = assigned - total;
    if (Math.abs(diff) < 0.01) {
      bar.className = 'proj-hours-bar phb-ok'; bar.textContent = `✓ ${assigned.toFixed(1)} / ${total.toFixed(1)} hrs — completo`;
    } else if (diff < 0) {
      bar.className = 'proj-hours-bar phb-warn'; bar.textContent = `Asignado: ${assigned.toFixed(1)} / ${total.toFixed(1)} hrs — faltan ${Math.abs(diff).toFixed(1)} hrs`;
    } else {
      bar.className = 'proj-hours-bar phb-over'; bar.textContent = `Asignado: ${assigned.toFixed(1)} / ${total.toFixed(1)} hrs — excede ${diff.toFixed(1)} hrs`;
    }
  }
}

// ── Hours total ───────────────────────────────────────────────
function updHrsTotal(wId) {
  const ws  = getWS(wId);
  const eq  = horasEq(ws);
  const el  = document.getElementById(`htot-${wId}`);
  if (el) el.innerHTML = eq > 0
    ? `<b style="color:var(--green)">${eq.toFixed(1)} horas equivalentes</b>`
    : 'Ingresa las horas trabajadas';
}

// Llamado por oninput de los campos de horas. Si hay un solo proyecto, lo mantiene sincronizado.
function onHoraChange(wId, field, val) {
  const ws = getWS(wId);
  ws[field] = val;
  updHrsTotal(wId);
  if (ws.proyectos.length === 1) {
    const eq = horasEq(ws);
    if (eq > 0) { ws.proyectos[0].horas = eq.toFixed(1); renderProyRows(wId); }
  }
  updProjBar(wId);
}

// Retardo → reduce horasNormal automáticamente
function onRetardoChange(wId, val) {
  const ws  = getWS(wId);
  const min = parseFloat(val) || 0;
  ws.retardoMin = val;
  const reduced = parseFloat(Math.max(0, 9 - min / 60).toFixed(2));
  ws.horasNormal = reduced;
  const h1 = document.getElementById(`h1-${wId}`);
  if (h1) h1.value = reduced;
  updHrsTotal(wId);
  if (ws.proyectos.length === 1) {
    const eq = horasEq(ws);
    if (eq > 0) { ws.proyectos[0].horas = eq.toFixed(2); renderProyRows(wId); }
  }
  updProjBar(wId);
}

// Sincroniza los inputs del DOM al estado antes de validar (por si oninput no se disparó)
function syncFromDOM(wId) {
  const ws  = getWS(wId);
  const h1  = document.getElementById(`h1-${wId}`);
  const h15 = document.getElementById(`h15-${wId}`);
  const h2  = document.getElementById(`h2-${wId}`);
  if (h1  && h1.value  !== '') ws.horasNormal = h1.value;
  if (h15 && h15.value !== '') ws.horasExtra  = h15.value;
  if (h2  && h2.value  !== '') ws.horasDoble  = h2.value;
}

// Guarda el registro de un trabajador en Firebase (upsert)
function saveWorkerRecord(wId) {
  const ws = getWS(wId);
  if (!ws.status) return;
  const db = window.DB.get();
  const record = {
    fecha:         currentDate,
    trabajadorId:  wId,
    estado:        ws.status,
    retardoMin:    parseFloat(ws.retardoMin)  || 0,
    horasNormal:   parseFloat(ws.horasNormal) || 0,
    horasExtra:    parseFloat(ws.horasExtra)  || 0,
    horasDoble:    parseFloat(ws.horasDoble)  || 0,
    horasTotales:  horasEq(ws),
    proyectos:     ws.proyectos.filter(pr => pr.p || pr.horas || pr.descripcion),
    notas:         ws.notas || ''
  };
  // Upsert: si ya existe un registro para este trabajador+fecha, actualizar
  const existing = (db.attendance || []).find(a =>
    (a.fecha || a.date) === currentDate && (a.trabajadorId || a.workerId) === wId && !a._init && (a.estado || a.status));
  if (existing) {
    record.id = existing.id;
    Object.assign(existing, record);
    if (window.parent?.setDocumentInFirebase) {
      window.parent.setDocumentInFirebase('attendance', record.id, existing);
    }
    // También actualizar attendance_logs (upsert interno)
    window.DB.addAttendance({ ...record, date: record.fecha, workerId: record.trabajadorId, status: record.estado, hours: record.horasNormal, horas_x15: record.horasExtra, horas_x2: record.horasDoble });
  } else {
    record.id = crypto.randomUUID();
    window.DB.addAttendance({ ...record, date: record.fecha, workerId: record.trabajadorId, status: record.estado, hours: record.horasNormal, horas_x15: record.horasExtra, horas_x2: record.horasDoble });
  }
}

// ── Status ────────────────────────────────────────────────────
function setStatus(wId, newStatus) {
  if (diaCerrado) { toast('Día cerrado — usa "↩ Reabrir día" para editar','warn'); return; }
  const ws = getWS(wId);
  if (ws.done) { requestEdit(wId); return; }

  ws.status = (ws.status === newStatus) ? '' : newStatus;
  const card = document.getElementById(`card-${wId}`);
  const statusCls = ws.status ? (['trabajo','falta','retardo','vacaciones','falta_justificada'].includes(ws.status) ? ws.status : 'generic') : '';
  card.className = `worker-card${statusCls ? ' st-'+statusCls : ''}`;

  ATTENDANCE_STATES.forEach(st => {
    const btn = document.getElementById(`sb-${st.id}-${wId}`);
    const isKnown = ['trabajo','falta','retardo','vacaciones','falta_justificada'].includes(st.id);
    const clsSuffix = isKnown ? st.id : 'generic';
    if (btn) btn.className = `sbtn${ws.status===st.id ? ' on-'+clsSuffix : ''}`;
    const btnDet = document.getElementById(`sb-det-${st.id}-${wId}`);
    if (btnDet) btnDet.className = `dsbtn${ws.status===st.id ? ' on-'+clsSuffix : ''}`;
  });

  const retrow = document.getElementById(`retrow-${wId}`);
  if (retrow) retrow.style.display = ws.status==='retardo' ? '' : 'none';

  if (ws.status === 'trabajo' || ws.status === 'retardo') {
    if (!ws.horasNormal) {
      ws.horasNormal = 9;
      ws.proyectos[0] = ws.proyectos[0] || { p:'', horas:'', actividad:'', descripcion:'', pieza:'' };
      ws.proyectos[0].horas = '9';
      const h1 = document.getElementById(`h1-${wId}`);
      if (h1) h1.value = '9';
      updHrsTotal(wId);
      renderProyRows(wId);
      updProjBar(wId);
    }
    if (!diaCerrado) openDetail(wId);
  } else {
    ws.horasNormal = ''; ws.horasExtra = ''; ws.horasDoble = '';
    const h1 = document.getElementById(`h1-${wId}`);
    if (h1) h1.value = '';
    updHrsTotal(wId); updProjBar(wId);
  }

  updateFooter();
}

// ── Open / close detail ───────────────────────────────────────
function togDet(wId, e) {
  if (e.target.closest('.sbtn-row') || e.target.closest('.edit-btn') || e.target.closest('.edit-confirm')) return;
  const det = document.getElementById(`det-${wId}`);
  if (!det) return;
  det.classList.contains('open') ? closeDetail(wId) : openDetail(wId);
}

function openDetail(wId) {
  document.getElementById(`det-${wId}`)?.classList.add('open');
  document.getElementById(`card-${wId}`)?.classList.add('open-det');
  document.getElementById(`edit-${wId}`).style.display = 'none';
}

function closeDetail(wId) {
  document.getElementById(`det-${wId}`)?.classList.remove('open');
  document.getElementById(`card-${wId}`)?.classList.remove('open-det');
  document.getElementById(`econf-${wId}`)?.classList.remove('open');
}

// ── Edit confirmation ─────────────────────────────────────────
function requestEdit(wId) {
  document.getElementById(`econf-${wId}`)?.classList.add('open');
}

function cancelEdit(wId) {
  document.getElementById(`econf-${wId}`)?.classList.remove('open');
}

function confirmEdit(wId) {
  document.getElementById(`econf-${wId}`)?.classList.remove('open');
  const ws = getWS(wId);
  ws.done = false;
  const card = document.getElementById(`card-${wId}`);
  document.getElementById('list-pendientes').appendChild(card);
  card.querySelector('.sbtn-row').style.display = '';
  document.getElementById(`edit-${wId}`).style.display = 'none';
  document.getElementById(`chips-${wId}`).innerHTML = '';
  renderProyRows(wId);
  openDetail(wId);
  updateLabels(); updateFooter();
}

// ── Mark done ─────────────────────────────────────────────────
function marcarListo(wId) {
  syncFromDOM(wId);
  const ws = getWS(wId);

  // Si las horas del día están vacías pero hay horas en proyectos, usar esas
  if (ws.status === 'trabajo' || ws.status === 'retardo') {
    const dayHrs = (parseFloat(ws.horasNormal)||0) + (parseFloat(ws.horasExtra)||0) + (parseFloat(ws.horasDoble)||0);
    if (dayHrs === 0) {
      const projHrs = ws.proyectos.reduce((s, pr) => s + (parseFloat(pr.horas)||0), 0);
      if (projHrs > 0) {
        ws.horasNormal = projHrs;
        const h1 = document.getElementById(`h1-${wId}`);
        if (h1) h1.value = projHrs;
        updHrsTotal(wId);
      }
    }
  }

  if (!isComplete(ws)) {
    const msg = !ws.status
      ? '⚠ Selecciona primero el estado del trabajador (✓ / ✗ / ⏰ / ☀)'
      : '⚠ Ingresa al menos las horas trabajadas';
    toast(msg, 'warn');
    document.getElementById(`h1-${wId}`)?.focus();
    return;
  }
  saveWorkerRecord(wId);      // guardar en Firebase inmediatamente
  closeDetail(wId);
  ws.done = true;
  const card    = document.getElementById(`card-${wId}`);
  const listReg = document.getElementById('list-registrados');
  if (card && listReg) listReg.appendChild(card);
  card.querySelector('.sbtn-row').style.display = 'none';
  document.getElementById(`edit-${wId}`).style.display = '';
  buildChips(wId);
  document.getElementById('registrados-section').style.display = '';
  updateLabels(); updateFooter();
  toast(`✓ ${WORKERS.find(w=>w.id===wId)?.nombre} guardado`);
}

function buildChips(wId) {
  const ws   = getWS(wId);
  const cont = document.getElementById(`chips-${wId}`);
  if (!cont) return;
  let html = '';
  if (ws.status === 'falta')      html = `<span class="chip chip-red">✗ Falta</span>`;
  if (ws.status === 'vacaciones') html = `<span class="chip chip-blue">☀ Vacaciones</span>`;
  if (ws.status === 'trabajo' || ws.status === 'retardo') {
    const eq    = horasEq(ws);
    const cls   = ws.status === 'retardo' ? 'chip-amber' : 'chip-green';
    const lbl   = ws.status === 'retardo' ? `⏰ ${eq.toFixed(1)}h` : `✓ ${eq.toFixed(1)}h`;
    html += `<span class="chip ${cls}">${lbl}</span>`;
    const uniqueProjs = [...new Set(ws.proyectos.map(p=>p.p).filter(Boolean))];
    uniqueProjs.forEach(pid => {
      const prj = PROYECTOS.find(p=>p.id===pid);
      if (prj) html += `<span class="chip chip-gray">${prj.id}</span>`;
    });
  }
  cont.innerHTML = html;
}

// ── Labels & footer ───────────────────────────────────────────
function updateLabels() {
  const total = VISIBLE_WORKERS.length;
  const done  = VISIBLE_WORKERS.filter(w => getWS(w.id).done).length;
  document.getElementById('lbl-pendientes').textContent  = `Sin registrar (${total - done})`;
  document.getElementById('lbl-registrados').textContent = `Registrados (${done})`;
  document.getElementById('hdr-badge').textContent       = `${done} / ${total}`;
}

function updateFooter() {
  let t=0, f=0, r=0, v=0, p=0, hrs=0;
  VISIBLE_WORKERS.forEach(w => {
    const ws = getWS(w.id);
    if (!ws.status) {
      p++;
    } else {
      if (ws.status === 'trabajo')         { t++; hrs += horasEq(ws); }
      else if (ws.status === 'retardo')    { r++; hrs += horasEq(ws); }
      else if (ws.status === 'falta' || ws.status === 'falta_justificada') f++;
      else if (ws.status === 'vacaciones') v++;
    }
  });
  document.getElementById('f-t').textContent = t + r;
  document.getElementById('f-f').textContent = f;
  document.getElementById('f-r').textContent = r;
  document.getElementById('f-h').textContent = hrs.toFixed(1);
  document.getElementById('f-p').textContent = p;
}

function collapseAll() { VISIBLE_WORKERS.forEach(w => closeDetail(w.id)); }

// ── Cerrar día ────────────────────────────────────────────────
async function cerrarDia() {
  if (diaCerrado) return;
  const pend = VISIBLE_WORKERS.filter(w => !getWS(w.id).status);
  if (pend.length > 0) {
    const ns = pend.slice(0,3).map(w=>w.nombre).join(', ') + (pend.length>3 ? ` y ${pend.length-3} más`:'');
    if (!confirm(`${pend.length} trabajador(es) sin registrar:\n${ns}\n\n¿Cerrar el día de todas formas?`)) return;
  }

  const t = VISIBLE_WORKERS.filter(w => {const s=getWS(w.id).status; return s==='trabajo'||s==='retardo';}).length;
  const f = VISIBLE_WORKERS.filter(w => getWS(w.id).status==='falta').length;

  try {
    const batchOps = [];
    const db = window.DB.get();

    // Generar operaciones para todos los trabajadores visibles con status
    VISIBLE_WORKERS.forEach(w => {
      syncFromDOM(w.id);
      const ws = getWS(w.id);
      if (!ws.status) return;

      const record = {
        fecha:         currentDate,
        date:          currentDate,
        trabajadorId:  w.id,
        workerId:      w.id,
        estado:        ws.status,
        status:        ws.status,
        retardoMin:    parseFloat(ws.retardoMin)  || 0,
        horasNormal:   parseFloat(ws.horasNormal) || 0,
        horasExtra:    parseFloat(ws.horasExtra)  || 0,
        horasDoble:    parseFloat(ws.horasDoble)  || 0,
        horasTotales:  horasEq(ws),
        proyectos:     ws.proyectos.filter(pr => pr.p || pr.horas || pr.descripcion),
        notas:         ws.notas || '',
        diaCerrado:    true
      };

      const existing = (db.attendance || []).find(a =>
        (a.fecha || a.date) === currentDate && (a.trabajadorId || a.workerId) === w.id && !a._init && (a.estado || a.status));

      record.id = existing ? existing.id : crypto.randomUUID();
      batchOps.push({ type: 'set', col: 'attendance', id: record.id, data: record });

      const attLog = {
        id:           record.id,
        trabajadorId: record.trabajadorId, workerId: record.workerId,
        fecha:        record.fecha,
        estado:       record.estado, status: record.status,
        entrada:      '', salida: '',
        horasNormal:  record.horasNormal, horasExtra: record.horasExtra, horasDoble: record.horasDoble,
        horasTotales: record.horasTotales, retardoMin: record.retardoMin, notas: record.notas
      };
      batchOps.push({ type: 'set', col: 'attendance_logs', id: attLog.id, data: attLog });

      if (record.proyectos && record.proyectos.length) {
        record.proyectos.forEach(p => {
          if (!p.p) return;
          const pLog = {
            id:              crypto.randomUUID(),
            trabajadorId:    record.trabajadorId,
            proyectoId:      p.p,
            fecha:           record.fecha,
            actividad:       p.actividad || '',
            descripcion:     p.descripcion || p.pieza || '',
            horasTrabajadas: parseFloat(p.horas) || (record.horasTotales ? record.horasTotales / record.proyectos.length : 0)
          };
          batchOps.push({ type: 'set', col: 'production_logs', id: pLog.id, data: pLog });
        });
      }
    });

    // Asegurar que los ya registrados que no estaban visibles también se marquen cerrados
    (db.attendance || [])
      .filter(a => (a.fecha || a.date) === currentDate && !a._init && (a.trabajadorId || a.workerId) && (a.estado || a.status))
      .forEach(a => {
        if (!batchOps.find(op => op.col === 'attendance' && op.id === a.id)) {
          const updatedRec = { ...a, diaCerrado: true };
          batchOps.push({ type: 'set', col: 'attendance', id: a.id, data: updatedRec });
        }
      });

    if (window.parent?.runBatchedWrites && batchOps.length > 0) {
      await window.parent.runBatchedWrites(batchOps);
    } else if (batchOps.length > 0) {
      for (const op of batchOps) {
        if (op.type === 'set' && window.parent?.setDocumentInFirebase) {
          await window.parent.setDocumentInFirebase(op.col, op.id, op.data);
        }
      }
    }

    // Actualización local (solo si Firebase fue exitoso)
    if (!db.attendance) db.attendance = [];
    if (!db.attendance_logs) db.attendance_logs = [];
    if (!db.production_logs) db.production_logs = [];
    const pState = window.parent?.DB_STATE;

    batchOps.forEach(op => {
      const colList = db[op.col];
      if (colList) {
        const idx = colList.findIndex(x => x.id === op.id);
        if (idx >= 0) colList[idx] = Object.assign(colList[idx] || {}, op.data);
        else colList.push(op.data);
      }
      if (pState && pState[op.col]) {
        const pIdx = pState[op.col].findIndex(x => x.id === op.id);
        if (pIdx >= 0) pState[op.col][pIdx] = Object.assign(pState[op.col][pIdx] || {}, op.data);
        else pState[op.col].push(op.data);
      }
    });
    window.DB.save(db);

    STATE[currentDate] = { cerrado: true, data: getState(currentDate).data };
    diaCerrado = true;
    updateCerradoUI();
    buildCalendar();
    toast(`✓ Día cerrado — ${t} trabajaron, ${f} faltas`);

  } catch(e) {
    console.error("Error al cerrar el día:", e);
    toast('Error guardando. Verifica tu conexión.', 'error');
  }
}

// ── Reabrir día ───────────────────────────────────────────────
function reabrirDia() {
  const msg = `¿Reabrir el día <b>${currentDate}</b>?\n\nLos datos ya guardados en Firebase NO se borran. Solo podrás volver a registrar. Al cerrar de nuevo se sobrescribirán los registros.`;
  const doReabrir = () => {
    STATE[currentDate].cerrado = false;
    diaCerrado = false;
    updateCerradoUI();
    buildCalendar();
    toast('Día reabierto — edita y vuelve a cerrar', 'warn');
  };
  
  if (window.parent && window.parent.showConfirm) {
    window.parent.showConfirm('Reabrir Día', msg, 'Reabrir', 'btn-amber', doReabrir);
  } else {
    if (confirm(`¿Reabrir el día ${currentDate}?\n\nLos datos ya guardados en Firebase NO se borran. Solo podrás volver a registrar. Al cerrar de nuevo se sobrescribirán los registros.`)) doReabrir();
  }
}

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  try {
    document.getElementById('list-pendientes').innerHTML = '<div style="padding:20px;text-align:center;color:var(--subtext);">Cargando…</div>';
    await loadMasterData();
    document.getElementById('fecha').value = todayStr();
    onDateChange();
  } catch (e) {
    document.getElementById('list-pendientes').innerHTML = `<div style="padding:20px;color:var(--red);">Error: ${e.message}</div>`;
    console.error(e);
  }
});
</script>
