<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Pedido</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding-bottom: 80px; }
.main { max-width: 820px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 24px; }
.card h3 { font-size: 14px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
.field input, .field select, .field textarea { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-size: 14px; font-family: inherit; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-blue  { background: var(--blue);  color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-sm { background: var(--surface0); color: var(--text); padding: 6px 12px; font-size: 12px; }

/* Pre-approved status badge */
.status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
.status-badge.confirmado { background: rgba(30,102,245,0.15); color: var(--blue); border: 1px solid var(--blue); }
.status-badge.autorizado { background: rgba(64,160,43,0.15); color: var(--green); border: 1px solid var(--green); }

/* Orders list */
.sec-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--subtext); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--crust); }
.pill { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
.pill-amber  { background: rgba(223,142,29,0.15);  color: var(--amber); }
.pill-blue   { background: rgba(30,102,245,0.15);  color: var(--blue);  }
.pill-green  { background: rgba(64,160,43,0.15);   color: var(--green); }
.pill-gray   { background: var(--surface0);         color: var(--subtext); }
.toast-wrap  { position: fixed; top: 70px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }

/* Items table */
.items-table { width: 100%; border-collapse: collapse; }
.items-table th { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; padding: 6px 8px; border-bottom: 2px solid var(--crust); text-align: left; }
.items-table td { padding: 6px 4px; border-bottom: 1px solid var(--crust); vertical-align: bottom; }
.items-table input, .items-table select { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-size: 13px; font-family: inherit; width: 100%; }
.items-table input:focus, .items-table select:focus { outline: none; border-color: var(--blue); }
.rm-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 4px 8px; }

/* Row type toggle */
.tipo-toggle { display:inline-flex; border-radius:6px; overflow:hidden; border:1px solid var(--crust); cursor:pointer; font-size:11px; font-weight:700; margin-bottom:5px; }
.tipo-toggle span { padding:3px 9px; background:var(--surface0); color:var(--subtext); transition:.15s; border-right:1px solid var(--crust); }
.tipo-toggle span:last-child { border-right:none; }
.tipo-toggle span.active-mat  { background:var(--blue-bg);  color:var(--blue); }
.tipo-toggle span.active-herr { background:var(--amber-bg); color:var(--amber); }
.tipo-toggle span.active-wood { background:rgba(64,160,43,.12); color:var(--green); }
.herr-badge { display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber); margin-left:5px; vertical-align:middle; }
.wood-badge { display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; background:rgba(64,160,43,.12); color:var(--green); border:1px solid var(--green); margin-left:5px; vertical-align:middle; }
</style>
</head>
<body>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="back-btn" onclick="if(window.parent?.goBackModule) window.parent.goBackModule(); else window.history.back();">← Volver</button>
    <h2 class="hdr-title">Hoja de Pedido</h2>
    <span id="status-badge-hdr" style="display:none;"></span>
  </div>
  <button class="btn btn-blue" id="submit-btn" onclick="submitRequest()">Enviar Solicitud</button>
</div>

<div class="main">

  <div class="card">
    <h3>Información del Pedido</h3>
    <div class="grid2">
      <div class="field">
        <label>Proyecto / Destino</label>
        <select id="proj" data-searchable>
          <option value="">— Stock General (sin proyecto) —</option>
        </select>
      </div>
      <div class="field">
        <label>Solicitante</label>
        <select id="requester" data-searchable>
          <option value="">— Seleccionar —</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:12px;">
      <label>Notas / Justificación</label>
      <textarea id="notes" rows="3" placeholder="Ej. Material requerido para instalar cocina según planos..."></textarea>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0;">Artículos Solicitados</h3>
      <button class="btn btn-sm" onclick="addRow()">+ Añadir renglón</button>
    </div>
    <table class="items-table">
      <thead>
        <tr>
          <th style="width:60%">Artículo / Concepto</th>
          <th style="width:30%">Cantidad</th>
          <th style="width:10%"></th>
        </tr>
      </thead>
      <tbody id="itemsList"></tbody>
    </table>
  </div>

</div>

<!-- ── Pedidos Activos & Historial ── -->
<div class="main" id="orders-sections" style="margin-top:0;">
  <div id="pedidos-activos"></div>
  <div id="historial-pedidos"></div>
</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
  let INV   = [];
  let UNITS = [];
  let ORDERS = [];
  let WOOD_NAMES = [];
  const WOOD_UNITS = ['pza','m3','pt','tablon','viga','regla','carga'];

  // INIT_STATUS: 'Pedido' (default), 'Confirmado' (from compras), 'Autorizado' (from admin)
  const INIT_STATUS = new URLSearchParams(location.search).get('status') || 'Pedido';

  // ── Orders loading ────────────────────────────────────────────
  async function loadOrders() {
    ORDERS = (await window.DB.query('purchase_orders')) || [];
    renderActivePedidos();
    renderHistorialPedidos();
  }

  const PILL_MAP = {
    'Pedido':'pill-amber','Solicitado':'pill-amber','Confirmado':'pill-blue',
    'Autorizado':'pill-green','Comprado':'pill-green','Recibido':'pill-green','Cancelado':'pill-red'
  };

  function sfFlow(cur) {
    const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
    const ci = steps.findIndex(([s])=>s===cur);
    return '<div class="sf-flow">'+steps.map(([,l],i)=>(i>0?'<span class="sf-sep">›</span>':'')+`<span class="sf-step ${i<ci?'sf-done':i===ci?'sf-active':''}">${l}</span>`).join('')+'</div>';
  }

  function renderActivePedidos() {
    const pedidos = ORDERS
      .filter(o => !o._init && o.status === 'Pedido')
      .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));
    const cont = document.getElementById('pedidos-activos');
    if (!pedidos.length) { cont.innerHTML = ''; return; }

    let html = `<div class="sec-lbl">Pedidos Enviados (${pedidos.length})</div>`;
    pedidos.forEach(o => {
      const itemsHtml = (o.items||[]).map(i => window.renderPurchaseCardItem(i, { showPrice: false })).join('');
      html += `
        <div class="ficha" id="rq-${o.id}">
          <div class="ficha-hdr">
            <span class="ficha-folio">${o.folio}</span>
            <span class="pill pill-amber">Pedido</span>
          </div>
          <div class="ficha-meta">
            <span>📁 ${o.project||'Stock General'}</span>
            ${o.requester?`<span>👤 ${o.requester}</span>`:''}
            ${o.date?`<span>📅 ${o.date}</span>`:''}
            ${o.notes?`<span>📝 ${o.notes}</span>`:''}
          </div>
          ${sfFlow('Pedido')}
          <div class="ficha-items">${itemsHtml}</div>
          <div class="ficha-actions" style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
            <button class="btn" style="background:var(--red);color:#fff;font-size:12px;padding:5px 12px;" onclick="cancelOrder('${o.id}')">Cancelar</button>
            <button class="btn btn-green" style="font-size:12px;padding:5px 12px;" onclick="confirmOrder('${o.id}')">Confirmar</button>
          </div>
        </div>`;
    });
    cont.innerHTML = html;
  }

  function renderHistorialPedidos() {
    const TERMINAL = ['Cancelado','Recibido','Entregado'];
    const hist = ORDERS
      .filter(o => !o._init && o.status !== 'Pedido' && !o.manual && !TERMINAL.includes(o.status))
      .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));
    const cont = document.getElementById('historial-pedidos');
    if (!hist.length) { cont.innerHTML = ''; return; }

    const isOpen = localStorage.getItem('rq_almacen_hist') !== 'closed';
    let html = `
      <div class="sec-lbl" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;" onclick="toggleHist(this)">
        <span>En Proceso (${hist.length})</span>
        <span id="hist-arrow">${isOpen ? '▲' : '▼'}</span>
      </div>
      <div id="hist-body" style="display:${isOpen ? 'block' : 'none'};">`;
    hist.forEach(o => {
      const cls = PILL_MAP[o.status] || 'pill-gray';
      html += `
        <div class="ficha" style="opacity:.75;">
          <div class="ficha-hdr">
            <span class="ficha-folio">${o.folio}</span>
            <span class="pill ${cls}">${o.status}</span>
          </div>
          <div class="ficha-meta">
            <span>📁 ${o.project||'Stock'}</span>
            ${o.requester?`<span>👤 ${o.requester}</span>`:''}
            ${o.date?`<span>📅 ${o.date}</span>`:''}
          </div>
          ${sfFlow(o.status)}
        </div>`;
    });
    html += '</div>';
    cont.innerHTML = html;
  }

  function toggleHist(hdr) {
    const body  = document.getElementById('hist-body');
    const arrow = document.getElementById('hist-arrow');
    const open  = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    arrow.textContent  = open ? '▼' : '▲';
    localStorage.setItem('rq_almacen_hist', open ? 'closed' : 'open');
  }

  async function cancelOrder(ordId) {
    const order = ORDERS.find(o => o.id === ordId);
    if (!order || !window.confirm(`¿Cancelar pedido ${order.folio}?`)) return;
    order.status = 'Cancelado';
    order.cancelledAt = new Date().toISOString();
    if (window.parent?.setDocumentInFirebase)
      await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
    if (window.parent?.DB_STATE?.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
      if (idx >= 0) window.parent.DB_STATE.purchase_orders[idx] = order;
    }
    toast('Pedido cancelado.');
    renderActivePedidos();
    renderHistorialPedidos();
  }

  async function confirmOrder(ordId) {
    const order = ORDERS.find(o => o.id === ordId);
    if (!order || !window.confirm(`¿Confirmar pedido ${order.folio}?\nPasará al Panel de Compras.`)) return;
    order.status = 'Confirmado';
    order.confirmedAt = new Date().toISOString();
    if (window.parent?.setDocumentInFirebase)
      await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
    if (window.parent?.DB_STATE?.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
      if (idx >= 0) window.parent.DB_STATE.purchase_orders[idx] = order;
    }
    toast('Pedido confirmado — aparece en Panel de Compras.');
    renderActivePedidos();
    renderHistorialPedidos();
  }

  async function init() {
    // Adapt header based on init status
    const badge = document.getElementById('status-badge-hdr');
    const btn   = document.getElementById('submit-btn');
    if (INIT_STATUS === 'Confirmado') {
      badge.style.display = '';
      badge.className = 'status-badge confirmado';
      badge.textContent = 'Pedido Confirmado';
      btn.textContent = 'Guardar Pedido';
    } else if (INIT_STATUS === 'Autorizado') {
      badge.style.display = '';
      badge.className = 'status-badge autorizado';
      badge.textContent = 'Pedido Autorizado';
      btn.textContent = 'Guardar Pedido';
      btn.className = 'btn btn-green';
    }

    if (window.parent?.cargar_coleccion) {
      await window.parent.cargar_coleccion('wood_price_catalog');
    }
    const [projects, contacts, inventory, conceptUnits, woodFormats, woodTypes, woodQuality] = await Promise.all([
      window.DB.query('projects'),
      window.DB.query('contacts'),
      window.DB.query('inventory'),
      window.DB.query('concept_units'),
      window.DB.query('wood_formats').catch(() => []),
      window.DB.query('wood_types').catch(() => []),
      window.DB.query('wood_quality').catch(() => []),
    ]);

    // Projects dropdown
    const activeStatuses = ['Planificación', 'En Producción'];
    const activeProjs = projects.filter(p => (p.codigo||p.code) && (p.nombre||p.name) && activeStatuses.includes((p.estado||p.status)));
    const histProjs   = projects.filter(p => (p.codigo||p.code) && (p.nombre||p.name) && !activeStatuses.includes((p.estado||p.status)));
    const projSel = document.getElementById('proj');
    if (activeProjs.length) {
      const g = document.createElement('optgroup'); g.label = 'Proyectos Activos';
      activeProjs.forEach(p => { const o = document.createElement('option'); o.value = (p.codigo||p.code); o.textContent = `${(p.codigo||p.code)} – ${(p.nombre||p.name)}`; g.appendChild(o); });
      projSel.appendChild(g);
    }
    if (histProjs.length) {
      const g = document.createElement('optgroup'); g.label = 'Proyectos Anteriores';
      histProjs.forEach(p => { const o = document.createElement('option'); o.value = (p.codigo||p.code); o.textContent = `${(p.codigo||p.code)} – ${(p.nombre||p.name)}`; g.appendChild(o); });
      projSel.appendChild(g);
    }

    // Requester dropdown
    const reqSel = document.getElementById('requester');
    const workers = contacts.filter(c => c.tipo === 'trabajador' && c.activo !== false && (c.name || c.givenName));
    workers.forEach(w => { const o = document.createElement('option'); o.value = w.name||w.givenName; o.textContent = w.name||w.givenName; reqSel.appendChild(o); });
    SearchableSelect.init(projSel);
    SearchableSelect.init(reqSel);

    // Inventory & units
    INV = inventory.filter(i => i.code && i.name);
    const rawUnits = conceptUnits[0]?.list || [];
    UNITS = rawUnits.length ? rawUnits : ['pza','caja','mt','mt2','lt','kg','gln','rollo','par','juego','bolsa'];

    // Wood catalogs
    const extractList = arr => {
      const list = arr?.[0]?.list || arr || [];
      return list.map(x => typeof x === 'object' ? (x.name || x.nombre) : x).filter(Boolean);
    };

    const wf = extractList(woodFormats);
    if (wf.length) WOOD_FORMATS = [...new Set(wf)].sort((a,b) => a.localeCompare(b, 'es'));

    const wt = extractList(woodTypes);
    if (wt.length) WOOD_SPECIES = [...new Set(wt)].sort((a,b) => a.localeCompare(b, 'es'));

    const wq = extractList(woodQuality);
    if (wq.length) WOOD_QUALS = [...new Set(wq)].sort((a,b) => a.localeCompare(b, 'es'));

    addRow();
    await loadOrders();
  }

  // Helper logic for custom concept options
  function buildInvOptions(selectedCode) {
    return `<option value="">— Buscar concepto —</option>` +
      INV.map(i => `<option value="${i.code}" data-unit="${i.unit||'pza'}" ${i.code===selectedCode?'selected':''}>${i.name}</option>`).join('') +
      `<option value="_new" style="font-weight:700;color:var(--blue);">+ Concepto nuevo…</option>`;
  }

  function buildUnitOptions(selected) {
    return UNITS.map(u => `<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
  }

  function buildWoodUnitOptions(selected) {
    return WOOD_UNITS.map(u => `<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
  }

  let WOOD_FORMATS = [];
  let WOOD_SPECIES = ['Cedro','Parota','Encino','Pino','Tzalam','Macuil','Mezquite','Tepeguaje','Guanacaste','Primavera','Caoba','Nogal'];
  let WOOD_QUALS = ['Primera', 'Segunda', 'Tercera'];

  function buildWoodFormatOptions(selected) {
    return `<option value="">— Formato —</option>` +
      WOOD_FORMATS.map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
  }
  function buildWoodSpeciesOptions(selected) {
    return `<option value="">— Especie —</option>` +
      WOOD_SPECIES.map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
  }
  function buildWoodQualOptions(selected) {
    return `<option value="">— Calidad —</option>` +
      WOOD_QUALS.map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
  }

  function addRow(tipo='material', data={}) {
    const { code='', name='', qty=1, unit='pza', especie='', nombre='', calidad='', woodUnit='pza', notas='' } = data;
    const tbody = document.getElementById('itemsList');
    const tr = document.createElement('tr');
    tr.dataset.tipo = tipo;

    const isHerr  = tipo === 'herramienta';
    const isWood  = tipo === 'madera';
    const isMat   = !isHerr && !isWood;
    const isCustom = isMat && (!code || !INV.find(i => i.code === code));

    tr.innerHTML = `
      <td style="vertical-align:bottom; padding-bottom:10px;">
        <div class="tipo-toggle" style="margin-bottom:8px;">
          <span class="${isMat?'active-mat':''}"  onclick="setTipoRow(this.closest('tr'),'material')">📦 Material</span>
          <span class="${isHerr?'active-herr':''}" onclick="setTipoRow(this.closest('tr'),'herramienta')">🔧 Herramienta</span>
          <span class="${isWood?'active-wood':''}" onclick="setTipoRow(this.closest('tr'),'madera')">🪵 Madera</span>
        </div>
        <div class="i-mat-wrap" style="${isHerr||isWood?'display:none':''}">
          <select class="i-sel" data-searchable data-allow-new onchange="handleConceptChange(this)">
            ${buildInvOptions(code)}
          </select>
          <input type="text" class="i-custom" placeholder="Descripción del material" value="${name}"
            style="display:${isCustom&&name?'block':'none'}; margin-top:4px;">
        </div>
        <input type="text" class="i-herr-name" placeholder="Nombre de la herramienta…" value="${isHerr?name:''}"
          style="display:${isHerr?'block':'none'};">
        <div class="i-wood-wrap" style="display:${isWood?'flex':'none'}; gap:4px; flex-wrap:wrap; margin-top:4px;">
          <div style="flex:1; min-width:90px;">
            <select class="i-wood-format" data-searchable>
              ${buildWoodFormatOptions(nombre)}
            </select>
          </div>
          <div style="flex:1; min-width:90px;">
            <select class="i-wood-species" data-searchable>
              ${buildWoodSpeciesOptions(especie)}
            </select>
          </div>
          <div style="flex:1; min-width:90px;">
            <select class="i-wood-qual" data-searchable>
              ${buildWoodQualOptions(calidad)}
            </select>
          </div>
        </div>
      </td>
      <td style="vertical-align:bottom; padding-bottom:10px;">
        <input type="number" class="i-qty" value="${isWood?1:qty}" min="0.01" step="any" style="width:90px;">
      </td>
      <td style="display:none;">
        <select class="i-unit" data-searchable style="${isWood?'display:none':''}">${buildUnitOptions(unit)}</select>
        <select class="i-wood-unit" style="${isWood?'':'display:none'}">${buildWoodUnitOptions(woodUnit)}</select>
      </td>
      <td style="vertical-align:bottom; padding-bottom:10px; text-align:right;">
        <button class="rm-btn" onclick="this.closest('tr').remove()">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
    if (isMat) SearchableSelect.init(tr.querySelector('.i-sel'));
    if (!isWood) SearchableSelect.init(tr.querySelector('.i-unit'));
    if (isWood) {
      SearchableSelect.init(tr.querySelector('.i-wood-format'));
      SearchableSelect.init(tr.querySelector('.i-wood-species'));
      SearchableSelect.init(tr.querySelector('.i-wood-qual'));
    }
  }

  function unitEl(tr) {
    const sel = tr.querySelector('.i-unit');
    return sel.closest('.ss-wrap') || sel;
  }

  function setTipoRow(tr, tipo) {
    tr.dataset.tipo = tipo;
    const spans      = tr.querySelectorAll('.tipo-toggle span');
    const matWrap    = tr.querySelector('.i-mat-wrap');
    const herrName   = tr.querySelector('.i-herr-name');
    const woodWrap   = tr.querySelector('.i-wood-wrap');
    const woodUnitSel= tr.querySelector('.i-wood-unit');

    spans[0].className = '';
    spans[1].className = '';
    spans[2].className = '';

    matWrap.style.display     = 'none';
    herrName.style.display    = 'none';
    woodWrap.style.display    = 'none';
    unitEl(tr).style.display  = '';
    woodUnitSel.style.display = 'none';

    if (tipo === 'material') {
      spans[0].className = 'active-mat';
      matWrap.style.display = '';
      const iSel = tr.querySelector('.i-sel');
      if (!iSel._ssInit) SearchableSelect.init(iSel);
      else iSel._ssSync?.();
      tr.querySelector('.i-custom').style.display = 'none';
      const rawUnit = tr.querySelector('.i-unit');
      rawUnit.disabled = false;
      rawUnit.style.opacity = '';
    } else if (tipo === 'herramienta') {
      spans[1].className = 'active-herr';
      herrName.style.display = 'block';
      herrName.value = '';
      herrName.focus();
    } else { // madera
      spans[2].className = 'active-wood';
      woodWrap.style.display    = 'flex';
      unitEl(tr).style.display  = 'none';
      woodUnitSel.style.display = '';
      
      const wf = tr.querySelector('.i-wood-format');
      if (!wf._ssInit) SearchableSelect.init(wf); else wf._ssSync?.();
      
      const ws = tr.querySelector('.i-wood-species');
      if (!ws._ssInit) SearchableSelect.init(ws); else ws._ssSync?.();
      
      const wq = tr.querySelector('.i-wood-qual');
      if (!wq._ssInit) SearchableSelect.init(wq); else wq._ssSync?.();
    }
  }

  function handleConceptChange(sel) {
    const tr = sel.closest('tr');
    const customInput = tr.querySelector('.i-custom');
    const unitSel = tr.querySelector('.i-unit');
    if (sel.value === '_new') {
      const typed = sel.dataset.allowNewText || '';
      sel.value = '';
      if (sel._ssSync) sel._ssSync();
      customInput.style.display = 'block';
      if (typed) customInput.value = typed;
      customInput.focus();
      unitSel.disabled = false;
      unitSel.style.opacity = '';
    } else if (sel.value) {
      const opt = sel.options[sel.selectedIndex];
      if (opt?.dataset?.unit) {
        unitSel.value = opt.dataset.unit;
        unitSel.disabled = true;
        unitSel.style.opacity = '.6';
      }
      customInput.style.display = 'none';
    } else {
      customInput.style.display = 'none';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
    }
  }

  function toast(msg, type = 'ok') {
    const wrap = document.getElementById('toast-wrap');
    const bg = type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--green)';
    const el = document.createElement('div');
    el.style.cssText = `background:${bg};color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);`;
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  async function submitRequest() {
    const projCode  = document.getElementById('proj').value;
    const requester = document.getElementById('requester').value;
    const notes     = document.getElementById('notes').value.trim();
    const items = [];

    document.querySelectorAll('#itemsList tr').forEach(tr => {
      const tipo = tr.dataset.tipo || 'material';

      if (tipo === 'madera') {
        const fmtSel  = tr.querySelector('.i-wood-format');
        const spcSel  = tr.querySelector('.i-wood-species');
        const qualSel = tr.querySelector('.i-wood-qual');
        
        const nombre  = fmtSel ? fmtSel.value : '';
        const especie = spcSel ? spcSel.value : '';
        const calidad = qualSel ? qualSel.value : '';
        
        const cantidad = parseFloat(tr.querySelector('.i-qty').value) || 1;
        const unit     = tr.querySelector('.i-wood-unit').value;
        if (nombre || especie) items.push({ tipo: 'madera', nombre, especie, calidad, cantidad, unit });
      } else if (tipo === 'herramienta') {
        const name = tr.querySelector('.i-herr-name').value.trim();
        const qty  = parseFloat(tr.querySelector('.i-qty').value) || 0;
        const unit = tr.querySelector('.i-unit').value;
        if (name && qty > 0) items.push({ tipo: 'herramienta', name, qty, unit, esHerramienta: true });
      } else { // material
        const sel    = tr.querySelector('.i-sel');
        const custom = tr.querySelector('.i-custom');
        const qty    = parseFloat(tr.querySelector('.i-qty').value) || 0;
        const unit   = tr.querySelector('.i-unit').value;
        let code = sel.value, name = '';
        if (code && code !== '_new') {
          const inv = INV.find(i => i.code === code);
          name = inv ? inv.name : sel.options[sel.selectedIndex]?.text || code;
        } else {
          name = custom?.value.trim() || '';
          code = '';
        }
        if ((name || code) && qty > 0) items.push({ code, name, qty, unit, price: 0 });
      }
    });

    if (!items.length) { toast('Agrega al menos un artículo.', 'warn'); return; }

    const now = new Date();
    const folio = 'RQ-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') +
                  String(now.getDate()).padStart(2,'0') + '-' + String(now.getTime()).slice(-4);

    const request = {
      id: crypto.randomUUID(),
      folio,
      date: now.toISOString().slice(0,10),
      status: INIT_STATUS,
      project: projCode,
      requester,
      notes,
      items,
      createdAt: now.toISOString(),
    };

    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', request.id, request);
      if (window.parent.DB_STATE) {
        if (!window.parent.DB_STATE.purchase_orders) window.parent.DB_STATE.purchase_orders = [];
        window.parent.DB_STATE.purchase_orders.push(request);
      }
    }

    document.getElementById('proj').value = '';
    document.getElementById('requester').value = '';
    document.getElementById('notes').value = '';
    document.getElementById('itemsList').innerHTML = '';
    addRow();

    ORDERS.push(request);

    const statusMsg = INIT_STATUS === 'Autorizado'
      ? `Pedido ${folio} guardado como Autorizado`
      : INIT_STATUS === 'Confirmado'
        ? `Pedido ${folio} guardado — aparece en Panel de Compras`
        : `Pedido ${folio} enviado — pendiente de confirmación`;
    toast(statusMsg);

    if (INIT_STATUS === 'Pedido') {
      renderActivePedidos();
      renderHistorialPedidos();
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
