<!DOCTYPE html>
<html lang="es">
<head>
<link rel="stylesheet" href="global.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Pedido</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body { background: var(--base); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding-bottom: 80px; }
.main { max-width: 820px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; padding: 24px; }
.card h3 { font-size: 14px; font-weight: 800; color: var(--subtext); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; }
.field input, .field select, .field textarea { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-size: 14px; font-family: inherit; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--blue); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn { padding: 9px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; transition: opacity .15s; }
.btn:hover { opacity: .8; }
.btn-blue  { background: var(--blue);  color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-sm { background: var(--surface0); color: var(--text); padding: 6px 12px; font-size: 12px; }

/* Orders list */
.sec-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--subtext); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--crust); }
.ord-card { background: var(--mantle); border: 1px solid var(--crust); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
.ord-card.c-done { opacity: .55; }
.ord-folio { font-size: 13px; font-weight: 800; }
.ord-meta  { font-size: 12px; color: var(--subtext); margin-top: 2px; }
.pill { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
.pill-amber  { background: rgba(223,142,29,0.15);  color: var(--amber); }
.pill-blue   { background: rgba(30,102,245,0.15);  color: var(--blue);  }
.pill-green  { background: rgba(64,160,43,0.15);   color: var(--green); }
.pill-gray   { background: var(--surface0);         color: var(--subtext); }
.toast-wrap  { position: fixed; top: 70px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }

/* Items table */
.items-table { width: 100%; border-collapse: collapse; }
.items-table th { font-size: 11px; font-weight: 700; color: var(--subtext); text-transform: uppercase; padding: 6px 8px; border-bottom: 2px solid var(--crust); text-align: left; }
.items-table td { padding: 6px 4px; border-bottom: 1px solid var(--crust); vertical-align: bottom; }
.items-table input, .items-table select { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--crust); background: var(--base); color: var(--text); font-size: 13px; font-family: inherit; width: 100%; }
.items-table input:focus, .items-table select:focus { outline: none; border-color: var(--blue); }
.rm-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 4px 8px; }
.tipo-toggle { display:inline-flex; border-radius:6px; overflow:hidden; border:1px solid var(--crust); cursor:pointer; font-size:11px; font-weight:700; margin-bottom:5px; }
.tipo-toggle span { padding:3px 9px; background:var(--surface0); color:var(--subtext); transition:.15s; }
.tipo-toggle span.active-mat  { background:var(--blue-bg);  color:var(--blue); }
.tipo-toggle span.active-herr { background:var(--amber-bg); color:var(--amber); }
.tipo-toggle span.active-mad  { background:var(--green-bg); color:var(--green); }
.herr-badge { display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber); margin-left:5px; vertical-align:middle; }
</style>
</head>
<body>

<div class="toast-wrap" id="toast-wrap"></div>

<div class="hdr">
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="back-btn" onclick="window.history.back()">← Volver</button>
    <span class="hdr-title">Hoja de Pedido</span>
  </div>
  <button class="btn btn-blue" onclick="submitRequest()">↗ Enviar Solicitud</button>
</div>

<div class="main">

  <div class="card">
    <h3>Información del Pedido</h3>
    <div class="grid2">
      <div class="field">
        <label>Proyecto / Destino</label>
        <select id="proj" data-searchable>
          <option value="">— Stock General (sin proyecto) —</option>
        </select>
      </div>
      <div class="field">
        <label>Solicitante</label>
        <select id="requester" data-searchable>
          <option value="">— Seleccionar —</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-top:12px;">
      <label>Notas / Justificación</label>
      <textarea id="notes" rows="3" placeholder="Ej. Material requerido para instalar cocina según planos..."></textarea>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0;">Materiales Solicitados</h3>
      <button class="btn btn-sm" onclick="addRow()">+ Añadir renglón</button>
    </div>

    <table class="items-table">
      <thead>
        <tr>
          <th style="width:45%">Material / Concepto</th>
          <th style="width:20%">Cantidad</th>
          <th style="width:20%">Unidad</th>
          <th style="width:12%"></th>
        </tr>
      </thead>
      <tbody id="itemsList"></tbody>
    </table>
  </div>

</div>

<!-- ── Pedidos Activos & Historial ── -->
<div class="main" id="orders-sections" style="margin-top:0;">
  <div id="pedidos-activos"></div>
  <div id="historial-pedidos"></div>
</div>

<script src="searchable-select.js"></script>
<script src="db.js"></script>
<script>
  let INV        = [];
  let MADERA_INV = [];
  let UNITS  = [];
  let ORDERS = [];

  // ── Orders loading ────────────────────────────────────────────
  async function loadOrders() {
    ORDERS = (await window.DB.query('purchase_orders')) || [];
    renderActivePedidos();
    renderHistorialPedidos();
  }

  const PILL_MAP = {
    'Pedido':'pill-amber','Solicitado':'pill-amber','Confirmado':'pill-blue',
    'Autorizado':'pill-green','Comprado':'pill-green','Recibido':'pill-green','Cancelado':'pill-red'
  };
  function sfFlow(cur) {
    const steps = [['Pedido','Solicitado'],['Confirmado','Confirmado'],['Autorizado','Autorizado'],['Comprado','Comprado'],['Recibido','Recibido']];
    const ci = steps.findIndex(([s])=>s===cur);
    return '<div class="sf-flow">'+steps.map(([,l],i)=>(i>0?'<span class="sf-sep">›</span>':'')+`<span class="sf-step ${i<ci?'sf-done':i===ci?'sf-active':''}">${l}</span>`).join('')+'</div>';
  }

  function renderActivePedidos() {
    const pedidos = ORDERS
      .filter(o => !o._init && o.status === 'Pedido')
      .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));
    const cont = document.getElementById('pedidos-activos');
    if (!pedidos.length) { cont.innerHTML = ''; return; }

    let html = `<div class="sec-lbl">Pedidos Enviados (${pedidos.length})</div>`;
    pedidos.forEach(o => {
      const itemsHtml = (o.items||[]).map(i => `
        <div class="ficha-item">
          <span class="ficha-item-name">${i.name||i.code||'—'}${i.esHerramienta?'<span class="herr-badge">🔧</span>':''}</span>
          <span class="ficha-item-qty">${i.qty} ${i.unit||'pza'}</span>
        </div>`).join('');
      html += `
        <div class="ficha" id="rq-${o.id}">
          <div class="ficha-hdr">
            <span class="ficha-folio">${o.folio}</span>
            <span class="pill pill-amber">Pedido</span>
          </div>
          <div class="ficha-meta">
            <span>📁 ${o.project||'Stock General'}</span>
            ${o.requester?`<span>👤 ${o.requester}</span>`:''}
            ${o.date?`<span>📅 ${o.date}</span>`:''}
            ${o.notes?`<span>📝 ${o.notes}</span>`:''}
          </div>
          ${sfFlow('Pedido')}
          <div class="ficha-items">${itemsHtml}</div>
          <div class="ficha-actions" style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;">
            <button class="btn btn-red" style="font-size:12px;padding:5px 12px;" onclick="cancelOrder('${o.id}')">✕ Cancelar</button>
            <button class="btn btn-green" style="font-size:12px;padding:5px 12px;" onclick="confirmOrder('${o.id}')">✓ Confirmar</button>
          </div>
        </div>`;
    });
    cont.innerHTML = html;
  }

  function renderHistorialPedidos() {
    const TERMINAL = ['Cancelado','Recibido','Entregado'];
    const hist = ORDERS
      .filter(o => !o._init && o.status !== 'Pedido' && !o.manual && !TERMINAL.includes(o.status))
      .sort((a, b) => new Date(b.createdAt||b.date) - new Date(a.createdAt||a.date));
    const cont = document.getElementById('historial-pedidos');
    if (!hist.length) { cont.innerHTML = ''; return; }

    const isOpen = localStorage.getItem('rq_almacen_hist') !== 'closed';
    let html = `
      <div class="sec-lbl" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;" onclick="toggleHist(this)">
        <span>En Proceso (${hist.length})</span>
        <span id="hist-arrow">${isOpen ? '▲' : '▼'}</span>
      </div>
      <div id="hist-body" style="display:${isOpen ? 'block' : 'none'};">`;
    hist.forEach(o => {
      const cls = PILL_MAP[o.status] || 'pill-gray';
      const itemsTxt = (o.items||[]).map(i => `${i.qty} ${i.unit||'pza'} — ${i.name||i.code}`).join(' · ');
      html += `
        <div class="ficha" style="opacity:.75;">
          <div class="ficha-hdr">
            <span class="ficha-folio">${o.folio}</span>
            <span class="pill ${cls}">${o.status}</span>
          </div>
          <div class="ficha-meta">
            <span>📁 ${o.project||'Stock'}</span>
            ${o.requester?`<span>👤 ${o.requester}</span>`:''}
            ${o.date?`<span>📅 ${o.date}</span>`:''}
          </div>
          ${sfFlow(o.status)}
        </div>`;
    });
    html += '</div>';
    cont.innerHTML = html;
  }

  function toggleHist(hdr) {
    const body = document.getElementById('hist-body');
    const arrow = document.getElementById('hist-arrow');
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'block';
    arrow.textContent  = open ? '▼' : '▲';
    localStorage.setItem('rq_almacen_hist', open ? 'closed' : 'open');
  }

  async function cancelOrder(ordId) {
    const order = ORDERS.find(o => o.id === ordId);
    if (!order || !window.confirm(`¿Cancelar pedido ${order.folio}?\nSe moverá al Historial de Compras.`)) return;
    order.status = 'Cancelado';
    order.cancelledAt = new Date().toISOString();
    if (window.parent?.setDocumentInFirebase)
      await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
    if (window.parent?.DB_STATE?.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
      if (idx >= 0) window.parent.DB_STATE.purchase_orders[idx] = order;
    }
    toast('Pedido cancelado — aparece en Historial de Compras.');
    renderActivePedidos();
    renderHistorialPedidos();
  }

  async function confirmOrder(ordId) {
    const order = ORDERS.find(o => o.id === ordId);
    if (!order) return;
    if (!await showConfirm(`¿Confirmar pedido ${order.folio}?<br><span style="font-weight:400;font-size:13px;">Pasará a la lista de cotizaciones en el Panel de Compras.</span>`)) return;

    order.status = 'Confirmado';
    order.confirmedAt = new Date().toISOString();

    if (window.parent?.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', ordId, order);
    }
    if (window.parent?.DB_STATE?.purchase_orders) {
      const idx = window.parent.DB_STATE.purchase_orders.findIndex(x => x.id === ordId);
      if (idx >= 0) window.parent.DB_STATE.purchase_orders[idx] = order;
    }

    toast('✓ Pedido confirmado — ahora aparece en Panel de Compras para cotizar precio y proveedor');
    renderActivePedidos();
    renderHistorialPedidos();
  }

  function toast(msg, type = 'ok') {
    const wrap = document.getElementById('toast-wrap');
    const bg = type === 'error' ? 'var(--red)' : type === 'warn' ? 'var(--amber)' : 'var(--green)';
    const el = document.createElement('div');
    el.style.cssText = `background:${bg};color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);`;
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function showConfirm(msg, okLabel = 'Confirmar') {
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `<div style="background:var(--base,#eff1f5);border-radius:12px;padding:24px 28px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25);"><p style="margin:0 0 20px;font-size:14px;font-weight:600;color:var(--text,#4c4f69);line-height:1.5;">${msg}</p><div style="display:flex;gap:10px;justify-content:flex-end;"><button id="sc-no" style="padding:8px 18px;border-radius:7px;border:1px solid var(--crust,#dce0e8);background:var(--mantle,#e6e9ef);color:var(--text,#4c4f69);font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button><button id="sc-yes" style="padding:8px 18px;border-radius:7px;border:none;background:var(--blue,#1e66f5);color:#fff;font-size:13px;font-weight:700;cursor:pointer;">${okLabel}</button></div></div>`;
      document.body.appendChild(ov);
      const done = v => { ov.remove(); resolve(v); };
      ov.querySelector('#sc-no').onclick  = () => done(false);
      ov.querySelector('#sc-yes').onclick = () => done(true);
      ov.addEventListener('mousedown', e => { if (e.target === ov) done(false); });
    });
  }

  async function init() {
    const [projects, contacts, inventory, conceptUnits] = await Promise.all([
      window.DB.query('projects'),
      window.DB.query('contacts'),
      window.DB.query('inventory'),
      window.DB.query('concept_units'),
    ]);

    // Projects dropdown — active only
    const activeStatuses = ['Planificación', 'En Producción'];
    const activeProjs = projects.filter(p => (p.codigo||p.code) && (p.nombre||p.name) && activeStatuses.includes((p.estado||p.status)));
    const histProjs   = projects.filter(p => (p.codigo||p.code) && (p.nombre||p.name) && !activeStatuses.includes((p.estado||p.status)));
    const projSel = document.getElementById('proj');
    if (activeProjs.length) {
      const grpActive = document.createElement('optgroup');
      grpActive.label = 'Proyectos Activos';
      activeProjs.forEach(p => {
        const o = document.createElement('option');
        o.value = (p.codigo||p.code); o.textContent = `${(p.codigo||p.code)} – ${(p.nombre||p.name)}`;
        grpActive.appendChild(o);
      });
      projSel.appendChild(grpActive);
    }
    if (histProjs.length) {
      const grpHist = document.createElement('optgroup');
      grpHist.label = 'Proyectos Anteriores';
      histProjs.forEach(p => {
        const o = document.createElement('option');
        o.value = (p.codigo||p.code); o.textContent = `${(p.codigo||p.code)} – ${(p.nombre||p.name)}`;
        grpHist.appendChild(o);
      });
      projSel.appendChild(grpHist);
    }

    // Requester dropdown — workers
    const reqSel = document.getElementById('requester');
    const workers = contacts.filter(c => c.tipo === 'trabajador' && c.activo !== false && (c.name || c.givenName));
    workers.forEach(w => {
      const o = document.createElement('option');
      o.value = w.name || w.givenName; o.textContent = w.name || w.givenName;
      reqSel.appendChild(o);
    });

    SearchableSelect.init(projSel);
    SearchableSelect.init(reqSel);

    // Inventory & units for rows
    INV        = inventory.filter(i => i.code && i.name && i.category !== 'madera');
    MADERA_INV = inventory.filter(i => i.code && i.name && i.category === 'madera');
    const rawUnits = conceptUnits[0]?.list || [];
    UNITS = rawUnits.length ? rawUnits : ['pza','caja','mt','mt2','lt','kg','gln','rollo','par','juego','bolsa'];

    addRow(); // start with one empty row
    await loadOrders();
  }

  function buildInvOptions(selectedCode) {
    return `<option value="">— Buscar concepto —</option>` +
      INV.map(i => `<option value="${i.code}" data-unit="${i.unit||'pza'}" ${i.code===selectedCode?'selected':''}>${i.code} – ${i.name}</option>`).join('') +
      `<option value="_new" style="font-weight:700; color:var(--blue);">+ Concepto nuevo…</option>`;
  }

  function buildMaderaOptions(selectedCode) {
    return `<option value="">— Buscar madera —</option>` +
      MADERA_INV.map(i => `<option value="${i.code}" data-unit="${i.unit||'pza'}" ${i.code===selectedCode?'selected':''}>${i.code} – ${i.name}</option>`).join('') +
      `<option value="_new" style="font-weight:700; color:var(--blue);">+ Concepto nuevo…</option>`;
  }

  function buildUnitOptions(selected) {
    return UNITS.map(u => `<option value="${u}" ${u===selected?'selected':''}>${u}</option>`).join('');
  }

  function addRow(code='', name='', qty=1, unit='pza', esHerramienta=false, esMadera=false) {
    const tbody = document.getElementById('itemsList');
    const tr = document.createElement('tr');
    const invList = esMadera ? MADERA_INV : INV;
    const isCustom = (esHerramienta || !code || !invList.find(i => i.code === code)) ? '1' : '0';
    tr.dataset.custom        = isCustom;
    tr.dataset.esHerramienta = esHerramienta ? '1' : '0';
    tr.dataset.esMadera      = esMadera ? '1' : '0';
    const showNewWrap = (isCustom === '1' && !!name) || esHerramienta;
    const showSel     = !showNewWrap;

    tr.innerHTML = `
      <td>
        <div class="tipo-toggle">
          <span class="${!esHerramienta && !esMadera ? 'active-mat' : ''}" onclick="setTipoRow(this.closest('tr'),'material')">📦 Material</span>
          <span class="${esMadera ? 'active-mad' : ''}" onclick="setTipoRow(this.closest('tr'),'madera')">🪵 Madera</span>
          <span class="${esHerramienta ? 'active-herr' : ''}" onclick="setTipoRow(this.closest('tr'),'herramienta')">🔧 Herramienta</span>
        </div>
        <div class="i-sel-wrap" style="${showSel ? '' : 'display:none'}">
          <select class="i-sel" data-searchable data-allow-new onchange="handleConceptChange(this)">
            ${esMadera ? buildMaderaOptions(code) : buildInvOptions(code)}
          </select>
        </div>
        <div class="i-new-wrap" style="display:${showNewWrap ? 'flex' : 'none'}; align-items:center; gap:6px;">
          <input type="text" class="i-custom" style="flex:1;"
            placeholder="${esHerramienta ? 'Nombre de la herramienta…' : 'Descripción del concepto'}"
            value="${name}">
          ${!esHerramienta ? '<button type="button" class="btn btn-sm i-back-sel" title="Volver al catálogo" onclick="backToSel(this.closest(\'tr\'))">✕</button>' : ''}
        </div>
      </td>
      <td><input type="number" class="i-qty" value="${qty}" min="0.01" step="any" style="width:80px;"></td>
      <td>
        <select class="i-unit" data-searchable>${buildUnitOptions(unit)}</select>
      </td>
      <td><button class="rm-btn" onclick="this.closest('tr').remove()">✕</button></td>
    `;
    tbody.appendChild(tr);
    if (!esHerramienta) SearchableSelect.init(tr.querySelector('.i-sel'));
    SearchableSelect.init(tr.querySelector('.i-unit'));
  }

  function setTipoRow(tr, tipo) {
    const toggle  = tr.querySelector('.tipo-toggle');
    const selWrap = tr.querySelector('.i-sel-wrap');
    const newWrap = tr.querySelector('.i-new-wrap');
    const iSel    = tr.querySelector('.i-sel');
    const iCustom = tr.querySelector('.i-custom');
    const backBtn = tr.querySelector('.i-back-sel');
    const unitSel = tr.querySelector('.i-unit');
    const spans   = toggle.querySelectorAll('span'); // [material, madera, herramienta]

    if (tipo === 'herramienta') {
      spans[0].className = '';
      spans[1].className = '';
      spans[2].className = 'active-herr';
      selWrap.style.display = 'none';
      newWrap.style.display = 'flex';
      iCustom.placeholder = 'Nombre de la herramienta…';
      iCustom.value = '';
      if (backBtn) backBtn.style.display = 'none';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
      tr.dataset.custom = '1';
      tr.dataset.esHerramienta = '1';
      tr.dataset.esMadera = '0';
    } else if (tipo === 'madera') {
      spans[0].className = '';
      spans[1].className = 'active-mad';
      spans[2].className = '';
      selWrap.style.display = '';
      newWrap.style.display = 'none';
      iSel.innerHTML = buildMaderaOptions('');
      if (!iSel._ssInit) SearchableSelect.init(iSel);
      else iSel._ssRefresh?.() ?? iSel._ssSync?.();
      iCustom.value = '';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
      tr.dataset.custom = '0';
      tr.dataset.esHerramienta = '0';
      tr.dataset.esMadera = '1';
    } else { // material
      spans[0].className = 'active-mat';
      spans[1].className = '';
      spans[2].className = '';
      selWrap.style.display = '';
      newWrap.style.display = 'none';
      iSel.innerHTML = buildInvOptions('');
      if (!iSel._ssInit) SearchableSelect.init(iSel);
      else iSel._ssRefresh?.() ?? iSel._ssSync?.();
      iCustom.value = '';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
      tr.dataset.custom = '0';
      tr.dataset.esHerramienta = '0';
      tr.dataset.esMadera = '0';
    }
  }

  function handleConceptChange(sel) {
    const tr        = sel.closest('tr');
    const selWrap   = tr.querySelector('.i-sel-wrap');
    const newWrap   = tr.querySelector('.i-new-wrap');
    const iCustom   = tr.querySelector('.i-custom');
    const unitSel   = tr.querySelector('.i-unit');

    if (sel.value === '_new') {
      const typed = sel.dataset.allowNewText || '';
      sel.value = '';
      if (sel._ssSync) sel._ssSync();
      selWrap.style.display = 'none';
      newWrap.style.display = 'flex';
      if (typed) iCustom.value = typed;
      iCustom.focus();
      tr.dataset.custom = '1';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
    } else if (sel.value) {
      const opt = sel.options[sel.selectedIndex];
      if (opt?.dataset?.unit) {
        unitSel.value = opt.dataset.unit;
        unitSel.disabled = true;
        unitSel.style.opacity = '.6';
      }
      newWrap.style.display = 'none';
      tr.dataset.custom = '0';
    } else {
      newWrap.style.display = 'none';
      tr.dataset.custom = '0';
      unitSel.disabled = false;
      unitSel.style.opacity = '';
    }
  }

  function backToSel(tr) {
    const iSel  = tr.querySelector('.i-sel');
    tr.querySelector('.i-new-wrap').style.display = 'none';
    tr.querySelector('.i-sel-wrap').style.display = '';
    tr.querySelector('.i-custom').value = '';
    tr.dataset.custom = '0';
    const unitSel = tr.querySelector('.i-unit');
    unitSel.disabled = false;
    unitSel.style.opacity = '';
    if (!iSel._ssInit) SearchableSelect.init(iSel);
    else iSel._ssSync?.();
  }

  async function submitRequest() {
    const projCode = document.getElementById('proj').value;
    const requester = document.getElementById('requester').value;
    const notes = document.getElementById('notes').value.trim();

    const rows = document.querySelectorAll('#itemsList tr');
    const items = [];
    rows.forEach(tr => {
      const sel   = tr.querySelector('.i-sel');
      const custom = tr.querySelector('.i-custom');
      const qty   = parseFloat(tr.querySelector('.i-qty').value) || 0;
      const unit  = tr.querySelector('.i-unit').value;

      const esHerr = tr.dataset.esHerramienta === '1';
      const esMad  = tr.dataset.esMadera === '1';
      let code = sel?.value || '';
      let name = '';
      if (esHerr) {
        name = custom?.value.trim() || '';
        code = '';
      } else if (code && code !== '_new') {
        const inv = INV.find(i => i.code === code) || MADERA_INV.find(i => i.code === code);
        name = inv ? inv.name : sel?.options[sel.selectedIndex]?.text || code;
      } else {
        name = custom?.value.trim() || '';
        code = '';
      }
      if ((name || code) && qty > 0) items.push({
        code, name, qty, unit, price: 0,
        esHerramienta: esHerr || undefined,
        esMadera: esMad || undefined
      });
    });

    if (!items.length) { toast('Agrega al menos un material.', 'warn'); return; }

    const now = new Date();
    const folio = 'RQ-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') +
                  String(now.getDate()).padStart(2,'0') + '-' + String(now.getTime()).slice(-4);

    const request = {
      id: crypto.randomUUID(),
      folio,
      date: now.toISOString().slice(0,10),
      status: 'Pedido',
      project: projCode,
      requester,
      notes,
      items,
      createdAt: now.toISOString(),
    };

    if (window.parent && window.parent.setDocumentInFirebase) {
      await window.parent.setDocumentInFirebase('purchase_orders', request.id, request);
      if (window.parent.DB_STATE) {
        if (!window.parent.DB_STATE.purchase_orders) window.parent.DB_STATE.purchase_orders = [];
        window.parent.DB_STATE.purchase_orders.push(request);
      }
    }

    // Clear form
    document.getElementById('proj').value = '';
    document.getElementById('requester').value = '';
    document.getElementById('notes').value = '';
    document.getElementById('itemsList').innerHTML = '';
    addRow();

    ORDERS.push(request);
    renderActivePedidos();
    renderHistorialPedidos();
    toast(`✅ Pedido ${folio} enviado — pendiente de confirmación`);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
